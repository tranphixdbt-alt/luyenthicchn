a thêm chứng khoán","Chỉ được mua thêm chứng khoán để bình quân giá, không được bán ra","Được mua, bán bình thường nhưng phải báo cáo UBCKNN trước mỗi giao dịch"],"a":1,"e":"Khoản 6 Điều 307 (bổ sung bởi NĐ 245): bị cấm giao dịch thì chỉ được bán chứng khoán có trên tài khoản, không được tiếp tục mua (trừ giao dịch theo bản án, quyết định của Tòa án, Trọng tài, thừa kế); vẫn được thực hiện các quyền phát sinh liên quan đến chứng khoán.","basis":"Khoản 6 Điều 307 Nghị định 155/2020/NĐ-CP (bổ sung bởi khoản 87 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"tổ chức, cá nhân chỉ được bán chứng khoán có trên tài khoản giao dịch chứng khoán và không được tiếp tục mua chứng khoán trên tài khoản giao dịch chứng khoán","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-049","part":"LUAT","subject":"LU","topic":"Hạn chế tài chính CTCK","level":1,"q":"Theo Thông tư 121/2020/TT-BTC, tỷ lệ tổng nợ trên vốn chủ sở hữu của công ty chứng khoán không được vượt quá:","o":["03 lần","06 lần","05 lần","10 lần"],"a":2,"e":"Khoản 1 Điều 26: tỷ lệ tổng nợ/VCSH không vượt quá 05 lần; tổng nợ không bao gồm tiền gửi giao dịch chứng khoán của khách hàng, quỹ khen thưởng phúc lợi, dự phòng trợ cấp mất việc làm, dự phòng bồi thường thiệt hại cho nhà đầu tư.","basis":"Khoản 1 Điều 26 Thông tư 121/2020/TT-BTC (VBHN số 09/VBHN-BTC năm 2026, hợp nhất TT 68/2024 và TT 08/2026)","quote":"Tỷ lệ tổng nợ trên vốn chủ sở hữu của công ty chứng khoán không được vượt quá 05 lần.","src":"VBHN_09_VBHN-BTC_2026_TT121_68_08_hop_nhat.txt","as_of":"2026-11"},{"id":"L2-050","part":"LUAT","subject":"LU","topic":"Hạn chế tài chính CTCK","level":3,"q":"CTCK E có vốn chủ sở hữu 1.000 tỷ đồng; tổng nợ phải trả trên BCTC là 6.500 tỷ đồng, trong đó tiền gửi giao dịch chứng khoán của khách hàng 1.800 tỷ đồng, quỹ khen thưởng phúc lợi 50 tỷ đồng, phần còn lại là vay và phải trả khác. Tỷ lệ tổng nợ/VCSH theo Thông tư 121/2020/TT-BTC và kết luận là:","o":["6,50 lần – vi phạm hạn chế vay nợ","4,70 lần – đáp ứng hạn chế vay nợ","6,45 lần – vi phạm hạn chế vay nợ","4,65 lần – đáp ứng hạn chế vay nợ"],"a":3,"e":"Tổng nợ tính hạn chế = 6.500 − 1.800 (tiền gửi của khách hàng) − 50 (quỹ khen thưởng phúc lợi) = 4.650 tỷ đồng → 4.650/1.000 = 4,65 lần ≤ 05 lần. 4,70 là lỗi chỉ trừ tiền gửi khách hàng; 6,45 là lỗi chỉ trừ quỹ khen thưởng.","basis":"Khoản 1 Điều 26 Thông tư 121/2020/TT-BTC (VBHN số 09/VBHN-BTC năm 2026, hợp nhất TT 68/2024 và TT 08/2026)","quote":"Giá trị tổng nợ theo quy định này không bao gồm các khoản sau đây: a) Tiền gửi giao dịch chứng khoán của khách hàng; b) Quỹ khen thưởng phúc lợi;","src":"VBHN_09_VBHN-BTC_2026_TT121_68_08_hop_nhat.txt","as_of":"2026-11"},{"id":"L2-052","part":"LUAT","subject":"LU","topic":"Hạn chế tài chính CTCK","level":3,"q":"Theo BCTC quý gần nhất, CTCK G có vốn chủ sở hữu 800 tỷ đồng, tài sản ngắn hạn 2.000 tỷ đồng, nợ ngắn hạn 1.950 tỷ đồng. Tổng giá trị tối đa G được bảo lãnh phát hành chứng khoán ra công chúng (nhận mua một phần hoặc toàn bộ) là:","o":["750 tỷ đồng","800 tỷ đồng","1.550 tỷ đồng","50 tỷ đồng"],"a":0,"e":"Giới hạn 1 = VCSH = 800 tỷ; giới hạn 2 = 15 × (2.000 − 1.950) = 750 tỷ. Phải thỏa cả hai → tối đa 750 tỷ đồng. 800 là chỉ xét VCSH; 50 là quên nhân 15.","basis":"Khoản 1 Điều 23 Thông tư 121/2020/TT-BTC (VBHN số 09/VBHN-BTC năm 2026, hợp nhất TT 68/2024 và TT 08/2026)","quote":"không được vượt quá 15 lần hiệu số giữa giá trị tài sản ngắn hạn và nợ ngắn hạn tính theo báo cáo tài chính quý gần nhất","src":"VBHN_09_VBHN-BTC_2026_TT121_68_08_hop_nhat.txt","as_of":"2026-11"},{"id":"L2-053","part":"LUAT","subject":"LU","topic":"Hạn chế tài chính CTCK","level":2,"q":"Trường hợp nào sau đây CTCK KHÔNG được bảo lãnh phát hành theo hình thức cam kết chắc chắn hoặc làm người bảo lãnh chính cho tổ chức phát hành?","o":["CTCK sở hữu 8% vốn điều lệ của tổ chức phát hành và không có quyền kiểm soát","CTCK cùng người có liên quan sở hữu 12% vốn điều lệ của tổ chức phát hành","Tổ chức phát hành cùng người có liên quan sở hữu 15% vốn điều lệ của CTCK","CTCK và tổ chức phát hành cùng thuê một công ty kiểm toán được chấp thuận"],"a":1,"e":"Khoản 2 Điều 23: cấm khi CTCK (độc lập hoặc cùng công ty con, người có liên quan) sở hữu từ 10% vốn điều lệ của tổ chức phát hành; hoặc tổ chức phát hành sở hữu từ 20% vốn điều lệ của CTCK; hoặc cùng một chủ thể nắm ≥30% vốn của cả hai... 12% ≥ 10% → bị cấm; 15% < 20% chưa thuộc trường hợp cấm.","basis":"Điểm a khoản 2 Điều 23 Thông tư 121/2020/TT-BTC (VBHN số 09/VBHN-BTC năm 2026, hợp nhất TT 68/2024 và TT 08/2026)","quote":"Công ty chứng khoán, độc lập hoặc cùng công ty con hoặc cùng với người có liên quan sở hữu từ 10% trở lên vốn điều lệ của tổ chức phát hành","src":"VBHN_09_VBHN-BTC_2026_TT121_68_08_hop_nhat.txt","as_of":"2026-11"},{"id":"L2-054","part":"LUAT","subject":"LU","topic":"Hạn chế tài chính CTCK","level":1,"q":"Tổng giá trị đầu tư vào trái phiếu doanh nghiệp của công ty chứng khoán không được vượt quá:","o":["50% vốn chủ sở hữu","70% vốn điều lệ","70% vốn chủ sở hữu","100% vốn chủ sở hữu"],"a":2,"e":"Khoản 3 Điều 28: tổng giá trị đầu tư vào các trái phiếu doanh nghiệp không vượt quá 70% vốn chủ sở hữu.","basis":"Khoản 3 Điều 28 Thông tư 121/2020/TT-BTC (VBHN số 09/VBHN-BTC năm 2026, hợp nhất TT 68/2024 và TT 08/2026)","quote":"Tổng giá trị đầu tư vào các trái phiếu doanh nghiệp của công ty chứng khoán không được vượt quá 70% vốn chủ sở hữu.","src":"VBHN_09_VBHN-BTC_2026_TT121_68_08_hop_nhat.txt","as_of":"2026-11"},{"id":"L2-055","part":"LUAT","subject":"LU","topic":"Hạn chế tài chính CTCK","level":3,"q":"CTCK K có vốn chủ sở hữu 2.000 tỷ đồng, đang nắm cổ phiếu niêm yết trị giá 900 tỷ đồng và cổ phiếu chưa niêm yết trị giá 350 tỷ đồng (không có phần vốn góp, dự án kinh doanh). Giá trị tối đa K được đầu tư thêm vào cổ phiếu chưa niêm yết là:","o":["150 tỷ đồng","300 tỷ đồng","400 tỷ đồng","50 tỷ đồng"],"a":3,"e":"Điểm g khoản 4 Điều 28: tổng đầu tư vào cổ phiếu, phần vốn góp, dự án ≤ 70% × 2.000 = 1.400 tỷ; trong đó cổ phiếu chưa niêm yết, phần vốn góp, dự án ≤ 20% × 2.000 = 400 tỷ. Hiện có 350 tỷ → được thêm 50 tỷ (tổng 1.300 tỷ vẫn ≤ 1.400 tỷ). 150 tỷ là chỉ xét hạn mức 70%; 400 tỷ là quên khoản đang nắm giữ.","basis":"Điểm g khoản 4 Điều 28 Thông tư 121/2020/TT-BTC (VBHN số 09/VBHN-BTC năm 2026, hợp nhất TT 68/2024 và TT 08/2026)","quote":"Đầu tư quá 70% vốn chủ sở hữu vào cổ phiếu, phần vốn góp và dự án kinh doanh, trong đó không được đầu tư quá 20% vốn chủ sở hữu vào cổ phiếu chưa niêm yết, phần vốn góp và dự án kinh doanh.","src":"VBHN_09_VBHN-BTC_2026_TT121_68_08_hop_nhat.txt","as_of":"2026-11"},{"id":"L2-056","part":"LUAT","subject":"LU","topic":"Hạn chế tài chính CTCK","level":1,"q":"Công ty chứng khoán không được đầu tư quá bao nhiêu phần trăm tổng số cổ phiếu đang lưu hành của một tổ chức niêm yết?","o":["20%","10%","15%","25%"],"a":0,"e":"Điểm c khoản 4 Điều 28: không đầu tư quá 20% tổng số cổ phiếu, chứng chỉ quỹ đang lưu hành của một tổ chức niêm yết (15% đối với tổ chức chưa niêm yết – điểm d).","basis":"Điểm c khoản 4 Điều 28 Thông tư 121/2020/TT-BTC (VBHN số 09/VBHN-BTC năm 2026, hợp nhất TT 68/2024 và TT 08/2026)","quote":"Đầu tư quá 20% tổng số cổ phiếu, chứng chỉ quỹ đang lưu hành của một tổ chức niêm yết;","src":"VBHN_09_VBHN-BTC_2026_TT121_68_08_hop_nhat.txt","as_of":"2026-11"},{"id":"L2-057","part":"LUAT","subject":"LU","topic":"Hoạt động CTCK","level":2,"q":"Về dịch vụ ủy thác quản lý tài khoản giao dịch chứng khoán của nhà đầu tư cá nhân, phát biểu nào sau đây đúng theo Thông tư 121/2020/TT-BTC?","o":["CTCK được nhận ủy thác quyết định toàn bộ giao dịch thay nhà đầu tư","Thời hạn hợp đồng ủy thác không quá 01 năm kể từ thời điểm ký kết","Được ủy thác mua, bán cả cổ phiếu đăng ký giao dịch trên UPCoM","Người quản lý tài khoản ủy thác chỉ cần có CCHN môi giới chứng khoán"],"a":1,"e":"Điều 19: hợp đồng ủy thác không quá 01 năm; CTCK không được nhận ủy thác quyết định toàn bộ giao dịch; chỉ ủy thác cổ phiếu, chứng chỉ quỹ niêm yết (không gồm UPCoM); người quản lý phải có CCHN phân tích tài chính hoặc quản lý quỹ.","basis":"Điểm a khoản 4 Điều 19 Thông tư 121/2020/TT-BTC (VBHN số 09/VBHN-BTC năm 2026, hợp nhất TT 68/2024 và TT 08/2026)","quote":"Thời hạn hợp đồng ủy thác không quá 01 năm tính từ thời điểm ký kết hợp đồng;","src":"VBHN_09_VBHN-BTC_2026_TT121_68_08_hop_nhat.txt","as_of":"2026-11"},{"id":"L2-058","part":"LUAT","subject":"LU","topic":"Hoạt động CTCK","level":3,"q":"Khách hàng cá nhân ký hợp đồng ủy thác quản lý tài khoản với tổng giá trị 2 tỷ đồng tại CTCK M. Sau một thời gian, giá trị tài sản trên tài khoản ủy thác giảm còn 480 triệu đồng. M phải:","o":["Thông báo cho khách hàng trong vòng 03 ngày làm việc","Chưa phải thông báo vì tài sản chưa giảm xuống dưới 20%","Thông báo cho khách hàng trong vòng 24 giờ","Báo cáo UBCKNN trong 24 giờ, không phải thông báo khách hàng"],"a":2,"e":"480 triệu/2 tỷ = 24% < 25% tổng giá trị hợp đồng ủy thác → theo điểm e khoản 6 Điều 19, CTCK phải thông báo cho khách hàng trong vòng 24 giờ kể từ khi tài sản giảm xuống dưới 25%.","basis":"Điểm e khoản 6 Điều 19 Thông tư 121/2020/TT-BTC (VBHN số 09/VBHN-BTC năm 2026, hợp nhất TT 68/2024 và TT 08/2026)","quote":"Thông báo cho khách hàng trong vòng 24 giờ kể từ khi tài sản trong tài khoản giao dịch ủy thác của khách hàng ủy thác giảm xuống dưới 25% tính trên tổng giá trị hợp đồng ủy thác;","src":"VBHN_09_VBHN-BTC_2026_TT121_68_08_hop_nhat.txt","as_of":"2026-11"},{"id":"L2-059","part":"LUAT","subject":"LU","topic":"Hoạt động CTCK","level":2,"q":"Theo Thông tư 121/2020/TT-BTC, Tổng Giám đốc công ty chứng khoán KHÔNG được đồng thời giữ vị trí nào sau đây?","o":["Thành viên HĐQT của chính công ty chứng khoán đó","Người đại diện theo pháp luật của chính công ty chứng khoán đó","Cổ đông sở hữu cổ phần của chính công ty chứng khoán đó","Thành viên HĐQT của một công ty chứng khoán khác"],"a":3,"e":"Khoản 2 Điều 10: Tổng Giám đốc, Phó Tổng Giám đốc CTCK không được đồng thời làm việc cho CTCK, CTQLQ hoặc doanh nghiệp khác; Tổng Giám đốc không được là thành viên HĐQT, HĐTV của công ty chứng khoán khác.","basis":"Khoản 2 Điều 10 Thông tư 121/2020/TT-BTC (VBHN số 09/VBHN-BTC năm 2026, hợp nhất TT 68/2024 và TT 08/2026)","quote":"Tổng Giám đốc (Giám đốc) công ty chứng khoán không được là thành viên Hội đồng quản trị, thành viên Hội đồng thành viên của công ty chứng khoán khác.","src":"VBHN_09_VBHN-BTC_2026_TT121_68_08_hop_nhat.txt","as_of":"2026-11"},{"id":"L2-060","part":"LUAT","subject":"LU","topic":"An toàn tài chính CTCK","level":1,"q":"Tổ chức kinh doanh chứng khoán có tỷ lệ vốn khả dụng (tự tính hoặc đã soát xét, kiểm toán) dưới 120% bị UBCKNN đặt vào tình trạng nào?","o":["Kiểm soát đặc biệt","Cảnh báo","Kiểm soát","Đình chỉ hoạt động ngay lập tức"],"a":0,"e":"Điểm a khoản 1 Điều 16: tỷ lệ vốn khả dụng dưới 120% → kiểm soát đặc biệt (thời hạn không quá 04 tháng). Cảnh báo: 150% đến dưới 180%; kiểm soát: 120% đến dưới 150%.","basis":"Điểm a khoản 1 Điều 16 Thông tư 91/2020/TT-BTC","quote":"Tỷ lệ vốn khả dụng do công ty tự tính hoặc đã được soát xét, kiểm toán bởi tổ chức kiểm toán được chấp thuận dưới 120%","src":"TT_91_2020_TT-BTC_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-061","part":"LUAT","subject":"LU","topic":"An toàn tài chính CTCK","level":3,"q":"CTCK T có vốn khả dụng 360 tỷ đồng, tổng giá trị rủi ro 250 tỷ đồng theo báo cáo tỷ lệ an toàn tài chính đã được kiểm toán. Theo Thông tư 91/2020/TT-BTC, T:","o":["Có tỷ lệ 144%, thuộc diện bị đặt vào tình trạng cảnh báo","Có tỷ lệ 144%, thuộc diện bị đặt vào tình trạng kiểm soát","Có tỷ lệ 69%, thuộc diện bị đặt vào tình trạng kiểm soát đặc biệt","Có tỷ lệ 144%, đáp ứng chỉ tiêu an toàn tài chính"],"a":1,"e":"Tỷ lệ vốn khả dụng = 360/250 × 100% = 144%. Theo điểm b khoản 1 Điều 14, tỷ lệ đã kiểm toán từ 120% đến dưới 150% → kiểm soát. 69% là lỗi đảo mẫu số (250/360).","basis":"Khoản 1 Điều 11, điểm b khoản 1 Điều 14 Thông tư 91/2020/TT-BTC","quote":"Tỷ lệ vốn khả dụng đã được soát xét hoặc được kiểm toán bởi tổ chức kiểm toán được chấp thuận từ 120% đến dưới 150%","src":"TT_91_2020_TT-BTC_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-062","part":"LUAT","subject":"LU","topic":"An toàn tài chính CTCK","level":2,"q":"Căn cứ nào sau đây để UBCKNN đặt tổ chức kinh doanh chứng khoán vào tình trạng cảnh báo?","o":["Tỷ lệ vốn khả dụng từ 120% đến dưới 150% tại một kỳ báo cáo bất kỳ trong năm","Tỷ lệ vốn khả dụng dưới 180% tại một kỳ báo cáo bất kỳ trong 03 tháng gần nhất","Tỷ lệ vốn khả dụng từ 150% đến dưới 180% trong tất cả kỳ báo cáo của 03 tháng liên tục","Tỷ lệ vốn khả dụng từ 150% đến dưới 220% trong tất cả kỳ báo cáo của 06 tháng"],"a":2,"e":"Điểm a khoản 1 Điều 13: cảnh báo khi tỷ lệ vốn khả dụng từ 150% đến dưới 180% trong tất cả các kỳ báo cáo trong 03 tháng liên tục (hoặc tỷ lệ đã soát xét/kiểm toán trong khoảng này).","basis":"Điểm a khoản 1 Điều 13 Thông tư 91/2020/TT-BTC","quote":"Tỷ lệ vốn khả dụng từ 150% đến dưới 180% trong tất cả các kỳ báo cáo trong ba (03) tháng liên tục","src":"TT_91_2020_TT-BTC_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-063","part":"LUAT","subject":"LU","topic":"An toàn tài chính CTCK","level":1,"q":"Thời hạn tối đa của tình trạng kiểm soát và tình trạng kiểm soát đặc biệt theo Thông tư 91/2020/TT-BTC lần lượt là:","o":["06 tháng và 03 tháng","12 tháng và 06 tháng","04 tháng và 12 tháng","12 tháng và 04 tháng"],"a":3,"e":"Khoản 2 Điều 14: thời hạn kiểm soát không quá 12 tháng; khoản 2 Điều 16: thời hạn kiểm soát đặc biệt không quá 04 tháng kể từ ngày bị đặt vào tình trạng.","basis":"Khoản 2 Điều 14, khoản 2 Điều 16 Thông tư 91/2020/TT-BTC","quote":"Thời hạn kiểm soát không quá 12 tháng, kể từ ngày tổ chức kinh doanh chứng khoán bị đặt vào tình trạng kiểm soát.","src":"TT_91_2020_TT-BTC_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-064","part":"LUAT","subject":"LU","topic":"An toàn tài chính CTCK","level":2,"q":"Kể từ khi tỷ lệ vốn khả dụng xuống dưới 150%, tổ chức kinh doanh chứng khoán phải báo cáo UBCKNN tỷ lệ vốn khả dụng với tần suất nào?","o":["01 tuần 01 lần, gửi trước 16 giờ ngày thứ sáu hàng tuần","01 tháng 02 lần, với dữ liệu tại ngày 15 và ngày 30 hàng tháng","Hàng ngày, gửi trước 16 giờ của mỗi ngày làm việc","01 tháng 01 lần, trong 07 ngày làm việc kể từ ngày kết thúc tháng"],"a":0,"e":"Khoản 2 Điều 12: dưới 180% → 2 lần/tháng (ngày 15, 30); dưới 150% → hàng tuần, trước 16 giờ thứ sáu; dưới 120% → hàng ngày trước 16 giờ. Báo cáo định kỳ tháng gửi trong 07 ngày làm việc.","basis":"Điểm b khoản 2 Điều 12 Thông tư 91/2020/TT-BTC","quote":"Kể từ khi tỷ lệ vốn khả dụng xuống dưới 150%, tổ chức kinh doanh chứng khoán phải báo cáo Ủy ban Chứng khoán Nhà nước tỷ lệ vốn khả dụng một (01) tuần một (01) lần","src":"TT_91_2020_TT-BTC_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-065","part":"LUAT","subject":"LU","topic":"An toàn tài chính CTCK","level":3,"q":"CTCK V (không kinh doanh chứng khoán phái sinh) có ba nghiệp vụ môi giới, tự doanh và bảo lãnh phát hành chứng khoán. Chi phí để tính rủi ro hoạt động trong 12 tháng liền kề (sau giảm trừ) là 160 tỷ đồng. Giá trị rủi ro hoạt động của V là:","o":["40 tỷ đồng","48 tỷ đồng","60 tỷ đồng","88 tỷ đồng"],"a":1,"e":"Rủi ro hoạt động = max(25% chi phí; 20% vốn điều lệ tối thiểu cho các nghiệp vụ). 25% × 160 = 40 tỷ; vốn tối thiểu = 25 + 50 + 165 = 240 tỷ → 20% × 240 = 48 tỷ. Lấy giá trị lớn hơn: 48 tỷ đồng. (TT 102/2025 thay cụm từ \"chi phí duy trì hoạt động\" bằng \"chi phí để tính rủi ro hoạt động\".)","basis":"Khoản 1 Điều 8 Thông tư 91/2020/TT-BTC (sửa đổi bởi khoản 2 Điều 8 Thông tư 102/2025/TT-BTC); Điều 175 Nghị định 155/2020/NĐ-CP","quote":"20% vốn điều lệ tối thiểu cho các nghiệp vụ kinh doanh của tổ chức kinh doanh chứng khoán theo quy định của pháp luật.","src":"TT_91_2020_TT-BTC_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-066","part":"LUAT","subject":"LU","topic":"An toàn tài chính CTCK","level":2,"q":"Theo Thông tư 91/2020/TT-BTC (sửa đổi, bổ sung bởi Thông tư 102/2025/TT-BTC), khoản nào sau đây được trừ ra khỏi tổng chi phí phát sinh trong kỳ khi xác định chi phí để tính rủi ro hoạt động của công ty chứng khoán?","o":["Chi phí tiền lương, phụ cấp trả cho người lao động của công ty","Chi phí thuê trụ sở chính, chi nhánh và phòng giao dịch của công ty","Chi phí chênh lệch do đánh giá lại phải trả chứng quyền đang lưu hành","Chi phí thuê ngoài dịch vụ công nghệ thông tin và đường truyền"],"a":2,"e":"Khoản 2 Điều 8 TT 91 (TT 102/2025 thay cụm từ \"chi phí duy trì hoạt động\" bằng \"chi phí để tính rủi ro hoạt động\" và bổ sung điểm h, i, k): chi phí để tính rủi ro hoạt động của CTCK = tổng chi phí phát sinh trong kỳ trừ khấu hao, chi phí/hoàn nhập dự phòng, chênh lệch giảm do đánh giá lại tài sản tài chính FVTPL, chi phí lãi vay và (bổ sung) chênh lệch do đánh giá lại phải trả chứng quyền đang lưu hành, chênh lệch tỷ giá chưa thực hiện, chi phí tài chính và chi phí không bằng tiền khác. Lương, thuê trụ sở, dịch vụ CNTT là chi phí hoạt động bằng tiền nên không được trừ.","basis":"Điểm h khoản 2 Điều 8 Thông tư 91/2020/TT-BTC (bổ sung bởi khoản 1 Điều 5 Thông tư 102/2025/TT-BTC; cụm từ \"chi phí để tính rủi ro hoạt động\" theo khoản 2 Điều 8 Thông tư 102/2025/TT-BTC)","quote":"Bổ sung điểm h, i, k vào sau điểm g khoản 2 như sau: “h) Chi phí chênh lệch do đánh giá lại phải trả chứng quyền đang lưu hành;","src":"TT_102_2025_TT-BTC_sua_TT91.txt","as_of":"2026-11"},{"id":"L2-067","part":"LUAT","subject":"LU","topic":"An toàn tài chính CTCK","level":2,"q":"Theo Thông tư 91/2020/TT-BTC (sửa đổi bởi Thông tư 102/2025/TT-BTC), giá trị rủi ro thị trường của khoản đầu tư vào chứng khoán của một tổ chức chiếm 18% vốn chủ sở hữu của CTCK (không phải trái phiếu Chính phủ, không trong thời gian bảo lãnh) được điều chỉnh tăng thêm:","o":["10%","30%","Không phải điều chỉnh","20%"],"a":3,"e":"Khoản 5 Điều 9 (sửa đổi bởi TT 102): tăng thêm 10% khi khoản đầu tư chiếm trên 10% đến 15% VCSH; 20% khi trên 15% đến 25%; 30% khi trên 25%. 18% thuộc nhóm trên 15% đến 25% → tăng 20%.","basis":"Điểm b khoản 5 Điều 9 Thông tư 91/2020/TT-BTC (sửa đổi bởi Điều 6 Thông tư 102/2025/TT-BTC)","quote":"Tăng thêm 20% trong trường hợp tổng giá trị của khoản đầu tư vào chứng khoán, phần vốn góp của một tổ chức chiếm từ trên 15% đến 25% vốn chủ sở hữu của tổ chức kinh doanh chứng khoán","src":"TT_102_2025_TT-BTC_sua_TT91.txt","as_of":"2026-11"},{"id":"L2-068","part":"LUAT","subject":"LU","topic":"Công bố thông tin","level":1,"q":"Công ty đại chúng phải công bố báo cáo tài chính năm đã được kiểm toán trong thời hạn nào?","o":["10 ngày kể từ ngày ký báo cáo kiểm toán, không quá 90 ngày kể từ ngày kết thúc năm tài chính","05 ngày kể từ ngày ký báo cáo kiểm toán, không quá 90 ngày kể từ ngày kết thúc năm tài chính","10 ngày kể từ ngày ký báo cáo kiểm toán, không quá 100 ngày kể từ ngày kết thúc năm tài chính","20 ngày kể từ ngày ký báo cáo kiểm toán, không quá 120 ngày kể từ ngày kết thúc năm tài chính"],"a":0,"e":"Điểm c khoản 1 Điều 10: thời hạn 10 ngày kể từ ngày tổ chức kiểm toán ký báo cáo kiểm toán nhưng không vượt quá 90 ngày kể từ ngày kết thúc năm tài chính.","basis":"Điểm c khoản 1 Điều 10 Thông tư 96/2020/TT-BTC","quote":"Công ty đại chúng phải công bố báo cáo tài chính năm đã được kiểm toán trong thời hạn 10 ngày, kể từ ngày tổ chức kiểm toán ký báo cáo kiểm toán nhưng không vượt quá 90 ngày, kể từ ngày kết thúc năm tài chính.","src":"TT_96_2020_TT-BTC_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-069","part":"LUAT","subject":"LU","topic":"Công bố thông tin","level":2,"q":"Thời hạn công bố báo cáo thường niên của công ty đại chúng là:","o":["10 ngày kể từ ngày công bố BCTC năm kiểm toán, không quá 90 ngày kể từ ngày kết thúc năm tài chính","20 ngày kể từ ngày công bố BCTC năm kiểm toán, không quá 110 ngày kể từ ngày kết thúc năm tài chính","30 ngày kể từ ngày công bố BCTC năm kiểm toán, không quá 120 ngày kể từ ngày kết thúc năm tài chính","20 ngày kể từ ngày công bố BCTC năm kiểm toán, không quá 100 ngày kể từ ngày kết thúc năm tài chính"],"a":1,"e":"Khoản 2 Điều 10: báo cáo thường niên công bố trong 20 ngày kể từ ngày công bố BCTC năm được kiểm toán nhưng không vượt quá 110 ngày kể từ ngày kết thúc năm tài chính.","basis":"Khoản 2 Điều 10 Thông tư 96/2020/TT-BTC","quote":"công bố báo cáo này trong thời hạn 20 ngày kể từ ngày công bố báo cáo tài chính năm được kiểm toán nhưng không vượt quá 110 ngày, kể từ ngày kết thúc năm tài chính.","src":"TT_96_2020_TT-BTC_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-070","part":"LUAT","subject":"LU","topic":"Công bố thông tin","level":1,"q":"Nếu Điều lệ không quy định thời hạn dài hơn, công ty đại chúng phải công bố thông tin về họp ĐHĐCĐ thường niên (kèm đường dẫn tài liệu họp) tối thiểu bao nhiêu ngày trước ngày khai mạc?","o":["10 ngày","15 ngày","21 ngày","30 ngày"],"a":2,"e":"Điểm a khoản 3 Điều 10: tối thiểu 21 ngày trước ngày khai mạc họp ĐHĐCĐ (nếu Điều lệ không quy định dài hơn), công bố trên trang thông tin điện tử của công ty, UBCKNN, SGDCK.","basis":"Điểm a khoản 3 Điều 10 Thông tư 96/2020/TT-BTC","quote":"Tối thiểu 21 ngày trước ngày khai mạc họp Đại hội đồng cổ đông nếu Điều lệ công ty không quy định thời hạn dài hơn","src":"TT_96_2020_TT-BTC_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-071","part":"LUAT","subject":"LU","topic":"Công bố thông tin","level":1,"q":"Khi tài khoản của công ty đại chúng tại ngân hàng bị phong tỏa theo yêu cầu của cơ quan có thẩm quyền, công ty phải công bố thông tin bất thường trong thời hạn:","o":["36 giờ kể từ khi xảy ra sự kiện","72 giờ kể từ khi xảy ra sự kiện","05 ngày làm việc kể từ khi xảy ra sự kiện","24 giờ kể từ khi xảy ra sự kiện"],"a":3,"e":"Khoản 1 Điều 11: công ty đại chúng công bố thông tin bất thường trong 24 giờ kể từ khi xảy ra các sự kiện, trong đó có việc tài khoản bị phong tỏa hoặc được hoạt động trở lại.","basis":"Điểm a khoản 1 Điều 11 Thông tư 96/2020/TT-BTC","quote":"Công ty đại chúng phải công bố thông tin bất thường trong thời hạn 24 giờ, kể từ khi xảy ra một trong các sự kiện sau đây","src":"TT_96_2020_TT-BTC_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-072","part":"LUAT","subject":"LU","topic":"Công bố thông tin","level":2,"q":"Tổ chức niêm yết cổ phiếu là công ty mẹ của tổ chức khác phải công bố BCTC bán niên đã được soát xét trong thời hạn:","o":["05 ngày kể từ ngày ký báo cáo soát xét, tối đa 60 ngày kể từ ngày kết thúc 06 tháng đầu năm","05 ngày kể từ ngày ký báo cáo soát xét, tối đa 45 ngày kể từ ngày kết thúc 06 tháng đầu năm","10 ngày kể từ ngày ký báo cáo soát xét, tối đa 60 ngày kể từ ngày kết thúc 06 tháng đầu năm","05 ngày kể từ ngày ký báo cáo soát xét, tối đa 90 ngày kể từ ngày kết thúc 06 tháng đầu năm"],"a":0,"e":"Điểm c khoản 2 Điều 14: thông thường 05 ngày kể từ ngày ký báo cáo soát xét nhưng không quá 45 ngày; công ty mẹ hoặc đơn vị kế toán cấp trên có đơn vị trực thuộc thì tối đa không quá 60 ngày kể từ ngày kết thúc 06 tháng đầu năm tài chính.","basis":"Điểm c khoản 2 Điều 14 Thông tư 96/2020/TT-BTC","quote":"phải công bố báo cáo tài chính bán niên đã được soát xét trong thời hạn 05 ngày, kể từ ngày tổ chức kiểm toán ký báo cáo soát xét nhưng tối đa không quá 60 ngày, kể từ ngày kết thúc 06 tháng đầu năm tài chính.","src":"TT_96_2020_TT-BTC_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-073","part":"LUAT","subject":"LU","topic":"Công bố thông tin","level":3,"q":"Công ty niêm yết W là công ty mẹ, không thực hiện soát xét BCTC quý. Hạn chót W phải công bố BCTC quý III/2026 (quý kết thúc ngày 30/9/2026) là:","o":["Ngày 20/10/2026","Ngày 30/10/2026","Ngày 14/11/2026","Ngày 29/11/2026"],"a":1,"e":"Điểm c khoản 3 Điều 14: BCTC quý công bố trong 20 ngày kể từ ngày kết thúc quý; công ty mẹ (hoặc đơn vị kế toán cấp trên có đơn vị trực thuộc) trong 30 ngày → 30/9 + 30 ngày = 30/10/2026. 20/10 là thời hạn của công ty không phải công ty mẹ.","basis":"Điểm c khoản 3 Điều 14 Thông tư 96/2020/TT-BTC","quote":"thì phải công bố báo cáo tài chính quý trong thời hạn 30 ngày, kể từ ngày kết thúc quý.","src":"TT_96_2020_TT-BTC_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-074","part":"LUAT","subject":"LU","topic":"Công bố thông tin","level":3,"q":"Công ty niêm yết X có lợi nhuận sau thuế quý II/2026 là 106 tỷ đồng, cùng kỳ năm trước là 120 tỷ đồng. Khi công bố BCTC quý II/2026, X:","o":["Không phải giải trình vì LNST kỳ này vẫn dương","Chỉ phải giải trình khi LNST giảm từ 20% trở lên so với cùng kỳ","Phải giải trình nguyên nhân vì LNST thay đổi từ 10% trở lên so với cùng kỳ","Chỉ phải giải trình khi số liệu trước và sau soát xét chênh lệch từ 5%"],"a":2,"e":"(106 − 120)/120 = −11,7% → thay đổi từ 10% trở lên so với cùng kỳ năm trước → phải đồng thời giải trình nguyên nhân khi công bố BCTC (điểm a khoản 4 Điều 14).","basis":"Điểm a khoản 4 Điều 14 Thông tư 96/2020/TT-BTC","quote":"Lợi nhuận sau thuế thu nhập doanh nghiệp tại báo cáo kết quả hoạt động kinh doanh của kỳ báo cáo thay đổi từ 10% trở lên so với báo cáo cùng kỳ năm trước;","src":"TT_96_2020_TT-BTC_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-075","part":"LUAT","subject":"LU","topic":"Công bố thông tin","level":1,"q":"Tổ chức, cá nhân khi trở thành hoặc không còn là cổ đông lớn của công ty đại chúng phải công bố thông tin, báo cáo trong thời hạn:","o":["03 ngày làm việc kể từ ngày trở thành hoặc không còn là cổ đông lớn","07 ngày làm việc kể từ ngày trở thành hoặc không còn là cổ đông lớn","10 ngày kể từ ngày trở thành hoặc không còn là cổ đông lớn","05 ngày làm việc kể từ ngày trở thành hoặc không còn là cổ đông lớn"],"a":3,"e":"Khoản 1 Điều 31: thời hạn 05 ngày làm việc kể từ ngày trở thành hoặc không còn là cổ đông lớn (tính từ ngày hoàn tất giao dịch).","basis":"Khoản 1 Điều 31 Thông tư 96/2020/TT-BTC","quote":"trong thời hạn 05 ngày làm việc, kể từ ngày trở thành hoặc không còn là cổ đông lớn.","src":"TT_96_2020_TT-BTC_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-076","part":"LUAT","subject":"LU","topic":"Công bố thông tin","level":3,"q":"Nhà đầu tư B sở hữu 7,6% cổ phiếu có quyền biểu quyết của công ty niêm yết Y. Ngày T, B mua thêm làm tỷ lệ tăng lên 7,9%; ngày T+3, B mua tiếp làm tỷ lệ tăng lên 8,2%. Nghĩa vụ công bố thông tin của B là:","o":["Phải CBTT trong 05 ngày làm việc từ ngày T+3 do vượt ngưỡng 8%","Phải CBTT sau giao dịch ngày T vì tỷ lệ sở hữu đã thay đổi 0,3%","Không phải CBTT vì mỗi giao dịch chỉ làm thay đổi dưới 1%","Phải CBTT trong 24 giờ sau mỗi giao dịch vì B là cổ đông lớn"],"a":0,"e":"Khoản 2 Điều 31: cổ đông lớn phải CBTT khi tỷ lệ sở hữu thay đổi qua các ngưỡng 1% (6%, 7%, 8%...). Giao dịch ngày T (7,6% → 7,9%) chưa qua ngưỡng; ngày T+3 (7,9% → 8,2%) vượt ngưỡng 8% → CBTT trong 05 ngày làm việc kể từ ngày hoàn tất giao dịch.","basis":"Khoản 2, khoản 3 Điều 31 Thông tư 96/2020/TT-BTC","quote":"Cổ đông lớn của công ty đại chúng, công ty đầu tư chứng khoán đại chúng khi có thay đổi về số lượng cổ phiếu sở hữu qua các ngưỡng 1% số cổ phiếu có quyền biểu quyết phải công bố thông tin","src":"TT_96_2020_TT-BTC_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-077","part":"LUAT","subject":"LU","topic":"Công bố thông tin","level":2,"q":"Cổ đông sáng lập nắm giữ cổ phiếu đang bị hạn chế chuyển nhượng theo pháp luật doanh nghiệp, khi thực hiện giao dịch phải gửi báo cáo cho UBCKNN, SGDCK, công ty đại chúng... trong thời hạn nào?","o":["Tối thiểu 05 ngày làm việc trước ngày thực hiện giao dịch","Tối thiểu 03 ngày làm việc trước ngày thực hiện giao dịch","Tối thiểu 10 ngày trước ngày thực hiện giao dịch","Trong vòng 24 giờ sau khi hoàn tất giao dịch"],"a":1,"e":"Khoản 1 Điều 32: tối thiểu 03 ngày làm việc trước ngày giao dịch phải gửi báo cáo theo mẫu Phụ lục XI; chuyển nhượng cho người không phải cổ đông sáng lập phải kèm nghị quyết ĐHĐCĐ. Kết quả giao dịch báo cáo trong 05 ngày làm việc.","basis":"Khoản 1 Điều 32 Thông tư 96/2020/TT-BTC","quote":"Tối thiểu 03 ngày làm việc trước ngày thực hiện giao dịch, cổ đông sáng lập nắm giữ cổ phiếu bị hạn chế chuyển nhượng theo quy định pháp luật về doanh nghiệp phải gửi báo cáo","src":"TT_96_2020_TT-BTC_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-078","part":"LUAT","subject":"LU","topic":"Quỹ đầu tư","level":1,"q":"Tần suất giao dịch chứng chỉ quỹ mở tối thiểu theo Thông tư 98/2020/TT-BTC là:","o":["01 lần trong 01 tháng","01 lần trong 01 tuần","02 lần trong 01 tháng","04 lần trong 01 tháng"],"a":2,"e":"Khoản 1 Điều 30: trong 30 ngày kể từ ngày Giấy chứng nhận đăng ký lập quỹ có hiệu lực, công ty quản lý quỹ phải tổ chức giao dịch chứng chỉ quỹ định kỳ; tần suất tối thiểu 02 lần trong 01 tháng.","basis":"Khoản 1 Điều 30 Thông tư 98/2020/TT-BTC (VBHN số 04/VBHN-BTC năm 2026, hợp nhất TT 136/2025)","quote":"Tần suất giao dịch tối thiểu 02 lần trong 01 tháng.","src":"VBHN_04_VBHN-BTC_2026_TT98_136_hop_nhat.txt","as_of":"2026-11"},{"id":"L2-079","part":"LUAT","subject":"LU","topic":"Quỹ đầu tư","level":2,"q":"Yêu cầu về đa dạng hóa tổ chức phát hành trong danh mục của quỹ mở theo Thông tư 98/2020/TT-BTC là:","o":["Có chứng khoán của ít nhất 05 tổ chức phát hành, áp dụng cả quỹ trái phiếu","Có chứng khoán của ít nhất 10 tổ chức phát hành, trừ quỹ trái phiếu","Có chứng khoán của ít nhất 03 tổ chức phát hành, trừ quỹ cổ phiếu","Có chứng khoán của ít nhất 06 tổ chức phát hành, trừ quỹ trái phiếu"],"a":3,"e":"Điểm l khoản 4 Điều 35: quỹ mở phải có chứng khoán của ít nhất 06 tổ chức phát hành, trừ trường hợp quỹ trái phiếu.","basis":"Điểm l khoản 4 Điều 35 Thông tư 98/2020/TT-BTC (VBHN số 04/VBHN-BTC năm 2026, hợp nhất TT 136/2025)","quote":"Phải có chứng khoán của ít nhất 06 tổ chức phát hành, trừ trường hợp quỹ trái phiếu;","src":"VBHN_04_VBHN-BTC_2026_TT98_136_hop_nhat.txt","as_of":"2026-11"},{"id":"L2-080","part":"LUAT","subject":"LU","topic":"Quỹ đầu tư","level":3,"q":"Quỹ mở M có tổng giá trị tài sản 500 tỷ đồng. Tổng giá trị tối đa quỹ được đầu tư vào chứng khoán đang lưu hành và tiền gửi, công cụ thị trường tiền tệ của cùng một tổ chức phát hành (không phải công cụ nợ Chính phủ) là:","o":["100 tỷ đồng","50 tỷ đồng","150 tỷ đồng","200 tỷ đồng"],"a":0,"e":"Điểm c khoản 4 Điều 35: không đầu tư quá 20% tổng giá trị tài sản của quỹ vào chứng khoán đang lưu hành và tiền gửi, công cụ thị trường tiền tệ của một tổ chức phát hành → 20% × 500 = 100 tỷ đồng.","basis":"Điểm c khoản 4 Điều 35 Thông tư 98/2020/TT-BTC (VBHN số 04/VBHN-BTC năm 2026, hợp nhất TT 136/2025)","quote":"Không được đầu tư quá 20% tổng giá trị tài sản của quỹ vào chứng khoán đang lưu hành và các tài sản (nếu có) quy định tại điểm a, b khoản 2 Điều này của một tổ chức phát hành, trừ công cụ nợ của Chính phủ;","src":"VBHN_04_VBHN-BTC_2026_TT98_136_hop_nhat.txt","as_of":"2026-11"},{"id":"L2-081","part":"LUAT","subject":"LU","topic":"Quỹ đầu tư","level":2,"q":"Theo Thông tư 98/2020/TT-BTC (sửa đổi bởi Thông tư 136/2025/TT-BTC), hạn mức đối với các hạng mục đầu tư lớn trong danh mục quỹ mở (không phải quỹ trái phiếu) là:","o":["Tổng không quá 49% tổng tài sản; hạng mục lớn là khoản từ 10% tổng tài sản trở lên","Tổng không quá 40% tổng tài sản; hạng mục lớn là khoản từ 5% tổng tài sản trở lên","Tổng không quá 40% tổng tài sản; hạng mục lớn là khoản từ 10% tổng tài sản trở lên","Tổng không quá 30% tổng tài sản; hạng mục lớn là khoản từ 5% tổng tài sản trở lên"],"a":1,"e":"Điểm e khoản 4 Điều 35 (sửa đổi bởi khoản 6 Điều 17 TT 136/2025): tổng giá trị các hạng mục đầu tư lớn không vượt quá 40% tổng giá trị tài sản (trừ quỹ trái phiếu); hạng mục lớn là đầu tư vào tài sản của cùng một tổ chức chiếm từ 5% tổng giá trị tài sản trở lên.","basis":"Điểm e khoản 4 Điều 35 Thông tư 98/2020/TT-BTC (VBHN số 04/VBHN-BTC năm 2026, hợp nhất TT 136/2025)","quote":"Tổng giá trị các hạng mục đầu tư lớn trong danh mục đầu tư của quỹ không được vượt quá 40% tổng giá trị tài sản của quỹ, trừ trường hợp quỹ trái phiếu.","src":"VBHN_04_VBHN-BTC_2026_TT98_136_hop_nhat.txt","as_of":"2026-11"},{"id":"L2-082","part":"LUAT","subject":"LU","topic":"Quỹ đầu tư","level":1,"q":"Công ty quản lý quỹ được vay ngắn hạn cho quỹ để trang trải chi phí hoặc thanh toán giao dịch chứng chỉ quỹ với giới hạn nào?","o":["Tổng khoản vay không quá 10% giá trị tài sản ròng, thời hạn vay tối đa 90 ngày","Tổng khoản vay không quá 5% giá trị tài sản ròng, thời hạn vay tối đa 90 ngày","Tổng khoản vay không quá 5% giá trị tài sản ròng, thời hạn vay tối đa 30 ngày","Tổng khoản vay không quá 20% giá trị tài sản ròng, thời hạn vay tối đa 30 ngày"],"a":2,"e":"Khoản 2 Điều 25: không được vay để đầu tư; chỉ vay ngắn hạn để trang trải chi phí cần thiết hoặc thanh toán giao dịch chứng chỉ quỹ, tổng khoản vay ≤ 5% NAV tại mọi thời điểm, thời hạn tối đa 30 ngày (áp dụng cho quỹ mở theo khoản 9 Điều 35).","basis":"Khoản 2 Điều 25 Thông tư 98/2020/TT-BTC (VBHN số 04/VBHN-BTC năm 2026, hợp nhất TT 136/2025)","quote":"Tổng giá trị các khoản vay ngắn hạn của quỹ không được quá 5% giá trị tài sản ròng của quỹ tại mọi thời điểm và thời hạn vay tối đa 30 ngày.","src":"VBHN_04_VBHN-BTC_2026_TT98_136_hop_nhat.txt","as_of":"2026-11"},{"id":"L2-083","part":"LUAT","subject":"LU","topic":"Quỹ đầu tư","level":3,"q":"Quỹ mở N có giá trị tài sản ròng 200 tỷ đồng. Tại một ngày giao dịch, tổng lệnh bán là 18 tỷ đồng, tổng lệnh mua là 7 tỷ đồng (không có lệnh chuyển đổi). Điều lệ và Bản cáo bạch có quy định về quản lý thanh khoản. Công ty quản lý quỹ:","o":["Phải đáp ứng toàn bộ lệnh vì tổng lệnh bán mới bằng 9% NAV, dưới 10%","Phải đáp ứng toàn bộ lệnh vì NAV sau giao dịch vẫn trên 50 tỷ đồng","Bắt buộc phải tạm dừng giao dịch chứng chỉ quỹ ngay trong ngày","Được quyền chỉ đáp ứng một phần lệnh vì giá trị bán ròng bằng 5,5% NAV"],"a":3,"e":"Bán ròng = 18 − 7 = 11 tỷ = 5,5% NAV ≥ 5% → theo điểm a khoản 1 Điều 33 (sửa đổi bởi TT 136/2025), công ty quản lý quỹ có quyền chỉ đáp ứng một phần lệnh (theo nguyên tắc ưu tiên thời gian hoặc cùng tỷ lệ).","basis":"Điểm a khoản 1 Điều 33 Thông tư 98/2020/TT-BTC (VBHN số 04/VBHN-BTC năm 2026, hợp nhất TT 136/2025)","quote":"Tổng giá trị các lệnh bán (kể cả lệnh bán từ hoạt động chuyển đổi) trừ tổng giá trị các lệnh mua (kể cả lệnh mua từ hoạt động chuyển đổi) tại ngày giao dịch chứng chỉ quỹ lớn hơn hoặc bằng 5% giá trị tài sản ròng của quỹ","src":"VBHN_04_VBHN-BTC_2026_TT98_136_hop_nhat.txt","as_of":"2026-11"},{"id":"L2-084","part":"LUAT","subject":"LU","topic":"Quỹ đầu tư","level":1,"q":"Khi chào bán chứng chỉ quỹ lần đầu ra công chúng, thời hạn đăng ký mua tối thiểu dành cho nhà đầu tư là:","o":["20 ngày","10 ngày","15 ngày","30 ngày"],"a":0,"e":"Khoản 1 Điều 14: phải phân phối công bằng, công khai, bảo đảm thời hạn đăng ký mua tối thiểu 20 ngày và ghi trong bản thông báo chào bán; khoản 2: hoàn thành phân phối trong 90 ngày kể từ ngày Giấy chứng nhận chào bán có hiệu lực.","basis":"Khoản 1 Điều 14 Thông tư 98/2020/TT-BTC (VBHN số 04/VBHN-BTC năm 2026, hợp nhất TT 136/2025)","quote":"bảo đảm thời hạn đăng ký mua chứng chỉ quỹ cho nhà đầu tư tối thiểu là 20 ngày; thời hạn này phải được ghi trong bản thông báo chào bán.","src":"VBHN_04_VBHN-BTC_2026_TT98_136_hop_nhat.txt","as_of":"2026-11"},{"id":"L2-085","part":"LUAT","subject":"LU","topic":"Quỹ đầu tư","level":2,"q":"Theo Thông tư 98/2020/TT-BTC (sửa đổi bởi Thông tư 136/2025/TT-BTC), cuộc họp Đại hội nhà đầu tư lần thứ nhất được tiến hành khi:","o":["Số nhà đầu tư dự họp đại diện cho từ 65% tổng số phiếu biểu quyết","Số nhà đầu tư dự họp đại diện cho trên 50% tổng số phiếu biểu quyết","Số nhà đầu tư dự họp đại diện cho từ 51% số phiếu của nhà đầu tư dự họp","Có ít nhất 100 nhà đầu tư tham dự trực tiếp hoặc qua ủy quyền"],"a":1,"e":"Khoản 1 Điều 18 (sửa đổi bởi Điều 6 TT 136/2025): họp được tiến hành khi số nhà đầu tư tham dự đại diện trên 50% tổng số phiếu biểu quyết; lần hai triệu tập trong 30 ngày và tiến hành không phụ thuộc số dự họp. Một số nội dung quan trọng cần trên 65% phiếu dự họp tán thành.","basis":"Khoản 1 Điều 18 Thông tư 98/2020/TT-BTC (VBHN số 04/VBHN-BTC năm 2026, hợp nhất TT 136/2025)","quote":"Cuộc họp Đại hội nhà đầu tư được tiến hành khi có số nhà đầu tư tham dự đại diện cho trên 50% tổng số phiếu biểu quyết.","src":"VBHN_04_VBHN-BTC_2026_TT98_136_hop_nhat.txt","as_of":"2026-11"},{"id":"L2-086","part":"LUAT","subject":"LU","topic":"Quỹ đầu tư","level":2,"q":"Theo Thông tư 98/2020/TT-BTC (sửa đổi, bổ sung bởi Thông tư 136/2025/TT-BTC), quỹ mở được đầu tư vào chứng quyền có bảo đảm với giới hạn nào?","o":["Chứng quyền thanh toán bằng chứng khoán cơ sở; không quá 10% số lưu hành của một mã","Chứng quyền niêm yết hoặc chưa niêm yết; không quá 5% số lưu hành của một mã","Chứng quyền niêm yết, thanh toán bằng tiền; không quá 5% số đang lưu hành của một mã","Chứng quyền niêm yết, thanh toán bằng tiền; không quá 20% số lưu hành của một mã"],"a":2,"e":"TT 136/2025 bổ sung điểm h khoản 2 Điều 35 (chứng quyền có bảo đảm niêm yết, thanh toán bằng tiền) và điểm m khoản 4 Điều 35: không đầu tư quá 5% tổng số chứng quyền có bảo đảm đang lưu hành của một mã.","basis":"Điểm h khoản 2, điểm m khoản 4 Điều 35 Thông tư 98/2020/TT-BTC (VBHN số 04/VBHN-BTC năm 2026, hợp nhất TT 136/2025)","quote":"Không được đầu tư quá 5% tổng số chứng quyền có bảo đảm đang lưu hành của một mã chứng quyền có bảo đảm.","src":"VBHN_04_VBHN-BTC_2026_TT98_136_hop_nhat.txt","as_of":"2026-11"},{"id":"L2-087","part":"LUAT","subject":"LU","topic":"CK phái sinh","level":1,"q":"Vốn điều lệ, vốn chủ sở hữu tối thiểu để CTCK được cấp Giấy chứng nhận đủ điều kiện hoạt động môi giới chứng khoán phái sinh là:","o":["250 tỷ đồng","600 tỷ đồng","1.200 tỷ đồng","800 tỷ đồng"],"a":3,"e":"Điểm b khoản 2 Điều 4 NĐ 158 (không bị NĐ 306 sửa đổi): môi giới CKPS 800 tỷ; tự doanh CKPS 600 tỷ; tư vấn đầu tư CKPS 250 tỷ đồng.","basis":"Điểm b khoản 2 Điều 4 Nghị định 158/2020/NĐ-CP","quote":"Đối với hoạt động môi giới chứng khoán phái sinh: có vốn điều lệ, có vốn chủ sở hữu tối thiểu từ 800 tỷ đồng trở lên;","src":"ND_158_2020_ND-CP_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-088","part":"LUAT","subject":"LU","topic":"CK phái sinh","level":3,"q":"CTCK Q đăng ký kinh doanh cả ba hoạt động: môi giới, tự doanh và tư vấn đầu tư chứng khoán phái sinh. Vốn điều lệ, vốn chủ sở hữu tối thiểu Q phải có là:","o":["800 tỷ đồng","1.650 tỷ đồng","1.400 tỷ đồng","600 tỷ đồng"],"a":0,"e":"Khác với Điều 175 NĐ 155 (cộng dồn theo nghiệp vụ), NĐ 158 quy định khi đăng ký cả ba hoạt động CKPS thì vốn tối thiểu là 800 tỷ đồng. 1.650 = 800 + 600 + 250 là lỗi cộng dồn.","basis":"Điểm b khoản 2 Điều 4 Nghị định 158/2020/NĐ-CP","quote":"Trường hợp đăng ký kinh doanh cả hoạt động môi giới chứng khoán phái sinh, tự doanh chứng khoán phái sinh và tư vấn đầu tư chứng khoán phái sinh, công ty chứng khoán phải có vốn điều lệ, có vốn chủ sở hữu tối thiểu từ 800 tỷ đồng trở lên","src":"ND_158_2020_ND-CP_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-089","part":"LUAT","subject":"LU","topic":"CK phái sinh","level":2,"q":"Công ty quản lý quỹ đầu tư chứng khoán được thực hiện hoạt động kinh doanh chứng khoán phái sinh nào?","o":["Môi giới và tư vấn đầu tư chứng khoán phái sinh","Chỉ tư vấn đầu tư chứng khoán phái sinh","Tự doanh chứng khoán phái sinh bằng vốn của công ty","Môi giới, tự doanh và tư vấn đầu tư chứng khoán phái sinh"],"a":1,"e":"Điểm b khoản 1 Điều 4: công ty quản lý quỹ chỉ được thực hiện hoạt động tư vấn đầu tư CKPS (vốn điều lệ, VCSH tối thiểu 25 tỷ đồng – điểm a khoản 3).","basis":"Điểm b khoản 1 Điều 4 Nghị định 158/2020/NĐ-CP","quote":"Công ty quản lý quỹ chỉ được thực hiện hoạt động tư vấn đầu tư chứng khoán phái sinh.","src":"ND_158_2020_ND-CP_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-090","part":"LUAT","subject":"LU","topic":"CK phái sinh","level":1,"q":"Vốn điều lệ, vốn chủ sở hữu tối thiểu đối với CTCK đề nghị làm thành viên bù trừ chung trên thị trường chứng khoán phái sinh là:","o":["900 tỷ đồng","800 tỷ đồng","1.200 tỷ đồng","5.000 tỷ đồng"],"a":2,"e":"Điểm c khoản 2 Điều 9 (không bị NĐ 306 sửa đổi): thành viên bù trừ trực tiếp 900 tỷ; thành viên bù trừ chung 1.200 tỷ đồng. Mức 5.000 tỷ áp dụng cho ngân hàng thương mại (điểm b khoản 3).","basis":"Điểm c khoản 2 Điều 9 Nghị định 158/2020/NĐ-CP","quote":"Đối với thành viên bù trừ chung: có vốn điều lệ, có vốn chủ sở hữu tối thiểu từ 1.200 tỷ đồng trở lên;","src":"ND_158_2020_ND-CP_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-091","part":"LUAT","subject":"LU","topic":"CK phái sinh","level":2,"q":"Theo Nghị định 158/2020/NĐ-CP (sửa đổi bởi Nghị định 306/2025/NĐ-CP, hiệu lực 09/01/2026), điều kiện nào sau đây đã bị bãi bỏ đối với CTCK đề nghị cấp Giấy chứng nhận đủ điều kiện kinh doanh chứng khoán phái sinh?","o":["Vốn điều lệ, vốn chủ sở hữu tối thiểu theo từng hoạt động phái sinh","Tối thiểu 05 nhân viên có CCHN và chứng chỉ phái sinh cho mỗi hoạt động","Không có lỗ trong 02 năm gần nhất của công ty chứng khoán","Tỷ lệ vốn khả dụng tối thiểu 220% liên tục trong 12 tháng gần nhất"],"a":3,"e":"Khoản 10 Điều 2 NĐ 306/2025 bãi bỏ điểm c (kiểm soát nội bộ), điểm đ (tỷ lệ vốn khả dụng 220% liên tục 12 tháng) và điểm h khoản 2 Điều 4 NĐ 158. Các điều kiện về vốn (điểm b), nhân sự (điểm d), không lỗ 02 năm (điểm e) vẫn giữ nguyên.","basis":"Khoản 10 Điều 2 Nghị định 306/2025/NĐ-CP; điểm đ khoản 2 Điều 4 Nghị định 158/2020/NĐ-CP","quote":"Points c, dd, h clause 2 Article 4; point dd clause 1 Article 5; points g, h clause 2, point c clause 3 Article 9; point d clause 1 Article 10 of the Government’s Decree No. 158/2020/ND-CP dated December 31, 2020 prescribing on derivatives and derivative market are abrogated.","src":"ND_306_2025_ND-CP_English_SSC.txt","as_of":"2026-11"},{"id":"L2-092","part":"LUAT","subject":"LU","topic":"Xử phạt vi phạm","level":2,"q":"Theo Nghị định 156/2020/NĐ-CP (sửa đổi bởi Nghị định 128/2021/NĐ-CP), một tổ chức có hành vi sử dụng thông tin nội bộ để mua, bán chứng khoán (chưa đến mức truy cứu trách nhiệm hình sự) bị phạt tiền ở mức nào?","o":["10 lần khoản thu trái pháp luật, không thấp hơn 3 tỷ đồng","05 lần khoản thu trái pháp luật, không thấp hơn 1,5 tỷ đồng","02 lần khoản thu trái pháp luật, không thấp hơn 3 tỷ đồng","10 lần khoản thu trái pháp luật, tối đa không quá 3 tỷ đồng"],"a":0,"e":"Khoản 1 Điều 35 (sửa đổi bởi khoản 29 Điều 1 NĐ 128/2021): phạt tiền 10 lần khoản thu trái pháp luật nhưng không thấp hơn mức phạt tiền tối đa tại điểm b khoản 3 Điều 5 (3 tỷ đồng đối với tổ chức); không có khoản thu trái pháp luật hoặc mức tính theo khoản thu thấp hơn thì phạt 3 tỷ đồng. Mức phạt Chương II áp dụng cho tổ chức; cá nhân vi phạm như tổ chức bị phạt bằng 1/2 (tức 05 lần, không thấp hơn 1,5 tỷ đồng). NĐ 306/2025 không sửa Điều 35.","basis":"Khoản 1 Điều 35 Nghị định 156/2020/NĐ-CP (sửa đổi bởi khoản 29 Điều 1 Nghị định 128/2021/NĐ-CP); điểm b, c khoản 3 Điều 5 (sửa đổi bởi khoản 4 Điều 1 Nghị định 128/2021/NĐ-CP)","quote":"Phạt tiền 10 lần khoản thu trái pháp luật nhưng không thấp hơn mức phạt tiền tối đa quy định tại điểm b khoản 3 Điều 5 Nghị định này đối với hành vi sử dụng thông tin nội bộ để mua, bán chứng khoán","src":"Web_TT96_hop_nhat_2026_va_ND128_2021_trich.md","as_of":"2026-11"},{"id":"L2-093","part":"LUAT","subject":"LU","topic":"Xử phạt vi phạm","level":1,"q":"Người hành nghề chứng khoán có hành vi thao túng thị trường chứng khoán (chưa đến mức hình sự) bị áp dụng hình thức xử phạt bổ sung tước quyền sử dụng CCHN trong thời hạn:","o":["Từ 01 tháng đến 03 tháng","Từ 18 tháng đến 24 tháng","Từ 06 tháng đến 12 tháng","Từ 12 tháng đến 18 tháng"],"a":1,"e":"Điểm b khoản 2 Điều 36 (tương tự Điều 35 về sử dụng thông tin nội bộ): tước quyền sử dụng CCHN chứng khoán từ 18 tháng đến 24 tháng.","basis":"Điểm b khoản 2 Điều 36 Nghị định 156/2020/NĐ-CP","quote":"Tước quyền sử dụng chứng chỉ hành nghề chứng khoán trong thời hạn từ 18 tháng đến 24 tháng đối với người hành nghề chứng khoán có hành vi vi phạm quy định tại khoản 1 Điều này.","src":"ND_156_2020_ND-CP_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-094","part":"LUAT","subject":"LU","topic":"Xử phạt vi phạm","level":1,"q":"Hình thức xử phạt bổ sung đối với công ty chứng khoán có hành vi thao túng thị trường chứng khoán (chưa đến mức truy cứu trách nhiệm hình sự) là:","o":["Đình chỉ hoạt động kinh doanh, dịch vụ chứng khoán từ 03 tháng đến 06 tháng","Đình chỉ hoạt động kinh doanh, dịch vụ chứng khoán từ 06 tháng đến 12 tháng","Đình chỉ hoạt động kinh doanh, dịch vụ chứng khoán từ 01 tháng đến 03 tháng","Thu hồi ngay Giấy phép thành lập và hoạt động kinh doanh chứng khoán"],"a":2,"e":"Điểm a khoản 2 Điều 36: đình chỉ hoạt động kinh doanh, dịch vụ chứng khoán từ 01 tháng đến 03 tháng đối với CTCK, CTQLQ, chi nhánh CTCK/CTQLQ nước ngoài vi phạm; kèm biện pháp buộc nộp lại khoản thu trái pháp luật.","basis":"Điểm a khoản 2 Điều 36 Nghị định 156/2020/NĐ-CP","quote":"Đình chỉ hoạt động kinh doanh, dịch vụ chứng khoán trong thời hạn từ 01 tháng đến 03 tháng đối với công ty chứng khoán","src":"ND_156_2020_ND-CP_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-095","part":"LUAT","subject":"LU","topic":"Xử phạt vi phạm","level":2,"q":"Theo Nghị định 156/2020/NĐ-CP (sửa đổi bởi Nghị định 128/2021/NĐ-CP), đối với hành vi vi phạm hành chính trong lĩnh vực chứng khoán đã kết thúc, thời hiệu xử phạt được tính từ thời điểm nào?","o":["Thời điểm người có thẩm quyền phát hiện hành vi vi phạm","Thời điểm bắt đầu thực hiện hành vi vi phạm","Thời điểm lập biên bản vi phạm hành chính","Thời điểm chấm dứt hành vi vi phạm"],"a":3,"e":"Khoản 2 Điều 6 (sửa đổi bởi khoản 5 Điều 1 NĐ 128/2021): hành vi đang thực hiện → thời hiệu tính từ thời điểm người có thẩm quyền thi hành công vụ phát hiện; hành vi đã kết thúc → tính từ thời điểm chấm dứt hành vi vi phạm. Khoản 3 Điều 6 xác định riêng thời điểm chấm dứt cho một số hành vi (ví dụ chậm công bố thông tin: ngày thực hiện công bố).","basis":"Điểm b khoản 2 Điều 6 Nghị định 156/2020/NĐ-CP (sửa đổi bởi khoản 5 Điều 1 Nghị định 128/2021/NĐ-CP)","quote":"Đối với hành vi vi phạm hành chính đã kết thúc thì thời hiệu được tính từ thời điểm chấm dứt hành vi vi phạm.","src":"Web_TT96_hop_nhat_2026_va_ND128_2021_trich.md","as_of":"2026-11"}]</script>
<script type="application/json" id="data-luat_ck">{"van_ban":"Luật Chứng khoán số 54/2019/QH14, hợp nhất theo VBHN 24/VBHN-VPQH năm 2025 (đã gồm sửa đổi của Luật 56/2024/QH15)","nguon":"Công báo số 531+532 ngày 18/3/2025","dieu":[{"so":"1","ten":"Phạm vi điều chỉnh","chuong":"Chương I. NHỮNG QUY ĐỊNH CHUNG","doan":["Luật này quy định các hoạt động về chứng khoán và thị trường chứng khoán; quyền và nghĩa vụ của tổ chức, cá nhân trong lĩnh vực chứng khoán; tổ chức thị trường chứng khoán; quản lý nhà nước về chứng khoán và thị trường chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"2","ten":"Đối tượng áp dụng","chuong":"Chương I. NHỮNG QUY ĐỊNH CHUNG","doan":["1. Tổ chức, cá nhân Việt Nam và tổ chức, cá nhân nước ngoài tham gia đầu tư chứng khoán và hoạt động trên thị trường chứng khoán Việt Nam.","2. Cơ quan quản lý nhà nước về chứng khoán và thị trường chứng khoán.","3. Cơ quan, tổ chức, cá nhân khác có liên quan đến hoạt động về chứng khoán và thị trường chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"3","ten":"Áp dụng Luật Chứng khoán, các luật có liên quan","chuong":"Chương I. NHỮNG QUY ĐỊNH CHUNG","doan":["Các hoạt động về chứng khoán và thị trường chứng khoán, quyền và nghĩa vụ của tổ chức, cá nhân trong lĩnh vực chứng khoán, tổ chức thị trường chứng khoán, quản lý nhà nước về chứng khoán và thị trường chứng khoán phải tuân thủ quy định của Luật này và quy định khác của pháp luật có liên quan."],"sua_doi":false,"ghi_chu":[]},{"so":"4","ten":"Giải thích từ ngữ","chuong":"Chương I. NHỮNG QUY ĐỊNH CHUNG","doan":["Trong Luật này, các từ ngữ dưới đây được hiểu như sau:","1. Chứng khoán là tài sản, bao gồm các loại sau đây:","a) Cổ phiếu, trái phiếu, chứng chỉ quỹ;","b) Chứng quyền, chứng quyền có bảo đảm, quyền mua cổ phần, chứng chỉ lưu ký;","c) Chứng khoán phái sinh;","d) Các loại chứng khoán khác do Chính phủ quy định.","2. Cổ phiếu là loại chứng khoán xác nhận quyền và lợi ích hợp pháp của người sở hữu đối với một phần vốn cổ phần của tổ chức phát hành.","3. Trái phiếu là loại chứng khoán xác nhận quyền và lợi ích hợp pháp của người sở hữu đối với một phần nợ của tổ chức phát hành.","4. Chứng chỉ quỹ là loại chứng khoán xác nhận quyền sở hữu của nhà đầu tư đối với một phần vốn góp của quỹ đầu tư chứng khoán.","5. Chứng quyền là loại chứng khoán được phát hành cùng với việc phát hành trái phiếu hoặc cổ phiếu ưu đãi, cho phép người sở hữu chứng quyền được quyền mua một số cổ phiếu phổ thông nhất định theo mức giá đã được xác định trước trong khoảng thời gian xác định.","6. Chứng quyền có bảo đảm là loại chứng khoán có tài sản bảo đảm do công ty chứng khoán phát hành, cho phép người sở hữu được quyền mua (chứng quyền mua) hoặc được quyền bán (chứng quyền bán) chứng khoán cơ sở với tổ chức phát hành chứng quyền có bảo đảm đó theo mức giá đã được xác định trước, tại một thời điểm hoặc trước một thời điểm đã được ấn định hoặc nhận khoản tiền chênh lệch giữa giá thực hiện và giá chứng khoán cơ sở tại thời điểm thực hiện.","7. Quyền mua cổ phần là loại chứng khoán do công ty cổ phần phát hành nhằm mang lại cho cổ đông hiện hữu quyền được mua cổ phần mới theo điều kiện đã được xác định.","8. Chứng chỉ lưu ký là loại chứng khoán được phát hành trên cơ sở chứng khoán của tổ chức được thành lập và hoạt động hợp pháp tại Việt Nam.","9. Chứng khoán phái sinh là công cụ tài chính dưới dạng hợp đồng, bao gồm hợp đồng quyền chọn, hợp đồng tương lai, hợp đồng kỳ hạn, trong đó xác nhận quyền, nghĩa vụ của các bên đối với việc thanh toán tiền, chuyển giao số lượng tài sản cơ sở nhất định theo mức giá đã được xác định trong khoảng thời gian hoặc vào ngày đã xác định trong tương lai.","10. Tài sản cơ sở của chứng khoán phái sinh (sau đây gọi là tài sản cơ sở) là chứng khoán, chỉ số chứng khoán hoặc tài sản khác theo quy định của Chính phủ được sử dụng làm cơ sở để xác định giá trị chứng khoán phái sinh.","11. Hợp đồng quyền chọn là loại chứng khoán phái sinh, xác nhận quyền của người mua và nghĩa vụ của người bán để thực hiện một trong các giao dịch sau đây:","a) Mua hoặc bán số lượng tài sản cơ sở nhất định theo mức giá thực hiện đã được xác định tại thời điểm trước hoặc vào ngày đã xác định trong tương lai;","b) Thanh toán khoản chênh lệch giữa giá trị tài sản cơ sở đã được xác định tại thời điểm giao kết hợp đồng và giá trị tài sản cơ sở tại thời điểm trước hoặc vào ngày đã xác định trong tương lai.","12. Hợp đồng tương lai là loại chứng khoán phái sinh niêm yết, xác nhận cam kết giữa các bên để thực hiện một trong các giao dịch sau đây:","a) Mua hoặc bán số lượng tài sản cơ sở nhất định theo mức giá đã được xác định vào ngày đã xác định trong tương lai;","b) Thanh toán khoản chênh lệch giữa giá trị tài sản cơ sở đã được xác định tại thời điểm giao kết hợp đồng và giá trị tài sản cơ sở vào ngày đã xác định trong tương lai.","13. Hợp đồng kỳ hạn là loại chứng khoán phái sinh giao dịch thỏa thuận, xác nhận cam kết giữa các bên về việc mua hoặc bán số lượng tài sản cơ sở nhất định theo mức giá đã được xác định vào ngày đã xác định trong tương lai.","14. Hoạt động về chứng khoán và thị trường chứng khoán bao gồm hoạt động chào bán, niêm yết, giao dịch, kinh doanh, đầu tư chứng khoán, cung cấp dịch vụ về chứng khoán, công bố thông tin, quản trị công ty đại chúng và các hoạt động khác được quy định tại Luật này.","15. Đầu tư chứng khoán là việc mua, bán, nắm giữ chứng khoán của nhà đầu tư trên thị trường chứng khoán.","16. Nhà đầu tư là tổ chức, cá nhân tham gia đầu tư trên thị trường chứng khoán.","17. Nhà đầu tư chiến lược là nhà đầu tư được Đại hội đồng cổ đông lựa chọn theo các tiêu chí về năng lực tài chính, trình độ công nghệ và có cam kết hợp tác với công ty trong thời gian ít nhất 03 năm.","18. Cổ đông lớn là cổ đông sở hữu từ 5% trở lên số cổ phiếu có quyền biểu quyết của một tổ chức phát hành.","19. Chào bán chứng khoán ra công chúng là việc chào bán chứng khoán theo một trong các phương thức sau đây:","a) Chào bán thông qua phương tiện thông tin đại chúng;","b) Chào bán cho từ 100 nhà đầu tư trở lên, không kể nhà đầu tư chứng khoán chuyên nghiệp;","c) Chào bán cho các nhà đầu tư không xác định.","20. Chào bán chứng khoán riêng lẻ là việc chào bán chứng khoán không thuộc trường hợp quy định tại điểm a khoản 19 Điều này và theo một trong các phương thức sau đây:","a) Chào bán cho dưới 100 nhà đầu tư, không kể nhà đầu tư chứng khoán chuyên nghiệp;","b) Chỉ chào bán cho nhà đầu tư chứng khoán chuyên nghiệp.","21. Tổ chức phát hành là tổ chức thực hiện chào bán, phát hành chứng khoán.","22. Tổ chức kiểm toán được chấp thuận là tổ chức kiểm toán độc lập thuộc danh sách các tổ chức kiểm toán được Ủy ban Chứng khoán Nhà nước chấp thuận kiểm toán theo quy định của Luật này và pháp luật về kiểm toán độc lập.","23. Bản cáo bạch là tài liệu hoặc dữ liệu điện tử công khai những thông tin chính xác, trung thực, khách quan liên quan đến việc chào bán hoặc niêm yết chứng khoán của tổ chức phát hành.","24. Niêm yết chứng khoán là việc đưa chứng khoán có đủ điều kiện niêm yết vào giao dịch trên hệ thống giao dịch cho chứng khoán niêm yết.","25. Đăng ký giao dịch là việc đưa chứng khoán vào giao dịch trên hệ thống giao dịch cho chứng khoán chưa niêm yết.","26. Hệ thống giao dịch chứng khoán bao gồm hệ thống giao dịch cho chứng khoán niêm yết và hệ thống giao dịch cho chứng khoán chưa niêm yết, do Sở giao dịch chứng khoán Việt Nam và công ty con của Sở giao dịch chứng khoán Việt Nam (sau đây gọi là Sở giao dịch chứng khoán Việt Nam và công ty con) tổ chức, vận hành.","27. Thị trường giao dịch chứng khoán là địa điểm hoặc hình thức trao đổi thông tin để tập hợp lệnh mua, bán và giao dịch chứng khoán.","28. Kinh doanh chứng khoán là việc thực hiện nghiệp vụ môi giới chứng khoán, tự doanh chứng khoán, bảo lãnh phát hành chứng khoán, tư vấn đầu tư chứng khoán, quản lý quỹ đầu tư chứng khoán, quản lý danh mục đầu tư chứng khoán và cung cấp dịch vụ về chứng khoán theo quy định tại Điều 86 của Luật này.","29. Môi giới chứng khoán là việc làm trung gian thực hiện mua, bán chứng khoán cho khách hàng.","30. Tự doanh chứng khoán là việc công ty chứng khoán mua, bán chứng khoán cho chính mình.","31. Bảo lãnh phát hành chứng khoán là việc cam kết với tổ chức phát hành nhận mua một phần hoặc toàn bộ chứng khoán của tổ chức phát hành để bán lại hoặc mua số chứng khoán còn lại chưa được phân phối hết hoặc cố gắng tối đa để phân phối số chứng khoán cần phát hành của tổ chức phát hành.","32. Tư vấn đầu tư chứng khoán là việc cung cấp cho khách hàng kết quả phân tích, báo cáo phân tích và đưa ra khuyến nghị liên quan đến việc mua, bán, nắm giữ chứng khoán.","33. Đăng ký chứng khoán là việc ghi nhận thông tin về tổ chức phát hành, chứng khoán của tổ chức phát hành và người sở hữu chứng khoán.","34. Lưu ký chứng khoán là việc nhận ký gửi, bảo quản, chuyển giao chứng khoán cho khách hàng, giúp khách hàng thực hiện các quyền liên quan đến chứng khoán lưu ký.","35. Quản lý danh mục đầu tư chứng khoán là hoạt động quản lý theo ủy thác của từng nhà đầu tư trong việc mua, bán, nắm giữ chứng khoán và các tài sản khác của nhà đầu tư.","36. Quản lý quỹ đầu tư chứng khoán là hoạt động quản lý trong việc mua, bán, nắm giữ chứng khoán và các tài sản khác của quỹ đầu tư chứng khoán.","37. Quỹ đầu tư chứng khoán là quỹ hình thành từ vốn góp của nhà đầu tư với mục đích thu lợi nhuận từ việc đầu tư vào chứng khoán hoặc vào các tài sản khác, kể cả bất động sản, trong đó nhà đầu tư không có quyền kiểm soát hằng ngày đối với việc ra quyết định đầu tư của quỹ.","38. Quỹ đại chúng là quỹ đầu tư chứng khoán thực hiện chào bán chứng chỉ quỹ ra công chúng.","39. Quỹ mở là quỹ đại chúng mà chứng chỉ quỹ đã chào bán ra công chúng phải được mua lại theo yêu cầu của nhà đầu tư.","40. Quỹ đóng là quỹ đại chúng mà chứng chỉ quỹ đã chào bán ra công chúng không được mua lại theo yêu cầu của nhà đầu tư.","41. Quỹ thành viên là quỹ đầu tư chứng khoán có số thành viên tham gia góp vốn từ 02 đến 99 thành viên và chỉ bao gồm thành viên là nhà đầu tư chứng khoán chuyên nghiệp.","42. Quỹ hoán đổi danh mục là quỹ mở hình thành từ việc tiếp nhận, hoán đổi danh mục chứng khoán cơ cấu lấy chứng chỉ quỹ. Chứng chỉ quỹ hoán đổi danh mục được niêm yết và giao dịch trên hệ thống giao dịch cho chứng khoán niêm yết.","43. Quỹ đầu tư bất động sản là quỹ đầu tư chứng khoán được đầu tư chủ yếu vào bất động sản và chứng khoán của tổ chức phát hành là tổ chức kinh doanh bất động sản có doanh thu từ việc sở hữu và kinh doanh bất động sản tối thiểu là 65% tổng doanh thu tính trên báo cáo tài chính năm gần nhất.","44. Thông tin nội bộ là thông tin liên quan đến công ty đại chúng, tổ chức niêm yết, tổ chức đăng ký giao dịch, quỹ đại chúng, công ty đầu tư chứng khoán đại chúng chưa được công bố mà nếu được công bố có thể ảnh hưởng lớn đến giá chứng khoán của tổ chức này.","45. Người nội bộ là người giữ vị trí quan trọng trong bộ máy quản trị, điều hành của doanh nghiệp, quỹ đại chúng, công ty đầu tư chứng khoán đại chúng, bao gồm:","a) Người nội bộ của doanh nghiệp là Chủ tịch Hội đồng quản trị hoặc Chủ tịch Hội đồng thành viên hoặc Chủ tịch công ty, thành viên Hội đồng quản trị hoặc thành viên Hội đồng thành viên, người đại diện theo pháp luật, Tổng giám đốc (Giám đốc), Phó Tổng giám đốc (Phó Giám đốc), Giám đốc tài chính, Kế toán trưởng và các chức danh quản lý tương đương do Đại hội đồng cổ đông bầu hoặc Hội đồng quản trị hoặc Hội đồng thành viên hoặc Chủ tịch công ty bổ nhiệm; Trưởng Ban kiểm soát và thành viên Ban kiểm soát (Kiểm soát viên), thành viên Ban kiểm toán nội bộ; thư ký công ty, người phụ trách quản trị công ty, người được ủy quyền công bố thông tin;","b) Người nội bộ của quỹ đại chúng hoặc công ty đầu tư chứng khoán đại chúng là thành viên Ban đại diện quỹ đại chúng, thành viên Hội đồng quản trị công ty đầu tư chứng khoán đại chúng, người điều hành quỹ đại chúng, người điều hành công ty đầu tư chứng khoán đại chúng, người nội bộ của công ty quản lý quỹ đầu tư chứng khoán.","46. Người có liên quan là cá nhân hoặc tổ chức có quan hệ với nhau trong các trường hợp sau đây:","a) Doanh nghiệp và người nội bộ của doanh nghiệp đó; quỹ đại chúng, công ty đầu tư chứng khoán đại chúng và người nội bộ của quỹ đại chúng hoặc công ty đầu tư chứng khoán đại chúng đó;","b) Doanh nghiệp và tổ chức, cá nhân sở hữu trên 10% số cổ phiếu có quyền biểu quyết hoặc vốn góp của doanh nghiệp đó;","c) Tổ chức, cá nhân mà trong mối quan hệ với tổ chức, cá nhân khác trực tiếp, gián tiếp kiểm soát hoặc bị kiểm soát bởi tổ chức, cá nhân đó hoặc cùng với tổ chức, cá nhân đó chịu chung một sự kiểm soát;","d) Cá nhân và bố đẻ, mẹ đẻ, bố nuôi, mẹ nuôi, bố chồng, mẹ chồng, bố vợ, mẹ vợ, vợ, chồng, con đẻ, con nuôi, con dâu, con rể, anh ruột, chị ruột, em ruột, anh rể, em rể, chị dâu, em dâu của cá nhân đó;","đ) Công ty quản lý quỹ đầu tư chứng khoán và các quỹ đầu tư chứng khoán, công ty đầu tư chứng khoán do công ty quản lý quỹ đầu tư chứng khoán đó quản lý;","e) Quan hệ hợp đồng trong đó một tổ chức, cá nhân là đại diện cho tổ chức, cá nhân kia;","g) Tổ chức, cá nhân khác là người có liên quan theo quy định của Luật Doanh nghiệp.","47. Người hành nghề chứng khoán là người được Ủy ban Chứng khoán Nhà nước cấp chứng chỉ hành nghề chứng khoán và làm việc tại công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán nước ngoài tại Việt Nam và chi nhánh công ty quản lý quỹ nước ngoài tại Việt Nam (sau đây gọi là chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam), công ty đầu tư chứng khoán.","48. Tổ chức niêm yết, tổ chức đăng ký giao dịch là tổ chức có chứng khoán phát hành được niêm yết hoặc đăng ký giao dịch trên hệ thống giao dịch chứng khoán.","49. Thao túng thị trường chứng khoán là việc thực hiện một trong các hành vi sau đây:","a) Sử dụng một hoặc nhiều tài khoản giao dịch của mình hoặc của người khác hoặc thông đồng liên tục mua, bán chứng khoán nhằm tạo ra cung, cầu giả tạo;","b) Đặt lệnh mua và bán cùng loại chứng khoán trong cùng ngày giao dịch hoặc thông đồng với nhau giao dịch mua, bán chứng khoán mà không dẫn đến chuyển nhượng thực sự quyền sở hữu hoặc quyền sở hữu chỉ luân chuyển giữa các thành viên trong nhóm nhằm tạo giá chứng khoán, cung cầu giả tạo;","c) Liên tục mua hoặc bán chứng khoán với khối lượng chi phối vào thời điểm mở cửa hoặc đóng cửa thị trường nhằm thao túng giá chứng khoán;","d) Giao dịch chứng khoán bằng hình thức cấu kết, lôi kéo người khác liên tục đặt lệnh mua, bán chứng khoán gây ảnh hưởng lớn đến cung cầu và giá chứng khoán, thao túng giá chứng khoán;","đ) Đưa ra ý kiến một cách trực tiếp hoặc gián tiếp thông qua phương tiện thông tin đại chúng về một loại chứng khoán, về tổ chức phát hành chứng khoán nhằm tạo ảnh hưởng đến giá của loại chứng khoán đó sau khi đã thực hiện giao dịch và nắm giữ vị thế đối với loại chứng khoán đó;","e) Sử dụng các phương thức hoặc thực hiện các hành vi giao dịch khác hoặc kết hợp tung tin đồn sai sự thật, cung cấp thông tin sai lệch ra công chúng để tạo cung cầu giả tạo, thao túng giá chứng khoán."],"sua_doi":true,"ghi_chu":["Khoản này được bổ sung theo quy định tại khoản 1 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"5","ten":"Nguyên tắc hoạt động về chứng khoán và thị trường chứng khoán","chuong":"Chương I. NHỮNG QUY ĐỊNH CHUNG","doan":["1. Tôn trọng quyền sở hữu, quyền khác đối với tài sản trong hoạt động về chứng khoán và thị trường chứng khoán; quyền tự do giao dịch, đầu tư, kinh doanh và cung cấp dịch vụ về chứng khoán của tổ chức, cá nhân.","2. Công bằng, công khai, minh bạch.","3. Bảo vệ quyền và lợi ích hợp pháp của nhà đầu tư.","4. Tự chịu trách nhiệm về rủi ro."],"sua_doi":false,"ghi_chu":[]},{"so":"6","ten":"Chính sách phát triển thị trường chứng khoán","chuong":"Chương I. NHỮNG QUY ĐỊNH CHUNG","doan":["1. Nhà nước có chính sách khuyến khích, tạo điều kiện thuận lợi để tổ chức, cá nhân trong nước, nước ngoài tham gia đầu tư và hoạt động trên thị trường chứng khoán nhằm huy động các nguồn vốn trung hạn và dài hạn cho đầu tư phát triển.","2. Nhà nước có chính sách quản lý, giám sát bảo đảm thị trường chứng khoán hoạt động công bằng, công khai, minh bạch, an toàn và hiệu quả.","3. Nhà nước có chính sách đầu tư hiện đại hóa cơ sở hạ tầng, công nghệ thông tin cho hoạt động của thị trường chứng khoán, phát triển nguồn nhân lực cho ngành chứng khoán, tuyên truyền, phổ biến kiến thức về chứng khoán và thị trường chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"7","ten":"Biện pháp bảo đảm an ninh, an toàn thị trường chứng khoán","chuong":"Chương I. NHỮNG QUY ĐỊNH CHUNG","doan":["1. Biện pháp bảo đảm an ninh, an toàn thị trường chứng khoán bao gồm:","a) Giám sát an ninh, an toàn thị trường chứng khoán;","b) Ứng phó, khắc phục sự cố, sự kiện, biến động ảnh hưởng đến an toàn, ổn định và tính toàn vẹn của thị trường chứng khoán;","c) Tạm ngừng, đình chỉ giao dịch đối với một hoặc một số chứng khoán niêm yết, đăng ký giao dịch trên hệ thống giao dịch chứng khoán;","d) Tạm ngừng, đình chỉ một phần hoặc toàn bộ hoặc khôi phục hoạt động giao dịch của Sở giao dịch chứng khoán Việt Nam và công ty con;","đ) Tạm ngừng, đình chỉ một phần hoặc toàn bộ hoặc khôi phục hoạt động đăng ký, lưu ký, bù trừ, thanh toán chứng khoán của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam và công ty con3;","e) Cấm đảm nhiệm chức vụ tại công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam, công ty đầu tư chứng khoán có thời hạn hoặc vĩnh viễn, cấm thực hiện các hoạt động về chứng khoán và thị trường chứng khoán có thời hạn hoặc vĩnh viễn do thực hiện hành vi bị nghiêm cấm trong hoạt động về chứng khoán và thị trường chứng khoán;","g) Phong tỏa tài khoản chứng khoán, yêu cầu người có thẩm quyền phong tỏa tài khoản tiền có liên quan đến hành vi vi phạm pháp luật về chứng khoán và thị trường chứng khoán.","2. Chính phủ quy định chi tiết việc áp dụng các biện pháp bảo đảm an ninh, an toàn thị trường chứng khoán quy định tại khoản 1 Điều này."],"sua_doi":false,"ghi_chu":[]},{"so":"8","ten":"Quản lý nhà nước về chứng khoán và thị trường chứng khoán","chuong":"Chương I. NHỮNG QUY ĐỊNH CHUNG","doan":["1. Chính phủ thống nhất quản lý nhà nước về chứng khoán và thị trường chứng khoán.","2. Bộ Tài chính chịu trách nhiệm trước Chính phủ thực hiện quản lý nhà nước về chứng khoán và thị trường chứng khoán và có các nhiệm vụ, quyền hạn sau đây:","a) Trình Chính phủ, Thủ tướng Chính phủ ban hành chiến lược, kế hoạch, đề án, chính sách phát triển thị trường chứng khoán;","b) Trình cấp có thẩm quyền ban hành hoặc ban hành theo thẩm quyền các văn bản quy phạm pháp luật về chứng khoán và thị trường chứng khoán;","c) Chỉ đạo Ủy ban Chứng khoán Nhà nước thực hiện chiến lược, kế hoạch, đề án, chính sách phát triển thị trường chứng khoán và các văn bản quy phạm pháp luật về chứng khoán và thị trường chứng khoán.","3. Bộ, cơ quan ngang Bộ, trong phạm vi nhiệm vụ, quyền hạn của mình, có trách nhiệm phối hợp với Bộ Tài chính thực hiện quản lý nhà nước về chứng khoán và thị trường chứng khoán.","4. Ủy ban nhân dân các cấp, trong phạm vi nhiệm vụ, quyền hạn của mình, có trách nhiệm thực hiện quản lý nhà nước về chứng khoán và thị trường chứng khoán tại địa phương."],"sua_doi":false,"ghi_chu":[]},{"so":"9","ten":"Ủy ban Chứng khoán Nhà nước","chuong":"Chương I. NHỮNG QUY ĐỊNH CHUNG","doan":["1. Ủy ban Chứng khoán Nhà nước là cơ quan thuộc Bộ Tài chính thực hiện chức năng tham mưu, giúp Bộ trưởng Bộ Tài chính quản lý nhà nước về chứng khoán và thị trường chứng khoán, tổ chức thực thi pháp luật về chứng khoán và thị trường chứng khoán theo phân cấp, ủy quyền của Bộ trưởng Bộ Tài chính và có các nhiệm vụ, quyền hạn sau đây:","a) Trình Bộ trưởng Bộ Tài chính ban hành hoặc để trình cấp có thẩm quyền ban hành các văn bản quy phạm pháp luật về chứng khoán và thị trường chứng khoán, chiến lược, kế hoạch, đề án, chính sách phát triển thị trường chứng khoán;","b) Tổ chức, phát triển thị trường chứng khoán; trực tiếp quản lý, giám sát hoạt động về chứng khoán và thị trường chứng khoán; quản lý các hoạt động dịch vụ về chứng khoán và thị trường chứng khoán theo quy định của pháp luật;","c) Cấp, cấp lại, gia hạn, điều chỉnh, thu hồi giấy phép, chứng chỉ hành nghề chứng khoán và giấy chứng nhận liên quan đến hoạt động về chứng khoán và thị trường chứng khoán; chấp thuận những thay đổi, đình chỉ, hủy bỏ liên quan đến hoạt động về chứng khoán và thị trường chứng khoán;","d) Quản lý, thanh tra, kiểm tra, giám sát hoạt động nghiệp vụ chứng khoán của Sở giao dịch chứng khoán Việt Nam và công ty con, Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam và công ty con; chấp thuận các quy chế nghiệp vụ của Sở giao dịch chứng khoán Việt Nam, Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam; yêu cầu Sở giao dịch chứng khoán Việt Nam, Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam sửa đổi quy chế nghiệp vụ; đình chỉ, hủy bỏ quyết định liên quan đến hoạt động nghiệp vụ của Sở giao dịch chứng khoán Việt Nam và công ty con, Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam và công ty con; chỉ đạo Sở giao dịch chứng khoán Việt Nam và công ty con, Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam và công ty con thực hiện các nhiệm vụ liên quan đến hoạt động nghiệp vụ trong trường hợp cần thiết để bảo vệ quyền và lợi ích hợp pháp của nhà đầu tư;","đ) Chấp thuận việc đưa vào giao dịch các loại chứng khoán mới, thay đổi và áp dụng phương thức giao dịch mới, chấp thuận hệ thống giao dịch chứng khoán và đưa vào vận hành hệ thống giao dịch chứng khoán mới;","e) Quản lý, giám sát hoạt động liên quan đến chứng khoán và thị trường chứng khoán của các tổ chức, cá nhân;","g) Thanh tra, kiểm tra, giải quyết khiếu nại, tố cáo và xử lý vi phạm hành chính trong lĩnh vực chứng khoán và thị trường chứng khoán;","h) Báo cáo Bộ Tài chính để báo cáo Thủ tướng Chính phủ, Chính phủ về tình hình hoạt động của thị trường chứng khoán. Trường hợp có biến động lớn ảnh hưởng đến an ninh, an toàn thị trường chứng khoán, Ủy ban Chứng khoán Nhà nước có trách nhiệm kịp thời báo cáo Bộ Tài chính, đồng thời báo cáo Chính phủ, Thủ tướng Chính phủ về tình hình thị trường và các giải pháp để ổn định thị trường và bảo đảm an ninh, an toàn tài chính;","i) Thực hiện theo thẩm quyền hoặc trình cấp có thẩm quyền thực hiện các biện pháp bảo đảm an ninh, an toàn thị trường chứng khoán;","k) Thực hiện thống kê, dự báo về hoạt động chứng khoán và thị trường chứng khoán; hiện đại hóa công nghệ thông tin trong lĩnh vực chứng khoán và thị trường chứng khoán;","l) Tổ chức, phối hợp với các cơ quan, tổ chức liên quan đào tạo, bồi dưỡng đội ngũ cán bộ, công chức, viên chức ngành chứng khoán và người hành nghề chứng khoán; tuyên truyền, phổ biến kiến thức về chứng khoán và thị trường chứng khoán cho công chúng;","m) Ban hành văn bản hướng dẫn chuyên môn, nghiệp vụ, văn bản khác thuộc phạm vi quản lý của Ủy ban Chứng khoán Nhà nước;","n) Giám sát tổ chức xã hội - nghề nghiệp về chứng khoán trong việc thực hiện mục đích, tôn chỉ, Điều lệ hoạt động;","o) Thực hiện chế độ báo cáo về chứng khoán và thị trường chứng khoán theo quy định của pháp luật;","p) Thực hiện hợp tác quốc tế và làm đầu mối thực hiện các cam kết quốc tế trong lĩnh vực chứng khoán và thị trường chứng khoán mà nước Cộng hòa xã hội chủ nghĩa Việt Nam là thành viên;","q) Nhiệm vụ, quyền hạn khác theo quy định của Luật này và quy định khác của pháp luật có liên quan.","2. Chức năng, nhiệm vụ, quyền hạn cụ thể và cơ cấu tổ chức của Ủy ban Chứng khoán Nhà nước do Thủ tướng Chính phủ quy định.","3. Cán bộ, công chức, viên chức của Ủy ban Chứng khoán Nhà nước trong khi thực hiện nhiệm vụ, quyền hạn của mình có trách nhiệm bảo đảm trung thực, bảo mật thông tin, tuân thủ quy định của pháp luật về chứng khoán và thị trường chứng khoán và quy định khác của pháp luật có liên quan."],"sua_doi":true,"ghi_chu":["Điểm này được sửa đổi, bổ sung theo quy định tại khoản 2 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025.","Điểm này được sửa đổi, bổ sung theo quy định tại khoản 2 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"10","ten":"Tổ chức xã hội - nghề nghiệp về chứng khoán","chuong":"Chương I. NHỮNG QUY ĐỊNH CHUNG","doan":["1. Tổ chức xã hội - nghề nghiệp về chứng khoán được thành lập, hoạt động theo quy định của pháp luật về hội, có trách nhiệm tuân thủ quy định của pháp luật về chứng khoán và thị trường chứng khoán và chịu sự giám sát của Ủy ban Chứng khoán Nhà nước.","2. Tổ chức xã hội - nghề nghiệp về chứng khoán ban hành bộ quy tắc đạo đức nghề nghiệp sau khi được Ủy ban Chứng khoán Nhà nước chấp thuận; phối hợp với cơ quan quản lý về chứng khoán và thị trường chứng khoán trong việc tuyên truyền, phổ biến pháp luật về chứng khoán và thị trường chứng khoán đến các hội viên."],"sua_doi":false,"ghi_chu":[]},{"so":"11","ten":"Nhà đầu tư chứng khoán chuyên nghiệp","chuong":"Chương I. NHỮNG QUY ĐỊNH CHUNG","doan":["1. Nhà đầu tư chứng khoán chuyên nghiệp là nhà đầu tư có năng lực tài chính hoặc có trình độ chuyên môn về chứng khoán bao gồm:","a) Ngân hàng thương mại, chi nhánh ngân hàng nước ngoài, công ty tài chính, tổ chức kinh doanh bảo hiểm, công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, công ty đầu tư chứng khoán, quỹ đầu tư chứng khoán, tổ chức tài chính quốc tế, quỹ tài chính nhà nước ngoài ngân sách, tổ chức tài chính nhà nước được mua chứng khoán theo quy định của pháp luật có liên quan;","b) Công ty có vốn điều lệ đã góp đạt trên 100 tỷ đồng hoặc tổ chức niêm yết, tổ chức đăng ký giao dịch;","c) Người có chứng chỉ hành nghề chứng khoán;","d) Cá nhân nắm giữ danh mục chứng khoán niêm yết, đăng ký giao dịch có giá trị tối thiểu là 02 tỷ đồng theo xác nhận của công ty chứng khoán tại thời điểm cá nhân đó được xác định tư cách là nhà đầu tư chứng khoán chuyên nghiệp;","đ) Cá nhân có thu nhập chịu thuế năm gần nhất tối thiểu là 01 tỷ đồng tính đến thời điểm cá nhân đó được xác định tư cách là nhà đầu tư chứng khoán chuyên nghiệp theo hồ sơ khai thuế đã nộp cho cơ quan thuế hoặc chứng từ khấu trừ thuế của tổ chức, cá nhân chi trả;","e) Nhà đầu tư nước ngoài là cá nhân có quốc tịch nước ngoài, tổ chức thành lập theo pháp luật nước ngoài thực hiện hoạt động đầu tư kinh doanh tại Việt Nam.","1a. Nhà đầu tư chứng khoán chuyên nghiệp là tổ chức theo quy định tại khoản 1 Điều này được tham gia mua, giao dịch, chuyển nhượng trái phiếu doanh nghiệp riêng lẻ.","1b. Nhà đầu tư chứng khoán chuyên nghiệp là cá nhân theo quy định tại khoản 1 Điều này được tham gia mua, giao dịch, chuyển nhượng đối với trái phiếu doanh nghiệp riêng lẻ thuộc một trong hai trường hợp sau đây:","a) Trái phiếu doanh nghiệp riêng lẻ có xếp hạng tín nhiệm và có tài sản bảo đảm đối với trái phiếu đó;","b) Trái phiếu doanh nghiệp riêng lẻ có xếp hạng tín nhiệm và có bảo lãnh thanh toán của tổ chức tín dụng đối với trái phiếu đó.","2. Chính phủ quy định chi tiết Điều này."],"sua_doi":true,"ghi_chu":["Điểm này được bổ sung theo quy định tại điểm a khoản 3 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025.","Điểm này được bổ sung theo quy định tại điểm a khoản 3 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025.","Khoản này được bổ sung theo quy định tại điểm b khoản 3 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025; đối với quy định về nhà đầu tư chứng khoán chuyên nghiệp tham gia mua, giao dịch, chuyển nhượng trái phiếu doanh nghiệp riêng lẻ được sửa đổi, bổ sung có hiệu lực kể từ ngày 01 tháng 01 năm 2026."]},{"so":"11a","ten":"Trách nhiệm của tổ chức, cá nhân liên quan đến hồ sơ, tài liệu báo cáo","chuong":"Chương I. NHỮNG QUY ĐỊNH CHUNG","doan":["1. Tổ chức, cá nhân tham gia vào quá trình lập hồ sơ, tài liệu báo cáo liên quan đến hoạt động về chứng khoán và thị trường chứng khoán phải chịu trách nhiệm trước pháp luật về tính hợp pháp, chính xác, trung thực và đầy đủ của hồ sơ, tài liệu báo cáo. Tổ chức, cá nhân tham gia xác nhận hồ sơ, tài liệu báo cáo phải chịu trách nhiệm trước pháp luật trong phạm vi liên quan đến hồ sơ, tài liệu báo cáo đó. Hồ sơ, tài liệu báo cáo phải bảo đảm thông tin rõ ràng, không gây hiểu nhầm và có đầy đủ những nội dung quan trọng ảnh hưởng đến quyết định của cơ quan, tổ chức và nhà đầu tư.","2. Cơ quan, tổ chức, cá nhân có thẩm quyền tiếp nhận, xử lý, chấp thuận hồ sơ, tài liệu báo cáo xem xét tính hợp lệ của hồ sơ, tài liệu báo cáo trên cơ sở hồ sơ, tài liệu báo cáo được cung cấp; không chịu trách nhiệm về những vi phạm của tổ chức, cá nhân xảy ra trước và sau khi nộp hồ sơ, tài liệu báo cáo hợp lệ. Hồ sơ, tài liệu báo cáo hợp lệ là hồ sơ, tài liệu báo cáo có đầy đủ giấy tờ và nội dung các giấy tờ đó được kê khai đầy đủ theo quy định của pháp luật.","3. Tổ chức tư vấn hồ sơ, người hành nghề tham gia tư vấn hồ sơ có trách nhiệm sau đây:","a) Tổ chức tư vấn hồ sơ và người hành nghề tham gia tư vấn hồ sơ phải trung thực, cẩn trọng và tuân thủ đầy đủ quy định của pháp luật trong hoạt động tư vấn hồ sơ;","b) Tổ chức tư vấn hồ sơ có trách nhiệm rà soát, kiểm tra các thông tin trong hồ sơ, bảo đảm việc phân tích, đánh giá được thực hiện hợp lý và cẩn trọng trên cơ sở các thông tin, số liệu, tài liệu được cung cấp, phải chịu trách nhiệm trước pháp luật trong phạm vi tư vấn liên quan đến hồ sơ, tài liệu báo cáo.","4. Tổ chức kiểm toán, kiểm toán viên được chấp thuận, người ký báo cáo kiểm toán hoặc soát xét phải tuân thủ quy định của pháp luật về kiểm toán độc lập; tuân thủ chuẩn mực kiểm toán khi kiểm toán báo cáo tài chính và chịu trách nhiệm đối với ý kiến về tính trung thực, hợp lý của các báo cáo, số liệu được kiểm toán; tuân thủ chuẩn mực về hợp đồng dịch vụ đảm bảo; chịu trách nhiệm về việc đưa ra ý kiến về tổng hợp thông tin tài chính theo quy ước."],"sua_doi":true,"ghi_chu":["Điều này được bổ sung theo quy định tại khoản 4 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"12","ten":"Các hành vi bị nghiêm cấm trong hoạt động về chứng khoán và thị trường chứng khoán","chuong":"Chương I. NHỮNG QUY ĐỊNH CHUNG","doan":["1. Trực tiếp hoặc gián tiếp thực hiện hành vi gian lận, lừa đảo, làm giả tài liệu, tạo dựng thông tin sai sự thật hoặc công bố thông tin sai lệch hoặc che giấu thông tin hoặc bỏ sót thông tin cần thiết gây hiểu nhầm nghiêm trọng làm ảnh hưởng đến hoạt động chào bán, niêm yết, giao dịch, kinh doanh, đầu tư chứng khoán, cung cấp dịch vụ về chứng khoán.","2. Sử dụng thông tin nội bộ để mua, bán chứng khoán cho chính mình hoặc cho người khác; tiết lộ, cung cấp thông tin nội bộ hoặc tư vấn cho người khác mua, bán chứng khoán trên cơ sở thông tin nội bộ.","3. Thực hiện hành vi thao túng thị trường chứng khoán.","4. Thực hiện hoạt động kinh doanh chứng khoán, cung cấp dịch vụ về chứng khoán khi chưa được Ủy ban Chứng khoán Nhà nước cấp giấy phép, cấp giấy chứng nhận hoặc chấp thuận.","5. Sử dụng tài khoản, tài sản của khách hàng khi không được khách hàng ủy thác hoặc trái quy định của pháp luật hoặc lạm dụng tín nhiệm để chiếm đoạt tài sản của khách hàng.","6. Cho người khác mượn tài khoản để giao dịch chứng khoán, đứng tên sở hữu chứng khoán hộ người khác dẫn đến hành vi thao túng giá chứng khoán.","7. Tổ chức thị trường giao dịch chứng khoán trái quy định của Luật này. VĂN BẢN PHÁP LUẬT KHÁC VĂN BẢN HỢP NHẤT - VĂN PHÒNG QUỐC HỘI Văn bản hợp nhất số 24/VBHN-VPQH ngày 26 tháng 02 năm 2025 hợp nhất Luật Chứng khoán (Tiếp theo Công báo số 531 + 532) Mục 1 CHÀO BÁN CHỨNG KHOÁN RA CÔNG CHÚNG"],"sua_doi":true,"ghi_chu":["Khoản này được sửa đổi, bổ sung theo quy định tại khoản 5 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025. (Xem tiếp Công báo số 533 + 534) Người ký: CỔNG THÔNG TIN ĐIỆN TỬ CHÍNH PHỦ Email: thongtinchinhphu@chinhphu.vn Cơ quan: VĂN PHÒNG CHÍNH PHỦ Thời gian ký: 11.04.2025 08:39:27 +07:00"]},{"so":"13","ten":"Mệnh giá chứng khoán","chuong":"Chương II. CHÀO BÁN CHỨNG KHOÁN","doan":["1. Mệnh giá chứng khoán chào bán trên lãnh thổ nước Cộng hòa xã hội chủ nghĩa Việt Nam được ghi bằng Đồng Việt Nam.","2. Mệnh giá cổ phiếu, chứng chỉ quỹ chào bán ra công chúng là 10 nghìn đồng. Mệnh giá của trái phiếu chào bán ra công chúng là 100 nghìn đồng và bội số của 100 nghìn đồng.","3. Trường hợp giá chứng khoán của tổ chức phát hành trên hệ thống giao dịch chứng khoán thấp hơn mệnh giá, tổ chức phát hành được chào bán chứng khoán với giá thấp hơn mệnh giá."],"sua_doi":false,"ghi_chu":[]},{"so":"14","ten":"Hình thức chào bán chứng khoán ra công chúng","chuong":"Chương II. CHÀO BÁN CHỨNG KHOÁN","doan":["1. Hình thức chào bán chứng khoán ra công chúng bao gồm chào bán chứng khoán lần đầu ra công chúng, chào bán thêm cổ phiếu hoặc quyền mua cổ phần ra công chúng và các hình thức khác.","2. Chính phủ quy định chi tiết hình thức chào bán chứng khoán ra công chúng."],"sua_doi":false,"ghi_chu":[]},{"so":"15","ten":"Điều kiện chào bán chứng khoán ra công chúng","chuong":"Chương II. CHÀO BÁN CHỨNG KHOÁN","doan":["1. Điều kiện chào bán cổ phiếu lần đầu ra công chúng của công ty cổ phần bao gồm:","a) Mức vốn điều lệ đã góp tại thời điểm đăng ký chào bán từ 30 tỷ đồng trở lên tính theo giá trị ghi trên sổ kế toán;","b) Hoạt động kinh doanh của 02 năm liên tục liền trước năm đăng ký chào bán phải có lãi, đồng thời không có lỗ lũy kế tính đến năm đăng ký chào bán;","c) Có phương án phát hành và phương án sử dụng vốn thu được từ đợt chào bán cổ phiếu được Đại hội đồng cổ đông thông qua;","d) Tối thiểu là 15% số cổ phiếu có quyền biểu quyết của tổ chức phát hành phải được bán cho ít nhất 100 nhà đầu tư không phải là cổ đông lớn; trường hợp vốn điều lệ của tổ chức phát hành từ 1.000 tỷ đồng trở lên, tỷ lệ tối thiểu là 10% số cổ phiếu có quyền biểu quyết của tổ chức phát hành;","đ) Cổ đông lớn trước thời điểm chào bán cổ phiếu lần đầu ra công chúng của tổ chức phát hành phải cam kết cùng nhau nắm giữ ít nhất 20% vốn điều lệ của tổ chức phát hành tối thiểu là 01 năm kể từ ngày kết thúc đợt chào bán;","e) Tổ chức phát hành không thuộc trường hợp đang bị truy cứu trách nhiệm hình
