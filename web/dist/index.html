ĐẦU TƯ CHỨNG KHOÁN, CÔNG TY ĐẦU TƯ CHỨNG KHOÁN VÀ NGÂN HÀNG GIÁM SÁT","doan":["1. Điều lệ quỹ đầu tư chứng khoán do công ty quản lý quỹ đầu tư chứng khoán dự thảo và được Đại hội nhà đầu tư quỹ đầu tư chứng khoán thông qua.","2. Điều lệ quỹ đầu tư chứng khoán có các nội dung chủ yếu sau đây:","a) Tên quỹ đầu tư chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, ngân hàng giám sát;","b) Ngày thành lập quỹ đầu tư chứng khoán;","c) Mục tiêu hoạt động; lĩnh vực đầu tư; thời hạn hoạt động của quỹ đầu tư chứng khoán;","d) Vốn góp và quy định về thay đổi vốn điều lệ của quỹ đầu tư chứng khoán;","đ) Quyền và nghĩa vụ của công ty quản lý quỹ đầu tư chứng khoán, ngân hàng giám sát; các trường hợp thay đổi công ty quản lý quỹ đầu tư chứng khoán, ngân hàng giám sát; quy định về việc ủy quyền cho công ty quản lý quỹ đầu tư chứng khoán ký hợp đồng giám sát với ngân hàng giám sát;","e) Quy định về Ban đại diện quỹ đầu tư chứng khoán, Đại hội nhà đầu tư quỹ đầu tư chứng khoán;","g) Các hạn chế đầu tư của quỹ đầu tư chứng khoán;","h) Quy định về việc đăng ký sở hữu chứng chỉ quỹ và lưu giữ sổ đăng ký nhà đầu tư của quỹ đầu tư chứng khoán;","i) Quy định về việc lựa chọn ngân hàng giám sát; lựa chọn và thay đổi tổ chức kiểm toán được chấp thuận;","k) Quy định về chuyển nhượng, phát hành, mua lại chứng chỉ quỹ mở; quy định về việc niêm yết chứng chỉ quỹ đóng;","l) Các loại chi phí và thu nhập của quỹ đầu tư chứng khoán; mức phí, thưởng đối với công ty quản lý quỹ đầu tư chứng khoán, ngân hàng giám sát; các trường hợp và phương pháp phân chia thu nhập của quỹ đầu tư chứng khoán cho nhà đầu tư;","m) Phương thức xác định giá trị tài sản ròng của quỹ đầu tư chứng khoán, giá trị tài sản ròng của mỗi chứng chỉ quỹ;","n) Quy định về giải quyết xung đột lợi ích;","o) Quy định về chế độ báo cáo;","p) Quy định về giải thể quỹ đầu tư chứng khoán;","q) Cam kết của ngân hàng giám sát và công ty quản lý quỹ đầu tư chứng khoán về việc thực hiện nghĩa vụ với quỹ đầu tư chứng khoán, nhà đầu tư và tuân thủ Điều lệ quỹ đầu tư chứng khoán;","r) Thể thức tiến hành sửa đổi, bổ sung Điều lệ quỹ đầu tư chứng khoán.","3. Bộ trưởng Bộ Tài chính ban hành mẫu Điều lệ quỹ đầu tư chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"104","ten":"Giải thể quỹ đầu tư chứng khoán","chuong":"Chương VII. QUỸ ĐẦU TƯ CHỨNG KHOÁN, CÔNG TY ĐẦU TƯ CHỨNG KHOÁN VÀ NGÂN HÀNG GIÁM SÁT","doan":["1. Quỹ đầu tư chứng khoán giải thể trong các trường hợp sau đây:","a) Kết thúc thời hạn hoạt động ghi trong Điều lệ quỹ đầu tư chứng khoán;","b) Đại hội nhà đầu tư quyết định giải thể quỹ đầu tư chứng khoán trước khi kết thúc thời hạn hoạt động ghi trong Điều lệ quỹ đầu tư chứng khoán;","c) Công ty quản lý quỹ đầu tư chứng khoán bị thu hồi Giấy phép thành lập và hoạt động kinh doanh chứng khoán hoặc bị giải thể, phá sản mà Ban đại diện quỹ đầu tư chứng khoán không xác lập được công ty quản lý quỹ đầu tư chứng khoán thay thế trong thời hạn 02 tháng kể từ ngày phát sinh sự kiện;","d) Ngân hàng giám sát bị thu hồi Giấy chứng nhận đăng ký hoạt động lưu ký chứng khoán, bị giải thể, phá sản hoặc hợp đồng giám sát giữa ngân hàng giám sát và công ty quản lý quỹ đầu tư chứng khoán bị chấm dứt mà công ty quản lý quỹ đầu tư chứng khoán không xác lập được ngân hàng giám sát thay thế trong thời hạn 02 tháng kể từ ngày phát sinh sự kiện;","đ) Giá trị tài sản ròng của quỹ đầu tư chứng khoán xuống dưới 10 tỷ đồng liên tục trong 06 tháng;","e) Trường hợp khác theo quy định của Điều lệ quỹ đầu tư chứng khoán.","2. Trong thời hạn 03 tháng trước ngày tiến hành giải thể theo quy định tại điểm a và điểm b khoản 1 Điều này hoặc trong thời hạn 30 ngày kể từ ngày quỹ đầu tư chứng khoán thuộc trường hợp giải thể theo quy định tại các điểm c, d, đ và e khoản 1 Điều này, công ty quản lý quỹ đầu tư chứng khoán hoặc ngân hàng giám sát và Ban đại diện quỹ đầu tư chứng khoán phải triệu tập Đại hội nhà đầu tư quỹ đầu tư chứng khoán để thông qua phương án giải thể quỹ đầu tư chứng khoán.","3. Công ty quản lý quỹ đầu tư chứng khoán và ngân hàng giám sát chịu trách nhiệm hoàn tất việc thanh lý tài sản quỹ và phân chia tài sản quỹ cho nhà đầu tư theo phương án được Đại hội nhà đầu tư quỹ đầu tư chứng khoán thông qua.","4. Tiền thu được từ thanh lý tài sản quỹ đầu tư chứng khoán và các tài sản còn lại sau khi trừ chi phí giải thể được thanh toán theo thứ tự sau đây:","a) Nghĩa vụ tài chính với Nhà nước;","b) Các khoản phải trả cho công ty quản lý quỹ đầu tư chứng khoán, ngân hàng giám sát, các khoản phải trả khác;","c) Phần còn lại được dùng để thanh toán cho nhà đầu tư tương ứng với tỷ lệ góp vốn của nhà đầu tư trong quỹ đầu tư chứng khoán.","5. Trong thời hạn 05 ngày làm việc kể từ ngày hoàn tất việc giải thể quỹ đầu tư chứng khoán, công ty quản lý quỹ đầu tư chứng khoán và ngân hàng giám sát phải báo cáo Ủy ban Chứng khoán Nhà nước về kết quả giải thể quỹ đầu tư chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"105","ten":"Hợp nhất, sáp nhập quỹ đầu tư chứng khoán","chuong":"Chương VII. QUỸ ĐẦU TƯ CHỨNG KHOÁN, CÔNG TY ĐẦU TƯ CHỨNG KHOÁN VÀ NGÂN HÀNG GIÁM SÁT","doan":["Quỹ đầu tư chứng khoán được hợp nhất, sáp nhập với một quỹ khác cùng loại hình theo quyết định của Đại hội nhà đầu tư quỹ đầu tư chứng khoán. Quỹ thành viên hình thành sau hợp nhất, sáp nhập có số thành viên không vượt quá 99 thành viên."],"sua_doi":false,"ghi_chu":[]},{"so":"106","ten":"Xác định giá trị tài sản ròng của quỹ đầu tư chứng khoán","chuong":"Chương VII. QUỸ ĐẦU TƯ CHỨNG KHOÁN, CÔNG TY ĐẦU TƯ CHỨNG KHOÁN VÀ NGÂN HÀNG GIÁM SÁT","doan":["1. Việc xác định giá trị tài sản ròng trên một đơn vị quỹ đầu tư chứng khoán do công ty quản lý quỹ đầu tư chứng khoán thực hiện và được ngân hàng giám sát xác nhận; việc xác nhận giá trị tài sản ròng đối với quỹ thành viên do ngân hàng giám sát hoặc ngân hàng lưu ký thực hiện.","2. Việc xác định giá trị tài sản ròng của quỹ đầu tư chứng khoán phải tuân thủ các nguyên tắc sau đây:","a) Đối với chứng khoán niêm yết, đăng ký giao dịch, giá của các chứng khoán được xác định là giá đóng cửa hoặc giá trung bình của ngày giao dịch gần nhất trước ngày định giá;","b) Đối với các tài sản là chứng khoán quy định tại điểm a khoản này nhưng không có giao dịch nhiều hơn 15 ngày tính đến ngày định giá hoặc không phải là chứng khoán quy định tại điểm a khoản này, việc xác định giá trị tài sản phải dựa trên quy trình và phương pháp xác định giá trị tài sản được nêu rõ trong Điều lệ quỹ đầu tư chứng khoán. Quy trình và phương pháp định giá phải được ngân hàng giám sát xác nhận và Ban đại diện quỹ đầu tư chứng khoán, Đại hội nhà đầu tư quỹ đầu tư chứng khoán phê chuẩn. Các bên tham gia định giá tài sản phải độc lập với công ty quản lý quỹ đầu tư chứng khoán và ngân hàng giám sát hoặc ngân hàng lưu ký;","c) Các tài sản bằng tiền bao gồm cổ tức, trái tức, tiền lãi được tính theo giá trị ghi trên sổ kế toán tại thời điểm xác định.","3. Giá trị tài sản ròng của quỹ đầu tư chứng khoán phải được công bố công khai định kỳ theo quy định tại khoản 1 Điều 124 của Luật này."],"sua_doi":false,"ghi_chu":[]},{"so":"107","ten":"Báo cáo về quỹ đầu tư chứng khoán","chuong":"Chương VII. QUỸ ĐẦU TƯ CHỨNG KHOÁN, CÔNG TY ĐẦU TƯ CHỨNG KHOÁN VÀ NGÂN HÀNG GIÁM SÁT","doan":["Công ty quản lý quỹ đầu tư chứng khoán phải báo cáo Ủy ban Chứng khoán Nhà nước định kỳ và bất thường về danh mục đầu tư, hoạt động đầu tư, tình hình tài chính của quỹ đầu tư chứng khoán. Mục 2 QUỸ ĐẠI CHÚNG VÀ QUỸ THÀNH VIÊN"],"sua_doi":false,"ghi_chu":[]},{"so":"108","ten":"Huy động vốn để thành lập quỹ đại chúng","chuong":"Chương VII. QUỸ ĐẦU TƯ CHỨNG KHOÁN, CÔNG TY ĐẦU TƯ CHỨNG KHOÁN VÀ NGÂN HÀNG GIÁM SÁT","doan":["1. Việc huy động vốn của quỹ đại chúng được công ty quản lý quỹ đầu tư chứng khoán thực hiện trong thời hạn 90 ngày kể từ ngày Giấy chứng nhận chào bán chứng chỉ quỹ ra công chúng có hiệu lực. Quỹ đại chúng được thành lập khi đáp ứng các điều kiện sau đây:","a) Có ít nhất 100 nhà đầu tư, không kể nhà đầu tư chứng khoán chuyên nghiệp mua chứng chỉ quỹ, trừ quỹ hoán đổi danh mục;","b) Tổng giá trị chứng chỉ quỹ đã bán đạt ít nhất là 50 tỷ đồng.","2. Toàn bộ vốn góp của nhà đầu tư phải được phong tỏa tại một tài khoản riêng đặt dưới sự kiểm soát của ngân hàng giám sát và không được sử dụng cho đến khi hoàn tất đợt huy động vốn. Công ty quản lý quỹ đầu tư chứng khoán phải báo cáo Ủy ban Chứng khoán Nhà nước kết quả huy động vốn có xác nhận của ngân hàng giám sát trong thời hạn 10 ngày kể từ ngày kết thúc việc huy động vốn.","3. Trường hợp việc huy động vốn của quỹ đại chúng không đáp ứng quy định tại khoản 1 Điều này thì công ty quản lý quỹ đầu tư chứng khoán phải hoàn trả cho nhà đầu tư mọi khoản tiền đã đóng góp trong thời hạn 15 ngày kể từ ngày kết thúc việc huy động vốn. Công ty quản lý quỹ đầu tư chứng khoán phải chịu mọi chi phí và nghĩa vụ tài chính khác phát sinh từ việc huy động vốn."],"sua_doi":false,"ghi_chu":[]},{"so":"109","ten":"Ban đại diện quỹ đại chúng","chuong":"Chương VII. QUỸ ĐẦU TƯ CHỨNG KHOÁN, CÔNG TY ĐẦU TƯ CHỨNG KHOÁN VÀ NGÂN HÀNG GIÁM SÁT","doan":["1. Ban đại diện quỹ đại chúng đại diện cho quyền lợi của nhà đầu tư, do Đại hội nhà đầu tư quỹ đầu tư chứng khoán bầu. Quyền và nghĩa vụ của Ban đại diện quỹ đại chúng được quy định tại Điều lệ quỹ đầu tư chứng khoán.","2. Quyết định của Ban đại diện quỹ đại chúng được thông qua bằng biểu quyết tại cuộc họp, lấy ý kiến bằng văn bản hoặc bằng hình thức khác theo quy định tại Điều lệ quỹ đầu tư chứng khoán. Mỗi thành viên Ban đại diện quỹ đại chúng có 01 phiếu biểu quyết.","3. Ban đại diện quỹ đại chúng có từ 03 đến 11 thành viên, trong đó có ít nhất hai phần ba số thành viên Ban đại diện quỹ là thành viên độc lập, không phải là người có liên quan của công ty quản lý quỹ đầu tư chứng khoán và ngân hàng giám sát.","4. Nhiệm kỳ, tiêu chuẩn, số lượng thành viên, việc bổ nhiệm, miễn nhiệm và bãi nhiệm, bổ sung thành viên Ban đại diện quỹ đại chúng, Chủ tịch Ban đại diện quỹ đại chúng, điều kiện, thể thức họp và thông qua quyết định của Ban đại diện quỹ đại chúng được quy định tại Điều lệ quỹ đầu tư chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"110","ten":"Hạn chế đối với quỹ đại chúng","chuong":"Chương VII. QUỸ ĐẦU TƯ CHỨNG KHOÁN, CÔNG TY ĐẦU TƯ CHỨNG KHOÁN VÀ NGÂN HÀNG GIÁM SÁT","doan":["1. Công ty quản lý quỹ đầu tư chứng khoán không được sử dụng vốn và tài sản của quỹ đại chúng để thực hiện các hoạt động sau đây:","a) Đầu tư vào chứng chỉ quỹ của chính quỹ đại chúng đó;","b) Đầu tư vào chứng khoán của 01 tổ chức phát hành quá 10% tổng giá trị chứng khoán đang lưu hành của tổ chức đó, trừ trái phiếu Chính phủ;","c) Đầu tư quá 20% tổng giá trị tài sản của quỹ đại chúng vào chứng khoán đang lưu hành của 01 tổ chức phát hành, trừ trái phiếu Chính phủ;","d) Đầu tư quá 10% tổng giá trị tài sản của quỹ đóng vào bất động sản, trừ trường hợp là quỹ đầu tư bất động sản; đầu tư vốn của quỹ mở vào bất động sản;","đ) Đầu tư quá 30% tổng giá trị tài sản của quỹ đại chúng vào các công ty trong cùng một nhóm công ty có quan hệ sở hữu với nhau thuộc các trường hợp sau đây: công ty mẹ, công ty con; các công ty sở hữu trên 35% cổ phần, phần vốn góp của nhau; nhóm công ty con có cùng một công ty mẹ;","e) Cho vay hoặc bảo lãnh cho bất kỳ khoản vay nào;","g) Các hạn chế đầu tư vào quỹ đầu tư chứng khoán khác và đối với từng loại hình quỹ cụ thể được thực hiện theo quy định của Bộ trưởng Bộ Tài chính.","2. Công ty quản lý quỹ đầu tư chứng khoán không được phép vay để tài trợ cho hoạt động của quỹ đại chúng, trừ trường hợp vay ngắn hạn theo quy định của pháp luật về ngân hàng để trang trải các chi phí cần thiết cho quỹ đại chúng hoặc thực hiện thanh toán các giao dịch chứng chỉ quỹ với nhà đầu tư. Tổng giá trị các khoản vay ngắn hạn của quỹ đại chúng không được quá 5% giá trị tài sản ròng của quỹ đại chúng tại mọi thời điểm và thời hạn vay tối đa là 30 ngày.","3. Cơ cấu đầu tư của quỹ đại chúng chỉ được vượt mức so với hạn chế đầu tư trong trường hợp quy định tại các điểm b, c, d, đ và g khoản 1 Điều này và chỉ do nguyên nhân sau đây:","a) Biến động giá trên thị trường của tài sản trong danh mục đầu tư của quỹ;","b) Thực hiện các khoản thanh toán của quỹ theo quy định của pháp luật;","c) Hoạt động hợp nhất, sáp nhập các tổ chức phát hành;","d) Quỹ mới được cấp phép thành lập hoặc do tách quỹ, hợp nhất quỹ, sáp nhập quỹ mà thời gian hoạt động chưa quá 06 tháng kể từ ngày được cấp giấy chứng nhận đăng ký lập quỹ;","đ) Quỹ đang trong thời gian giải thể.","4. Công ty quản lý quỹ đầu tư chứng khoán có nghĩa vụ báo cáo Ủy ban Chứng khoán Nhà nước và công bố thông tin về việc vượt mức các hạn chế đầu tư quy định tại khoản 1 Điều này. Trong thời hạn 03 tháng kể từ ngày phát sinh vượt mức hạn chế đầu tư, công ty quản lý quỹ đầu tư chứng khoán phải điều chỉnh lại danh mục đầu tư để bảo đảm các hạn mức đầu tư quy định tại khoản 1 Điều này."],"sua_doi":false,"ghi_chu":[]},{"so":"111","ten":"Quỹ mở","chuong":"Chương VII. QUỸ ĐẦU TƯ CHỨNG KHOÁN, CÔNG TY ĐẦU TƯ CHỨNG KHOÁN VÀ NGÂN HÀNG GIÁM SÁT","doan":["1. Công ty quản lý quỹ đầu tư chứng khoán thay mặt quỹ mở thực hiện mua lại chứng chỉ quỹ mở từ nhà đầu tư và phát hành thêm chứng chỉ quỹ mở trong phạm vi vốn góp tối đa của quỹ theo tần suất và thời gian cụ thể được quy định trong Điều lệ quỹ đầu tư chứng khoán.","2. Công ty quản lý quỹ đầu tư chứng khoán không phải thay mặt quỹ mở thực hiện việc mua lại chứng chỉ quỹ mở khi xảy ra một trong các sự kiện sau đây:","a) Không thể thực hiện việc mua lại chứng chỉ quỹ mở do nguyên nhân bất khả kháng;","b) Không thể xác định giá trị tài sản ròng của quỹ mở vào ngày định giá mua lại do có quyết định đình chỉ giao dịch chứng khoán trong danh mục đầu tư của quỹ;","c) Sự kiện khác do Điều lệ quỹ đầu tư chứng khoán quy định.","3. Công ty quản lý quỹ đầu tư chứng khoán phải báo cáo Ủy ban Chứng khoán Nhà nước trong thời hạn 24 giờ kể từ khi xảy ra một trong các sự kiện quy định tại khoản 2 Điều này và phải tiếp tục thực hiện việc mua lại chứng chỉ quỹ mở sau khi sự kiện này chấm dứt."],"sua_doi":false,"ghi_chu":[]},{"so":"112","ten":"Quỹ đóng","chuong":"Chương VII. QUỸ ĐẦU TƯ CHỨNG KHOÁN, CÔNG TY ĐẦU TƯ CHỨNG KHOÁN VÀ NGÂN HÀNG GIÁM SÁT","doan":["1. Việc tăng vốn của quỹ đóng phải được sự chấp thuận của Ủy ban Chứng khoán Nhà nước và đáp ứng các điều kiện sau đây:","a) Điều lệ quỹ đầu tư chứng khoán có quy định việc tăng vốn của quỹ;","b) Lợi nhuận của quỹ trong năm liền trước năm đề nghị tăng vốn phải là số dương;","c) Công ty quản lý quỹ đầu tư chứng khoán không bị xử phạt vi phạm hành chính trong lĩnh vực chứng khoán và thị trường chứng khoán trong thời hạn 02 năm, tính đến thời điểm đề nghị tăng vốn;","d) Phương án phát hành thêm chứng chỉ quỹ đóng phải được Đại hội nhà đầu tư thông qua.","2. Chứng chỉ quỹ đóng chỉ được phát hành cho nhà đầu tư hiện hữu của quỹ thông qua phát hành quyền mua chứng chỉ quỹ đóng được chuyển nhượng. Trường hợp nhà đầu tư hiện hữu không mua hết quyền mua thì được phát hành cho nhà đầu tư bên ngoài.","3. Việc thay đổi thời hạn hoạt động của quỹ đóng phải được sự chấp thuận của Ủy ban Chứng khoán Nhà nước và đáp ứng các điều kiện sau đây:","a) Việc thay đổi thời hạn hoạt động của quỹ đã được Đại hội nhà đầu tư thông qua;","b) Trường hợp gia hạn thời hạn hoạt động, giá trị tài sản ròng của quỹ tại kỳ định giá gần nhất trước thời điểm nộp hồ sơ gia hạn không thấp hơn 50 tỷ đồng."],"sua_doi":false,"ghi_chu":[]},{"so":"113","ten":"Thành lập quỹ thành viên","chuong":"Chương VII. QUỸ ĐẦU TƯ CHỨNG KHOÁN, CÔNG TY ĐẦU TƯ CHỨNG KHOÁN VÀ NGÂN HÀNG GIÁM SÁT","doan":["1. Quỹ thành viên do các thành viên góp vốn thành lập trên cơ sở hợp đồng góp vốn.","2. Việc thành lập quỹ thành viên phải đáp ứng các điều kiện sau đây:","a) Vốn góp tối thiểu là 50 tỷ đồng;","b) Có từ 02 đến 99 thành viên góp vốn và chỉ bao gồm thành viên là nhà đầu tư chứng khoán chuyên nghiệp;","c) Do 01 công ty quản lý quỹ đầu tư chứng khoán quản lý;","d) Tài sản của quỹ thành viên được lưu ký tại 01 ngân hàng lưu ký độc lập với công ty quản lý quỹ đầu tư chứng khoán. Mục 3 CÔNG TY ĐẦU TƯ CHỨNG KHOÁN"],"sua_doi":false,"ghi_chu":[]},{"so":"114","ten":"Công ty đầu tư chứng khoán","chuong":"Chương VII. QUỸ ĐẦU TƯ CHỨNG KHOÁN, CÔNG TY ĐẦU TƯ CHỨNG KHOÁN VÀ NGÂN HÀNG GIÁM SÁT","doan":["1. Công ty đầu tư chứng khoán là quỹ đầu tư chứng khoán được tổ chức theo loại hình công ty cổ phần để đầu tư chứng khoán. Công ty đầu tư chứng khoán có hai hình thức là công ty đầu tư chứng khoán riêng lẻ và công ty đầu tư chứng khoán đại chúng.","2. Ủy ban Chứng khoán Nhà nước cấp Giấy phép thành lập và hoạt động của công ty đầu tư chứng khoán. Sau khi được Ủy ban Chứng khoán Nhà nước cấp Giấy phép thành lập và hoạt động, công ty đầu tư chứng khoán thực hiện đăng ký doanh nghiệp theo quy định của Luật Doanh nghiệp."],"sua_doi":false,"ghi_chu":[]},{"so":"115","ten":"Thành lập và hoạt động của công ty đầu tư chứng khoán","chuong":"Chương VII. QUỸ ĐẦU TƯ CHỨNG KHOÁN, CÔNG TY ĐẦU TƯ CHỨNG KHOÁN VÀ NGÂN HÀNG GIÁM SÁT","doan":["1. Điều kiện cấp Giấy phép thành lập và hoạt động của công ty đầu tư chứng khoán bao gồm:","a) Có vốn tối thiểu là 50 tỷ đồng;","b) Tổng giám đốc (Giám đốc) và nhân viên làm việc tại bộ phận nghiệp vụ có chứng chỉ hành nghề chứng khoán trong trường hợp công ty đầu tư chứng khoán tự quản lý vốn đầu tư.","2. Công ty đầu tư chứng khoán đại chúng phải tuân thủ các quy định sau đây:","a) Các hạn chế đầu tư quy định tại Điều 110 của Luật này;","b) Các nội dung liên quan đến định giá tài sản và chế độ báo cáo quy định tại Điều 106 và Điều 107 của Luật này;","c) Các nghĩa vụ của công ty đại chúng quy định tại các điểm a, b, c khoản 1 và khoản 2 Điều 34 của Luật này;","d) Tài sản của công ty đầu tư chứng khoán phải được lưu ký tại 01 ngân hàng giám sát. Mục 4 NGÂN HÀNG GIÁM SÁT"],"sua_doi":false,"ghi_chu":[]},{"so":"116","ten":"Ngân hàng giám sát","chuong":"Chương VII. QUỸ ĐẦU TƯ CHỨNG KHOÁN, CÔNG TY ĐẦU TƯ CHỨNG KHOÁN VÀ NGÂN HÀNG GIÁM SÁT","doan":["1. Ngân hàng giám sát là ngân hàng thương mại có Giấy chứng nhận đăng ký hoạt động lưu ký chứng khoán do Ủy ban Chứng khoán Nhà nước cấp, thực hiện các dịch vụ lưu ký và giám sát việc quản lý quỹ đại chúng, công ty đầu tư chứng khoán.","2. Ngân hàng giám sát thực hiện giám sát các hoạt động của công ty quản lý quỹ đầu tư chứng khoán trong phạm vi liên quan tới quỹ đại chúng, công ty đầu tư chứng khoán mà ngân hàng cung cấp dịch vụ giám sát. Ngân hàng giám sát có các nghĩa vụ sau đây:","a) Thực hiện các nghĩa vụ quy định tại khoản 3 Điều 56 của Luật này;","b) Thực hiện lưu ký tài sản của quỹ đại chúng, công ty đầu tư chứng khoán; quản lý tách biệt tài sản của quỹ đại chúng, công ty đầu tư chứng khoán và các tài sản khác của ngân hàng giám sát;","c) Giám sát để bảo đảm công ty quản lý quỹ đầu tư chứng khoán quản lý quỹ đại chúng, Tổng giám đốc (Giám đốc) công ty đầu tư chứng khoán quản lý tài sản của công ty đầu tư chứng khoán tuân thủ quy định của Luật này và Điều lệ quỹ đầu tư chứng khoán, Điều lệ công ty đầu tư chứng khoán;","d) Thực hiện hoạt động thu, chi, thanh toán và chuyển giao tài sản liên quan đến hoạt động của quỹ đại chúng, công ty đầu tư chứng khoán theo yêu cầu hợp pháp của công ty quản lý quỹ đầu tư chứng khoán hoặc Tổng giám đốc (Giám đốc) công ty đầu tư chứng khoán;","đ) Xác nhận báo cáo do công ty quản lý quỹ đầu tư chứng khoán, công ty đầu tư chứng khoán lập có liên quan đến quỹ đại chúng, công ty đầu tư chứng khoán;","e) Giám sát việc tuân thủ chế độ báo cáo và công bố thông tin của công ty quản lý quỹ đầu tư chứng khoán, công ty đầu tư chứng khoán theo quy định của Luật này;","g) Báo cáo Ủy ban Chứng khoán Nhà nước khi phát hiện công ty quản lý quỹ đầu tư chứng khoán, công ty đầu tư chứng khoán và tổ chức, cá nhân có liên quan vi phạm pháp luật hoặc Điều lệ quỹ đầu tư chứng khoán, Điều lệ công ty đầu tư chứng khoán;","h) Định kỳ cùng công ty quản lý quỹ đầu tư chứng khoán, công ty đầu tư chứng khoán đối chiếu sổ kế toán, báo cáo tài chính và hoạt động giao dịch của quỹ đại chúng, công ty đầu tư chứng khoán;","i) Nghĩa vụ khác theo quy định của pháp luật và Điều lệ quỹ đầu tư chứng khoán, Điều lệ công ty đầu tư chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"117","ten":"Hạn chế đối với ngân hàng giám sát","chuong":"Chương VII. QUỸ ĐẦU TƯ CHỨNG KHOÁN, CÔNG TY ĐẦU TƯ CHỨNG KHOÁN VÀ NGÂN HÀNG GIÁM SÁT","doan":["1. Ngân hàng giám sát, thành viên Hội đồng quản trị, người điều hành và nhân viên của ngân hàng giám sát làm nhiệm vụ giám sát hoạt động và bảo quản tài sản của quỹ đại chúng, công ty đầu tư chứng khoán không được là người có liên quan hoặc có quan hệ sở hữu, vay hoặc cho vay với công ty quản lý quỹ, công ty đầu tư chứng khoán và ngược lại.","2. Ngân hàng giám sát, thành viên Hội đồng quản trị, người điều hành và nhân viên của ngân hàng giám sát làm nhiệm vụ giám sát hoạt động và bảo quản tài sản của quỹ đại chúng, công ty đầu tư chứng khoán không được là đối tác mua, bán trong giao dịch mua, bán tài sản của quỹ đại chúng, công ty đầu tư chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"118","ten":"Đối tượng công bố thông tin","chuong":"Chương VIII. CÔNG BỐ THÔNG TIN","doan":["1. Các đối tượng công bố thông tin bao gồm:","a) Công ty đại chúng;","b) Tổ chức phát hành trái phiếu doanh nghiệp ra công chúng;","c) Tổ chức niêm yết trái phiếu doanh nghiệp;","d) Công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam;","đ) Sở giao dịch chứng khoán Việt Nam và công ty con, Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam;","e) Cổ đông lớn, nhóm người có liên quan sở hữu từ 5% trở lên số cổ phiếu có quyền biểu quyết của công ty đại chúng; nhà đầu tư, nhóm người có liên quan sở hữu từ 5% trở lên chứng chỉ quỹ của quỹ đóng;","g) Cổ đông sáng lập trong thời gian bị hạn chế chuyển nhượng của công ty đại chúng, công ty đầu tư chứng khoán đại chúng;","h) Người nội bộ của công ty đại chúng, người nội bộ của quỹ đại chúng, công ty đầu tư chứng khoán đại chúng theo quy định tại khoản 45 Điều 4 của Luật này và người có liên quan của người nội bộ;","i) Nhóm nhà đầu tư nước ngoài có liên quan sở hữu từ 5% trở lên số cổ phiếu có quyền biểu quyết của 01 tổ chức phát hành hoặc từ 5% trở lên chứng chỉ quỹ của quỹ đóng;","k) Đối tượng khác theo quy định của Bộ trưởng Bộ Tài chính.","2. Bộ trưởng Bộ Tài chính quy định chi tiết việc công bố thông tin của từng đối tượng quy định tại khoản 1 Điều này.","3. Đối với công ty đại chúng là tổ chức tín dụng được kiểm soát đặc biệt, việc công bố thông tin thực hiện theo yêu cầu của Ngân hàng Nhà nước Việt Nam phù hợp với mục tiêu bảo đảm an toàn hệ thống tổ chức tín dụng."],"sua_doi":false,"ghi_chu":[]},{"so":"119","ten":"Nguyên tắc công bố thông tin","chuong":"Chương VIII. CÔNG BỐ THÔNG TIN","doan":["1. Việc công bố thông tin phải đầy đủ, chính xác, kịp thời.","2. Đối tượng công bố thông tin phải chịu trách nhiệm trước pháp luật về nội dung thông tin công bố. Trường hợp có thay đổi nội dung thông tin đã công bố, đối tượng công bố thông tin phải công bố kịp thời, đầy đủ nội dung thay đổi và lý do thay đổi so với thông tin đã công bố trước đó.","3. Đối tượng quy định tại Điều 118 của Luật này khi công bố thông tin phải đồng thời báo cáo Ủy ban Chứng khoán Nhà nước và tổ chức nơi chứng khoán đó niêm yết, đăng ký giao dịch về nội dung thông tin công bố.","4. Việc công bố thông tin của tổ chức phải do người đại diện theo pháp luật hoặc người được ủy quyền công bố thông tin thực hiện. Việc công bố thông tin của cá nhân do cá nhân tự thực hiện hoặc ủy quyền cho tổ chức hoặc cá nhân khác thực hiện.","5. Đối tượng công bố thông tin có trách nhiệm bảo quản, lưu giữ thông tin đã công bố, báo cáo theo quy định của pháp luật."],"sua_doi":false,"ghi_chu":[]},{"so":"120","ten":"Công bố thông tin của công ty đại chúng","chuong":"Chương VIII. CÔNG BỐ THÔNG TIN","doan":["1. Công ty đại chúng phải công bố thông tin định kỳ về một hoặc một số nội dung sau đây:","a) Báo cáo tài chính năm đã được kiểm toán, báo cáo tài chính 06 tháng đã được soát xét bởi tổ chức kiểm toán được chấp thuận, báo cáo tài chính quý;","b) Báo cáo thường niên;","c) Báo cáo tình hình quản trị công ty;","d) Nghị quyết Đại hội đồng cổ đông thường niên;","đ) Thông tin khác theo quy định của pháp luật.","2. Công ty đại chúng phải công bố thông tin bất thường khi xảy ra một trong các sự kiện sau đây:","a) Tài khoản của công ty tại ngân hàng, chi nhánh ngân hàng nước ngoài bị phong tỏa theo yêu cầu của cơ quan có thẩm quyền hoặc khi tổ chức cung ứng dịch vụ thanh toán phát hiện có dấu hiệu gian lận, vi phạm pháp luật liên quan đến tài khoản thanh toán; tài khoản được phép hoạt động trở lại sau khi bị phong tỏa trong các trường hợp quy định tại điểm này;","b) Tạm ngừng kinh doanh; thay đổi nội dung đăng ký doanh nghiệp; thu hồi Giấy chứng nhận đăng ký doanh nghiệp; sửa đổi, bổ sung hoặc bị đình chỉ, thu hồi Giấy phép thành lập và hoạt động hoặc Giấy phép hoạt động;","c) Thông qua quyết định của Đại hội đồng cổ đông bất thường theo quy định của pháp luật;","d) Quyết định mua lại cổ phiếu của công ty; ngày thực hiện quyền mua cổ phần của người sở hữu trái phiếu kèm theo quyền mua cổ phần hoặc ngày thực hiện chuyển đổi trái phiếu chuyển đổi thành cổ phiếu và các quyết định liên quan đến việc chào bán, phát hành chứng khoán;","đ) Quyết định về việc tổ chức lại doanh nghiệp, giải thể doanh nghiệp; chiến lược, kế hoạch phát triển trung hạn và kế hoạch kinh doanh hằng năm của công ty; thành lập, giải thể công ty con, công ty liên kết, giao dịch dẫn đến một công ty trở thành hoặc không còn là công ty con, công ty liên kết; thành lập, đóng cửa chi nhánh, văn phòng đại diện;","e) Quyết định thay đổi kỳ kế toán, chính sách kế toán áp dụng; kết quả điều chỉnh hồi tố báo cáo tài chính; ý kiến không phải là ý kiến chấp nhận toàn phần của tổ chức kiểm toán đối với báo cáo tài chính; việc lựa chọn hoặc thay đổi công ty kiểm toán;","g) Thay đổi, bổ nhiệm mới người nội bộ;","h) Quyết định mua, bán tài sản hoặc thực hiện các giao dịch có giá trị lớn hơn 15% tổng tài sản của công ty căn cứ vào báo cáo tài chính năm gần nhất được kiểm toán hoặc báo cáo tài chính 06 tháng gần nhất được soát xét;","i) Có quyết định xử phạt vi phạm pháp luật về thuế, bản án, quyết định của Tòa án đã có hiệu lực pháp luật liên quan đến hoạt động của công ty; thông báo của Tòa án thụ lý đơn yêu cầu mở thủ tục phá sản doanh nghiệp;","k) Có quyết định khởi tố đối với công ty, người nội bộ của công ty;","l) Được chấp thuận hoặc bị hủy bỏ niêm yết tại Sở giao dịch chứng khoán nước ngoài;","m) Sự kiện khác theo quy định của Bộ trưởng Bộ Tài chính.","3. Công ty đại chúng phải công bố thông tin theo yêu cầu của Ủy ban Chứng khoán Nhà nước, Sở giao dịch chứng khoán Việt Nam và công ty con khi xảy ra một trong các sự kiện sau đây:","a) Sự kiện ảnh hưởng nghiêm trọng đến lợi ích hợp pháp của nhà đầu tư;","b) Có thông tin liên quan đến công ty ảnh hưởng lớn đến giá chứng khoán và cần phải xác nhận thông tin đó."],"sua_doi":false,"ghi_chu":[]},{"so":"121","ten":"Công bố thông tin của tổ chức phát hành trái phiếu doanh nghiệp ra công chúng","chuong":"Chương VIII. CÔNG BỐ THÔNG TIN","doan":["1. Tổ chức phát hành trái phiếu ra công chúng phải công bố thông tin định kỳ các nội dung sau đây:","a) Báo cáo tài chính năm đã được kiểm toán bởi tổ chức kiểm toán được chấp thuận;","b) Báo cáo thường niên;","c) Nghị quyết Đại hội đồng cổ đông thường niên đối với tổ chức phát hành là công ty cổ phần;","d) Báo cáo sử dụng vốn thu được từ đợt chào bán đã được kiểm toán;","đ) Thông tin khác theo quy định của pháp luật.","2. Tổ chức phát hành trái phiếu ra công chúng phải công bố thông tin bất thường khi xảy ra một trong các sự kiện quy định tại khoản 2 Điều 120 của Luật này.","3. Tổ chức phát hành trái phiếu ra công chúng phải công bố thông tin theo yêu cầu quy định tại khoản 3 Điều 120 của Luật này."],"sua_doi":false,"ghi_chu":[]},{"so":"122","ten":"Công bố thông tin của tổ chức niêm yết trái phiếu doanh nghiệp","chuong":"Chương VIII. CÔNG BỐ THÔNG TIN","doan":["1. Tổ chức niêm yết trái phiếu doanh nghiệp là công ty đại chúng thực hiện công bố thông tin theo quy định tại Điều 120 của Luật này.","2. Tổ chức niêm yết trái phiếu doanh nghiệp không thuộc đối tượng quy định tại khoản 1 Điều này thực hiện công bố thông tin như sau:","a) Công bố định kỳ báo cáo tài chính năm đã được kiểm toán bởi tổ chức kiểm toán được chấp thuận và báo cáo thường niên;","b) Công bố thông tin bất thường theo quy định tại khoản 2 Điều 120 của Luật này;","c) Công bố thông tin theo yêu cầu quy định tại khoản 3 Điều 120 của Luật này."],"sua_doi":false,"ghi_chu":[]},{"so":"123","ten":"Công bố thông tin của công ty chứng khoán, công ty quản lý quỹ","chuong":"Chương VIII. CÔNG BỐ THÔNG TIN","doan":["đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam","1. Công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam thực hiện công bố thông tin định kỳ các nội dung sau đây:","a) Báo cáo tài chính năm đã được kiểm toán, báo cáo tài chính 06 tháng đã được soát xét bởi tổ chức kiểm toán được chấp thuận, báo cáo tài chính quý;","b) Báo cáo tỷ lệ an toàn tài chính tại ngày 30 tháng 6 đã được soát xét và tại ngày 31 tháng 12 đã được kiểm toán bởi tổ chức kiểm toán được chấp thuận;","c) Báo cáo thường niên;","d) Báo cáo tình hình quản trị công ty;","đ) Nghị quyết Đại hội đồng cổ đông thường niên đối với công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán là công ty cổ phần;","e) Thông tin khác theo quy định của pháp luật.","2. Công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam thực hiện công bố thông tin bất thường theo quy định tại khoản 2 Điều 120 của Luật này và khi xảy ra một trong các sự kiện sau đây:","a) Có quyết định của Ủy ban Chứng khoán Nhà nước về việc xử phạt vi phạm hành chính trong lĩnh vực chứng khoán và thị trường chứng khoán đối với công ty, chi nhánh, người hành nghề chứng khoán của công ty, chi nhánh; Tổng giám đốc (Giám đốc), Phó Tổng giám đốc (Phó Giám đốc) bị tước quyền sử dụng chứng chỉ hành nghề chứng khoán có thời hạn, thu hồi chứng chỉ hành nghề chứng khoán;","b) Có quyết định của Ủy ban Chứng khoán Nhà nước về việc đặt công ty vào diện cảnh báo, kiểm soát, kiểm soát đặc biệt hoặc đưa ra khỏi diện cảnh báo, kiểm soát, kiểm soát đặc biệt; đình chỉ hoạt động, tạm ngừng hoạt động hoặc chấm dứt tình trạng đình chỉ hoạt động, tạm ngừng hoạt động;","c) Được Ủy ban Chứng khoán Nhà nước chấp thuận việc thành lập, đóng cửa chi nhánh, phòng giao dịch, văn phòng đại diện ở trong nước hoặc nước ngoài, việc đầu tư gián tiếp ra nước ngoài.","3. Công ty chứng khoán phải công bố thông tin tại trụ sở chính, các chi nhánh và phòng giao dịch về các nội dung liên quan đến phương thức giao dịch, đặt lệnh, ký quỹ giao dịch, thời gian thanh toán, phí giao dịch, các dịch vụ cung cấp và danh sách những người hành nghề chứng khoán của công ty. Trường hợp cung cấp dịch vụ giao dịch ký quỹ, công ty chứng khoán phải thông báo các điều kiện cung cấp dịch vụ bao gồm yêu cầu về tỷ lệ ký quỹ, lãi suất vay, thời hạn vay, phương thức thực hiện lệnh gọi ký quỹ bổ sung, danh mục chứng khoán thực hiện giao dịch ký quỹ.","4. Công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam công bố thông tin theo yêu cầu của Ủy ban Chứng khoán Nhà nước, Sở giao dịch chứng khoán Việt Nam và công ty con khi có thông tin liên quan đến công ty, chi nhánh ảnh hưởng nghiêm trọng đến quyền, lợi ích hợp pháp của nhà đầu tư."],"sua_doi":false,"ghi_chu":[]},{"so":"124","ten":"Công bố thông tin về quỹ đại chúng","chuong":"Chương VIII. CÔNG BỐ THÔNG TIN","doan":["1. Công ty quản lý quỹ đầu tư chứng khoán công bố thông tin định kỳ về các nội dung sau đây của quỹ đại chúng:","a) Báo cáo tài chính năm đã được kiểm toán, báo cáo tài chính 06 tháng đã được soát xét bởi tổ chức kiểm toán được chấp thuận, báo cáo tài chính quý;","b) Báo cáo thay đổi giá trị tài sản ròng;","c) Báo cáo hoạt động đầu tư;","d) Báo cáo tổng kết hoạt động quản lý quỹ.","2. Công ty quản lý quỹ đầu tư chứng khoán công bố thông tin bất thường về quỹ đại chúng khi xảy ra một trong các sự kiện sau đây:","a) Thông qua quyết định của Đại hội nhà đầu tư;","b) Quyết định thay đổi vốn điều lệ của quỹ đóng;","c) Bị thu hồi Giấy chứng nhận chào bán chứng chỉ quỹ đại chúng ra công chúng;","d) Bị đình chỉ, hủy bỏ đợt chào bán chứng chỉ quỹ đại chúng; quỹ đại chúng chào bán không thành công;","đ) Sửa đổi Điều lệ, Bản cáo bạch;","e) Thay đổi, bổ nhiệm mới người nội bộ của quỹ đại chúng; có quyết định khởi tố người nội bộ của quỹ đại chúng;","g) Quyết định hợp nhất, sáp nhập, chia, tách, giải thể, thay đổi thời hạn hoạt động, thanh lý tài sản của quỹ đại chúng;","h) Sự kiện khác theo quy định của Bộ trưởng Bộ Tài chính.","3. Công ty quản lý quỹ đầu tư chứng khoán công bố thông tin về quỹ đại chúng theo yêu cầu của Ủy ban Chứng khoán Nhà nước, Sở giao dịch chứng khoán Việt Nam và công ty con khi xảy ra một trong các sự kiện sau đây:","a) Có thông tin liên quan ảnh hưởng đến việc chào bán, giá chứng chỉ quỹ đại chúng;","b) Có thay đổi bất thường về giá, khối lượng giao dịch chứng chỉ quỹ đại chúng."],"sua_doi":false,"ghi_chu":[]},{"so":"125","ten":"Công bố thông tin về công ty đầu tư chứng khoán đại chúng","chuong":"Chương VIII. CÔNG BỐ THÔNG TIN","doan":["1. Công ty quản lý quỹ đầu tư chứng khoán công bố thông tin định kỳ các nội dung sau đây về công ty đầu tư chứng khoán đại chúng:","a) Các nội dung quy định tại các điểm a, b và c khoản 1 Điều 124 của Luật này;","b) Báo cáo tổng kết hoạt động quản lý công ty đầu tư chứng khoán đại chúng;","c) Nghị quyết Đại hội đồng cổ đông thường niên.","2. Công ty quản lý quỹ đầu tư chứng khoán công bố thông tin bất thường về công ty đầu tư chứng khoán đại chúng khi xảy ra một trong các sự kiện sau đây:","a) Bị đình chỉ, hủy bỏ đợt chào bán cổ phiếu của công ty đầu tư chứng khoán đại chúng;","b) Tạm ngừng giao dịch cổ phiếu của công ty đầu tư chứng khoán đại chúng;","c) Sự kiện quy định tại các điểm a, c, e và m khoản 2 Điều 120 và các điểm đ, e và g khoản 2 Điều 124 của Luật này.","3. Công ty quản lý quỹ đầu tư chứng khoán công bố thông tin về công ty đầu tư chứng khoán đại chúng theo yêu cầu của Ủy ban Chứng khoán Nhà nước, Sở giao dịch chứng khoán Việt Nam và công ty con theo quy định tại khoản 3 Điều 120 của Luật này."],"sua_doi":false,"ghi_chu":[]},{"so":"126","ten":"Công bố thông tin của Sở giao dịch chứng khoán Việt Nam và công ty con, Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam","chuong":"Chương VIII. CÔNG BỐ THÔNG TIN","doan":["1. Sở giao dịch chứng khoán Việt Nam và công ty con phải công bố các thông tin sau đây:","a) Thông tin về tổ chức và hoạt động của Sở giao dịch chứng khoán Việt Nam và công ty con;","b) Thông tin về tổ chức có chứng khoán niêm yết, đăng ký giao dịch; thông tin về thành viên của Sở giao dịch chứng khoán Việt Nam và công ty con;","c) Thông tin về giao dịch chứng khoán;","d) Thông tin khác theo quy định của Bộ trưởng Bộ Tài chính.","2. Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam phải công bố các thông tin sau đây:","a) Thông tin về tổ chức và hoạt động của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam;","b) Thông tin liên quan đến hoạt động quản lý, giám sát thành viên của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam;","c) Thông tin về hoạt động đăng ký, lưu ký chứng khoán;","d) Thông tin khác theo quy định của Bộ trưởng Bộ Tài chính."],"sua_doi":false,"ghi_chu":[]},{"so":"127","ten":"Công bố thông tin của cổ đông lớn, nhóm người có liên quan sở","chuong":"Chương VIII. CÔNG BỐ THÔNG TIN","doan":["hữu từ 5% trở lên số cổ phiếu có quyền biểu quyết của công ty đại chúng; nhà đầu tư, nhóm người có liên quan sở hữu từ 5% trở lên chứng chỉ quỹ của quỹ đóng; nhóm nhà đầu tư nước ngoài có liên quan sở hữu từ 5% trở lên số cổ phiếu có quyền biểu quyết của 01 tổ chức phát hành hoặc từ 5% trở lên chứng chỉ quỹ của quỹ đóng","1. Tổ chức, cá nhân, nhóm người có liên quan, nhóm nhà đầu tư nước ngoài có liên quan phải công bố thông tin khi trở thành hoặc không còn là cổ đông lớn của công ty đại chúng, công ty đầu tư chứng khoán đại chúng.","2. Tổ chức, cá nhân, nhóm người có liên quan, nhóm nhà đầu tư nước ngoài có liên quan là cổ đông lớn phải công bố thông tin khi có thay đổi về số lượng cổ phiếu sở hữu qua các ngưỡng 1% số cổ phiếu có quyền biểu quyết của công ty đại chúng, công ty đầu tư chứng khoán đại chúng.","3. Quy định tại khoản 1 và khoản 2 Điều này không áp dụng đối với các trường hợp sau đây:","a) Thay đổi tỷ lệ nắm giữ cổ phiếu có quyền biểu quyết phát sinh do công ty đại chúng mua lại cổ phiếu của chính mình hoặc phát hành thêm cổ phiếu;","b) Quỹ hoán đổi danh mục thực hiện giao dịch hoán đổi;","c) Trường hợp khác theo quy định của pháp luật.","4. Nhà đầu tư, nhóm người có liên quan, nhóm nhà đầu tư nước ngoài có liên quan phải công bố thông tin khi sở hữu từ 5% trở lên hoặc không còn sở hữu từ 5% trở lên chứng chỉ quỹ của quỹ đóng.","5. Nhà đầu tư, nhóm người có liên quan, nhóm nhà đầu tư nước ngoài có liên quan nắm giữ từ 5% trở lên chứng chỉ quỹ của quỹ đóng phải công bố thông tin khi có thay đổi tỷ lệ sở hữu qua các ngưỡng 1% chứng chỉ quỹ của quỹ đóng."],"sua_doi":false,"ghi_chu":[]},{"so":"128","ten":"Công bố thông tin của người nội bộ và người có liên quan của người nội bộ","chuong":"Chương VIII. CÔNG BỐ THÔNG TIN","doan":["1. Người nội bộ của công ty đại chúng, công ty đầu tư chứng khoán đại chúng, quỹ đại chúng và người có liên quan của các đối tượng này phải công bố thông tin trước và sau giao dịch hoặc khi có thay đổi sở hữu đối với cổ phiếu, quyền mua cổ phiếu, trái phiếu chuyển đổi, quyền mua trái phiếu chuyển đổi, chứng chỉ quỹ, quyền mua chứng chỉ quỹ hoặc chứng quyền có bảo đảm dựa trên chứng khoán của công ty đại chúng, công ty đầu tư chứng khoán đại chúng, quỹ đại chúng.","2. Quy định tại khoản 1 Điều này không áp dụng đối với trường hợp quỹ hoán đổi danh mục thực hiện giao dịch hoán đổi hoặc giá trị chứng khoán giao dịch chưa đạt giá trị tối thiểu phải công bố thông tin và các trường hợp khác theo quy định của pháp luật."],"sua_doi":false,"ghi_chu":[]},{"so":"129","ten":"Thanh tra chứng khoán","chuong":"Chương IX. THANH TRA, XỬ LÝ VI PHẠM, GIẢI QUYẾT TRANH CHẤP VÀ BỒI THƯỜNG THIỆT HẠI","doan":["1. Thanh tra chứng khoán là thanh tra chuyên ngành về chứng khoán và thị trường chứng khoán.","2. Thanh tra chứng khoán có Chánh thanh tra, các Phó Chánh thanh tra và các Thanh tra viên.","3. Thanh tra chứng khoán chịu sự chỉ đạo trực tiếp của Chủ tịch Ủy ban Chứng khoán Nhà nước và hướng dẫn về nghiệp vụ của Thanh tra Bộ Tài chính, hoạt động theo quy định của pháp luật về thanh tra và quy định của Luật này.","4. Thanh tra chứng khoán có các nhiệm vụ và quyền hạn sau đây:","a) Thanh tra, kiểm tra việc chấp hành quy định của pháp luật về chứng khoán và thị trường chứng khoán;","b) Xử phạt vi phạm hành chính theo thẩm quyền hoặc kiến nghị Chủ tịch Ủy ban Chứng khoán Nhà nước quyết định việc xử phạt vi phạm hành chính theo quy định của pháp luật về xử lý vi phạm hành chính;","c) Phối hợp với các cơ quan, đơn vị liên quan trong việc phòng ngừa, phát hiện, ngăn chặn, xử lý hành vi vi phạm pháp luật về chứng khoán và thị trường chứng khoán;","d) Thực hiện nhiệm vụ và quyền hạn khác theo quy định của pháp luật."],"sua_doi":false,"ghi_chu":[]},{"so":"130","ten":"Nhiệm vụ, quyền hạn của Ủy ban Chứng khoán Nhà nước trong thanh tra, kiểm tra, xử lý vi phạm pháp luật về chứng khoán và thị trường chứng khoán","chuong":"Chương IX. THANH TRA, XỬ LÝ VI PHẠM, GIẢI QUYẾT TRANH CHẤP VÀ BỒI THƯỜNG THIỆT HẠI","doan":["1. Trong thanh tra, kiểm tra, xử lý vi phạm pháp luật về chứng khoán và thị trường chứng khoán, ngoài các nhiệm vụ, quyền hạn theo quy định của pháp luật về thanh tra, pháp luật về xử lý vi phạm hành chính và quy định khác của pháp luật có liên quan, Ủy ban Chứng khoán Nhà nước còn có các nhiệm vụ, quyền hạn sau đây:","a) Yêu cầu cơ quan, tổ chức, cá nhân có thông tin, tài liệu, dữ liệu liên quan đến nội dung thanh tra, kiểm tra cung cấp thông tin, tài liệu, dữ liệu đó hoặc yêu cầu tổ chức, cá nhân giải trình, đến làm việc liên quan đến nội dung thanh tra, kiểm tra;","b) Yêu cầu tổ chức tín dụng, chi nhánh ngân hàng nước ngoài cung cấp thông tin liên quan đến giao dịch trên tài khoản của khách hàng đối với các trường hợp có dấu hiệu thực hiện hành vi bị nghiêm cấm quy định tại Điều 12 của Luật này. Trình tự, thủ tục yêu cầu và cung cấp thông tin thực hiện theo quy định của pháp luật về ngân hàng;","c) Yêu cầu doanh nghiệp viễn thông cung cấp tên, địa chỉ, số máy gọi, số máy được gọi, thời gian gọi để xác minh, xử lý hành vi bị nghiêm cấm quy định tại Điều 12 của Luật này. Trình tự, thủ tục yêu cầu và cung cấp thông tin thực hiện theo quy định của pháp luật về viễn thông.","2. Việc yêu cầu cơ quan, tổ chức, cá nhân cung cấp thông tin, tài liệu, dữ liệu, giải trình, đến làm việc theo quy định tại khoản 1 Điều này phải được Chủ tịch Ủy ban Chứng khoán Nhà nước phê duyệt và được thực hiện bằng văn bản, nêu rõ mục đích, căn cứ, nội dung, phạm vi yêu cầu.","3. Các thông tin, tài liệu, dữ liệu do tổ chức tín dụng, chi nhánh ngân hàng nước ngoài, doanh nghiệp viễn thông cung cấp theo quy định tại khoản 1 Điều này phải được bảo mật theo quy định của pháp luật và chỉ được phép sử dụng cho mục đích thanh tra, kiểm tra, xử lý vi phạm pháp luật của tổ chức, cá nhân liên quan.","4. Trong giám sát, phát hiện, xử lý các vi phạm về chứng khoán mang tính xuyên biên giới có liên quan đến thị trường chứng khoán Việt Nam, Ủy ban Chứng khoán Nhà nước phối hợp thanh tra, điều tra, xác minh, thu thập và chia sẻ thông tin với cơ quan quản lý thị trường chứng khoán các nước."],"sua_doi":false,"ghi_chu":[]},{"so":"131","ten":"Trách nhiệm phối hợp của các cơ quan, tổ chức, cá nhân trong thanh tra, kiểm tra, xử lý vi phạm pháp luật về chứng khoán và thị trường chứng khoán","chuong":"Chương IX. THANH TRA, XỬ LÝ VI PHẠM, GIẢI QUYẾT TRANH CHẤP VÀ BỒI THƯỜNG THIỆT HẠI","doan":["1. Cơ quan, tổ chức, cá nhân có trách nhiệm cung cấp thông tin, tài liệu, dữ liệu, giải trình, đến làm việc theo yêu cầu của Ủy ban Chứng khoán Nhà nước theo quy định tại điểm a khoản 1 Điều 130 của Luật này.","2. Tổ chức tín dụng, chi nhánh ngân hàng nước ngoài, doanh nghiệp viễn thông có trách nhiệm cung cấp thông tin theo yêu cầu của Ủy ban Chứng khoán Nhà nước theo quy định tại điểm b và điểm c khoản 1 Điều 130 của Luật này.","3. Cơ quan đăng ký kinh doanh có trách nhiệm phối hợp, gửi thông tin về đăng ký doanh nghiệp, đăng ký kinh doanh của công ty đại chúng, công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam, doanh nghiệp có liên quan, thông tin khác theo đề nghị của Ủy ban Chứng khoán Nhà nước.","4. Cơ quan thuế có trách nhiệm phối hợp cung cấp thông tin của công ty đại chúng về đăng ký thuế, đóng mã số thuế, mở lại mã số thuế, ngừng hoạt động, tạm ngừng kinh doanh có thời hạn, không hoạt động tại địa chỉ đã đăng ký, kết quả xử lý vi phạm pháp luật về thuế, quyết định cưỡng chế nợ thuế, thông tin khác theo đề nghị của Ủy ban Chứng khoán Nhà nước.","5. Cơ quan, tổ chức, cá nhân, trong phạm vi nhiệm vụ, quyền hạn của mình, có trách nhiệm cung cấp đầy đủ và đúng thời hạn cho Ủy ban Chứng khoán Nhà nước thông tin, tài liệu, dữ liệu mà mình đang lưu giữ, quản lý khi có yêu cầu của Ủy ban Chứng khoán Nhà nước. Cơ quan, tổ chức, cá nhân có quyền từ chối cung cấp thông tin, tài liệu, dữ liệu khi có căn cứ cho rằng việc yêu cầu cung cấp là trái quy định tại Điều 130 của Luật này hoặc thông tin, tài liệu, dữ liệu được yêu cầu không liên quan đến đối tượng thanh tra, kiểm tra, đối tượng có dấu hiệu vi phạm pháp luật. Trong trường hợp không cung cấp được, cơ quan, tổ chức, cá nhân phải thông báo bằng văn bản cho Ủy ban Chứng khoán Nhà nước biết và nêu rõ lý do."],"sua_doi":false,"ghi_chu":[]},{"so":"132","ten":"Xử lý vi phạm","chuong":"Chương IX. THANH TRA, XỬ LÝ VI PHẠM, GIẢI QUYẾT TRANH CHẤP VÀ BỒI THƯỜNG THIỆT HẠI","doan":["1. Tổ chức, cá nhân có hành vi vi phạm quy định của Luật này và quy định khác của pháp luật có liên quan đến hoạt động chứng khoán và thị trường chứng khoán thì tùy theo tính chất, mức độ vi phạm mà bị xử phạt hành chính hoặc bị truy cứu trách nhiệm hình sự; nếu gây thiệt hại thì phải bồi thường theo quy định của pháp luật.","2. Việc xử phạt vi phạm hành chính thực hiện theo quy định của Luật này và pháp luật về xử lý vi phạm hành chính.","3. Mức phạt tiền tối đa trong xử phạt vi phạm hành chính đối với hành vi vi phạm quy định tại khoản 2 và khoản 3 Điều 12 của Luật này là 10 lần khoản thu trái pháp luật có được từ hành vi vi phạm. Trường hợp không có khoản thu trái pháp luật hoặc mức phạt tính theo khoản thu trái pháp luật thấp hơn mức phạt tiền tối đa quy định tại khoản 4 Điều này thì áp dụng mức phạt tiền tối đa quy định tại khoản 4 Điều này. Bộ trưởng Bộ Tài chính quy định phương pháp tính khoản thu trái pháp luật có được từ việc thực hiện hành vi vi phạm pháp luật về chứng khoán và thị trường chứng khoán.","4. Mức phạt tiền tối đa trong xử phạt vi phạm hành chính đối với các hành vi vi phạm khác trong lĩnh vực chứng khoán là 03 tỷ đồng.","5. Mức phạt tiền tối đa quy định tại khoản 3 và khoản 4 Điều này được áp dụng đối với tổ chức; cá nhân thực hiện cùng hành vi vi phạm thì mức phạt tiền tối đa bằng một phần hai mức phạt tiền tối đa đối với tổ chức.","6. Chủ tịch Ủy ban Chứng khoán Nhà nước, Chánh Thanh tra, Trưởng đoàn thanh tra chuyên ngành chứng khoán có thẩm quyền xử phạt vi phạm hành chính trong lĩnh vực chứng khoán.","7. Chính phủ quy định thẩm quyền, mức phạt và hình thức xử phạt đối với từng hành vi vi phạm hành chính trong lĩnh vực chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"133","ten":"Giải quyết tranh chấp và bồi thường thiệt hại","chuong":"Chương IX. THANH TRA, XỬ LÝ VI PHẠM, GIẢI QUYẾT TRANH CHẤP VÀ BỒI THƯỜNG THIỆT HẠI","doan":["1. Trường hợp quyền, lợi ích hợp pháp của tổ chức, cá nhân trong hoạt động về chứng khoán và thị trường chứng khoán bị xâm phạm hoặc có tranh chấp phát sinh trong hoạt động chứng khoán và thị trường chứng khoán tại Việt Nam thì việc bảo vệ quyền, lợi ích hợp pháp hoặc giải quyết tranh chấp được thực hiện thông qua thương lượng, hòa giải hoặc yêu cầu Trọng tài hoặc Toà án Việt Nam giải quyết theo quy định của pháp luật.","2. Chủ thể xâm phạm quyền, lợi ích hợp pháp của tổ chức, cá nhân trong hoạt động về chứng khoán và thị trường chứng khoán mà gây thiệt hại thì phải bồi thường, thực hiện các trách nhiệm dân sự khác theo thỏa thuận, theo quy định của Bộ luật Dân sự và quy định khác của pháp luật có liên quan.","3. Thẩm quyền, thủ tục để bảo vệ quyền, lợi ích hợp pháp của tổ chức, cá nhân hoặc giải quyết tranh chấp phát sinh trong hoạt động chứng khoán và thị trường chứng khoán được thực hiện theo quy định của pháp luật."],"sua_doi":false,"ghi_chu":[]},{"so":"134","ten":"Hiệu lực thi hành","chuong":"Chương X. ĐIỀU KHOẢN THI HÀNH","doan":["1. Luật này có hiệu lực thi hành từ ngày 01 tháng 01 năm 2021.","2. Luật Chứng khoán số 70/2006/QH và Luật số 62/2010/QH sửa đổi, bổ sung một số điều của Luật Chứng khoán hết hiệu lực kể từ ngày Luật này có hiệu lực thi hành."],"sua_doi":true,"ghi_chu":["Điểm này được sửa đổi, bổ sung theo quy định tại điểm b khoản 6 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025.","Điểm này được bổ sung theo quy định tại điểm a khoản 7 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"135","ten":"Quy định chuyển tiếp","chuong":"Chương X. ĐIỀU KHOẢN THI HÀNH","doan":["1. Trong thời hạn 02 năm kể từ ngày Luật này có hiệu lực thi hành, công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam đã được cấp giấy phép trước ngày Luật này có hiệu lực thi hành phải bảo đảm đáp ứng các điều kiện cấp phép theo quy định sau đây:","a) Công ty chứng khoán phải bảo đảm đáp ứng các điều kiện cấp phép theo quy định tại khoản 1, điểm c và điểm d khoản 2, khoản 4, khoản 5 Điều 74 của Luật này;","b) Công ty quản lý quỹ đầu tư chứng khoán phải bảo đảm đáp ứng các điều kiện cấp phép theo quy định tại khoản 1, điểm b và điểm c khoản 2, khoản 4, khoản 5 Điều 75 của Luật này;","c) Chi nhánh công ty chứng khoán nước ngoài tại Việt Nam phải bảo đảm đáp ứng các điều kiện cấp phép theo quy định tại điểm b và điểm c khoản 1 Điều 76 của Luật này;","d) Chi nhánh công ty quản lý quỹ nước ngoài tại Việt Nam phải bảo đảm đáp ứng các điều kiện cấp phép theo quy định tại các điểm c, d và đ khoản 2 Điều 76 của Luật này.","2. Trong thời hạn 02 năm kể từ ngày Luật này có hiệu lực thi hành, công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam đã được cấp giấy phép trước ngày Luật này có hiệu lực thi hành mà đáp ứng quy định tại khoản 1 Điều này thì thực hiện đăng ký doanh nghiệp, đăng ký kinh doanh theo quy định tại Điều 71 của Luật này; không phải thực hiện thủ tục cấp đổi Giấy phép thành lập và hoạt động kinh doanh chứng khoán, trừ trường hợp có yêu cầu. Sau 02 năm kể từ ngày Luật này có hiệu lực thi hành, công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam đã được cấp giấy phép trước ngày Luật này có hiệu lực thi hành mà không đáp ứng quy định tại khoản 1 Điều này, Ủy ban Chứng khoán Nhà nước thực hiện đình chỉ hoạt động, thu hồi giấy phép theo quy định của Luật này.","3. Trừ trường hợp quy định tại khoản 1 và khoản 2 Điều này, tổ chức, cá nhân khác đã được Ủy ban Chứng khoán Nhà nước, Sở giao dịch chứng khoán, Trung tâm lưu ký chứng khoán cấp phép, chấp thuận trước ngày Luật này có hiệu lực thi hành thì không phải thực hiện thủ tục cấp phép, chấp thuận lại theo quy định của Luật này. Trường hợp tổ chức, cá nhân đã nộp hồ sơ đăng ký, đề nghị cấp phép, chấp thuận đến Ủy ban Chứng khoán Nhà nước, Sở giao dịch chứng khoán, Trung tâm lưu ký chứng khoán trước ngày Luật này có hiệu lực thi hành nhưng đến ngày Luật này có hiệu lực thi hành chưa được cấp phép hoặc chưa được chấp thuận thì phải thực hiện theo quy định của Luật này.","4. (được bãi bỏ)","5. (được bãi bỏ)","6. Trong thời hạn 02 năm kể từ ngày Luật này có hiệu lực thi hành, Sở giao dịch chứng khoán Việt Nam, Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam phải hoạt động theo quy định của Luật này. Các Sở giao dịch chứng khoán và Trung tâm lưu ký chứng khoán đã thành lập và hoạt động trước ngày Luật này có hiệu lực thi hành tiếp tục tổ chức và hoạt động theo quy định của Luật Chứng khoán số 70/2006/QH đã được sửa đổi, bổ sung một số điều theo Luật số 62/2010/QH cho đến khi Sở giao dịch chứng khoán Việt Nam, Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam hoạt động theo quy định của Luật này.","7. Chính phủ quy định chi tiết Điều này. VĂN PHÒNG QUỐC HỘI                         XÁC THỰC VĂN BẢN HỢP NHẤT Số: 24/VBHN-VPQH                        Hà Nội, ngày 26 tháng 02 năm 2025 CHỦ NHIỆM Lê Quang Tùng"],"sua_doi":true,"ghi_chu":["Khoản này được bãi bỏ theo quy định tại điểm a khoản 20 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025.","Khoản này được bãi bỏ theo quy định tại điểm a khoản 20 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025.","Điểm này được sửa đổi, bổ sung theo quy định tại điểm b khoản 6 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]}]}</script>

2020/TT-BTC","topic":"Công bố thông tin"},{"front":"TT 96: cổ đông lớn CBTT khi trở thành/không còn là cổ đông lớn hoặc thay đổi qua ngưỡng","back":"05 ngày làm việc; ngưỡng 5% và mỗi 1%","basis":"Khoản 1, 2 Điều 31 TT 96/2020/TT-BTC","topic":"Công bố thông tin"},{"front":"TT 98: quỹ mở – tần suất giao dịch tối thiểu; số tổ chức phát hành tối thiểu","back":"02 lần/tháng; ít nhất 06 tổ chức phát hành (trừ quỹ trái phiếu)","basis":"Khoản 1 Điều 30, điểm l khoản 4 Điều 35 TT 98/2020/TT-BTC","topic":"Quỹ đầu tư"},{"front":"TT 98: quỹ mở – đầu tư vào một tổ chức phát hành; tổng hạng mục đầu tư lớn","back":"≤ 20% tổng tài sản; ≤ 40% tổng tài sản (hạng mục lớn ≥ 5%)","basis":"Điểm c, e khoản 4 Điều 35 TT 98/2020 (điểm e sửa đổi bởi TT 136/2025)","topic":"Quỹ đầu tư"},{"front":"NĐ 158: vốn tối thiểu môi giới / tự doanh / tư vấn đầu tư CKPS (cả ba hoạt động)","back":"800 / 600 / 250 tỷ đồng (cả ba: 800 tỷ đồng)","basis":"Điểm b khoản 2 Điều 4 NĐ 158/2020/NĐ-CP","topic":"CK phái sinh"},{"front":"NĐ 158: vốn tối thiểu thành viên bù trừ trực tiếp / chung; tỷ lệ vốn khả dụng","back":"900 / 1.200 tỷ đồng; ≥ 260% liên tục 12 tháng","basis":"Điểm c, d khoản 2 Điều 9 NĐ 158/2020 (điểm d sửa đổi bởi NĐ 306/2025)","topic":"CK phái sinh"},{"front":"NĐ 156: phạt tiền tổ chức sử dụng thông tin nội bộ, thao túng; tước CCHN; đình chỉ CTCK","back":"10 lần khoản thu trái pháp luật, không thấp hơn 3 tỷ đồng (cá nhân: 1/2); 18–24 tháng; 01–03 tháng","basis":"Khoản 1 Điều 35, 36 NĐ 156/2020 (sửa đổi bởi khoản 29, 30 Điều 1 NĐ 128/2021/NĐ-CP); khoản 2 Điều 35, 36 NĐ 156/2020/NĐ-CP","topic":"Xử phạt vi phạm"},{"front":"Thi sát hạch CCHN 2026: thời gian làm bài môi giới / phân tích tài chính / quản lý quỹ","back":"120 / 150 / 180 phút (mỗi phần 60 / 75 / 90 phút)","basis":"Thông báo số 11 của Hội đồng thi sát hạch – UBCKNN (đợt III năm 2026)","topic":"Chứng chỉ hành nghề chứng khoán"},{"front":"Thi sát hạch CCHN từ 2026: điều kiện đạt; phúc khảo","back":"Đúng từ 60% câu hỏi trở lên ở mỗi phần (thi lại một phần: từ 60% phần thi lại); không phúc khảo bài thi trắc nghiệm trên máy tính","basis":"Thông báo số 01/TB-HĐTSH và số 09/TB-HĐTSH năm 2026 của Hội đồng thi sát hạch – UBCKNN","topic":"Chứng chỉ hành nghề chứng khoán"},{"front":"Chi phí dự thi sát hạch CCHN chứng khoán từ năm 2026","back":"1.000.000 đồng/thí sinh/loại chứng chỉ (thi mới và thi lại)","basis":"Mục 5.1 Thông báo số 01/TB-HĐTSH năm 2026 của Hội đồng thi sát hạch – UBCKNN","topic":"Chứng chỉ hành nghề chứng khoán"}]</script>
<script type="application/json" id="data-thay_doi">[{"title":"Công ty đại chúng: bổ sung điều kiện vốn chủ sở hữu","what":"Trước đây công ty cổ phần là công ty đại chúng khi có vốn điều lệ đã góp từ 30 tỷ đồng và tối thiểu 10% cổ phiếu có quyền biểu quyết do ít nhất 100 nhà đầu tư không phải cổ đông lớn nắm giữ; nay phải có thêm vốn chủ sở hữu từ 30 tỷ đồng trở lên (tiêu chí này áp dụng từ 01/01/2026). Công ty đại chúng niêm yết/đăng ký giao dịch trước 01/01/2021 mà đến 01/01/2026 không đáp ứng thì bị hủy tư cách công ty đại chúng, trừ khi ĐHĐCĐ đã quyết định hủy tư cách trước ngày này.","doc":"Luật 56/2024/QH15, điểm a khoản 11 Điều 1 (sửa điểm a khoản 1 Điều 32 Luật Chứng khoán); điểm d khoản 1 Điều 11 Luật 56/2024/QH15","effective":"01/01/2026"},{"title":"Hủy tư cách công ty đại chúng: thêm căn cứ, UBCKNN chủ động xem xét","what":"Trước đây chỉ hủy tư cách khi công ty không còn đáp ứng điều kiện vốn hoặc cơ cấu cổ đông sau 01 năm; nay bổ sung các trường hợp không công bố BCTC năm được kiểm toán hoặc nghị quyết ĐHĐCĐ thường niên 02 năm liên tục, hoặc trong 01 năm không đăng ký cổ phiếu tại VSDC/không niêm yết, đăng ký giao dịch. Nếu công ty không nộp hồ sơ, UBCKNN căn cứ danh sách cổ đông của VSDC hoặc BCTC kiểm toán để xem xét hủy.","doc":"Luật 56/2024/QH15, khoản 15 Điều 1 (sửa Điều 38 Luật Chứng khoán)","effective":"01/01/2025"},{"title":"Nhà đầu tư chứng khoán chuyên nghiệp: thêm NĐT nước ngoài, giới hạn cá nhân mua TPDN riêng lẻ","what":"Bổ sung nhà đầu tư nước ngoài (cá nhân quốc tịch nước ngoài, tổ chức thành lập theo pháp luật nước ngoài đầu tư kinh doanh tại Việt Nam) là nhà đầu tư chứng khoán chuyên nghiệp. Trước đây không phân biệt tổ chức/cá nhân khi mua TPDN riêng lẻ; từ 01/01/2026 NĐT chuyên nghiệp là cá nhân chỉ được mua, giao dịch TPDN riêng lẻ có xếp hạng tín nhiệm và có tài sản bảo đảm hoặc bảo lãnh thanh toán của tổ chức tín dụng.","doc":"Luật 56/2024/QH15, khoản 3 Điều 1 (bổ sung điểm e khoản 1, khoản 1a, 1b Điều 11) và khoản 9 Điều 1 (sửa Điều 31 Luật Chứng khoán)","effective":"01/01/2025"},{"title":"Định nghĩa 'thao túng thị trường chứng khoán'","what":"Trước đây khoản 3 Điều 12 mô tả gộp một số hành vi tạo cung cầu giả tạo, thao túng giá; nay khoản 49 Điều 4 định nghĩa thao túng thị trường gồm 06 nhóm hành vi (kể cả mua bán không chuyển quyền sở hữu thực sự, giao dịch chi phối lúc mở/đóng cửa, đưa ý kiến trên phương tiện thông tin đại chúng sau khi đã nắm vị thế) và khoản 3 Điều 12 cấm 'thực hiện hành vi thao túng thị trường chứng khoán'.","doc":"Luật 56/2024/QH15, khoản 1 và khoản 5 Điều 1 (bổ sung khoản 49 Điều 4, sửa khoản 3 Điều 12 Luật Chứng khoán)","effective":"01/01/2025"},{"title":"Đình chỉ, hủy bỏ chào bán riêng lẻ và hủy bỏ sau khi kết thúc chào bán","what":"Bổ sung Điều 31a, 31b: UBCKNN đình chỉ đợt chào bán riêng lẻ tối đa 60 ngày và hủy bỏ đợt chào bán, kể cả sau khi đã kết thúc; tương tự bổ sung căn cứ hủy bỏ sau khi kết thúc chào bán ra công chúng (Điều 28). Cổ phiếu đã được đưa vào niêm yết, đăng ký giao dịch thì không hủy bỏ đợt chào bán; khi bị hủy, tổ chức phát hành hoàn tiền trong 15 ngày.","doc":"Luật 56/2024/QH15, khoản 8 và khoản 10 Điều 1 (sửa Điều 28; bổ sung Điều 31a, 31b Luật Chứng khoán)","effective":"01/01/2025"},{"title":"Chào bán thêm để thực hiện dự án: miễn tỷ lệ 70% khi chào bán cho cổ đông hiện hữu","what":"Trước đây đợt chào bán thêm cổ phiếu ra công chúng để thực hiện dự án phải bán được tối thiểu 70% số cổ phiếu dự kiến chào bán trong mọi trường hợp; nay loại trừ trường hợp chào bán cho cổ đông hiện hữu theo tỷ lệ sở hữu. NĐ 245/2025 (hiệu lực 11/09/2025) sửa tương ứng điểm b khoản 2 Điều 12 NĐ 155/2020.","doc":"Luật 56/2024/QH15, điểm a khoản 6 Điều 1 (sửa điểm d khoản 2 Điều 15 Luật Chứng khoán); khoản 7 Điều 1 NĐ 245/2025/NĐ-CP","effective":"01/01/2025"},{"title":"Mua lại cổ phiếu ESOP không phải giảm vốn điều lệ","what":"Trước đây công ty mua lại cổ phiếu của người lao động theo quy chế phát hành cho người lao động phải làm thủ tục giảm vốn điều lệ trong 10 ngày kể từ ngày báo cáo ĐHĐCĐ thường niên; nay chỉ phải báo cáo tại ĐHĐCĐ thường niên gần nhất và không phải giảm vốn điều lệ.","doc":"Luật 56/2024/QH15, khoản 13 Điều 1 (sửa khoản 6 Điều 36 Luật Chứng khoán)","effective":"01/01/2025"},{"title":"Thi sát hạch và cấp CCHN: gộp thủ tục, nộp lý lịch tư pháp sau, thi lại trong 01 năm","what":"Trước đây thi sát hạch và cấp CCHN là hai thủ tục, hồ sơ cấp CCHN phải kèm Phiếu lý lịch tư pháp; nay hồ sơ cấp CCHN đồng thời là hồ sơ dự thi, Phiếu lý lịch tư pháp được nộp trong 20 ngày kể từ ngày công bố kết quả, bài thi gồm 02 phần (pháp luật, chuyên môn), kết quả công bố trong 15 ngày kể từ ngày kết thúc đợt thi và quyết định cấp CCHN (giấy hoặc điện tử) trong 30 ngày kể từ ngày công bố kết quả. Thí sinh chưa đạt một phần được thi lại phần đó trong 01 năm (hoặc tại kỳ thi gần nhất liền sau) và khi đăng ký thi lại không phải nộp lại bằng đại học, chứng chỉ chuyên môn; quá hạn phải thi lại cả hai phần.","doc":"NĐ 245/2025/NĐ-CP, khoản 73 Điều 1 (sửa khoản 5, 6; bổ sung khoản 5a Điều 213 NĐ 155/2020/NĐ-CP)","effective":"11/09/2025"},{"title":"Trái phiếu chào bán ra công chúng: bắt buộc xếp hạng tín nhiệm, trần hệ số nợ","what":"Luật 56/2024 (hiệu lực 01/01/2025) yêu cầu doanh nghiệp chào bán trái phiếu ra công chúng đáp ứng quy định của Chính phủ về đại diện người sở hữu trái phiếu, hệ số nợ, giá trị phát hành trên VCSH và xếp hạng tín nhiệm. NĐ 245/2025 cụ thể hóa: tổ chức phát hành hoặc trái phiếu phải được xếp hạng tín nhiệm (trừ trái phiếu của TCTD hoặc được bảo lãnh thanh toán toàn bộ gốc, lãi), phải có đại diện người sở hữu trái phiếu và nợ phải trả (kể cả trái phiếu dự kiến phát hành) không quá 05 lần vốn chủ sở hữu, trừ DNNN, DN phát hành cho dự án bất động sản, TCTD, DN bảo hiểm, CTCK, CTQLQ.","doc":"Luật 56/2024/QH15, điểm b khoản 6 Điều 1 (sửa điểm g khoản 3 Điều 15); NĐ 245/2025/NĐ-CP, khoản 8 Điều 1 (sửa Điều 19 NĐ 155/2020/NĐ-CP)","effective":"11/09/2025"},{"title":"Hủy niêm yết khi chậm đưa chứng khoán vào giao dịch: 90 ngày rút còn 30 ngày","what":"Trước đây cổ phiếu, chứng chỉ quỹ, cổ phiếu công ty đầu tư chứng khoán bị hủy niêm yết bắt buộc nếu không đưa vào giao dịch trong 90 ngày kể từ ngày SGDCK chấp thuận niêm yết; nay thời hạn này là 30 ngày.","doc":"NĐ 245/2025/NĐ-CP, khoản 47 Điều 1 (sửa điểm đ khoản 1, điểm d khoản 3 Điều 120 NĐ 155/2020/NĐ-CP)","effective":"11/09/2025"},{"title":"Chào mua công khai: rút ngắn thời hạn xử lý hồ sơ","what":"Trước đây UBCKNN thông báo đã nhận đầy đủ hồ sơ đăng ký chào mua công khai trong 15 ngày kể từ ngày nhận hồ sơ đầy đủ, hợp lệ; nay là 07 ngày làm việc kể từ ngày nhận hồ sơ hợp lệ.","doc":"NĐ 245/2025/NĐ-CP, khoản 32 Điều 1 (sửa khoản 3 Điều 86 NĐ 155/2020/NĐ-CP)","effective":"11/09/2025"},{"title":"CCHN điện tử, chứng chỉ chuyên môn và chứng chỉ tương đương","what":"Thông tư 135/2025 thay thế TT 197/2015: UBCKNN cấp CCHN điện tử khi hệ thống quản lý người hành nghề vận hành và ngừng cấp bản giấy; CCHN giấy phải chuyển đổi trong 01 năm kể từ ngày UBCKNN ban hành hướng dẫn, quá hạn không được ghi nhận trạng thái 'người hành nghề chứng khoán'. CIIA, CFA bậc II trở lên được coi tương đương cả chứng chỉ Quản lý quỹ và tài sản, Phái sinh; người có bằng cử nhân một số ngành được miễn khóa học nhưng vẫn phải kiểm tra trình độ.","doc":"Thông tư 135/2025/TT-BTC, Điều 3, 4, 5 và khoản 1 Điều 12","effective":"09/02/2026"},{"title":"Tập huấn kiến thức bắt buộc tối thiểu 08 giờ/năm","what":"Người hành nghề chứng khoán phải tham gia tập huấn kiến thức hằng năm (01/01–31/12) với thời lượng tối thiểu 08 giờ/năm, trực tiếp hoặc trực tuyến; không bắt buộc trong năm được cấp CCHN. Trước 31/01 hằng năm, UBCKNN công khai danh sách người không hoàn thành yêu cầu tập huấn của năm trước.","doc":"Thông tư 135/2025/TT-BTC, Điều 8, 10, 11 và khoản 3 Điều 12","effective":"01/01/2027"},{"title":"Xử phạt: đình chỉ giao dịch đến 24 tháng, mức phạt công bố thông tin theo tầng","what":"Hình thức phạt đình chỉ giao dịch chứng khoán có thời hạn từ 01 đến 24 tháng. Vi phạm về phương tiện, hình thức công bố thông tin bị phạt 30–50 triệu đồng; công bố thông tin chậm dưới 15 ngày phạt 50–70 triệu, từ 15 ngày trở lên phạt 70–100 triệu đồng.","doc":"NĐ 306/2025/NĐ-CP, khoản 2 và khoản 16 Điều 1 (sửa Điều 4 và Điều 42 NĐ 156/2020/NĐ-CP)","effective":"09/01/2026"},{"title":"An toàn tài chính CTCK: hệ số rủi ro mới","what":"Khoản tạm ứng còn dưới 90 ngày: trước đây hệ số 8% (đến 5% VCSH) và 100% (trên 5%), nay 8% (đến 2%), 50% (trên 2% đến dưới 5%), 100% (từ 5% VCSH). Hợp đồng đặt cọc mua bất động sản và khoản cho vay, phải thu khách hàng không thuộc trường hợp được liệt kê chịu hệ số rủi ro thanh toán 150%; điều chỉnh tăng rủi ro do đầu tư tập trung áp dụng cho chứng khoán, phần vốn góp của một tổ chức (trước đây: cổ phiếu và trái phiếu). Tổ chức có tỷ lệ vốn khả dụng dưới 180% do thay đổi cách tính có 06 tháng để khắc phục.","doc":"Thông tư 102/2025/TT-BTC, Điều 6, Điều 7, Điều 10 (sửa khoản 5 Điều 9, khoản 10 Điều 10 TT 91/2020/TT-BTC)","effective":"15/12/2025"},{"title":"Quỹ đầu tư: thêm quỹ thị trường tiền tệ và quỹ trái phiếu hạ tầng","what":"Bổ sung quỹ đầu tư công cụ thị trường tiền tệ (quỹ mở, từ 80% NAV vào tiền gửi, chứng chỉ tiền gửi, công cụ nợ Chính phủ, trái phiếu chính quyền địa phương, TPDN niêm yết/chào bán ra công chúng) và quỹ đầu tư trái phiếu hạ tầng (quỹ đóng, từ 65% NAV vào trái phiếu phát hành để phát triển hạ tầng, công cụ nợ Chính phủ, trái phiếu chính quyền địa phương, tiền gửi); quy định danh mục quỹ chỉ số. Quỹ thành viên không được dùng vốn, tài sản để góp vốn, mua cổ phần, trái phiếu của chính thành viên góp vốn.","doc":"Thông tư 136/2025/TT-BTC, Điều 1, 2, 11, 18, 19 (sửa, bổ sung TT 98/2020/TT-BTC)","effective":"12/02/2026"},{"title":"Giao dịch của nhà đầu tư nước ngoài qua tổ chức đại diện (tài khoản tổng)","what":"Tổ chức kinh doanh chứng khoán nước ngoài được dùng số tài khoản lưu ký của nhà đầu tư nước ngoài không cư trú để đặt lệnh thay tại CTCK theo hợp đồng; CTCK và CTQLQ nước ngoài được mở 02 tài khoản giao dịch tại mỗi CTCK (tự doanh và quản lý giao dịch của khách hàng). NĐT tổ chức nước ngoài vi phạm nghĩa vụ thanh toán khi mua không cần đủ tiền bị cấm đặt lệnh loại này 07 phiên; vi phạm lần thứ 3 trong 30 phiên bị cấm 180 phiên.","doc":"Thông tư 08/2026/TT-BTC, Điều 4, 6, 12 (sửa TT 120/2020/TT-BTC và TT 121/2020/TT-BTC)","effective":"03/02/2026"}]</script>

function pickLaw(n) {     // rải đều theo chủ đề
  const byTopic = {}; for (const q of shuffle(D.q.filter(q => q.subject === 'LU'))) (byTopic[q.topic] ||= []).push(q.id);
  const lists = shuffle(Object.values(byTopic)), out = [];
  while (out.length < n && lists.some(l => l.length)) for (const l of lists) { if (l.length && out.length < n) out.push(l.pop()); }
  return shuffle(out);
}
function pickSpec(cert, n) {
  const bp = Object.entries(CERTS[cert].blueprint), want = bp.map(([k, w]) => [k, Math.floor(w * n)]);
  let left = n - want.reduce((s, x) => s + x[1], 0);
  for (let i = 0; left > 0; i = (i + 1) % want.length, left--) want[i][1]++;
  const out = [], used = new Set();
  for (const [k, m] of want) for (const q of shuffle(D.q.filter(q => q.subject === k)).slice(0, m)) { out.push(q.id); used.add(q.id); }
  if (out.length < n) {      // môn nào thiếu câu thì bù bằng môn khác trong cùng chương trình
    const rest = shuffle(D.q.filter(q => CERTS[cert].blueprint[q.subject] && !used.has(q.id)));
    out.push(...rest.slice(0, n - out.length).map(q => q.id));
  }
  return shuffle(out);
}

  const parts = [];
  if (mode !== 'CM') parts.push(mkPart('LUAT', 'Phần 1 · Pháp luật', pickLaw(p.n), true, c.minutes));
  if (mode !== 'LUAT') parts.push(mkPart('CM', mode === 'both' ? 'Phần 2 · Chuyên môn' : 'Phần Chuyên môn', pickSpec(p.cert, p.n), true, c.minutes));
  if (parts.some(x => x.ids.length < p.n)) toast('Ngân hàng chưa đủ câu cho cấu hình này; đề sẽ ngắn hơn.');

  save(); go('lam-bai');
}

function explainHtml(q, chosen) {

}

  if (s.kind !== 'exam') $('#explain')?.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
function move(d) { const s = S.sess; s.i = Math.max(0, Math.min(part().ids.length - 1, s.i + d)); save(); VIEWS['lam-bai'](); }

}

}
function finishPart(auto) {

  // chấm

}

  $('#c-topic').onchange = e => { f.topic = e.target.value; f.i = 0; f.order = null; f.flip = false; VIEWS['the-nho'](); };
  $('#c-new').onchange = e => { f.onlyNew = e.target.checked; f.i = 0; f.order = null; f.flip = false; VIEWS['the-nho'](); };
  if (!c) return;
  const step = d => { f.i = Math.max(0, Math.min(list.length - 1, f.i + d)); f.flip = false; VIEWS['the-nho'](); };
  $('#c-card').onclick = () => { f.flip = !f.flip; VIEWS['the-nho'](); };
  $('#c-prev').onclick = () => step(-1); $('#c-next').onclick = () => step(1);
  const mark = ok => { S.cards[c.i] = { ok, at: now() }; save(); if (f.onlyNew && ok) { f.order = null; f.flip = false; VIEWS['the-nho'](); } else step(1); };
  $('#c-yes').onclick = () => mark(true); $('#c-no').onclick = () => mark(false);
};

const nf = (x, d = 2) => (isFinite(x) ? x.toLocaleString('vi-VN', { maximumFractionDigits: d }) : '—');
const fmtM = x => nf(Math.round(x), 0);
const fmtP = x => nf(x * 100, 3) + '%';          // x là số thập phân (0,08 → 8%)
const pc = x => nf(x, 3) + '%';                  // x đã ở dạng % (8 → 8%)
function bond(v) {
  const k = v.k, N = Math.round(v.T * k), y = v.y / 100 / k, C = v.F * v.c / 100 / k;
  let p = 0, w = 0; const flows = [];
  for (let t = 1; t <= N; t++) { const cf = C + (t === N ? v.F : 0), pv = cf / (1 + y) ** t; p += pv; w += t * pv; flows.push([t, cf, pv]); }
  const mac = w / p / k; return { p, mac, mod: mac / (1 + y), N, C, y, flows };
}
const ytmOf = v => { let lo = -0.99, hi = 5; for (let i = 0; i < 200; i++) { const mid = (lo + hi) / 2; bond({ ...v, y: mid * 100 }).p > v.P ? (lo = mid) : (hi = mid); } return (lo + hi) / 2; };

VIEWS['lich-su'] = () => {
  const ex = S.hist.filter(h => h.kind === 'exam').slice(0, 30).reverse();
  const W = 600, H = 120, pad = 20;
  const pts = key => ex.map((h, i) => { const p = h.parts.find(x => x.key === key); return p ? [pad + (ex.length > 1 ? i * (W - 2 * pad) / (ex.length - 1) : (W - 2 * pad) / 2), H - pad - (p.ok / Math.max(p.n, 1)) * (H - 2 * pad)] : null; }).filter(Boolean);
  const line = (key, color) => { const p = pts(key); return p.length ? `<polyline fill="none" stroke="var(--${color})" stroke-width="2.5" points="${p.map(x => x.join(',')).join(' ')}"/>` + p.map(([x, y]) => `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--${color})"/>`).join('') : ''; };
  const y60 = H - pad - .6 * (H - 2 * pad);
  main(page('Lịch sử & tiến độ', 'Kết quả các lần làm bài', `${S.hist.length} lượt đã lưu trên máy này.`,

        <line x1="${pad}" x2="${W - pad}" y1="${y60}" y2="${y60}" stroke="var(--ink)" stroke-dasharray="4 4" opacity=".5"/>${line('LUAT', 'accent')}${line('CM', 'ceil')}</svg></div>` : ''}

  $('#s-copy').onclick = () => copy('s-dump');
  $('#s-rep-copy').onclick = () => copy('s-rep');
  $('#s-file').onclick = () => { try { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([dump], { type: 'application/json' })); a.download = 'do-cchn-sao-luu.json'; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000); } catch { toast('Trình duyệt chặn tải file. Hãy dùng nút Sao chép.'); } };
  const restore = async text => {
    let d; try { d = JSON.parse(text); } catch { return toast('Mã sao lưu không hợp lệ: không đọc được JSON.'); }
    if (!d || d.app !== 'docchn' || typeof d.q !== 'object' || !Array.isArray(d.hist)) return toast('Mã sao lưu không đúng định dạng của Đỗ CCHN.');
    if (!(await confirmBox('Khôi phục tiến độ?', 'Tiến độ hiện tại trên máy này sẽ được thay bằng bản sao lưu.', 'Khôi phục'))) return;
    Object.assign(S, { q: d.q, star: d.star || {}, hist: d.hist, cards: d.cards || {}, reports: d.reports || [], sess: null, last: null }); save(); toast('Đã khôi phục tiến độ.'); go('tong-quan');
  };
  $('#s-restore').onclick = () => restore($('#s-in').value);
  $('#s-upload').onchange = e => { const f = e.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = () => restore(r.result); r.readAsText(f, 'utf-8'); };
  $('#s-reset').onclick = async () => { if (await confirmBox('Xóa toàn bộ tiến độ?', 'Thao tác này không hoàn tác được.', 'Xóa', 'danger')) { const keep = { theme: S.theme, prefs: S.prefs }; S = { ...blank(), ...keep }; save(); toast('Đã xóa tiến độ.'); go('tong-quan'); } };
};

      <div class="channels">${SOCIAL.map(([k, n, u, h]) => `<a href="${u}" target="_blank" rel="noopener"><svg viewBox="0 0 24 24" aria-hidden="true">${SOCIAL_IC[k]}</svg><span><b>${n}</b><small>${esc(h)}</small></span></a>`).join('')}</div></div>
    <div class="grid g2">

      <div class="card stack"><h2>Ứng dụng này có gì</h2>

        <p class="small">Thi thử đúng cấu trúc từng chứng chỉ: hai phần tính giờ riêng, đạt khi đúng từ 60% mỗi phần.</p>
        <p class="small">Ôn lặp lại câu sai theo lịch, thư viện Luật Chứng khoán hợp nhất, máy tính tài chính và thẻ ghi nhớ số liệu.</p></div>
      <div class="card stack"><h2>Dữ liệu của bạn</h2><p class="small">Ứng dụng không yêu cầu tài khoản và không gửi dữ liệu đi đâu. Tiến độ học lưu ngay trong trình duyệt của bạn; dùng mục Cài đặt để sao lưu khi đổi máy.</p></div>
      <div class="card stack"><h2>Lưu ý</h2><p class="small">BT-INVEST không phải cơ quan quản lý hay đơn vị tổ chức thi. Đây không phải trang chính thức của UBCKNN và không bảo đảm kết quả thi. Quy định chính thức xem tại trang của UBCKNN và SRTC.</p></div>
    </div>`));
  $('#ct-copy').onclick = async () => { try { await navigator.clipboard.writeText(BRAND.phone); toast('Đã sao chép số ' + BRAND.phoneShow); } catch { const r = document.createRange(); r.selectNodeContents($('#ct-num')); getSelection().removeAllRanges(); getSelection().addRange(r); toast('Đã chọn số, hãy nhấn sao chép.'); } };
};

// ---------- khởi động ----------
function applyTheme() { if (S.theme) document.documentElement.dataset.theme = S.theme; else delete document.documentElement.dataset.theme; }
document.addEventListener('keydown', e => {
  if (current !== 'lam-bai' || !S.sess || S.sess.waiting || $('#modal-root').children.length) return;
  if (['INPUT', 'TEXTAREA', 'SELECT'].includes(document.activeElement?.tagName)) return;
  const pt = part(), id = pt.ids[S.sess.i];
  if (/^[1-6]$/.test(e.key)) { const oi = pt.perm[id]?.[+e.key - 1]; if (oi !== undefined) choose(oi); }
  else if (e.key === 'ArrowRight') move(1);
  else if (e.key === 'ArrowLeft') move(-1);
  else if (e.key.toLowerCase() === 'f') { pt.flag[id] = !pt.flag[id]; save(); VIEWS['lam-bai'](); }
});
document.addEventListener('keydown', e => { if (current === 'the-nho' && e.key === ' ' && document.activeElement?.tagName !== 'SELECT') { e.preventDefault(); $('#c-card')?.click(); } });
$('#menu-btn').onclick = () => openNav(!$('#nav').classList.contains('open'));
window.addEventListener('hashchange', route);

(async function init() {
  applyTheme();
  const [q, law, cards, changes, docs] = await Promise.all([loadJSON('questions', []), loadJSON('luat_ck', null), loadJSON('so_lieu', []), loadJSON('thay_doi', []), loadJSON('van_ban', [])]);
  Object.assign(D, { q, law, cards, changes, docs }); D.byId = new Map(q.map(x => [x.id, x]));
  if (!q.length) { main(`<div class="page"><div class="card empty">Không tải được ngân hàng câu hỏi. Nếu bạn mở file trực tiếp trên máy, hãy dùng bản <b>dist/index.html</b> hoặc chạy qua máy chủ web.</div></div>`); renderNav(''); return; }
  if (S.sess && S.sess.parts?.some(p => p.ids.some(id => !D.byId.has(id)))) S.sess.parts.forEach(p => (p.ids = p.ids.filter(id => D.byId.has(id))));
  route();
  if ('serviceWorker' in navigator && location.protocol === 'https:' && document.querySelector('link[rel="manifest"]')) navigator.serviceWorker.register('sw.js').catch(() => {});
})();
})();

</script>
