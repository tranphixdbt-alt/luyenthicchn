ống giao dịch chứng khoán.","5. Việc kết nối giao dịch chứng khoán với Sở giao dịch chứng khoán nước ngoài do Thủ tướng Chính phủ quyết định theo đề nghị của Bộ trưởng Bộ Tài chính."],"sua_doi":false,"ghi_chu":[]},{"so":"51","ten":"Tham gia của nhà đầu tư nước ngoài, tổ chức kinh tế có vốn đầu tư nước ngoài trên thị trường chứng khoán Việt Nam","chuong":"Chương IV. THỊ TRƯỜNG GIAO DỊCH CHỨNG KHOÁN","doan":["1. Nhà đầu tư nước ngoài, tổ chức kinh tế có vốn đầu tư nước ngoài khi tham gia đầu tư, hoạt động trên thị trường chứng khoán Việt Nam tuân thủ quy định về tỷ lệ sở hữu nước ngoài, điều kiện, trình tự, thủ tục đầu tư theo quy định của pháp luật về chứng khoán và thị trường chứng khoán.","2. Chính phủ quy định chi tiết tỷ lệ sở hữu nước ngoài, điều kiện, trình tự, thủ tục đầu tư, việc tham gia của nhà đầu tư nước ngoài, tổ chức kinh tế có vốn đầu tư nước ngoài trên thị trường chứng khoán Việt Nam."],"sua_doi":false,"ghi_chu":[]},{"so":"52","ten":"Thành lập và hoạt động của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam","chuong":"Chương V. ĐĂNG KÝ, LƯU KÝ, BÙ TRỪ VÀ THANH TOÁN CHỨNG KHOÁN","doan":["1. Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam là doanh nghiệp được thành lập và hoạt động theo quy định của Luật này và Luật Doanh nghiệp, do Nhà nước nắm giữ trên 50% vốn điều lệ hoặc tổng số cổ phần có quyền biểu quyết.","2. Thủ tướng Chính phủ quyết định thành lập, giải thể, mô hình hoạt động, hình thức sở hữu, chức năng, quyền và nghĩa vụ của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam theo đề nghị của Bộ trưởng Bộ Tài chính.","3. Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam và công ty con chịu sự quản lý và giám sát của Ủy ban Chứng khoán Nhà nước."],"sua_doi":true,"ghi_chu":["Cụm từ “và công ty con” được bổ sung theo quy định tại điểm b khoản 20 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"53","ten":"Cơ cấu tổ chức quản lý của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam","chuong":"Chương V. ĐĂNG KÝ, LƯU KÝ, BÙ TRỪ VÀ THANH TOÁN CHỨNG KHOÁN","doan":["1. Thủ tướng Chính phủ quyết định cơ cấu tổ chức quản lý của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam theo quy định của Luật này, Luật Doanh nghiệp và quy định khác của pháp luật có liên quan.","2. Chủ tịch Hội đồng thành viên hoặc Chủ tịch Hội đồng quản trị, Tổng giám đốc (Giám đốc) Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam do Bộ trưởng Bộ Tài chính phê chuẩn hoặc bổ nhiệm, miễn nhiệm theo đề nghị của Hội đồng thành viên hoặc Hội đồng quản trị Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam và ý kiến của Chủ tịch Ủy ban Chứng khoán Nhà nước.","3. Quyền và nhiệm vụ của Hội đồng thành viên hoặc Hội đồng quản trị, Tổng giám đốc (Giám đốc), Ban kiểm soát (Kiểm soát viên) thực hiện theo quy định của pháp luật và Điều lệ Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam."],"sua_doi":false,"ghi_chu":[]},{"so":"54","ten":"Điều lệ Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam","chuong":"Chương V. ĐĂNG KÝ, LƯU KÝ, BÙ TRỪ VÀ THANH TOÁN CHỨNG KHOÁN","doan":["1. Điều lệ Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam được Bộ trưởng Bộ Tài chính phê chuẩn hoặc ban hành, sửa đổi, bổ sung theo đề nghị của Hội đồng thành viên hoặc Hội đồng quản trị Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam và ý kiến của Chủ tịch Ủy ban Chứng khoán Nhà nước.","2. Điều lệ Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam có các nội dung chính sau đây:","a) Tên, địa chỉ trụ sở chính, chi nhánh;","b) Mục tiêu, phạm vi hoạt động và các dịch vụ được cung cấp;","c) Vốn điều lệ; cách thức tăng, giảm vốn điều lệ hoặc chuyển nhượng vốn;","d) Tên, địa chỉ và các thông tin cơ bản của cổ đông sáng lập hoặc thành viên góp vốn hoặc chủ sở hữu;","đ) Phần vốn góp hoặc số cổ phần và giá trị vốn góp của cổ đông sáng lập hoặc thành viên góp vốn hoặc chủ sở hữu;","e) Người đại diện theo pháp luật;","g) Cơ cấu tổ chức quản lý;","h) Quyền và nghĩa vụ của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam;","i) Quyền và nghĩa vụ của thành viên góp vốn, chủ sở hữu hoặc cổ đông;","k) Quyền và nghĩa vụ của Hội đồng thành viên hoặc Hội đồng quản trị, Tổng giám đốc (Giám đốc) và Ban kiểm soát (Kiểm soát viên);","l) Thể thức thông qua quyết định của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam;","m) Thể thức sửa đổi, bổ sung Điều lệ;","n) Chế độ kế toán, kiểm toán được áp dụng;","o) Việc thành lập các quỹ, cơ chế sử dụng quỹ; nguyên tắc sử dụng lợi nhuận, xử lý lỗ và chế độ tài chính khác;","p) Nguyên tắc giải quyết tranh chấp nội bộ."],"sua_doi":false,"ghi_chu":[]},{"so":"55","ten":"Quyền và nghĩa vụ của Tổng công ty lưu ký và bù trừ chứng khoán","chuong":"Chương V. ĐĂNG KÝ, LƯU KÝ, BÙ TRỪ VÀ THANH TOÁN CHỨNG KHOÁN","doan":["Việt Nam","1. Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam có các quyền sau đây:","a) Ban hành các quy chế về đăng ký, lưu ký, bù trừ và thanh toán chứng khoán và các quy chế nghiệp vụ khác sau khi được Ủy ban Chứng khoán Nhà nước chấp thuận;","b) Cung cấp dịch vụ đăng ký, lưu ký, bù trừ và thanh toán chứng khoán; đăng ký biện pháp bảo đảm đối với chứng khoán đã đăng ký tập trung tại Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam theo yêu cầu của khách hàng; cung cấp dịch vụ khác quy định tại Điều lệ Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam;","c) Thực hiện cấp mã chứng khoán trong nước và mã số định danh chứng khoán quốc tế cho các loại chứng khoán đăng ký tập trung tại Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam;","d) Chấp thuận, thay đổi, hủy bỏ đăng ký chứng khoán tại Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam;","đ) Chấp thuận, hủy bỏ tư cách thành viên của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam; đình chỉ hoạt động lưu ký chứng khoán của thành viên lưu ký;","e) Được sử dụng các nguồn hỗ trợ thanh toán trong trường hợp thành viên của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam tạm thời mất khả năng thanh toán theo quy định của pháp luật;","g) Quyền khác theo quy định của pháp luật và Điều lệ Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam.","2. Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam có các nghĩa vụ sau đây:","a) Bảo đảm cơ sở vật chất, kỹ thuật phục vụ cho các hoạt động đăng ký, lưu ký, bù trừ và thanh toán chứng khoán;","b) Thực hiện chế độ kế toán, kiểm toán, thống kê, nghĩa vụ tài chính; báo cáo, công bố thông tin theo quy định của pháp luật;","c) Giám sát hoạt động đăng ký, lưu ký, bù trừ và thanh toán giao dịch chứng khoán; giám sát tỷ lệ sở hữu của nhà đầu tư nước ngoài theo quy định của pháp luật về chứng khoán và thị trường chứng khoán; giám sát việc tuân thủ nghĩa vụ của thành viên của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam;","d) Xây dựng quy trình hoạt động và quản lý rủi ro cho từng nghiệp vụ;","đ) Có biện pháp bảo vệ cơ sở dữ liệu và lưu giữ các chứng từ gốc về đăng ký, lưu ký, bù trừ và thanh toán chứng khoán theo quy định của pháp luật về kế toán, thống kê;","e) Cung cấp thông tin liên quan đến việc sở hữu chứng khoán của người sở hữu chứng khoán trong công ty đại chúng, tổ chức phát hành theo yêu cầu của công ty đại chúng, tổ chức phát hành đó và cơ quan có thẩm quyền theo quy định của pháp luật;","g) Có trách nhiệm bảo mật thông tin liên quan đến sở hữu của khách hàng; từ chối việc phong tỏa, cầm giữ, trích chuyển tài sản, trích lục, sao chép thông tin sở hữu chứng khoán của khách hàng mà không có sự đồng ý của khách hàng, trừ trường hợp theo yêu cầu của cơ quan có thẩm quyền hoặc yêu cầu cung cấp thông tin của kiểm toán viên thực hiện kiểm toán báo cáo tài chính của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam, báo cáo tài chính của thành viên lưu ký theo quy định của pháp luật;","h) Phối hợp thực hiện công tác tuyên truyền, phổ biến kiến thức về chứng khoán và thị trường chứng khoán cho nhà đầu tư;","i) Cung cấp thông tin và phối hợp với Sở giao dịch chứng khoán Việt Nam trong hoạt động nghiệp vụ chứng khoán và cơ quan có thẩm quyền trong công tác điều tra, phòng, chống vi phạm pháp luật về chứng khoán và thị trường chứng khoán;","k) Quản lý tách biệt tài sản của khách hàng, tài sản của khách hàng với tài sản của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam; quản lý tách biệt tài sản của các quỹ hỗ trợ thanh toán, quỹ bù trừ, quỹ phòng ngừa rủi ro nghiệp vụ theo quy định của pháp luật;","l) Bồi thường thiệt hại cho khách hàng trong trường hợp không thực hiện nghĩa vụ gây thiệt hại đến quyền, lợi ích hợp pháp của khách hàng, trừ trường hợp bất khả kháng;","m) Hoạt động vì lợi ích của người gửi chứng khoán, người sở hữu chứng khoán;","n) Nghĩa vụ khác theo quy định của pháp luật và Điều lệ Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam.","3. Cán bộ, nhân viên, người lao động của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam trong khi thực thi nhiệm vụ, quyền hạn của mình phải tuân thủ quy định của pháp luật về chứng khoán và thị trường chứng khoán, quy tắc đạo đức nghề nghiệp, quy định về bảo mật thông tin và quy định khác của pháp luật có liên quan.","4. Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam quyết định thành lập công ty con và tổ chức, phân công thực hiện một số quyền, nghĩa vụ của mình theo quy định của Luật này cho công ty con sau khi được Bộ Tài chính chấp thuận."],"sua_doi":true,"ghi_chu":["Khoản này được bổ sung theo quy định tại khoản 17 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"56","ten":"Thành viên của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam","chuong":"Chương V. ĐĂNG KÝ, LƯU KÝ, BÙ TRỪ VÀ THANH TOÁN CHỨNG KHOÁN","doan":["1. Thành viên của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam bao gồm:","a) Thành viên lưu ký là công ty chứng khoán, ngân hàng thương mại, chi nhánh ngân hàng nước ngoài được Ủy ban Chứng khoán Nhà nước cấp Giấy chứng nhận đăng ký hoạt động lưu ký chứng khoán và được Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam chấp thuận trở thành thành viên lưu ký;","b) Thành viên bù trừ là công ty chứng khoán, ngân hàng thương mại, chi nhánh ngân hàng nước ngoài được Ủy ban Chứng khoán Nhà nước cấp Giấy chứng nhận đủ điều kiện cung cấp dịch vụ bù trừ, thanh toán giao dịch chứng khoán và được Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam chấp thuận trở thành thành viên bù trừ.","2. Thành viên lưu ký có các quyền sau đây:","a) Cung cấp dịch vụ lưu ký và thanh toán giao dịch chứng khoán cho khách hàng;","b) Quyền khác theo quy định của pháp luật và quy chế của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam.","3. Thành viên lưu ký có các nghĩa vụ sau đây:","a) Tuân thủ nghĩa vụ quy định tại các điểm b, d, đ, g, h, i, l và m khoản 2 Điều 55 của Luật này;","b) Bảo đảm cơ sở vật chất, kỹ thuật phục vụ cho các hoạt động lưu ký và thanh toán chứng khoán;","c) Đóng góp quỹ hỗ trợ thanh toán theo quy định của pháp luật;","d) Quản lý tách biệt tài sản của khách hàng, tài sản của khách hàng với tài sản của thành viên lưu ký; ghi nhận chính xác, kịp thời tài sản, các quyền tài sản và các lợi ích có liên quan đến tài sản nhận lưu ký của khách hàng;","đ) Duy trì các điều kiện đăng ký hoạt động lưu ký chứng khoán;","e) Tuân thủ nghĩa vụ báo cáo và nghĩa vụ khác theo quy định của pháp luật và quy chế của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam.","4. Thành viên bù trừ có các quyền sau đây:","a) Thực hiện bù trừ, thanh toán giao dịch cho các chứng khoán giao dịch trên hệ thống giao dịch chứng khoán. Trường hợp thực hiện bù trừ, thanh toán giao dịch chứng khoán phái sinh, thành viên bù trừ là ngân hàng thương mại, chi nhánh ngân hàng nước ngoài chỉ được thực hiện bù trừ, thanh toán giao dịch cho chính thành viên bù trừ là ngân hàng thương mại, chi nhánh ngân hàng nước ngoài;","b) Yêu cầu nhà đầu tư đóng góp đầy đủ, kịp thời các khoản ký quỹ giao dịch; sử dụng tài sản ký quỹ của nhà đầu tư để thực hiện nghĩa vụ ký quỹ với Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam;","c) Thực hiện việc đóng vị thế, thanh lý vị thế bắt buộc đối với các vị thế mở của nhà đầu tư; sử dụng tài sản ký quỹ của nhà đầu tư để thực hiện các nghĩa vụ thanh toán đối với các vị thế mở của nhà đầu tư trong trường hợp nhà đầu tư mất khả năng thanh toán;","d) Quyền khác theo quy định của pháp luật và quy chế của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam.","5. Thành viên bù trừ có các nghĩa vụ sau đây:","a) Ký quỹ đầy đủ, kịp thời cho Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam; đóng góp vào quỹ bù trừ và trích lập quỹ phòng ngừa rủi ro nghiệp vụ theo quy định của pháp luật;","b) Thiết lập và duy trì hệ thống kiểm soát nội bộ, quản lý rủi ro trong từng nghiệp vụ; quản lý tách biệt tài sản, vị thế giao dịch của nhà đầu tư;","c) Nghĩa vụ khác theo quy định của pháp luật và quy chế của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam.","6. Chính phủ quy định chi tiết việc cung cấp dịch vụ bù trừ, thanh toán giao dịch chứng khoán của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam và thành viên của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam; điều kiện, hồ sơ, trình tự, thủ tục trở thành thành viên của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam."],"sua_doi":true,"ghi_chu":["Điểm này được sửa đổi, bổ sung theo quy định tại khoản 18 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025.","Điểm này được sửa đổi, bổ sung theo quy định tại khoản 18 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"57","ten":"Điều kiện đăng ký hoạt động lưu ký chứng khoán","chuong":"Chương V. ĐĂNG KÝ, LƯU KÝ, BÙ TRỪ VÀ THANH TOÁN CHỨNG KHOÁN","doan":["1. Ngân hàng thương mại, chi nhánh ngân hàng nước ngoài được đăng ký hoạt động lưu ký chứng khoán khi đáp ứng các điều kiện sau đây:","a) Có Giấy phép thành lập và hoạt động tại Việt Nam, trong đó có hoạt động lưu ký chứng khoán;","b) Đáp ứng tỷ lệ an toàn vốn tối thiểu theo quy định của pháp luật về ngân hàng, hoạt động kinh doanh có lãi trong năm gần nhất;","c) Có địa điểm, trang bị, thiết bị phục vụ hoạt động lưu ký, thanh toán giao dịch chứng khoán.","2. Công ty chứng khoán được đăng ký hoạt động lưu ký chứng khoán khi được cấp phép thực hiện nghiệp vụ môi giới chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"58","ten":"Hồ sơ đăng ký hoạt động lưu ký chứng khoán","chuong":"Chương V. ĐĂNG KÝ, LƯU KÝ, BÙ TRỪ VÀ THANH TOÁN CHỨNG KHOÁN","doan":["1. Hồ sơ cấp Giấy chứng nhận đăng ký hoạt động lưu ký chứng khoán cho ngân hàng thương mại, chi nhánh ngân hàng nước ngoài bao gồm:","a) Giấy đề nghị đăng ký hoạt động lưu ký chứng khoán;","b) Giấy phép thành lập và hoạt động;","c) Bản thuyết minh về cơ sở vật chất, kỹ thuật bảo đảm thực hiện hoạt động lưu ký, thanh toán giao dịch chứng khoán;","d) Tài liệu chứng minh đáp ứng điều kiện về tỷ lệ an toàn vốn tối thiểu theo quy định của pháp luật về ngân hàng;","đ) Báo cáo tài chính năm gần nhất đã được kiểm toán.","2. Hồ sơ cấp Giấy chứng nhận đăng ký hoạt động lưu ký chứng khoán cho công ty chứng khoán bao gồm các tài liệu quy định tại điểm a và điểm c khoản 1 Điều này."],"sua_doi":false,"ghi_chu":[]},{"so":"59","ten":"Thời hạn cấp Giấy chứng nhận đăng ký hoạt động lưu ký chứng khoán","chuong":"Chương V. ĐĂNG KÝ, LƯU KÝ, BÙ TRỪ VÀ THANH TOÁN CHỨNG KHOÁN","doan":["1. Trong thời hạn 15 ngày kể từ ngày nhận được hồ sơ đầy đủ và hợp lệ, Ủy ban Chứng khoán Nhà nước cấp Giấy chứng nhận đăng ký hoạt động lưu ký chứng khoán. Trường hợp từ chối, Ủy ban Chứng khoán Nhà nước phải trả lời bằng văn bản và nêu rõ lý do.","2. Trong thời hạn 12 tháng kể từ ngày được cấp Giấy chứng nhận đăng ký hoạt động lưu ký chứng khoán, công ty chứng khoán, ngân hàng thương mại, chi nhánh ngân hàng nước ngoài phải làm thủ tục đăng ký thành viên lưu ký tại Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam và tiến hành hoạt động lưu ký chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"60","ten":"Đình chỉ hoạt động lưu ký chứng khoán, thu hồi Giấy chứng nhận đăng ký hoạt động lưu ký chứng khoán","chuong":"Chương V. ĐĂNG KÝ, LƯU KÝ, BÙ TRỪ VÀ THANH TOÁN CHỨNG KHOÁN","doan":["1. Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam đình chỉ hoạt động lưu ký chứng khoán của thành viên lưu ký tối đa là 90 ngày trong các trường hợp sau đây:","a) Thường xuyên vi phạm nghĩa vụ của thành viên lưu ký theo quy định của Luật này và quy chế của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam;","b) Để xảy ra thiếu sót gây thiệt hại nghiêm trọng cho khách hàng.","2. Ủy ban Chứng khoán Nhà nước thu hồi Giấy chứng nhận đăng ký hoạt động lưu ký chứng khoán của công ty chứng khoán, ngân hàng thương mại, chi nhánh ngân hàng nước ngoài trong các trường hợp sau đây:","a) Hết thời hạn bị đình chỉ hoạt động lưu ký chứng khoán mà không khắc phục được các vi phạm, thiếu sót quy định tại khoản 1 Điều này;","b) Không tiến hành hoạt động lưu ký chứng khoán trong thời hạn 12 tháng kể từ ngày được cấp Giấy chứng nhận đăng ký hoạt động lưu ký chứng khoán;","c) Bị thu hồi Giấy phép thành lập và hoạt động;","d) Bị chấm dứt tồn tại, chuyển đổi loại hình doanh nghiệp theo quy định của Luật Doanh nghiệp;","đ) Tự nguyện chấm dứt hoạt động lưu ký chứng khoán sau khi được Ủy ban Chứng khoán Nhà nước chấp thuận;","e) Không đáp ứng các điều kiện đăng ký hoạt động lưu ký chứng khoán quy định tại Điều 57 của Luật này.","3. Khi bị thu hồi Giấy chứng nhận đăng ký hoạt động lưu ký chứng khoán, thành viên lưu ký phải làm thủ tục tất toán tài khoản lưu ký chứng khoán theo quy chế của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam."],"sua_doi":false,"ghi_chu":[]},{"so":"61","ten":"Đăng ký chứng khoán","chuong":"Chương V. ĐĂNG KÝ, LƯU KÝ, BÙ TRỪ VÀ THANH TOÁN CHỨNG KHOÁN","doan":["1. Chứng khoán của công ty đại chúng và chứng khoán của các tổ chức khác niêm yết, đăng ký giao dịch trên hệ thống giao dịch chứng khoán phải được đăng ký tập trung tại Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam.","2. Chứng khoán của tổ chức phát hành khác ủy quyền cho Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam làm đại lý chuyển nhượng được đăng ký tại Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam.","3. Công ty đại chúng, tổ chức phát hành theo quy định tại khoản 1 và khoản 2 Điều này thực hiện đăng ký thông tin về công ty đại chúng, tổ chức phát hành, chứng khoán của công ty đại chúng, tổ chức phát hành và người sở hữu chứng khoán với Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam.","4. Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam phải lập và lưu giữ Sổ đăng ký người sở hữu chứng khoán đối với các chứng khoán đã đăng ký tập trung tại Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam.","5. Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam thực hiện lập danh sách, tính toán và phân bổ quyền cho người sở hữu chứng khoán theo tỷ lệ do công ty đại chúng, tổ chức phát hành thông báo. Chỉ những người có tên trên Sổ đăng ký người sở hữu chứng khoán lập tại ngày đăng ký cuối cùng theo thông báo của công ty đại chúng, tổ chức phát hành mới được nhận các quyền phát sinh liên quan đến chứng khoán mà mình sở hữu."],"sua_doi":false,"ghi_chu":[]},{"so":"62","ten":"Lưu ký chứng khoán","chuong":"Chương V. ĐĂNG KÝ, LƯU KÝ, BÙ TRỪ VÀ THANH TOÁN CHỨNG KHOÁN","doan":["1. Chứng khoán của công ty đại chúng và chứng khoán của các tổ chức khác niêm yết, đăng ký giao dịch trên hệ thống giao dịch chứng khoán phải được lưu ký tập trung tại Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam trước khi thực hiện giao dịch, trừ trường hợp khác theo quy định của Bộ trưởng Bộ Tài chính.","2. Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam thực hiện quản lý chứng khoán riêng biệt cho từng thành viên lưu ký.","3. Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam thực hiện đăng ký biện pháp bảo đảm đối với chứng khoán đã đăng ký tập trung tại Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam theo quy định của Chính phủ.","4. Bộ trưởng Bộ Tài chính quy định chi tiết về hoạt động lưu ký chứng khoán, việc chuyển giao chứng khoán lưu ký để phát hành chứng chỉ lưu ký và niêm yết chứng khoán tại thị trường chứng khoán nước ngoài."],"sua_doi":false,"ghi_chu":[]},{"so":"63","ten":"Bù trừ và thanh toán giao dịch chứng khoán","chuong":"Chương V. ĐĂNG KÝ, LƯU KÝ, BÙ TRỪ VÀ THANH TOÁN CHỨNG KHOÁN","doan":["1. Hoạt động bù trừ, xác định nghĩa vụ thanh toán tiền và chứng khoán được thực hiện thông qua Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam hoặc công ty con của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam.","2. Thanh toán chứng khoán được thực hiện trên hệ thống tài khoản lưu ký tại Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam, thanh toán tiền giao dịch chứng khoán được thực hiện qua ngân hàng thanh toán và phải tuân thủ nguyên tắc chuyển giao chứng khoán đồng thời với thanh toán tiền.","3. Bộ trưởng Bộ Tài chính quy định các biện pháp xử lý trong trường hợp thành viên của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam tạm thời mất khả năng thanh toán giao dịch chứng khoán."],"sua_doi":true,"ghi_chu":["Khoản này được sửa đổi, bổ sung theo quy định tại khoản 19 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"64","ten":"Xác lập, chuyển quyền sở hữu và quyền khác đối với chứng khoán","chuong":"Chương V. ĐĂNG KÝ, LƯU KÝ, BÙ TRỪ VÀ THANH TOÁN CHỨNG KHOÁN","doan":["1. Việc xác lập, chuyển quyền sở hữu, quyền khác đối với chứng khoán đã đăng ký tập trung tại Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam thực hiện theo quy định của pháp luật về chứng khoán và thị trường chứng khoán.","2. Đối với chứng khoán đã được lưu ký tại Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam, việc chuyển quyền sở hữu chứng khoán có hiệu lực vào ngày thực hiện bút toán ghi sổ trên tài khoản lưu ký chứng khoán tại Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam.","3. Đối với chứng khoán quy định tại khoản 1 Điều 61 của Luật này nhưng chưa được lưu ký tại Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam, việc chuyển quyền sở hữu chứng khoán có hiệu lực vào ngày ghi Sổ đăng ký người sở hữu chứng khoán do Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam quản lý."],"sua_doi":false,"ghi_chu":[]},{"so":"65","ten":"Bảo vệ tài sản của khách hàng","chuong":"Chương V. ĐĂNG KÝ, LƯU KÝ, BÙ TRỪ VÀ THANH TOÁN CHỨNG KHOÁN","doan":["1. Chứng khoán và các tài sản khác của khách hàng do Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam hoặc thành viên của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam quản lý, tiền gửi thanh toán giao dịch chứng khoán của các thành viên lưu ký tại ngân hàng thanh toán là tài sản của chủ sở hữu, không phải là tài sản của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam hoặc của thành viên hoặc của ngân hàng thanh toán.","2. Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam, thành viên của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam, ngân hàng thanh toán không được sử dụng chứng khoán, các tài sản khác quy định tại khoản 1 Điều này để thanh toán các khoản nợ của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam hoặc của thành viên hoặc của ngân hàng thanh toán."],"sua_doi":false,"ghi_chu":[]},{"so":"66","ten":"Quỹ hỗ trợ thanh toán","chuong":"Chương V. ĐĂNG KÝ, LƯU KÝ, BÙ TRỪ VÀ THANH TOÁN CHỨNG KHOÁN","doan":["1. Quỹ hỗ trợ thanh toán được hình thành từ sự đóng góp của các thành viên lưu ký để thanh toán thay cho thành viên lưu ký trong trường hợp thành viên lưu ký tạm thời mất khả năng thanh toán giao dịch chứng khoán.","2. Quỹ hỗ trợ thanh toán do Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam quản lý và phải được tách biệt với tài sản của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam.","3. Hình thức đóng góp, mức đóng góp, phương thức quản lý và sử dụng quỹ hỗ trợ thanh toán thực hiện theo quy định của Bộ trưởng Bộ Tài chính."],"sua_doi":false,"ghi_chu":[]},{"so":"67","ten":"Quỹ bù trừ","chuong":"Chương V. ĐĂNG KÝ, LƯU KÝ, BÙ TRỪ VÀ THANH TOÁN CHỨNG KHOÁN","doan":["1. Quỹ bù trừ được hình thành từ sự đóng góp của các thành viên bù trừ với mục đích bồi thường thiệt hại và hoàn tất các giao dịch chứng khoán đứng tên thành viên bù trừ trong trường hợp thành viên bù trừ hoặc nhà đầu tư mất khả năng thanh toán.","2. Quỹ bù trừ do Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam quản lý và phải được tách biệt với tài sản của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam.","3. Hình thức đóng góp, mức đóng góp, phương thức quản lý và sử dụng quỹ bù trừ thực hiện theo quy định của Bộ trưởng Bộ Tài chính."],"sua_doi":false,"ghi_chu":[]},{"so":"68","ten":"Tạm ngừng, đình chỉ, khôi phục hoạt động đăng ký, lưu ký, bù trừ,","chuong":"Chương V. ĐĂNG KÝ, LƯU KÝ, BÙ TRỪ VÀ THANH TOÁN CHỨNG KHOÁN","doan":["thanh toán chứng khoán của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam và công ty con","1. Ủy ban Chứng khoán Nhà nước thực hiện tạm ngừng, đình chỉ một phần hoặc toàn bộ hoạt động đăng ký, lưu ký, bù trừ, thanh toán chứng khoán của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam và công ty con trong trường hợp sau đây:","a) Khi xảy ra chiến tranh, thảm họa tự nhiên, biến động lớn của nền kinh tế, sự cố hệ thống đăng ký, lưu ký, bù trừ, thanh toán chứng khoán hoặc các sự kiện bất khả kháng khác làm ảnh hưởng đến hoạt động đăng ký, lưu ký, bù trừ, thanh toán chứng khoán của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam và công ty con43;","b) Trong trường hợp cần thiết để bảo vệ quyền, lợi ích hợp pháp của nhà đầu tư và bảo đảm ổn định, an toàn của hệ thống đăng ký, lưu ký, bù trừ, thanh toán chứng khoán.","2. Ủy ban Chứng khoán Nhà nước thực hiện việc khôi phục một phần hoặc toàn bộ hoạt động đăng ký, lưu ký, bù trừ, thanh toán chứng khoán khi những nguyên nhân dẫn đến việc tạm ngừng, đình chỉ một phần hoặc toàn bộ hoạt động đăng ký, lưu ký, bù trừ, thanh toán chứng khoán của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam và công ty con được khắc phục."],"sua_doi":true,"ghi_chu":["Cụm từ “và công ty con” được bổ sung theo quy định tại điểm b khoản 20 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025.","Cụm từ “và công ty con” được bổ sung theo quy định tại điểm b khoản 20 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025.","Cụm từ “và công ty con” được bổ sung theo quy định tại điểm b khoản 20 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"69","ten":"Ngân hàng thanh toán","chuong":"Chương V. ĐĂNG KÝ, LƯU KÝ, BÙ TRỪ VÀ THANH TOÁN CHỨNG KHOÁN","doan":["1. Ngân hàng thanh toán là Ngân hàng Nhà nước Việt Nam hoặc ngân hàng thương mại thực hiện cung cấp dịch vụ thanh toán tiền cho các giao dịch chứng khoán trên hệ thống giao dịch chứng khoán.","2. Ngân hàng thương mại được Ủy ban Chứng khoán Nhà nước lựa chọn làm ngân hàng thanh toán khi đáp ứng các điều kiện sau đây:","a) Có Giấy phép thành lập và hoạt động tại Việt Nam theo quy định của pháp luật;","b) Có vốn điều lệ trên 10.000 tỷ đồng;","c) Hoạt động kinh doanh có lãi trong 02 năm gần nhất;","d) Đáp ứng tỷ lệ an toàn vốn tối thiểu theo quy định của pháp luật về ngân hàng;","đ) Có hệ thống cơ sở vật chất, kỹ thuật bảo đảm thực hiện thanh toán giao dịch và kết nối với hệ thống của Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam;","e) Có hệ thống thanh toán, bù trừ kết nối với hệ thống thanh toán, bù trừ của Ngân hàng Nhà nước Việt Nam;","g) Có hệ thống cơ sở vật chất, kỹ thuật để lưu giữ số liệu thông tin thanh toán giao dịch trong thời hạn ít nhất 10 năm và cung cấp được cho Ủy ban Chứng khoán Nhà nước hoặc Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam trong thời hạn 48 giờ khi có yêu cầu.","3. Ngân hàng thanh toán có các quyền và nghĩa vụ sau đây:","a) Tổ chức việc thanh toán cho hoạt động giao dịch chứng khoán trên hệ thống giao dịch chứng khoán tách biệt với hoạt động thanh toán khác của ngân hàng và theo quy định của pháp luật về chứng khoán và thị trường chứng khoán;","b) Tuân thủ chế độ báo cáo và nghĩa vụ khác theo quy định của pháp luật;","c) Ngân hàng thương mại được lựa chọn là ngân hàng thanh toán phải duy trì các điều kiện theo quy định tại khoản 2 Điều này.","4. Chính phủ quy định hồ sơ, trình tự, thủ tục đăng ký làm ngân hàng thanh toán. Mục 1 GIẤY PHÉP THÀNH LẬP VÀ HOẠT ĐỘNG KINH DOANH CHỨNG KHOÁN"],"sua_doi":false,"ghi_chu":[]},{"so":"70","ten":"Thẩm quyền cấp, cấp lại, điều chỉnh, thu hồi Giấy phép thành lập","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["và hoạt động kinh doanh chứng khoán Ủy ban Chứng khoán Nhà nước có thẩm quyền cấp, cấp lại, điều chỉnh, thu hồi Giấy phép thành lập và hoạt động kinh doanh chứng khoán cho công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam."],"sua_doi":false,"ghi_chu":[]},{"so":"71","ten":"Đăng ký doanh nghiệp, đăng ký kinh doanh","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Sau khi được cấp Giấy phép thành lập và hoạt động kinh doanh chứng khoán, công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán phải đăng ký doanh nghiệp theo quy định của Luật Doanh nghiệp, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam phải đăng ký kinh doanh tại Cơ quan đăng ký kinh doanh.","2. Công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán được tổ chức dưới hình thức công ty trách nhiệm hữu hạn hoặc công ty cổ phần theo quy định của Luật Doanh nghiệp.","3. Chính phủ quy định chi tiết Điều này."],"sua_doi":false,"ghi_chu":[]},{"so":"72","ten":"Nghiệp vụ kinh doanh của công ty chứng khoán","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Công ty chứng khoán được cấp phép thực hiện một, một số hoặc toàn bộ nghiệp vụ kinh doanh sau đây:","a) Môi giới chứng khoán;","b) Tự doanh chứng khoán;","c) Bảo lãnh phát hành chứng khoán;","d) Tư vấn đầu tư chứng khoán.","2. Công ty chứng khoán chỉ được cấp phép thực hiện nghiệp vụ tự doanh chứng khoán khi được cấp phép thực hiện nghiệp vụ môi giới chứng khoán.","3. Công ty chứng khoán chỉ được cấp phép thực hiện nghiệp vụ bảo lãnh phát hành chứng khoán khi được cấp phép thực hiện nghiệp vụ tự doanh chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"73","ten":"Nghiệp vụ kinh doanh của công ty quản lý quỹ đầu tư chứng khoán","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Công ty quản lý quỹ đầu tư chứng khoán được thực hiện các nghiệp vụ kinh doanh sau đây:","a) Quản lý quỹ đầu tư chứng khoán;","b) Quản lý danh mục đầu tư chứng khoán;","c) Tư vấn đầu tư chứng khoán.","2. Các nghiệp vụ kinh doanh quy định tại khoản 1 Điều này được cấp chung trong Giấy phép thành lập và hoạt động kinh doanh chứng khoán của công ty quản lý quỹ đầu tư chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"74","ten":"Điều kiện cấp Giấy phép thành lập và hoạt động kinh doanh chứng khoán của công ty chứng khoán","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Điều kiện về vốn bao gồm: việc góp vốn điều lệ vào công ty chứng khoán phải bằng Đồng Việt Nam; vốn điều lệ tối thiểu cho từng nghiệp vụ kinh doanh của công ty chứng khoán tại Việt Nam theo quy định của Chính phủ.","2. Điều kiện về cổ đông, thành viên góp vốn bao gồm:","a) Cổ đông, thành viên góp vốn là cá nhân không thuộc các trường hợp không được quyền thành lập và quản lý doanh nghiệp tại Việt Nam theo quy định của Luật Doanh nghiệp;","b) Cổ đông, thành viên góp vốn là tổ chức phải có tư cách pháp nhân và đang hoạt động hợp pháp; hoạt động kinh doanh có lãi trong 02 năm liền trước năm đề nghị cấp giấy phép; báo cáo tài chính năm gần nhất phải được kiểm toán với ý kiến chấp nhận toàn phần;","c) Cổ đông, thành viên góp vốn sở hữu từ 10% trở lên vốn điều lệ của 01 công ty chứng khoán và người có liên quan của cổ đông, thành viên góp vốn đó (nếu có) không sở hữu trên 5% vốn điều lệ của 01 công ty chứng khoán khác;","d) Cổ đông, thành viên góp vốn là nhà đầu tư nước ngoài phải đáp ứng điều kiện quy định tại Điều 77 của Luật này.","3. Điều kiện về cơ cấu cổ đông, thành viên góp vốn bao gồm:","a) Có tối thiểu 02 cổ đông sáng lập, thành viên góp vốn là tổ chức. Trường hợp công ty chứng khoán được tổ chức dưới hình thức công ty trách nhiệm hữu hạn một thành viên, chủ sở hữu phải là doanh nghiệp bảo hiểm hoặc ngân hàng thương mại hoặc tổ chức nước ngoài đáp ứng quy định tại khoản 2 Điều 77 của Luật này;","b) Tổng tỷ lệ vốn góp của các tổ chức tối thiểu là 65% vốn điều lệ, trong đó các tổ chức là doanh nghiệp bảo hiểm, ngân hàng thương mại sở hữu tối thiểu là 30% vốn điều lệ.","4. Điều kiện về cơ sở vật chất bao gồm:","a) Có trụ sở làm việc bảo đảm cho hoạt động kinh doanh chứng khoán;","b) Có đủ cơ sở vật chất, kỹ thuật, trang bị, thiết bị văn phòng, hệ thống công nghệ phù hợp với quy trình nghiệp vụ về hoạt động kinh doanh chứng khoán.","5. Điều kiện về nhân sự bao gồm: Có Tổng giám đốc (Giám đốc), tối thiểu 03 nhân viên có chứng chỉ hành nghề chứng khoán phù hợp cho mỗi nghiệp vụ kinh doanh chứng khoán đề nghị cấp phép và tối thiểu 01 nhân viên kiểm soát tuân thủ. Tổng giám đốc (Giám đốc) phải đáp ứng các tiêu chuẩn sau đây:","a) Không thuộc trường hợp đang bị truy cứu trách nhiệm hình sự hoặc chấp hành án phạt tù hoặc bị cấm hành nghề chứng khoán theo quy định của pháp luật;","b) Có tối thiểu 02 năm kinh nghiệm làm việc tại bộ phận nghiệp vụ của các tổ chức trong lĩnh vực tài chính, chứng khoán, ngân hàng, bảo hiểm hoặc tại bộ phận tài chính, kế toán, đầu tư trong các doanh nghiệp khác;","c) Có chứng chỉ hành nghề phân tích tài chính hoặc chứng chỉ hành nghề quản lý quỹ;","d) Không bị xử phạt vi phạm hành chính trong lĩnh vực chứng khoán và thị trường chứng khoán trong thời hạn 06 tháng gần nhất tính đến thời điểm nộp hồ sơ. Trường hợp có Phó Tổng giám đốc (Phó Giám đốc) phụ trách nghiệp vụ thì phải đáp ứng các tiêu chuẩn quy định tại các điểm a, b và d khoản này và có chứng chỉ hành nghề chứng khoán phù hợp với nghiệp vụ phụ trách.","6. Dự thảo Điều lệ phù hợp với quy định tại khoản 1 Điều 80 của Luật này."],"sua_doi":false,"ghi_chu":[]},{"so":"75","ten":"Điều kiện cấp Giấy phép thành lập và hoạt động kinh doanh chứng khoán của công ty quản lý quỹ đầu tư chứng khoán","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Điều kiện về vốn bao gồm: việc góp vốn điều lệ vào công ty quản lý quỹ đầu tư chứng khoán phải bằng Đồng Việt Nam; vốn điều lệ tối thiểu để được cấp Giấy phép thành lập và hoạt động kinh doanh chứng khoán của công ty quản lý quỹ đầu tư chứng khoán tại Việt Nam theo quy định của Chính phủ.","2. Điều kiện về cổ đông, thành viên góp vốn bao gồm:","a) Cổ đông, thành viên góp vốn đáp ứng điều kiện quy định tại điểm a và điểm b khoản 2 Điều 74 của Luật này;","b) Cổ đông, thành viên góp vốn là nhà đầu tư nước ngoài đáp ứng điều kiện quy định tại Điều 77 của Luật này;","c) Cổ đông, thành viên góp vốn sở hữu từ 10% trở lên vốn điều lệ của 01 công ty quản lý quỹ đầu tư chứng khoán và người có liên quan của cổ đông, thành viên góp vốn đó (nếu có) không sở hữu trên 5% vốn điều lệ của 01 công ty quản lý quỹ đầu tư chứng khoán khác.","3. Điều kiện về cơ cấu cổ đông, thành viên góp vốn bao gồm:","a) Có tối thiểu 02 cổ đông sáng lập, thành viên góp vốn là tổ chức. Trường hợp công ty quản lý quỹ đầu tư chứng khoán được tổ chức dưới hình thức công ty trách nhiệm hữu hạn một thành viên, chủ sở hữu phải là ngân hàng thương mại hoặc doanh nghiệp bảo hiểm hoặc công ty chứng khoán hoặc tổ chức nước ngoài đáp ứng quy định tại khoản 2 Điều 77 của Luật này;","b) Tổng tỷ lệ vốn góp của các tổ chức tối thiểu là 65% vốn điều lệ, trong đó các tổ chức là ngân hàng thương mại, doanh nghiệp bảo hiểm, công ty chứng khoán sở hữu tối thiểu là 30% vốn điều lệ.","4. Điều kiện về cơ sở vật chất bao gồm:","a) Có trụ sở làm việc bảo đảm cho hoạt động kinh doanh chứng khoán;","b) Có đủ cơ sở vật chất, kỹ thuật, trang bị, thiết bị văn phòng, hệ thống công nghệ phù hợp với quy trình nghiệp vụ về hoạt động kinh doanh chứng khoán.","5. Điều kiện về nhân sự bao gồm: Có Tổng giám đốc (Giám đốc), tối thiểu 05 nhân viên có chứng chỉ hành nghề quản lý quỹ và tối thiểu 01 nhân viên kiểm soát tuân thủ. Tổng giám đốc (Giám đốc) phải đáp ứng các tiêu chuẩn sau đây:","a) Không thuộc trường hợp đang bị truy cứu trách nhiệm hình sự hoặc chấp hành án phạt tù hoặc bị cấm hành nghề chứng khoán theo quy định của pháp luật;","b) Có tối thiểu 04 năm kinh nghiệm tại bộ phận nghiệp vụ của các tổ chức hoạt động trong lĩnh vực tài chính, chứng khoán, ngân hàng, bảo hiểm hoặc tại bộ phận tài chính, kế toán, đầu tư trong các doanh nghiệp khác;","c) Có chứng chỉ hành nghề quản lý quỹ hoặc chứng chỉ tương đương theo quy định của Chính phủ;","d) Không bị xử phạt vi phạm hành chính trong lĩnh vực chứng khoán và thị trường chứng khoán trong thời hạn 06 tháng gần nhất tính đến thời điểm nộp hồ sơ. Trường hợp có Phó Tổng giám đốc (Phó Giám đốc) phụ trách nghiệp vụ thì phải đáp ứng các tiêu chuẩn quy định tại các điểm a, b và d khoản này và có chứng chỉ hành nghề chứng khoán phù hợp với nghiệp vụ phụ trách.","6. Dự thảo Điều lệ phù hợp với quy định tại khoản 1 Điều 80 của Luật này."],"sua_doi":false,"ghi_chu":[]},{"so":"76","ten":"Điều kiện cấp Giấy phép thành lập và hoạt động kinh doanh chứng khoán của chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Công ty chứng khoán nước ngoài được thành lập chi nhánh tại Việt Nam khi đáp ứng các điều kiện sau đây:","a) Đáp ứng quy định tại khoản 2 Điều 77 của Luật này và chưa thành lập, tham gia góp vốn vào công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán tại Việt Nam do công ty chứng khoán nước ngoài sở hữu trên 49% vốn điều lệ;","b) Vốn cấp cho chi nhánh tại Việt Nam đáp ứng quy định tại khoản 1 Điều 74 của Luật này;","c) Bảo đảm điều kiện về cơ sở vật chất và nhân sự quy định tại khoản 4 và khoản 5 Điều 74 của Luật này đối với chi nhánh dự kiến thành lập tại Việt Nam.","2. Công ty quản lý quỹ nước ngoài được thành lập chi nhánh tại Việt Nam khi đáp ứng các điều kiện sau đây:","a) Được cơ quan quản lý, giám sát trong lĩnh vực chứng khoán ở nước nguyên xứ cấp phép hoạt động quản lý quỹ đại chúng và được chấp thuận thành lập chi nhánh tại Việt Nam;","b) Cơ quan cấp phép của nước nguyên xứ và Ủy ban Chứng khoán Nhà nước đã ký kết thỏa thuận hợp tác song phương hoặc đa phương về trao đổi thông tin, hợp tác quản lý, thanh tra, giám sát hoạt động về chứng khoán và thị trường chứng khoán; thời hạn hoạt động còn lại (nếu có) tối thiểu là 05 năm;","c) Không phải là cổ đông, thành viên góp vốn hoặc cùng với người có liên quan sở hữu trực tiếp hoặc gián tiếp thông qua ủy quyền, ủy thác đầu tư sở hữu trên 5% vốn điều lệ của 01 công ty quản lý quỹ đầu tư chứng khoán tại Việt Nam;","d) Vốn cấp cho chi nhánh tại Việt Nam đáp ứng quy định tại khoản 1 Điều 75 của Luật này;","đ) Bảo đảm điều kiện về cơ sở vật chất và nhân sự quy định tại khoản 4 và khoản 5 Điều 75 của Luật này đối với chi nhánh dự kiến thành lập tại Việt Nam;","e) Đáp ứng quy định tại điểm c khoản 2 Điều 77 của Luật này.","3. Công ty chứng khoán, công ty quản lý quỹ nước ngoài chỉ được lập 01 chi nhánh tại Việt Nam."],"sua_doi":false,"ghi_chu":[]},{"so":"77","ten":"Tham gia của nhà đầu tư nước ngoài trong công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Nhà đầu tư nước ngoài được tham gia góp vốn thành lập, mua cổ phần, phần vốn góp của công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán theo nguyên tắc sau đây:","a) Nhà đầu tư nước ngoài là tổ chức đáp ứng điều kiện quy định tại khoản 2 Điều này và người có liên quan được sở hữu đến 100% vốn điều lệ của công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán. Trường hợp không đáp ứng quy định tại khoản 2 Điều này, nhà đầu tư nước ngoài là tổ chức và người có liên quan chỉ được sở hữu đến 49% vốn điều lệ của công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán;","b) Nhà đầu tư nước ngoài là cá nhân và người có liên quan chỉ được sở hữu đến 49% vốn điều lệ của công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán;","c) Tuân thủ quy định tại điểm c khoản 2 Điều 74 và điểm c khoản 2 Điều 75 của Luật này.","2. Tổ chức nước ngoài tham gia góp vốn thành lập, mua cổ phần, phần vốn góp để sở hữu 100% vốn điều lệ của công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán phải đáp ứng các điều kiện sau đây:","a) Được cấp phép và có thời gian hoạt động liên tục trong lĩnh vực ngân hàng, chứng khoán, bảo hiểm trong thời hạn 02 năm liền trước năm tham gia góp vốn thành lập, mua cổ phần, phần vốn góp;","b) Cơ quan cấp phép của nước nguyên xứ và Ủy ban Chứng khoán Nhà nước đã ký kết thỏa thuận hợp tác song phương hoặc đa phương về trao đổi thông tin, hợp tác quản lý, thanh tra, giám sát hoạt động về chứng khoán và thị trường chứng khoán;","c) Hoạt động kinh doanh có lãi trong 02 năm liền trước năm tham gia góp vốn thành lập, mua cổ phần, phần vốn góp và báo cáo tài chính năm gần nhất phải được kiểm toán với ý kiến chấp nhận toàn phần.","3. Công ty chứng khoán, công ty quản lý quỹ nước ngoài được thành lập chi nhánh, văn phòng đại diện theo quy định tại Điều 76 và Điều 78 của Luật này."],"sua_doi":false,"ghi_chu":[]},{"so":"78","ten":"Văn phòng đại diện công ty chứng khoán, công ty quản lý quỹ nước ngoài tại Việt Nam","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Công ty chứng khoán, công ty quản lý quỹ nước ngoài được lập văn phòng đại diện tại Việt Nam khi đáp ứng các điều kiện sau đây:","a) Được cấp phép và đang hoạt động hợp pháp tại nước nguyên xứ;","b) Cơ quan cấp phép của nước nguyên xứ và Ủy ban Chứng khoán Nhà nước đã ký kết thỏa thuận hợp tác song phương hoặc đa phương về trao đổi thông tin, hợp tác quản lý, thanh tra, giám sát hoạt động về chứng khoán và thị trường chứng khoán hoặc công ty chứng khoán, công ty quản lý quỹ nước ngoài đang quản lý các quỹ đang đầu tư tại Việt Nam; thời hạn hoạt động còn lại (nếu có) tối thiểu là 01 năm.","2. Phạm vi hoạt động của văn phòng đại diện công ty chứng khoán, công ty quản lý quỹ nước ngoài tại Việt Nam bao gồm một, một số hoặc toàn bộ nội dung sau đây:","a) Thực hiện chức năng văn phòng liên lạc và nghiên cứu thị trường;","b) Xúc tiến xây dựng các dự án hợp tác trong lĩnh vực chứng khoán và thị trường chứng khoán tại Việt Nam;","c) Thúc đẩy, giám sát thực hiện các hợp đồng thỏa thuận đã ký kết giữa công ty chứng khoán, công ty quản lý quỹ nước ngoài với các tổ chức kinh tế của Việt Nam;","d) Thúc đẩy, giám sát thực hiện các dự án do công ty chứng khoán, công ty quản lý quỹ nước ngoài tài trợ tại Việt Nam.","3. Văn phòng đại diện công ty chứng khoán, công ty quản lý quỹ nước ngoài tại Việt Nam không được thực hiện các hoạt động kinh doanh chứng khoán.","4. Ủy ban Chứng khoán Nhà nước cấp Giấy chứng nhận đăng ký hoạt động; quản lý, giám sát hoạt động của văn phòng đại diện công ty chứng khoán, công ty quản lý quỹ nước ngoài tại Việt Nam."],"sua_doi":false,"ghi_chu":[]},{"so":"79","ten":"Hồ sơ, thủ tục cấp, cấp lại, điều chỉnh, thu hồi Giấy phép thành lập và hoạt động kinh doanh chứng khoán, Giấy chứng nhận đăng ký hoạt động","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Chính phủ quy định hồ sơ, thủ tục cấp, cấp lại, điều chỉnh, thu hồi Giấy phép thành lập và hoạt động kinh doanh chứng khoán của công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam, Giấy chứng nhận đăng ký hoạt động của văn phòng đại diện công ty chứng khoán, công ty quản lý quỹ nước ngoài tại Việt Nam.","2. Trong thời hạn 30 ngày kể từ ngày nhận được hồ sơ đầy đủ và hợp lệ, Ủy ban Chứng khoán Nhà nước cấp hoặc từ chối cấp Giấy phép thành lập và hoạt động kinh doanh chứng khoán, Giấy chứng nhận đăng ký hoạt động. Trường hợp từ chối, Ủy ban Chứng khoán Nhà nước phải trả lời bằng văn bản và nêu rõ lý do."],"sua_doi":false,"ghi_chu":[]},{"so":"80","ten":"Điều lệ công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Điều lệ công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán không được trái với quy định của Luật này và Luật Doanh nghiệp.","2. Công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán phải đăng tải toàn bộ Điều lệ trên trang thông tin điện tử chính thức của công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"81","ten":"Nội dung Giấy phép thành lập và hoạt động kinh doanh chứng khoán","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Giấy phép thành lập và hoạt động kinh doanh chứng khoán của công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán bao gồm các nội dung sau đây:","a) Tên công ty;","b) Địa chỉ trụ sở chính;","c) Nghiệp vụ kinh doanh;","d) Vốn điều lệ;","đ) Người đại diện theo pháp luật.","2. Giấy phép thành lập và hoạt động kinh doanh chứng khoán của chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam bao gồm các nội dung sau đây:","a) Tên chi nhánh, địa chỉ chi nhánh, nghiệp vụ kinh doanh của chi nhánh;","b) Tên công ty mẹ;","c) Địa chỉ trụ sở chính của công ty mẹ;","d) Vốn cấp cho chi nhánh;","đ) Giám đốc chi nhánh.","3. Các thay đổi liên quan đến Giấy phép thành lập và hoạt động kinh doanh chứng khoán quy định tại khoản 1 và khoản 2 Điều này phải được Ủy ban Chứng khoán Nhà nước chấp thuận trước khi thay đổi.","4. Trong thời hạn 10 ngày kể từ ngày Ủy ban Chứng khoán Nhà nước chấp thuận các thay đổi theo quy định tại khoản 3 Điều này, công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam thực hiện đăng ký, thông báo thay đổi có liên quan đến Cơ quan đăng ký kinh doanh theo quy định của pháp luật về doanh nghiệp."],"sua_doi":false,"ghi_chu":[]},{"so":"82","ten":"Tên của công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Tên của công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán phải tuân thủ quy định của Luật Doanh nghiệp và quy định tại khoản 2, khoản 3 Điều này.","2. Tên của công ty chứng khoán bao gồm các thành tố theo thứ tự sau đây:","a) Loại hình doanh nghiệp;","b) Cụm từ “chứng khoán”;","c) Tên riêng.","3. Tên của công ty quản lý quỹ đầu tư chứng khoán bao gồm các thành tố theo thứ tự sau đây:","a) Loại hình doanh nghiệp;","b) Cụm từ “quản lý quỹ”;","c) Tên riêng.","4. Tổ chức không phải là công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán không được phép sử dụng cụm từ “chứng khoán”, “quản lý quỹ” trong tên của tổ chức; không được sử dụng các cụm từ, thuật ngữ khác trong tên của tổ chức nếu việc sử dụng cụm từ, thuật ngữ đó có thể gây nhầm lẫn cho khách hàng về việc tổ chức đó là công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"83","ten":"Công bố thông tin hoạt động","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["Công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh, văn phòng đại diện công ty chứng khoán, công ty quản lý quỹ nước ngoài tại Việt Nam phải công bố thông tin hoạt động trên phương tiện công bố thông tin của Ủy ban Chứng khoán Nhà nước và 01 tờ báo điện tử hoặc báo in trong 03 số liên tiếp ít nhất 30 ngày trước ngày dự kiến chính thức hoạt động. Thông tin bao gồm:","1. Giấy phép thành lập và hoạt động kinh doanh chứng khoán hoặc Giấy chứng nhận đăng ký hoạt động do Ủy ban Chứng khoán Nhà nước cấp;","2. Ngày chính thức hoạt động."],"sua_doi":false,"ghi_chu":[]},{"so":"84","ten":"Ngày chính thức hoạt động","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh, văn phòng đại diện công ty chứng khoán, công ty quản lý quỹ nước ngoài tại Việt Nam phải chính thức hoạt động trong thời hạn 12 tháng kể từ ngày được cấp phép.","2. Công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam không được tiến hành hoạt động kinh doanh chứng khoán trước ngày chính thức hoạt động.","3. Công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán được chính thức hoạt động sau khi đáp ứng các quy định sau đây:","a) Thực hiện đăng ký doanh nghiệp theo quy định tại Điều 71 của Luật này;","b) Có quy trình hoạt động, quản lý rủi ro, kiểm soát nội bộ;","c) Điều lệ đã được Đại hội đồng cổ đông, Hội đồng thành viên hoặc chủ sở hữu công ty thông qua.","4. Chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam được chính thức hoạt động sau khi đáp ứng quy định tại điểm a và điểm b khoản 3 Điều này.","5. Công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam được cấp giấy phép phải thông báo cho Ủy ban Chứng khoán Nhà nước về việc đáp ứng quy định tại khoản 3 và khoản 4 Điều này ít nhất là 15 ngày trước ngày chính thức hoạt động. Ủy ban Chứng khoán Nhà nước đình chỉ việc chính thức hoạt động khi công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam không đáp ứng quy định tại khoản 3 và khoản 4 Điều này. Mục 2 HOẠT ĐỘNG CỦA CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN"],"sua_doi":false,"ghi_chu":[]},{"so":"85","ten":"Duy trì các điều kiện cấp Giấy phép thành lập và hoạt động kinh doanh chứng khoán","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Việc duy trì các điều kiện cấp Giấy phép thành lập và hoạt động kinh doanh chứng khoán được thực hiện theo quy định sau đây:","a) Công ty chứng khoán phải duy trì và tuân thủ các điều kiện cấp giấy phép theo quy định tại khoản 1, điểm c và điểm d khoản 2, khoản 4 và khoản 5 Điều 74 của Luật này;","b) Chi nhánh công ty chứng khoán nước ngoài tại Việt Nam phải duy trì và tuân thủ các điều kiện cấp giấy phép theo quy định tại điểm b và điểm c khoản 1 Điều 76 của Luật này;","c) Công ty quản lý quỹ đầu tư chứng khoán phải duy trì và tuân thủ các điều kiện cấp giấy phép theo quy định tại khoản 1, điểm b và điểm c khoản 2, khoản 4 và khoản 5 Điều 75 của Luật này;","d) Chi nhánh công ty quản lý quỹ nước ngoài tại Việt Nam phải duy trì và tuân thủ các điều kiện cấp giấy phép theo quy định tại các điểm c, d và đ khoản 2 Điều 76 của Luật này.","2. Trong thời hạn 30 ngày kể từ ngày không đáp ứng điều kiện quy định tại khoản 1 Điều này hoặc vốn chủ sở hữu thấp hơn vốn điều lệ tối thiểu, Hội đồng quản trị, Hội đồng thành viên hoặc chủ sở hữu công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam phải thông qua phương án khắc phục và báo cáo Ủy ban Chứng khoán Nhà nước. Thời gian thực hiện phương án khắc phục tối đa là 06 tháng đối với điều kiện về vốn chủ sở hữu, tối đa là 03 tháng đối với các điều kiện khác kể từ ngày không đáp ứng điều kiện.","3. Trong thời gian thực hiện phương án khắc phục, công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam phải thực hiện các biện pháp hạn chế hoạt động sau đây:","a) Công ty chứng khoán không được mở rộng hoạt động kinh doanh; không được chia lợi nhuận; không được mua lại cổ phiếu, trừ việc mua lại cổ phiếu của người lao động theo quy chế phát hành cổ phiếu cho người lao động hoặc do sửa lỗi giao dịch;","b) Công ty quản lý quỹ đầu tư chứng khoán không được bổ sung nghiệp vụ kinh doanh chứng khoán; không được chia lợi nhuận; không được huy động vốn lập quỹ, lập công ty đầu tư chứng khoán; không được tăng vốn điều lệ cho quỹ đóng, quỹ thành viên, công ty đầu tư chứng khoán đang quản lý; không được ký mới các hợp đồng quản lý đầu tư, ký kéo dài thời hạn hoặc tiếp nhận thêm vốn từ các khách hàng ủy thác hiện tại; không được lập chi nhánh, lập văn phòng đại diện, đầu tư ra nước ngoài;","c) Chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam không được chuyển lợi nhuận của chi nhánh ra nước ngoài."],"sua_doi":false,"ghi_chu":[]},{"so":"86","ten":"Hoạt động của công ty chứng khoán, công ty quản lý quỹ đầu tư","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["chứng khoán và chi nhánh, văn phòng đại diện công ty chứng khoán, công ty quản lý quỹ nước ngoài tại Việt Nam","1. Công ty chứng khoán được cấp phép thực hiện nghiệp vụ môi giới chứng khoán được cung cấp các dịch vụ sau đây:","a) Nhận ủy thác quản lý tài khoản giao dịch chứng khoán của nhà đầu tư cá nhân; thực hiện phân phối hoặc làm đại lý phân phối chứng khoán; quản lý tài khoản giao dịch chứng khoán; cung ứng dịch vụ quản lý danh sách người sở hữu chứng khoán cho các doanh nghiệp khác;","b) Cung cấp dịch vụ giao dịch chứng khoán trực tuyến; cung cấp hoặc phối hợp với các tổ chức tín dụng cung cấp dịch vụ cho khách hàng vay tiền mua chứng khoán hoặc cung cấp dịch vụ cho vay chứng khoán; cung cấp hoặc phối hợp với các tổ chức tín dụng cung cấp dịch vụ ứng trước tiền bán chứng khoán; lưu ký chứng khoán; bù trừ và thanh toán chứng khoán; các dịch vụ trên thị trường chứng khoán phái sinh.","2. Công ty chứng khoán được cấp phép thực hiện nghiệp vụ tự doanh chứng khoán được giao dịch chứng khoán trên tài khoản tự doanh chứng khoán và được đầu tư, góp vốn, phát hành, chào bán các sản phẩm tài chính.","3. Công ty chứng khoán được cấp phép thực hiện nghiệp vụ bảo lãnh phát hành chứng khoán được cung cấp dịch vụ tư vấn hồ sơ chào bán chứng khoán, thực hiện các thủ tục trước khi chào bán chứng khoán; đại lý lưu ký, thanh toán, chuyển nhượng chứng khoán; tư vấn tái cơ cấu, hợp nhất, sáp nhập, tổ chức lại, mua bán doanh nghiệp; tư vấn quản trị, tư vấn chiến lược doanh nghiệp; tư vấn chào bán, niêm yết, đăng ký giao dịch chứng khoán; tư vấn cổ phần hóa doanh nghiệp.","4. Công ty chứng khoán được cấp phép thực hiện nghiệp vụ tư vấn đầu tư chứng khoán được ký hợp đồng cung cấp dịch vụ cho khách hàng theo quy định tại khoản 32 Điều 4 của Luật này.","5. Ngoài các dịch vụ quy định tại các khoản 1, 2, 3 và 4 Điều này, công ty chứng khoán chỉ được cung cấp dịch vụ tài chính khác phù hợp với quy định của pháp luật sau khi báo cáo Ủy ban Chứng khoán Nhà nước bằng văn bản. Ủy ban Chứng khoán Nhà nước có quyền tạm ngừng, đình chỉ việc cung cấp dịch vụ tài chính khác của công ty chứng khoán nếu việc cung cấp dịch vụ đó trái với quy định của pháp luật hoặc gây rủi ro hệ thống thị trường chứng khoán.","6. Công ty quản lý quỹ đầu tư chứng khoán được huy động và quản lý các quỹ đầu tư nước ngoài có mục tiêu đầu tư vào Việt Nam, quản lý quỹ hưu trí bổ sung tự nguyện theo quy định của pháp luật có liên quan, cung cấp dịch vụ giao dịch chứng khoán trực tuyến.","7. Chi nhánh công ty chứng khoán nước ngoài tại Việt Nam chỉ được thực hiện nghiệp vụ tư vấn đầu tư chứng khoán. Chi nhánh công ty quản lý quỹ nước ngoài tại Việt Nam chỉ được cung cấp dịch vụ quản lý tài sản cho vốn huy động tại nước ngoài.","8. Bộ trưởng Bộ Tài chính quy định chi tiết về hoạt động của công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh và văn phòng đại diện công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán và chi nhánh, văn phòng đại diện công ty chứng khoán, công ty quản lý quỹ nước ngoài tại Việt Nam; các dịch vụ được cung cấp, việc tạm ngừng, đình chỉ việc cung cấp dịch vụ tài chính khác của công ty chứng khoán quy định tại các khoản 1, 2, 3, 4 và 5 của Điều này."],"sua_doi":false,"ghi_chu":[]},{"so":"87","ten":"Những hoạt động phải được Ủy ban Chứng khoán Nhà nước chấp thuận","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán phải được Ủy ban Chứng khoán Nhà nước chấp thuận bằng văn bản trước khi thực hiện các hoạt động sau đây:","a) Tạm ngừng hoạt động, trừ trường hợp tạm ngừng do nguyên nhân bất khả kháng;","b) Chào bán và niêm yết chứng khoán của công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán tại nước ngoài;","c) Đầu tư gián tiếp ra nước ngoài;","d) Thành lập, đóng cửa chi nhánh, văn phòng đại diện trong nước và nước ngoài; thành lập công ty con tại nước ngoài; thay đổi nghiệp vụ kinh doanh tại chi nhánh; thành lập, đóng cửa phòng giao dịch;","đ) Thay đổi tên, địa điểm chi nhánh, văn phòng đại diện, phòng giao dịch;","e) Thực hiện dịch vụ quy định tại điểm b khoản 1 Điều 86 của Luật này.","2. Chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam khi tạm ngừng hoạt động theo quy định tại điểm a khoản 1 Điều này phải được Ủy ban Chứng khoán Nhà nước chấp thuận bằng văn bản trước khi thực hiện.","3. Chính phủ quy định chi tiết điều kiện, hồ sơ, trình tự, thủ tục chấp thuận các hoạt động quy định tại Điều này."],"sua_doi":false,"ghi_chu":[]},{"so":"88","ten":"Quản lý tài sản của khách hàng","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Tài sản của khách hàng do công ty chứng khoán tiếp nhận và quản lý bao gồm tiền gửi giao dịch chứng khoán, chứng khoán lưu ký, lưu giữ tại công ty chứng khoán và các quyền có liên quan là tài sản thuộc quyền sở hữu của khách hàng, không phải là tài sản của công ty chứng khoán.","2. Tài sản của khách hàng ủy thác trên tài khoản lưu ký của công ty quản lý quỹ đầu tư chứng khoán là tài sản thuộc quyền sở hữu của khách hàng ủy thác, không phải là tài sản của công ty quản lý quỹ đầu tư chứng khoán.","3. Trường hợp công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán giải thể hoặc bị phá sản, tài sản của khách hàng phải được hoàn trả cho khách hàng sau khi trừ đi nghĩa vụ nợ phải trả của khách hàng đối với công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán.","4. Bộ trưởng Bộ Tài chính quy định chi tiết việc quản lý tài sản của khách hàng tại công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"89","ten":"Nghĩa vụ của công ty chứng khoán, chi nhánh công ty chứng khoán nước ngoài tại Việt Nam","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Thiết lập hệ thống kiểm soát nội bộ, quản trị rủi ro và giám sát, ngăn ngừa những xung đột lợi ích trong nội bộ công ty và trong giao dịch với người có liên quan.","2. Bảo đảm nhân viên làm việc tại bộ phận nghiệp vụ phải có chứng chỉ hành nghề chứng khoán phù hợp với nghiệp vụ thực hiện.","3. Thực hiện quản lý tách biệt tài sản của từng khách hàng, tách biệt tài sản của khách hàng với tài sản của công ty chứng khoán.","4. Ký hợp đồng bằng văn bản với khách hàng khi cung cấp dịch vụ cho khách hàng; cung cấp đầy đủ, trung thực thông tin cho khách hàng.","5. Ưu tiên thực hiện lệnh của khách hàng trước lệnh của công ty chứng khoán.","6. Thu thập, tìm hiểu thông tin về tình hình tài chính, mục tiêu đầu tư, khả năng chấp nhận rủi ro của khách hàng; bảo đảm các khuyến nghị, tư vấn đầu tư của công ty cho khách hàng phải phù hợp với tình hình tài chính, mục tiêu đầu tư và khả năng chấp nhận rủi ro của từng khách hàng, trừ trường hợp khách hàng không cung cấp thông tin hoặc cung cấp thông tin nhưng không đầy đủ, chính xác.","7. Cập nhật, lưu giữ đầy đủ hồ sơ thông tin khách hàng, chứng từ và phản ánh chi tiết, chính xác các giao dịch của khách hàng và của công ty chứng khoán.","8. Thực hiện chế độ kế toán, kiểm toán, thống kê, nghĩa vụ tài chính theo quy định của pháp luật.","9. Thực hiện công bố thông tin và báo cáo kịp thời, đầy đủ, chính xác theo quy định của pháp luật.","10. Xây dựng hệ thống công nghệ thông tin, cơ sở dữ liệu dự phòng để bảo đảm hoạt động an toàn và liên tục.","11. Thực hiện giám sát giao dịch chứng khoán theo quy định của Bộ trưởng Bộ Tài chính.","12. Thực hiện nghĩa vụ khác theo quy định của Luật này và quy định khác của pháp luật có liên quan."],"sua_doi":false,"ghi_chu":[]},{"so":"90","ten":"Nghĩa vụ của công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty quản lý quỹ nước ngoài tại Việt Nam","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Tuân thủ nghĩa vụ quy định tại các khoản 1, 2, 4, 5, 6, 7, 8, 9, 10 và 12 Điều 89 của Luật này.","2. Thực hiện hoạt động quản lý quỹ đầu tư chứng khoán, quản lý danh mục đầu tư chứng khoán theo quy định của Luật này, Điều lệ quỹ đầu tư chứng khoán, hợp đồng ký với khách hàng ủy thác đầu tư và hợp đồng ký với ngân hàng giám sát.","3. Thực hiện việc xác định giá trị tài sản ròng của quỹ đầu tư chứng khoán theo quy định tại Điều 106 của Luật này, Điều lệ quỹ đầu tư chứng khoán và hợp đồng ký với khách hàng ủy thác đầu tư.","4. Khi quản lý tài sản ủy thác, công ty quản lý quỹ đầu tư chứng khoán phải lưu ký toàn bộ tài sản ủy thác, bảo đảm nguyên tắc độc lập và tách biệt tới từng khách hàng ủy thác, tách biệt tài sản ủy thác và tài sản của công ty quản lý quỹ đầu tư chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"91","ten":"Hạn chế đối với công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Không được đưa ra nhận định hoặc bảo đảm với khách hàng về mức thu nhập hoặc lợi nhuận đạt được trên khoản đầu tư của mình hoặc bảo đảm khách hàng không bị thua lỗ, trừ trường hợp đầu tư vào chứng khoán có thu nhập cố định.","2. Không được tiết lộ thông tin về khách hàng, trừ trường hợp được khách hàng đồng ý hoặc theo yêu cầu của cơ quan có thẩm quyền.","3. Không được thực hiện hành vi làm cho khách hàng và nhà đầu tư hiểu nhầm về giá chứng khoán.","4. Cổ đông sáng lập, thành viên góp vốn khi thành lập của công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán không được chuyển nhượng cổ phần hoặc phần vốn góp của mình trong thời hạn 03 năm kể từ ngày được cấp giấy phép, trừ trường hợp chuyển nhượng giữa các cổ đông sáng lập, thành viên góp vốn khi thành lập công ty.","5. Công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam phải thực hiện hoạt động kinh doanh, cung cấp dịch vụ chứng khoán với danh nghĩa của chính mình; không được sử dụng danh nghĩa tổ chức, cá nhân khác hoặc cho tổ chức, cá nhân khác sử dụng danh nghĩa của mình để kinh doanh, cung cấp dịch vụ chứng khoán.","6. Công ty chứng khoán không được góp vốn thành lập, mua cổ phần, phần vốn góp của 01 công ty chứng khoán khác tại Việt Nam, trừ các trường hợp sau đây:","a) Mua để thực hiện hợp nhất, sáp nhập;","b) Mua để sở hữu hoặc cùng với người có liên quan (nếu có) sở hữu không quá 5% số cổ phiếu có quyền biểu quyết đang lưu hành của công ty chứng khoán niêm yết, đăng ký giao dịch.","7. Công ty quản lý quỹ đầu tư chứng khoán không được góp vốn thành lập, mua cổ phần, phần vốn góp của 01 công ty quản lý quỹ đầu tư chứng khoán khác tại Việt Nam, trừ các trường hợp sau đây:","a) Mua để thực hiện hợp nhất, sáp nhập;","b) Mua để sở hữu hoặc cùng với người có liên quan (nếu có) sở hữu không quá 5% số cổ phiếu có quyền biểu quyết đang lưu hành của công ty quản lý quỹ đầu tư chứng khoán niêm yết, đăng ký giao dịch."],"sua_doi":false,"ghi_chu":[]},{"so":"92","ten":"An toàn tài chính","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam phải bảo đảm các chỉ tiêu an toàn tài chính.","2. Bộ trưởng Bộ Tài chính quy định chi tiết về chỉ tiêu an toàn tài chính và biện pháp xử lý đối với công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam không đáp ứng chỉ tiêu an toàn tài chính. Ủy ban Chứng khoán Nhà nước đưa vào diện cảnh báo, kiểm soát, kiểm soát đặc biệt và áp dụng các biện pháp xử lý đối với trường hợp không đáp ứng chỉ tiêu an toàn tài chính. Mục 3 TỔ CHỨC LẠI, ĐÌNH CHỈ VÀ THU HỒI GIẤY PHÉP THÀNH LẬP VÀ HOẠT ĐỘNG KINH DOANH CHỨNG KHOÁN"],"sua_doi":false,"ghi_chu":[]},{"so":"93","ten":"Tổ chức lại công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Việc tổ chức lại công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán phải được sự chấp thuận của Ủy ban Chứng khoán Nhà nước trước khi thực hiện. Trong thời hạn 30 ngày kể từ ngày nhận được hồ sơ đầy đủ và hợp lệ, Ủy ban Chứng khoán Nhà nước chấp thuận việc tổ chức lại công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán. Trường hợp từ chối, Ủy ban Chứng khoán Nhà nước phải trả lời bằng văn bản và nêu rõ lý do.","2. Sau khi được Ủy ban Chứng khoán Nhà nước chấp thuận theo quy định tại khoản 1 Điều này, công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán thực hiện việc tổ chức lại theo quy định của Luật Doanh nghiệp và phải bảo đảm các nguyên tắc sau đây:","a) Việc tổ chức lại không được ảnh hưởng đến quyền, lợi ích hợp pháp của khách hàng, bảo đảm việc giao dịch liên tục, thông suốt và an toàn;","b) Công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán hình thành sau tổ chức lại kế thừa quyền và nghĩa vụ của các công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán tham gia tổ chức lại theo quy định của pháp luật;","c) Công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán thực hiện việc tổ chức lại phải thực hiện đầy đủ nghĩa vụ công bố thông tin cho khách hàng.","3. Chính phủ quy định điều kiện, hồ sơ, trình tự, thủ tục chấp thuận việc tổ chức lại công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán.","4. Công ty hình thành sau tổ chức lại phải thực hiện thủ tục đề nghị cấp, điều chỉnh Giấy phép thành lập và hoạt động kinh doanh chứng khoán theo quy định của Luật này."],"sua_doi":false,"ghi_chu":[]},{"so":"94","ten":"Đình chỉ hoạt động của công ty chứng khoán, công ty quản lý quỹ","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam","1. Ủy ban Chứng khoán Nhà nước quyết định đình chỉ một, một số hoặc toàn bộ hoạt động kinh doanh của công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam trong các trường hợp sau đây:","a) Hồ sơ đề nghị cấp, bổ sung Giấy phép thành lập và hoạt động kinh doanh chứng khoán có thông tin sai sự thật;","b) Không khắc phục được tình trạng theo quy định tại Điều 92 của Luật này;","c) Hoạt động sai mục đích hoặc không đúng với nội dung quy định trong giấy phép;","d) Không đáp ứng điều kiện quy định tại khoản 1 Điều 85 của Luật này hoặc điều kiện vốn chủ sở hữu không thấp hơn vốn điều lệ tối thiểu sau thời hạn khắc phục quy định tại khoản 2 Điều 85 của Luật này.","2. Sau 06 tháng kể từ ngày quyết định đình chỉ có hiệu lực, Ủy ban Chứng khoán Nhà nước ra quyết định rút nghiệp vụ kinh doanh chứng khoán bị đình chỉ trong trường hợp công ty chứng khoán không khắc phục được tình trạng bị đình chỉ quy định tại điểm b hoặc điểm d khoản 1 Điều này.","3. Trong thời gian bị đình chỉ hoạt động, công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam phải thực hiện các biện pháp khắc phục hoặc hạn chế hoạt động sau đây:","a) Không được ký mới, gia hạn các hợp đồng có liên quan đến các nghiệp vụ kinh doanh bị đình chỉ hoạt động; phải thực hiện tất toán, chuyển tài khoản theo yêu cầu của khách hàng (nếu có);","b) Có phương án khắc phục và báo cáo tình hình thực hiện phương án theo yêu cầu của Ủy ban Chứng khoán Nhà nước;","c) Trường hợp bị đình chỉ nghiệp vụ tự doanh, công ty chứng khoán chỉ được bán, không được tăng thêm các khoản đầu tư kinh doanh, trừ trường hợp buộc mua để sửa lỗi giao dịch, giao dịch lô lẻ hoặc thực hiện các quyền có liên quan đến chứng khoán đang nắm giữ theo quy định của pháp luật."],"sua_doi":false,"ghi_chu":[]},{"so":"95","ten":"Thu hồi Giấy phép thành lập và hoạt động kinh doanh chứng","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["khoán của công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam","1. Công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam bị thu hồi Giấy phép thành lập và hoạt động kinh doanh chứng khoán trong các trường hợp sau đây:","a) Không chính thức hoạt động trong thời hạn 12 tháng kể từ ngày được cấp giấy phép; không khôi phục được hoạt động sau khi hết thời hạn tạm ngừng hoạt động đã được Ủy ban Chứng khoán Nhà nước chấp thuận; không tiến hành hoạt động nghiệp vụ quản lý quỹ trong thời hạn 02 năm liên tục;","b) Có văn bản đề nghị rút Giấy phép thành lập và hoạt động kinh doanh chứng khoán;","c) Công ty chứng khoán bị rút toàn bộ nghiệp vụ kinh doanh chứng khoán theo quy định tại khoản 2 Điều 94 của Luật này; công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam không khắc phục được tình trạng bị đình chỉ hoạt động quy định tại điểm b, điểm d khoản 1 Điều 94 của Luật này trong thời hạn 06 tháng kể từ ngày bị đình chỉ hoạt động;","d) Không khắc phục được các vi phạm quy định tại điểm a, điểm c khoản 1 Điều 94 của Luật này trong thời hạn 60 ngày kể từ ngày bị đình chỉ hoạt động;","đ) Giải thể, phá sản, hợp nhất, bị chia, bị sáp nhập.","2. Đối với trường hợp thu hồi giấy phép quy định tại điểm c và điểm d khoản 1 Điều này, Ủy ban Chứng khoán Nhà nước có quyền chỉ định công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán khác thay thế để hoàn tất các giao dịch, hợp đồng của công ty bị thu hồi giấy phép; trong trường hợp này, quan hệ ủy quyền mặc nhiên được xác lập giữa hai công ty.","3. Khi bị thu hồi giấy phép, công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam phải thực hiện theo các quy định sau đây:","a) Chấm dứt ngay mọi hoạt động ghi trong giấy phép và thông báo trên 01 tờ báo điện tử hoặc báo in trong 03 số liên tiếp;","b) Thực hiện việc tất toán tài sản của khách hàng do công ty chứng khoán tiếp nhận và quản lý, tài sản của khách hàng ủy thác trên tài khoản lưu ký của công ty quản lý quỹ đầu tư chứng khoán;","c) Báo cáo Ủy ban Chứng khoán Nhà nước sau khi hoàn thành nghĩa vụ tất toán tài sản của khách hàng.","4. Ủy ban Chứng khoán Nhà nước có trách nhiệm công bố thông tin về việc thu hồi giấy phép và thông báo cho Cơ quan đăng ký kinh doanh để thu hồi Giấy chứng nhận đăng ký doanh nghiệp, Giấy chứng nhận đăng ký kinh doanh."],"sua_doi":false,"ghi_chu":[]},{"so":"96","ten":"Giải thể, phá sản công ty chứng khoán, công ty quản lý quỹ đầu","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam","1. Việc giải thể công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam thực hiện theo quy định của Luật này và Luật Doanh nghiệp.","2. Chính phủ quy định chi tiết việc tất toán tài sản của khách hàng quy định tại điểm b khoản 3 Điều 95 của Luật này; hồ sơ, trình tự, thủ tục giải thể công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam.","3. Việc phá sản công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán thực hiện theo quy định của pháp luật về phá sản. Mục 4 HÀNH NGHỀ CHỨNG KHOÁN"],"sua_doi":false,"ghi_chu":[]},{"so":"97","ten":"Chứng chỉ hành nghề chứng khoán","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Chứng chỉ hành nghề chứng khoán bao gồm các loại sau đây:","a) Chứng chỉ hành nghề môi giới chứng khoán;","b) Chứng chỉ hành nghề phân tích tài chính;","c) Chứng chỉ hành nghề quản lý quỹ.","2. Chứng chỉ hành nghề chứng khoán được cấp cho cá nhân đáp ứng các điều kiện sau đây:","a) Có năng lực hành vi dân sự đầy đủ; không thuộc trường hợp đang bị truy cứu trách nhiệm hình sự hoặc đang bị cấm hành nghề chứng khoán theo quy định của pháp luật;","b) Có trình độ từ đại học trở lên;","c) Có trình độ chuyên môn về chứng khoán;","d) Đạt yêu cầu trong kỳ thi sát hạch cấp chứng chỉ hành nghề chứng khoán phù hợp với loại chứng chỉ hành nghề chứng khoán đề nghị cấp. Người nước ngoài có chứng chỉ chuyên môn về chứng khoán hoặc những người đã hành nghề chứng khoán hợp pháp ở nước ngoài phải đạt yêu cầu trong kỳ thi sát hạch pháp luật về chứng khoán và thị trường chứng khoán của Việt Nam.","3. Cá nhân được cấp chứng chỉ hành nghề chứng khoán bị thu hồi chứng chỉ hành nghề chứng khoán trong các trường hợp sau đây:","a) Không còn đáp ứng điều kiện cấp chứng chỉ hành nghề chứng khoán quy định tại khoản 2 Điều này;","b) Vi phạm quy định tại Điều 12, khoản 2 Điều 98 của Luật này;","c) Không hành nghề chứng khoán trong 03 năm liên tục.","4. Người bị thu hồi chứng chỉ hành nghề chứng khoán trong trường hợp quy định tại điểm b khoản 3 Điều này không được cấp lại chứng chỉ hành nghề chứng khoán.","5. Chính phủ quy định chi tiết điều kiện, hồ sơ, trình tự, thủ tục cấp, cấp lại, thu hồi chứng chỉ hành nghề chứng khoán và việc quản lý, giám sát người hành nghề chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"98","ten":"Trách nhiệm của người hành nghề chứng khoán","chuong":"Chương VI. CÔNG TY CHỨNG KHOÁN, CÔNG TY QUẢN LÝ QUỸ ĐẦU TƯ CHỨNG KHOÁN","doan":["1. Người được cấp chứng chỉ hành nghề chứng khoán chỉ được hành nghề chứng khoán với tư cách đại diện cho công ty chứng khoán hoặc công ty quản lý quỹ đầu tư chứng khoán hoặc chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam hoặc công ty đầu tư chứng khoán.","2. Người hành nghề chứng khoán không được thực hiện các hành vi sau đây:","a) Đồng thời làm việc cho từ 02 công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam, công ty đầu tư chứng khoán trở lên;","b) Mở, quản lý tài khoản giao dịch chứng khoán tại công ty chứng khoán nơi mình không làm việc, trừ trường hợp công ty chứng khoán nơi mình đang làm việc không có nghiệp vụ môi giới chứng khoán;","c) Thực hiện hành vi vượt quá phạm vi ủy quyền của công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam, công ty đầu tư chứng khoán nơi mình đang làm việc.","3. Người hành nghề chứng khoán phải tham gia các khóa tập huấn về pháp luật về chứng khoán và thị trường chứng khoán, hệ thống giao dịch, loại chứng khoán mới do Ủy ban Chứng khoán Nhà nước, Sở giao dịch chứng khoán Việt Nam và công ty con, Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam tổ chức.","4. Công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, chi nhánh công ty chứng khoán và công ty quản lý quỹ nước ngoài tại Việt Nam, công ty đầu tư chứng khoán chịu trách nhiệm về hoạt động nghiệp vụ của người hành nghề chứng khoán. Mục 1 QUY ĐỊNH CHUNG VỀ QUỸ ĐẦU TƯ CHỨNG KHOÁN"],"sua_doi":false,"ghi_chu":[]},{"so":"99","ten":"Các loại hình quỹ đầu tư chứng khoán","chuong":"Chương VII. QUỸ ĐẦU TƯ CHỨNG KHOÁN, CÔNG TY ĐẦU TƯ CHỨNG KHOÁN VÀ NGÂN HÀNG GIÁM SÁT","doan":["1. Quỹ đầu tư chứng khoán bao gồm quỹ đại chúng và quỹ thành viên.","2. Quỹ đại chúng bao gồm quỹ mở và quỹ đóng."],"sua_doi":false,"ghi_chu":[]},{"so":"100","ten":"Thành lập và tổ chức hoạt động của quỹ đầu tư chứng khoán","chuong":"Chương VII. QUỸ ĐẦU TƯ CHỨNG KHOÁN, CÔNG TY ĐẦU TƯ CHỨNG KHOÁN VÀ NGÂN HÀNG GIÁM SÁT","doan":["1. Việc thành lập và chào bán chứng chỉ quỹ ra công chúng của quỹ đại chúng do công ty quản lý quỹ đầu tư chứng khoán thực hiện theo quy định tại Điều 108 của Luật này và phải đăng ký với Ủy ban Chứng khoán Nhà nước.","2. Việc thành lập quỹ thành viên do công ty quản lý quỹ đầu tư chứng khoán thực hiện theo quy định tại Điều 113 của Luật này và phải báo cáo Ủy ban Chứng khoán Nhà nước.","3. Chính phủ quy định cụ thể điều kiện, hồ sơ, trình tự, thủ tục về chào bán, thành lập, tổ chức lại, giải thể các quỹ đầu tư chứng khoán quy định tại Điều 99 và Điều 114 của Luật này.","4. Hoạt động của các loại hình quỹ quy định tại Điều 99 và Điều 114 của Luật này thực hiện theo quy định của Bộ trưởng Bộ Tài chính và quy định khác của pháp luật có liên quan."],"sua_doi":false,"ghi_chu":[]},{"so":"101","ten":"Quyền và nghĩa vụ của nhà đầu tư tham gia vào quỹ đầu tư chứng khoán","chuong":"Chương VII. QUỸ ĐẦU TƯ CHỨNG KHOÁN, CÔNG TY ĐẦU TƯ CHỨNG KHOÁN VÀ NGÂN HÀNG GIÁM SÁT","doan":["1. Nhà đầu tư có các quyền sau đây:","a) Hưởng lợi từ hoạt động đầu tư của quỹ đầu tư chứng khoán tương ứng với tỷ lệ vốn góp;","b) Hưởng các lợi ích và tài sản được chia hợp pháp từ việc thanh lý tài sản quỹ đầu tư chứng khoán;","c) Yêu cầu công ty quản lý quỹ đầu tư chứng khoán mua lại chứng chỉ quỹ mở;","d) Khởi kiện công ty quản lý quỹ đầu tư chứng khoán, ngân hàng giám sát hoặc tổ chức liên quan nếu tổ chức này vi phạm quyền, lợi ích hợp pháp của mình;","đ) Thực hiện quyền của mình thông qua Đại hội nhà đầu tư;","e) Chuyển nhượng chứng chỉ quỹ theo quy định tại Điều lệ quỹ đầu tư chứng khoán;","g) Quyền khác theo quy định của pháp luật và Điều lệ quỹ đầu tư chứng khoán.","2. Nhà đầu tư có các nghĩa vụ sau đây:","a) Chấp hành quyết định của Đại hội nhà đầu tư;","b) Thanh toán đủ tiền mua chứng chỉ quỹ;","c) Nghĩa vụ khác theo quy định của pháp luật và Điều lệ quỹ đầu tư chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"102","ten":"Đại hội nhà đầu tư quỹ đầu tư chứng khoán","chuong":"Chương VII. QUỸ ĐẦU TƯ CHỨNG KHOÁN, CÔNG TY ĐẦU TƯ CHỨNG KHOÁN VÀ NGÂN HÀNG GIÁM SÁT","doan":["1. Đại hội nhà đầu tư quỹ đầu tư chứng khoán bao gồm tất cả các nhà đầu tư, là cơ quan quyết định cao nhất của quỹ đầu tư chứng khoán.","2. Đại hội nhà đầu tư quỹ đầu tư chứng khoán có các quyền và nghĩa vụ sau đây:","a) Bầu, miễn nhiệm, bãi nhiệm Chủ tịch và thành viên Ban đại diện quỹ đầu tư chứng khoán;","b) Quyết định mức thù lao và chi phí hoạt động của Ban đại diện quỹ đầu tư chứng khoán;","c) Quyết định các thay đổi cơ bản trong chính sách đầu tư, phương án phân phối lợi nhuận và mục tiêu đầu tư của quỹ đầu tư chứng khoán; quyết định thay đổi công ty quản lý quỹ đầu tư chứng khoán, ngân hàng giám sát; thay đổi mức phí trả cho công ty quản lý quỹ đầu tư chứng khoán và ngân hàng giám sát;","d) Quyết định sửa đổi, bổ sung Điều lệ quỹ đầu tư chứng khoán;","đ) Chia, tách, hợp nhất, sáp nhập, giải thể quỹ đầu tư chứng khoán; thay đổi vốn điều lệ, thay đổi thời hạn hoạt động của quỹ đầu tư chứng khoán;","e) Yêu cầu công ty quản lý quỹ đầu tư chứng khoán, ngân hàng giám sát xuất trình sổ sách hoặc giấy tờ giao dịch tại Đại hội nhà đầu tư quỹ đầu tư chứng khoán;","g) Thông qua các báo cáo về tình hình tài chính, tài sản và hoạt động hằng năm của quỹ đầu tư chứng khoán; thông qua việc lựa chọn tổ chức kiểm toán được chấp thuận để kiểm toán báo cáo tài chính hằng năm của quỹ đầu tư chứng khoán, tổ chức định giá độc lập (nếu có);","h) Xử lý vi phạm của công ty quản lý quỹ đầu tư chứng khoán, ngân hàng giám sát và Ban đại diện quỹ đầu tư chứng khoán gây tổn thất cho quỹ đầu tư chứng khoán;","i) Quyền và nghĩa vụ khác theo quy định của pháp luật và Điều lệ quỹ đầu tư chứng khoán.","3. Đại hội nhà đầu tư quỹ đầu tư chứng khoán được triệu tập hằng năm hoặc bất thường.","4. Bộ trưởng Bộ Tài chính quy định việc triệu tập, thể thức tiến hành và thông qua quyết định của Đại hội nhà đầu tư quỹ đầu tư chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"103","ten":"Điều lệ quỹ đầu tư chứng khoán","chuong":"Chương VII. QUỸ
