i phí như chi phí cho −500 đ; quên phí cho 3.000 đ; đảo dấu phí ròng cho 4.500 đ.","basis":"Chiến lược chênh lệch giá tăng (bull call spread)","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C3-087","part":"CM","subject":"PS","topic":"Định giá và sử dụng hợp đồng quyền chọn","level":2,"q":"Khi các yếu tố khác không đổi, nếu độ biến động (volatility) kỳ vọng của tài sản cơ sở tăng lên thì giá quyền chọn mua và quyền chọn bán kiểu châu Âu thay đổi như thế nào?","o":["Quyền chọn mua tăng giá, quyền chọn bán giảm giá","Quyền chọn mua giảm giá, quyền chọn bán tăng giá","Quyền chọn mua và quyền chọn bán đều tăng giá","Hai loại quyền chọn đều giảm giá do rủi ro cao hơn"],"a":2,"e":"Vega của vị thế mua quyền chọn (mua hoặc bán) đều dương: biến động cao làm tăng khả năng quyền chọn kết thúc ở trạng thái cao giá, trong khi khoản lỗ của người nắm giữ bị giới hạn ở phí quyền chọn.","basis":"Các hệ số nhạy (Greeks): vega","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C3-088","part":"CM","subject":"PS","topic":"Định giá và sử dụng hợp đồng quyền chọn","level":3,"q":"CTCK phát hành 2.000.000 chứng quyền mua, tỷ lệ chuyển đổi 4:1 (4 chứng quyền tương ứng 1 cổ phiếu cơ sở). Delta của chứng quyền tính theo 1 cổ phiếu cơ sở là 0,55. Để phòng ngừa rủi ro delta cho vị thế phát hành, CTCK cần nắm giữ bao nhiêu cổ phiếu cơ sở?","o":["68.750 cổ phiếu","500.000 cổ phiếu","1.100.000 cổ phiếu","275.000 cổ phiếu"],"a":3,"e":"Số cổ phiếu cơ sở tương ứng = 2.000.000/4 = 500.000; số cổ phiếu phòng ngừa = 500.000 × 0,55 = 275.000 cổ phiếu (mua vào vì CTCK đang ở vị thế bán quyền chọn mua). Quên tỷ lệ chuyển đổi cho 1.100.000; bỏ qua delta cho 500.000.","basis":"Phòng ngừa delta (delta hedging)","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C3-089","part":"CM","subject":"PS","topic":"Sở Giao dịch CKPS và giao dịch CKPS trên sở giao dịch","level":2,"q":"HĐTL chỉ số VN30 đang giao dịch ở mức 1.280,5 điểm, hệ số nhân 100.000 đ/điểm. Giả định tỷ lệ ký quỹ ban đầu là 17% giá trị hợp đồng. Giá trị ký quỹ ban đầu cho 1 hợp đồng là bao nhiêu?","o":["21.768.500 đ","2.176.850 đ","128.050.000 đ","217.685.000 đ"],"a":0,"e":"Giá trị hợp đồng = 1.280,5 × 100.000 = 128.050.000 đ; ký quỹ ban đầu = 17% × 128.050.000 = 21.768.500 đ. Dùng nhầm hệ số nhân 10.000 cho 2.176.850 đ.","basis":"Giá trị hợp đồng = Giá × Hệ số nhân; Ký quỹ = Giá trị hợp đồng × Tỷ lệ ký quỹ","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C3-090","part":"CM","subject":"PS","topic":"Sở Giao dịch CKPS và giao dịch CKPS trên sở giao dịch","level":1,"q":"HĐTL chỉ số VN30 giao dịch trên thị trường chứng khoán phái sinh Việt Nam được thanh toán khi đáo hạn theo phương thức nào?","o":["Chuyển giao vật chất toàn bộ rổ 30 cổ phiếu thành phần của chỉ số VN30","Thanh toán bằng tiền, dựa trên chênh lệch giữa giá hợp đồng và giá thanh toán cuối cùng","Chuyển giao chứng chỉ quỹ ETF mô phỏng chỉ số VN30","Người mua được lựa chọn giữa nhận tiền hoặc nhận rổ cổ phiếu"],"a":1,"e":"Tài sản cơ sở là chỉ số nên không thể chuyển giao vật chất; HĐTL chỉ số VN30 thanh toán bằng tiền theo giá thanh toán cuối cùng (giá đóng cửa của chỉ số cơ sở tại ngày giao dịch cuối cùng).","basis":"Đặc tả HĐTL chỉ số VN30 – phương thức thanh toán","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C3-091","part":"CM","subject":"PS","topic":"Sở Giao dịch CKPS và giao dịch CKPS trên sở giao dịch","level":3,"q":"Nhà đầu tư mở 5 vị thế mua HĐTL chỉ số VN30 ở mức 1.305,2 điểm và đóng toàn bộ vị thế ở 1.318,7 điểm (hệ số nhân 100.000 đ/điểm). Giả định tổng phí là 20.000 đ/hợp đồng cho mỗi lượt mở hoặc đóng vị thế; bỏ qua thuế. Lợi nhuận ròng của nhà đầu tư là bao nhiêu?","o":["1.310.000 đ","6.650.000 đ","6.550.000 đ","6.750.000 đ"],"a":2,"e":"Lãi gộp = (1.318,7 − 1.305,2) × 100.000 × 5 = 6.750.000 đ; phí = 20.000 × 5 × 2 lượt = 200.000 đ; lãi ròng = 6.550.000 đ. Chỉ tính phí một chiều cho 6.650.000 đ; 1.310.000 đ là lãi ròng của 1 hợp đồng.","basis":"Lãi lỗ khi đóng vị thế HĐTL = (Giá đóng − Giá mở) × Hệ số nhân × Số hợp đồng − Phí","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C3-092","part":"CM","subject":"PS","topic":"Một số công cụ phái sinh giao dịch trên thị trường OTC","level":2,"q":"Hợp đồng hoán đổi lãi suất danh nghĩa 100 tỷ đồng, kỳ hạn 1 năm, thanh toán 6 tháng/lần: bên A trả lãi cố định 6,0%/năm, bên B trả lãi thả nổi theo lãi suất tham chiếu xác định vào đầu mỗi kỳ, các khoản lãi được bù trừ ròng. Lãi suất tham chiếu đầu kỳ 1 là 5,4%/năm, đầu kỳ 2 là 6,8%/năm. Khoản thanh toán ròng vào cuối kỳ 2 là:","o":["Bên A trả ròng 0,4 tỷ đồng cho bên B","Bên A nhận ròng 0,8 tỷ đồng từ bên B","Bên A trả ròng 0,3 tỷ đồng cho bên B","Bên A nhận ròng 0,4 tỷ đồng từ bên B"],"a":3,"e":"Lãi thả nổi kỳ 2 xác định đầu kỳ = 6,8%. Bên B trả 100 × 6,8% × 0,5 = 3,4 tỷ; bên A trả 100 × 6,0% × 0,5 = 3,0 tỷ → bên A nhận ròng 0,4 tỷ đồng. Quên nhân 0,5 năm cho 0,8 tỷ; dùng lãi suất đầu kỳ 1 cho bên A trả ròng 0,3 tỷ.","basis":"Hoán đổi lãi suất (cố định – thả nổi), thanh toán ròng","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C3-093","part":"CM","subject":"PS","topic":"Một số công cụ phái sinh giao dịch trên thị trường OTC","level":2,"q":"So với hợp đồng hoán đổi lãi suất thông thường (plain vanilla), điểm khác biệt cơ bản của hợp đồng hoán đổi tiền tệ là:","o":["Thường có trao đổi số tiền gốc bằng hai đồng tiền khác nhau vào đầu và cuối kỳ hạn","Chỉ trao đổi phần chênh lệch lãi tính trên cùng một số tiền gốc danh nghĩa","Bắt buộc niêm yết và giao dịch tập trung trên Sở giao dịch chứng khoán","Không phát sinh rủi ro tỷ giá cho các bên tham gia"],"a":0,"e":"Hoán đổi tiền tệ trao đổi gốc và lãi bằng hai đồng tiền (thường trao đổi gốc đầu và cuối kỳ), nên các bên chịu rủi ro tỷ giá. Hoán đổi lãi suất thông thường cùng một đồng tiền, không trao đổi gốc, chỉ thanh toán ròng chênh lệch lãi. Cả hai chủ yếu giao dịch OTC.","basis":"Hoán đổi tiền tệ và hoán đổi lãi suất","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C3-094","part":"CM","subject":"PS","topic":"Hoạt động bù trừ và thanh toán trong giao dịch CKPS","level":1,"q":"Theo Nghị định 158/2020/NĐ-CP, trong cơ chế đối tác bù trừ trung tâm, tổ chức nào thông qua hoạt động thế vị trở thành một đối tác của giao dịch chứng khoán phái sinh?","o":["Sở giao dịch chứng khoán tổ chức thị trường phái sinh","Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam","Ngân hàng thanh toán do các thành viên bù trừ lựa chọn","Ủy ban Chứng khoán Nhà nước"],"a":1,"e":"Trong cơ chế đối tác bù trừ trung tâm, VSDC thông qua thế vị trở thành một đối tác của giao dịch, thành viên bù trừ là đối tác còn lại; nhờ đó rủi ro đối tác giữa các nhà đầu tư được loại bỏ.","basis":"Khoản 19 Điều 3 Nghị định 158/2020/NĐ-CP (không bị sửa đổi bởi Nghị định 306/2025/NĐ-CP)","quote":"Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam thông qua hoạt động thế vị trở thành một đối tác của giao dịch chứng khoán phái sinh, thành viên bù trừ là đối tác còn lại của giao dịch.","src":"ND_158_2020_ND-CP_Cong_bao.txt","as_of":"2026-11"},{"id":"C3-095","part":"CM","subject":"PS","topic":"Hoạt động bù trừ và thanh toán trong giao dịch CKPS","level":2,"q":"Theo Nghị định 158/2020/NĐ-CP, biện pháp nào sau đây thuộc cơ chế phòng ngừa rủi ro mà Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam được áp dụng?","o":["Bảo đảm mức lợi nhuận tối thiểu cho nhà đầu tư có vị thế mở","Cho thành viên bù trừ vay vốn để thanh toán lỗ vị thế","Yêu cầu thành viên bù trừ đóng góp vào quỹ bù trừ","Quyết định hủy niêm yết hợp đồng tương lai khi đáo hạn"],"a":2,"e":"Điều 35: VSDC được xác định, điều chỉnh mức ký quỹ; yêu cầu thành viên bù trừ đóng góp quỹ bù trừ; xác định giới hạn vị thế; đóng vị thế của bên mất khả năng thanh toán; sử dụng quỹ bù trừ. Hủy niêm yết chứng khoán phái sinh thuộc thẩm quyền Sở giao dịch chứng khoán (Điều 15).","basis":"Điểm b khoản 1 Điều 35 Nghị định 158/2020/NĐ-CP (không bị sửa đổi bởi Nghị định 306/2025/NĐ-CP)","quote":"b) Yêu cầu thành viên bù trừ đóng góp vào quỹ bù trừ;","src":"ND_158_2020_ND-CP_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-001","part":"LUAT","subject":"LU","topic":"Giải thích từ ngữ","level":1,"q":"Theo khoản 19 Điều 4 Luật Chứng khoán, chào bán chứng khoán cho bao nhiêu nhà đầu tư (không kể nhà đầu tư chứng khoán chuyên nghiệp) thì thuộc trường hợp chào bán ra công chúng?","o":["Trên 100 nhà đầu tư","Từ 50 nhà đầu tư trở lên","Từ 200 nhà đầu tư trở lên","Từ 100 nhà đầu tư trở lên"],"a":3,"e":"Chào bán ra công chúng gồm: chào bán qua phương tiện thông tin đại chúng; chào bán cho từ 100 nhà đầu tư trở lên (không kể nhà đầu tư chứng khoán chuyên nghiệp); chào bán cho nhà đầu tư không xác định. Ngưỡng là 'từ 100' (bao gồm 100), không phải 'trên 100'.","basis":"Điểm b khoản 19 Điều 4 Luật Chứng khoán 2019","quote":"Chào bán cho từ 100 nhà đầu tư trở lên, không kể nhà đầu tư chứng khoán chuyên nghiệp","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-002","part":"LUAT","subject":"LU","topic":"Giải thích từ ngữ","level":1,"q":"Theo Luật Chứng khoán, cổ đông lớn là cổ đông sở hữu:","o":["Từ 5% trở lên số cổ phiếu có quyền biểu quyết của một tổ chức phát hành","Từ 5% trở lên vốn điều lệ đã góp của một tổ chức phát hành","Trên 10% số cổ phiếu có quyền biểu quyết của một tổ chức phát hành","Từ 10% trở lên tổng số cổ phiếu đã phát hành của một tổ chức phát hành"],"a":0,"e":"Cổ đông lớn được xác định theo tỷ lệ từ 5% trở lên số cổ phiếu có quyền biểu quyết (không tính theo vốn điều lệ hay tổng số cổ phiếu đã phát hành). Mốc trên 10% là tiêu chí xác định người có liên quan giữa doanh nghiệp và người sở hữu.","basis":"Khoản 18 Điều 4 Luật Chứng khoán 2019","quote":"Cổ đông lớn là cổ đông sở hữu từ 5% trở lên số cổ phiếu có quyền biểu quyết của một tổ chức phát hành.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-003","part":"LUAT","subject":"LU","topic":"Giải thích từ ngữ","level":2,"q":"Theo Luật Chứng khoán, đặc điểm phân biệt quỹ đóng với quỹ mở là gì?","o":["Quỹ đóng chỉ được chào bán cho nhà đầu tư chứng khoán chuyên nghiệp","Chứng chỉ quỹ đóng không được mua lại theo yêu cầu của nhà đầu tư","Chứng chỉ quỹ đóng không được niêm yết trên hệ thống giao dịch chứng khoán","Quỹ đóng có tối đa 99 nhà đầu tư, quỹ mở có tối thiểu 100 nhà đầu tư"],"a":1,"e":"Cả quỹ mở và quỹ đóng đều là quỹ đại chúng. Chứng chỉ quỹ mở phải được mua lại theo yêu cầu của nhà đầu tư; chứng chỉ quỹ đóng thì không được mua lại theo yêu cầu và phải niêm yết sau đợt chào bán. Giới hạn 02–99 thành viên là đặc điểm của quỹ thành viên.","basis":"Khoản 39, 40 Điều 4 Luật Chứng khoán 2019","quote":"Quỹ đóng là quỹ đại chúng mà chứng chỉ quỹ đã chào bán ra công chúng không được mua lại theo yêu cầu của nhà đầu tư.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-004","part":"LUAT","subject":"LU","topic":"Giải thích từ ngữ","level":1,"q":"Quỹ đầu tư bất động sản đầu tư chủ yếu vào bất động sản và chứng khoán của tổ chức kinh doanh bất động sản có doanh thu từ việc sở hữu và kinh doanh bất động sản tối thiểu bằng bao nhiêu phần trăm tổng doanh thu (theo báo cáo tài chính năm gần nhất)?","o":["50%","51%","65%","80%"],"a":2,"e":"Khoản 43 Điều 4 Luật Chứng khoán: tổ chức kinh doanh bất động sản có doanh thu từ sở hữu và kinh doanh bất động sản tối thiểu 65% tổng doanh thu tính trên báo cáo tài chính năm gần nhất.","basis":"Khoản 43 Điều 4 Luật Chứng khoán 2019","quote":"có doanh thu từ việc sở hữu và kinh doanh bất động sản tối thiểu là 65% tổng doanh thu tính trên báo cáo tài chính năm gần nhất","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-005","part":"LUAT","subject":"LU","topic":"Giải thích từ ngữ","level":2,"q":"Bà H sở hữu 12% số cổ phiếu có quyền biểu quyết của Công ty cổ phần A nhưng không giữ chức vụ nào tại A. Theo Luật Chứng khoán, quan hệ giữa bà H và Công ty A được xác định thế nào?","o":["Bà H chỉ là cổ đông lớn, chưa phải người có liên quan vì tỷ lệ dưới 20%","Bà H là người nội bộ của Công ty A","Bà H chỉ là người có liên quan nếu được bầu vào Hội đồng quản trị","Bà H và Công ty A là người có liên quan của nhau"],"a":3,"e":"Doanh nghiệp và tổ chức, cá nhân sở hữu trên 10% số cổ phiếu có quyền biểu quyết hoặc vốn góp của doanh nghiệp đó là người có liên quan. Bà H (12%) đồng thời là cổ đông lớn (từ 5%) nhưng không phải người nội bộ vì không giữ chức danh quản trị, điều hành.","basis":"Điểm b khoản 46 Điều 4 Luật Chứng khoán 2019","quote":"Doanh nghiệp và tổ chức, cá nhân sở hữu trên 10% số cổ phiếu có quyền biểu quyết hoặc vốn góp của doanh nghiệp đó","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-006","part":"LUAT","subject":"LU","topic":"Giải thích từ ngữ","level":2,"q":"Theo khoản 45 Điều 4 Luật Chứng khoán, đối tượng nào sau đây KHÔNG phải là người nội bộ của doanh nghiệp?","o":["Cổ đông nắm 4% cổ phần, không giữ chức danh nào","Người phụ trách quản trị công ty do HĐQT bổ nhiệm","Thành viên Ban kiểm toán nội bộ của công ty","Người được ủy quyền công bố thông tin của công ty"],"a":0,"e":"Người nội bộ của doanh nghiệp gồm Chủ tịch, thành viên HĐQT/HĐTV, người đại diện theo pháp luật, Tổng giám đốc, Phó Tổng giám đốc, Giám đốc tài chính, Kế toán trưởng, Ban kiểm soát, thành viên Ban kiểm toán nội bộ, thư ký công ty, người phụ trách quản trị công ty, người được ủy quyền công bố thông tin. Tư cách cổ đông (nhất là dưới 5%) không làm phát sinh tư cách người nội bộ.","basis":"Điểm a khoản 45 Điều 4 Luật Chứng khoán 2019","quote":"thành viên Ban kiểm toán nội bộ; thư ký công ty, người phụ trách quản trị công ty, người được ủy quyền công bố thông tin","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-007","part":"LUAT","subject":"LU","topic":"Nhà đầu tư chuyên nghiệp","level":1,"q":"Theo Điều 11 Luật Chứng khoán, công ty (không phải tổ chức niêm yết, đăng ký giao dịch) được xác định là nhà đầu tư chứng khoán chuyên nghiệp khi có vốn điều lệ đã góp:","o":["Trên 50 tỷ đồng","Trên 100 tỷ đồng","Từ 30 tỷ đồng trở lên","Từ 100 tỷ đồng trở lên"],"a":1,"e":"Điểm b khoản 1 Điều 11: công ty có vốn điều lệ đã góp đạt trên 100 tỷ đồng hoặc tổ chức niêm yết, tổ chức đăng ký giao dịch là nhà đầu tư chứng khoán chuyên nghiệp. Ngưỡng là 'trên 100 tỷ đồng' (công ty có đúng 100 tỷ đồng chưa đạt), không phải 'từ 100 tỷ đồng trở lên'. Mốc 30 tỷ đồng là điều kiện vốn của công ty đại chúng/chào bán ra công chúng.","basis":"Điểm b khoản 1 Điều 11 Luật Chứng khoán 2019","quote":"Công ty có vốn điều lệ đã góp đạt trên 100 tỷ đồng hoặc tổ chức niêm yết, tổ chức đăng ký giao dịch","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-008","part":"LUAT","subject":"LU","topic":"Nhà đầu tư chuyên nghiệp","level":3,"q":"Ông K có danh mục cổ phiếu niêm yết trị giá 1,8 tỷ đồng (theo xác nhận của công ty chứng khoán), có thu nhập chịu thuế năm gần nhất 1,2 tỷ đồng theo hồ sơ khai thuế đã nộp và không có chứng chỉ hành nghề chứng khoán. Ông K có đủ tư cách nhà đầu tư chứng khoán chuyên nghiệp không?","o":["Không, vì giá trị danh mục chứng khoán chưa đạt 02 tỷ đồng","Không, vì cá nhân phải đáp ứng đồng thời tiêu chí danh mục và thu nhập","Có, vì đáp ứng tiêu chí thu nhập chịu thuế năm gần nhất tối thiểu 01 tỷ đồng","Có, nhưng chỉ khi được Ủy ban Chứng khoán Nhà nước xác nhận bằng văn bản"],"a":2,"e":"Các tiêu chí tại điểm c, d, đ khoản 1 Điều 11 là độc lập: có CCHN; hoặc danh mục chứng khoán niêm yết, đăng ký giao dịch tối thiểu 02 tỷ đồng; hoặc thu nhập chịu thuế năm gần nhất tối thiểu 01 tỷ đồng. Ông K chưa đạt tiêu chí danh mục nhưng đạt tiêu chí thu nhập (1,2 tỷ ≥ 01 tỷ) nên đủ tư cách.","basis":"Điểm d, đ khoản 1 Điều 11 Luật Chứng khoán 2019","quote":"Cá nhân có thu nhập chịu thuế năm gần nhất tối thiểu là 01 tỷ đồng tính đến thời điểm cá nhân đó được xác định tư cách là nhà đầu tư chứng khoán chuyên nghiệp","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-009","part":"LUAT","subject":"LU","topic":"Nhà đầu tư chuyên nghiệp","level":1,"q":"Luật số 56/2024/QH15 bổ sung nhóm đối tượng nào sau đây vào danh sách nhà đầu tư chứng khoán chuyên nghiệp?","o":["Cá nhân có danh mục chứng khoán niêm yết, đăng ký giao dịch từ 01 tỷ đồng","Hộ kinh doanh có doanh thu năm gần nhất từ 10 tỷ đồng trở lên tại Việt Nam","Cá nhân có chứng chỉ chuyên môn chứng khoán do Trung tâm đào tạo của UBCKNN cấp","Nhà đầu tư nước ngoài thực hiện hoạt động đầu tư kinh doanh tại Việt Nam"],"a":3,"e":"Điểm e khoản 1 Điều 11 được bổ sung bởi điểm a khoản 3 Điều 1 Luật 56/2024/QH15 (hiệu lực 01/01/2025): nhà đầu tư nước ngoài là cá nhân có quốc tịch nước ngoài, tổ chức thành lập theo pháp luật nước ngoài thực hiện hoạt động đầu tư kinh doanh tại Việt Nam là nhà đầu tư chứng khoán chuyên nghiệp.","basis":"Điểm e khoản 1 Điều 11 Luật Chứng khoán 2019 (sửa đổi, bổ sung bởi Luật 56/2024/QH15)","quote":"Nhà đầu tư nước ngoài là cá nhân có quốc tịch nước ngoài, tổ chức thành lập theo pháp luật nước ngoài thực hiện hoạt động đầu tư kinh doanh tại Việt Nam.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-010","part":"LUAT","subject":"LU","topic":"Nhà đầu tư chuyên nghiệp","level":3,"q":"Tháng 10/2026, bà M (nhà đầu tư chứng khoán chuyên nghiệp là cá nhân) muốn mua trái phiếu của một đợt chào bán trái phiếu doanh nghiệp riêng lẻ công bố thông tin trước đợt chào bán vào tháng 9/2026. Theo Luật Chứng khoán hiện hành, bà M được mua loại trái phiếu nào sau đây?","o":["Trái phiếu có xếp hạng tín nhiệm và có bảo lãnh thanh toán của tổ chức tín dụng","Trái phiếu không có xếp hạng tín nhiệm nhưng có tài sản bảo đảm","Trái phiếu có xếp hạng tín nhiệm nhưng không có tài sản bảo đảm hay bảo lãnh","Mọi loại trái phiếu riêng lẻ, vì bà M đã là nhà đầu tư chuyên nghiệp"],"a":0,"e":"Từ 01/01/2026, khoản 1b Điều 11 (bổ sung bởi Luật 56/2024) chỉ cho phép nhà đầu tư chuyên nghiệp là cá nhân mua, giao dịch, chuyển nhượng trái phiếu doanh nghiệp riêng lẻ khi trái phiếu có xếp hạng tín nhiệm VÀ có tài sản bảo đảm hoặc có bảo lãnh thanh toán của tổ chức tín dụng. Nhà đầu tư chuyên nghiệp là tổ chức không bị giới hạn này (khoản 1a). Đợt chào bán ở đây công bố thông tin năm 2026 nên không thuộc trường hợp chuyển tiếp tại khoản 1 Điều 11 Luật 56/2024.","basis":"Khoản 1b Điều 11 Luật Chứng khoán 2019 (sửa đổi, bổ sung bởi Luật 56/2024/QH15); hiệu lực từ 01/01/2026","quote":"Trái phiếu doanh nghiệp riêng lẻ có xếp hạng tín nhiệm và có bảo lãnh thanh toán của tổ chức tín dụng đối với trái phiếu đó.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-011","part":"LUAT","subject":"LU","topic":"Nhà đầu tư chuyên nghiệp","level":2,"q":"Đối tượng nào sau đây là nhà đầu tư chứng khoán chuyên nghiệp theo khoản 1 Điều 11 Luật Chứng khoán?","o":["Cá nhân có chứng chỉ chuyên môn về chứng khoán","Cá nhân có chứng chỉ hành nghề chứng khoán","Cá nhân nắm giữ cổ phiếu chưa đăng ký giao dịch trị giá 03 tỷ đồng","Công ty chưa niêm yết có vốn điều lệ đã góp 80 tỷ đồng"],"a":1,"e":"Người có chứng chỉ hành nghề chứng khoán là nhà đầu tư chuyên nghiệp (điểm c). Chứng chỉ chuyên môn không thay thế CCHN; danh mục chỉ tính chứng khoán niêm yết, đăng ký giao dịch (điểm d); công ty phải có vốn điều lệ đã góp trên 100 tỷ đồng hoặc là tổ chức niêm yết, đăng ký giao dịch (điểm b).","basis":"Điểm c khoản 1 Điều 11 Luật Chứng khoán 2019","quote":"Người có chứng chỉ hành nghề chứng khoán;","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-012","part":"LUAT","subject":"LU","topic":"Hành vi bị cấm","level":1,"q":"Hành vi nào sau đây thuộc các hành vi bị nghiêm cấm theo Điều 12 Luật Chứng khoán?","o":["Nhà đầu tư đặt lệnh giới hạn mua cổ phiếu tại mức giá trần trong phiên","Cổ đông lớn bán cổ phiếu sau khi đã công bố thông tin theo quy định","Cho người khác mượn tài khoản, đứng tên sở hữu chứng khoán hộ dẫn đến thao túng giá","Công ty chứng khoán mua, bán chứng khoán cho chính mình trên tài khoản tự doanh"],"a":2,"e":"Khoản 6 Điều 12 nghiêm cấm cho người khác mượn tài khoản để giao dịch chứng khoán, đứng tên sở hữu chứng khoán hộ người khác dẫn đến hành vi thao túng giá chứng khoán. Các phương án còn lại là hoạt động hợp pháp (tự doanh là nghiệp vụ được cấp phép).","basis":"Khoản 6 Điều 12 Luật Chứng khoán 2019","quote":"Cho người khác mượn tài khoản để giao dịch chứng khoán, đứng tên sở hữu chứng khoán hộ người khác dẫn đến hành vi thao túng giá chứng khoán.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-013","part":"LUAT","subject":"LU","topic":"Hành vi bị cấm","level":3,"q":"Ông T là Kế toán trưởng của công ty niêm yết X, biết trước kết quả kinh doanh quý III giảm mạnh khi thông tin này chưa được công bố. Ông T không giao dịch nhưng khuyên em ruột bán toàn bộ cổ phiếu X trước ngày công bố. Nhận định nào đúng?","o":["Ông T không vi phạm vì bản thân không trực tiếp mua, bán cổ phiếu X","Chỉ người em vi phạm vì là người trực tiếp đặt lệnh bán","Không ai vi phạm nếu giao dịch được thực hiện qua phương thức khớp lệnh","Ông T vi phạm quy định cấm về thông tin nội bộ dù không trực tiếp giao dịch"],"a":3,"e":"Khoản 2 Điều 12 nghiêm cấm cả việc sử dụng thông tin nội bộ để giao dịch và việc tiết lộ, cung cấp thông tin nội bộ hoặc tư vấn cho người khác mua, bán chứng khoán trên cơ sở thông tin nội bộ. Kế toán trưởng là người nội bộ; kết quả kinh doanh chưa công bố là thông tin nội bộ.","basis":"Khoản 2 Điều 12; khoản 44, 45 Điều 4 Luật Chứng khoán 2019","quote":"tiết lộ, cung cấp thông tin nội bộ hoặc tư vấn cho người khác mua, bán chứng khoán trên cơ sở thông tin nội bộ","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-014","part":"LUAT","subject":"LU","topic":"Hành vi bị cấm","level":2,"q":"Theo khoản 49 Điều 4 Luật Chứng khoán (bổ sung bởi Luật 56/2024/QH15), hành vi nào sau đây là thao túng thị trường chứng khoán?","o":["Đặt lệnh mua và bán cùng loại chứng khoán trong ngày nhằm tạo cung cầu giả tạo","Đặt lệnh bán cổ phiếu tại giá sàn để cắt lỗ khi thị trường giảm mạnh","Đăng ký mua cổ phiếu phát hành thêm theo quyền mua của cổ đông hiện hữu","Mua cổ phiếu khối lượng lớn sau khi đã đăng ký và công bố chào mua công khai"],"a":0,"e":"Điểm b khoản 49 Điều 4 liệt kê hành vi đặt lệnh mua và bán cùng loại chứng khoán trong cùng ngày giao dịch hoặc thông đồng giao dịch mà không dẫn đến chuyển nhượng thực sự quyền sở hữu (hoặc chỉ luân chuyển trong nhóm) nhằm tạo giá, cung cầu giả tạo. Các phương án còn lại là giao dịch thông thường, hợp pháp.","basis":"Điểm b khoản 49 Điều 4 Luật Chứng khoán 2019 (sửa đổi, bổ sung bởi Luật 56/2024/QH15)","quote":"Đặt lệnh mua và bán cùng loại chứng khoán trong cùng ngày giao dịch hoặc thông đồng với nhau giao dịch mua, bán chứng khoán mà không dẫn đến chuyển nhượng thực sự quyền sở hữu","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-015","part":"LUAT","subject":"LU","topic":"Hành vi bị cấm","level":3,"q":"Anh P mua 2 triệu cổ phiếu Y, sau đó liên tục đăng bài trên mạng xã hội khẳng định Y sắp bị thâu tóm (không có căn cứ) để kéo giá lên, rồi bán toàn bộ khi giá tăng. Hành vi của anh P được xác định là:","o":["Sử dụng thông tin nội bộ để giao dịch chứng khoán","Thao túng thị trường chứng khoán, bị nghiêm cấm","Hành vi hợp pháp vì thuộc quyền tự do bày tỏ ý kiến","Chỉ vi phạm nghĩa vụ công bố thông tin của cổ đông lớn"],"a":1,"e":"Điểm đ khoản 49 Điều 4: đưa ra ý kiến trực tiếp hoặc gián tiếp qua phương tiện thông tin đại chúng về một loại chứng khoán nhằm tạo ảnh hưởng đến giá sau khi đã giao dịch và nắm giữ vị thế là thao túng thị trường; khoản 3 Điều 12 nghiêm cấm hành vi này. Thông tin bịa đặt không phải thông tin nội bộ.","basis":"Điểm đ khoản 49 Điều 4; khoản 3 Điều 12 Luật Chứng khoán 2019 (sửa đổi, bổ sung bởi Luật 56/2024/QH15)","quote":"Đưa ra ý kiến một cách trực tiếp hoặc gián tiếp thông qua phương tiện thông tin đại chúng về một loại chứng khoán, về tổ chức phát hành chứng khoán nhằm tạo ảnh hưởng đến giá của loại chứng khoán đó sau khi đã thực hiện giao dịch và nắm giữ vị thế","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-016","part":"LUAT","subject":"LU","topic":"Hành vi bị cấm","level":1,"q":"Nhân viên môi giới tự ý đặt lệnh mua, bán trên tài khoản của khách hàng khi chưa được khách hàng ủy thác. Theo Luật Chứng khoán, hành vi này là:","o":["Hành vi được phép nếu giao dịch mang lại lợi nhuận cho khách hàng","Vi phạm nội quy công ty, không thuộc hành vi bị nghiêm cấm","Hành vi bị nghiêm cấm trong hoạt động về chứng khoán","Hành vi được phép đối với tài khoản giao dịch ký quỹ"],"a":2,"e":"Khoản 5 Điều 12 nghiêm cấm sử dụng tài khoản, tài sản của khách hàng khi không được khách hàng ủy thác hoặc trái quy định của pháp luật hoặc lạm dụng tín nhiệm để chiếm đoạt tài sản của khách hàng; kết quả lãi hay lỗ không làm thay đổi tính chất vi phạm.","basis":"Khoản 5 Điều 12 Luật Chứng khoán 2019","quote":"Sử dụng tài khoản, tài sản của khách hàng khi không được khách hàng ủy thác hoặc trái quy định của pháp luật hoặc lạm dụng tín nhiệm để chiếm đoạt tài sản của khách hàng.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-017","part":"LUAT","subject":"LU","topic":"Chào bán ra công chúng","level":1,"q":"Điều kiện về vốn để công ty cổ phần chào bán cổ phiếu lần đầu ra công chúng (IPO) là mức vốn điều lệ đã góp tại thời điểm đăng ký chào bán:","o":["Từ 10 tỷ đồng trở lên tính theo giá trị ghi trên sổ kế toán","Từ 50 tỷ đồng trở lên tính theo giá thị trường","Trên 100 tỷ đồng tính theo báo cáo tài chính hợp nhất","Từ 30 tỷ đồng trở lên tính theo giá trị ghi trên sổ kế toán"],"a":3,"e":"Điểm a khoản 1 Điều 15: vốn điều lệ đã góp tại thời điểm đăng ký chào bán từ 30 tỷ đồng trở lên tính theo giá trị ghi trên sổ kế toán. Mức 10 tỷ đồng là quy định của Luật Chứng khoán 2006 đã hết hiệu lực.","basis":"Điểm a khoản 1 Điều 15 Luật Chứng khoán 2019","quote":"Mức vốn điều lệ đã góp tại thời điểm đăng ký chào bán từ 30 tỷ đồng trở lên tính theo giá trị ghi trên sổ kế toán","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-018","part":"LUAT","subject":"LU","topic":"Chào bán ra công chúng","level":2,"q":"Điều kiện về kết quả kinh doanh đối với công ty cổ phần chào bán cổ phiếu lần đầu ra công chúng là gì?","o":["02 năm liền trước năm đăng ký có lãi, không có lỗ lũy kế","Năm liền trước năm đăng ký chào bán có lãi và không có lỗ lũy kế","03 năm liên tục liền trước năm đăng ký chào bán có lãi","02 năm liền trước có lãi, lỗ lũy kế không vượt quá 10% vốn điều lệ"],"a":0,"e":"IPO cổ phiếu đòi hỏi 02 năm liên tục liền trước năm đăng ký chào bán có lãi, đồng thời không có lỗ lũy kế tính đến năm đăng ký chào bán (điểm b khoản 1 Điều 15). Điều kiện 'năm liền trước có lãi' áp dụng cho chào bán thêm cổ phiếu và chào bán trái phiếu ra công chúng.","basis":"Điểm b khoản 1 Điều 15 Luật Chứng khoán 2019","quote":"Hoạt động kinh doanh của 02 năm liên tục liền trước năm đăng ký chào bán phải có lãi, đồng thời không có lỗ lũy kế tính đến năm đăng ký chào bán","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-019","part":"LUAT","subject":"LU","topic":"Chào bán ra công chúng","level":2,"q":"Công ty cổ phần B có vốn điều lệ 1.200 tỷ đồng đăng ký chào bán cổ phiếu lần đầu ra công chúng. Tỷ lệ tối thiểu số cổ phiếu có quyền biểu quyết của B phải được bán cho ít nhất 100 nhà đầu tư không phải là cổ đông lớn là:","o":["15%","10%","20%","25%"],"a":1,"e":"Điểm d khoản 1 Điều 15: tối thiểu 15% số cổ phiếu có quyền biểu quyết phải được bán cho ít nhất 100 nhà đầu tư không phải cổ đông lớn; nếu vốn điều lệ từ 1.000 tỷ đồng trở lên thì tỷ lệ tối thiểu là 10%. B có vốn điều lệ 1.200 tỷ đồng nên áp dụng 10%.","basis":"Điểm d khoản 1 Điều 15 Luật Chứng khoán 2019","quote":"trường hợp vốn điều lệ của tổ chức phát hành từ 1.000 tỷ đồng trở lên, tỷ lệ tối thiểu là 10% số cổ phiếu có quyền biểu quyết của tổ chức phát hành","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-020","part":"LUAT","subject":"LU","topic":"Chào bán ra công chúng","level":2,"q":"Khi chào bán cổ phiếu lần đầu ra công chúng, cổ đông lớn trước thời điểm chào bán của tổ chức phát hành phải cam kết:","o":["Mỗi cổ đông lớn nắm giữ toàn bộ cổ phần trong 03 năm kể từ ngày niêm yết","Cùng nhau nắm giữ ít nhất 30% vốn điều lệ tối thiểu 06 tháng kể từ ngày chào bán","Cùng nắm giữ ít nhất 20% vốn điều lệ tối thiểu 01 năm từ ngày kết thúc chào bán","Cùng nhau nắm giữ ít nhất 20% vốn điều lệ tối thiểu 01 năm kể từ ngày niêm yết"],"a":2,"e":"Điểm đ khoản 1 Điều 15: cổ đông lớn trước IPO phải cam kết cùng nhau nắm giữ ít nhất 20% vốn điều lệ tối thiểu 01 năm kể từ ngày kết thúc đợt chào bán (mốc tính là ngày kết thúc đợt chào bán, không phải ngày niêm yết).","basis":"Điểm đ khoản 1 Điều 15 Luật Chứng khoán 2019","quote":"phải cam kết cùng nhau nắm giữ ít nhất 20% vốn điều lệ của tổ chức phát hành tối thiểu là 01 năm kể từ ngày kết thúc đợt chào bán","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-021","part":"LUAT","subject":"LU","topic":"Chào bán ra công chúng","level":3,"q":"Công ty đại chúng C có 50 triệu cổ phiếu đang lưu hành (mệnh giá 10.000 đồng). C dự kiến chào bán thêm ra công chúng 60 triệu cổ phiếu để huy động vốn, không có bảo lãnh phát hành, không phải phát hành để hoán đổi, hợp nhất, sáp nhập. Phương án của C:","o":["Đáp ứng vì luật không giới hạn số lượng cổ phiếu chào bán thêm ra công chúng","Đáp ứng nếu bán được tối thiểu 70% số cổ phiếu dự kiến chào bán","Không đáp ứng vì chỉ được chào bán thêm tối đa 50% số cổ phiếu đang lưu hành","Không đáp ứng vì giá trị phát hành thêm theo mệnh giá vượt cổ phiếu đang lưu hành"],"a":3,"e":"Điểm c khoản 2 Điều 15: giá trị cổ phiếu phát hành thêm theo mệnh giá không lớn hơn tổng giá trị cổ phiếu đang lưu hành theo mệnh giá, trừ trường hợp có bảo lãnh phát hành cam kết nhận mua toàn bộ hoặc mua số còn lại, phát hành từ nguồn vốn chủ sở hữu, phát hành để hoán đổi, hợp nhất, sáp nhập. 600 tỷ > 500 tỷ đồng nên không đáp ứng.","basis":"Điểm c khoản 2 Điều 15 Luật Chứng khoán 2019","quote":"Giá trị cổ phiếu phát hành thêm theo mệnh giá không lớn hơn tổng giá trị cổ phiếu đang lưu hành tính theo mệnh giá","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-022","part":"LUAT","subject":"LU","topic":"Chào bán ra công chúng","level":3,"q":"Công ty đại chúng D chào bán thêm cổ phiếu ra công chúng cho cổ đông hiện hữu theo tỷ lệ sở hữu nhằm huy động vốn thực hiện dự án nhà máy. Theo Luật Chứng khoán sửa đổi năm 2024, yêu cầu số cổ phiếu bán được tối thiểu 70% số cổ phiếu dự kiến chào bán:","o":["Không áp dụng đối với đợt chào bán cho cổ đông hiện hữu theo tỷ lệ sở hữu","Vẫn áp dụng, đợt chào bán bị hủy bỏ nếu bán được dưới 70%","Được thay bằng tỷ lệ tối thiểu 50% đối với chào bán cho cổ đông hiện hữu","Chỉ áp dụng khi đợt chào bán có tổ chức bảo lãnh phát hành"],"a":0,"e":"Điểm d khoản 2 Điều 15 (sửa đổi bởi điểm a khoản 6 Điều 1 Luật 56/2024/QH15): đợt chào bán để huy động vốn thực hiện dự án phải bán tối thiểu 70% số cổ phiếu dự kiến chào bán, trừ trường hợp chào bán cho các cổ đông hiện hữu theo tỷ lệ sở hữu; tổ chức phát hành phải có phương án bù đắp phần vốn thiếu hụt.","basis":"Điểm d khoản 2 Điều 15 Luật Chứng khoán 2019 (sửa đổi, bổ sung bởi Luật 56/2024/QH15)","quote":"phải đạt tối thiểu 70% số cổ phiếu dự kiến được chào bán, trừ trường hợp chào bán cho các cổ đông hiện hữu theo tỷ lệ sở hữu.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-023","part":"LUAT","subject":"LU","topic":"Chào bán ra công chúng","level":2,"q":"Theo điểm g khoản 3 Điều 15 Luật Chứng khoán (sửa đổi bởi Luật 56/2024/QH15), doanh nghiệp chào bán trái phiếu ra công chúng phải đáp ứng quy định của Chính phủ về những nội dung nào?","o":["Tỷ lệ an toàn vốn, hạn mức tín dụng, tài sản bảo đảm và bảo hiểm trái phiếu","Đại diện người sở hữu trái phiếu, hệ số nợ, giá trị phát hành/VCSH, xếp hạng tín nhiệm","Bảo lãnh thanh toán của ngân hàng và tài khoản phong tỏa tại Ngân hàng Nhà nước","Tỷ lệ sở hữu nước ngoài, cơ cấu cổ đông và vốn điều lệ tối thiểu 100 tỷ đồng"],"a":1,"e":"Luật 56/2024/QH15 sửa điểm g khoản 3 Điều 15: tổ chức phát hành phải đáp ứng quy định của Chính phủ về đại diện người sở hữu trái phiếu, hệ số nợ, giá trị phát hành trên vốn chủ sở hữu và xếp hạng tín nhiệm. NĐ 245/2025 cụ thể hóa: nợ phải trả (gồm trái phiếu dự kiến phát hành) không quá 05 lần vốn chủ sở hữu (trừ một số loại hình), bắt buộc xếp hạng tín nhiệm (trừ trường hợp ngoại lệ).","basis":"Điểm g khoản 3 Điều 15 Luật Chứng khoán 2019 (sửa đổi, bổ sung bởi Luật 56/2024/QH15); Điều 19 NĐ 155/2020/NĐ-CP (sửa đổi bởi NĐ 245/2025/NĐ-CP)","quote":"Đáp ứng quy định của Chính phủ về đại diện người sở hữu trái phiếu, hệ số nợ, giá trị phát hành trên vốn chủ sở hữu và xếp hạng tín nhiệm","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-024","part":"LUAT","subject":"LU","topic":"Chào bán ra công chúng","level":2,"q":"Trường hợp nào sau đây KHÔNG phải đăng ký chào bán chứng khoán ra công chúng với Ủy ban Chứng khoán Nhà nước?","o":["Công ty đại chúng chào bán thêm cổ phiếu ra công chúng","Công ty quản lý quỹ chào bán chứng chỉ quỹ đóng ra công chúng","Chào bán trái phiếu chính quyền địa phương","Ngân hàng thương mại cổ phần chào bán trái phiếu ra công chúng"],"a":2,"e":"Khoản 2 Điều 16 miễn đăng ký đối với: công cụ nợ của Chính phủ, trái phiếu được Chính phủ bảo lãnh do ngân hàng chính sách phát hành, trái phiếu chính quyền địa phương; trái phiếu của tổ chức tài chính quốc tế được Chính phủ chấp thuận; cổ phần hóa doanh nghiệp nhà nước; bán chứng khoán theo bản án, quyết định của Tòa án, Trọng tài hoặc trong phá sản.","basis":"Điểm a khoản 2 Điều 16 Luật Chứng khoán 2019","quote":"Chào bán công cụ nợ của Chính phủ, trái phiếu được Chính phủ bảo lãnh do ngân hàng chính sách phát hành, trái phiếu chính quyền địa phương","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-025","part":"LUAT","subject":"LU","topic":"Chào bán ra công chúng","level":2,"q":"Tổ chức bảo lãnh phát hành chứng khoán ra công chúng theo phương thức nhận mua một phần hoặc toàn bộ chứng khoán chỉ được bảo lãnh tổng giá trị chứng khoán:","o":["Không lớn hơn vốn điều lệ và không quá 10 lần hiệu số tài sản ngắn hạn trừ nợ ngắn hạn","Không quá 02 lần vốn chủ sở hữu theo báo cáo tài chính năm gần nhất","Không quá 15 lần vốn chủ sở hữu theo báo cáo tài chính quý gần nhất","Không lớn hơn vốn chủ sở hữu và không quá 15 lần hiệu số tài sản ngắn hạn trừ nợ ngắn hạn"],"a":3,"e":"Khoản 2 Điều 17: tổng giá trị bảo lãnh không lớn hơn vốn chủ sở hữu và không quá 15 lần hiệu số giữa giá trị tài sản ngắn hạn và nợ ngắn hạn tính theo báo cáo tài chính quý gần nhất. Hai giới hạn áp dụng đồng thời.","basis":"Khoản 2 Điều 17 Luật Chứng khoán 2019","quote":"chỉ được phép bảo lãnh phát hành tổng giá trị chứng khoán không được lớn hơn vốn chủ sở hữu và không quá 15 lần hiệu số giữa giá trị tài sản ngắn hạn và nợ ngắn hạn tính theo báo cáo tài chính quý gần nhất","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-026","part":"LUAT","subject":"LU","topic":"Chào bán ra công chúng","level":3,"q":"Công ty chứng khoán E (không phải người có liên quan của tổ chức phát hành) có số liệu theo báo cáo tài chính quý gần nhất: vốn chủ sở hữu 800 tỷ đồng, tài sản ngắn hạn 1.500 tỷ đồng, nợ ngắn hạn 1.450 tỷ đồng. Tổng giá trị chứng khoán tối đa E được bảo lãnh phát hành ra công chúng theo hình thức nhận mua là:","o":["750 tỷ đồng","800 tỷ đồng","1.550 tỷ đồng","12.000 tỷ đồng"],"a":0,"e":"Bước 1: hiệu số TSNH − nợ NH = 1.500 − 1.450 = 50 tỷ; giới hạn 15 lần = 15 × 50 = 750 tỷ. Bước 2: giới hạn vốn chủ sở hữu = 800 tỷ. Bước 3: áp dụng đồng thời hai giới hạn → mức tối đa = min(750; 800) = 750 tỷ đồng. 800 tỷ là chỉ xét VCSH; 1.550 tỷ là cộng hai giới hạn; 12.000 tỷ là nhân 15 với VCSH.","basis":"Khoản 2 Điều 17 Luật Chứng khoán 2019","quote":"không quá 15 lần hiệu số giữa giá trị tài sản ngắn hạn và nợ ngắn hạn tính theo báo cáo tài chính quý gần nhất","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-027","part":"LUAT","subject":"LU","topic":"Chào bán ra công chúng","level":1,"q":"Tổ chức phát hành phải hoàn thành việc phân phối chứng khoán ra công chúng trong thời hạn nào kể từ ngày Giấy chứng nhận đăng ký chào bán có hiệu lực?","o":["60 ngày; UBCKNN có thể xem xét gia hạn tối đa không quá 30 ngày","90 ngày; UBCKNN có thể xem xét gia hạn tối đa không quá 30 ngày","90 ngày; UBCKNN có thể xem xét gia hạn tối đa không quá 60 ngày","30 ngày; UBCKNN có thể xem xét gia hạn tối đa không quá 15 ngày"],"a":1,"e":"Khoản 4 Điều 26: thời hạn phân phối 90 ngày kể từ ngày Giấy chứng nhận có hiệu lực, gia hạn tối đa không quá 30 ngày; nếu chào bán nhiều đợt thì khoảng cách giữa các đợt không quá 12 tháng. Thời hạn đăng ký mua tối thiểu cho nhà đầu tư là 20 ngày.","basis":"Khoản 4 Điều 26 Luật Chứng khoán 2019","quote":"Tổ chức phát hành phải hoàn thành việc phân phối chứng khoán trong thời hạn 90 ngày kể từ ngày Giấy chứng nhận đăng ký chào bán chứng khoán ra công chúng có hiệu lực.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-028","part":"LUAT","subject":"LU","topic":"Chào bán ra công chúng","level":2,"q":"Trong thời hạn 07 ngày làm việc kể từ ngày Giấy chứng nhận đăng ký chào bán chứng khoán ra công chúng có hiệu lực, tổ chức phát hành phải công bố Bản thông báo phát hành bằng cách nào?","o":["Trên 02 tờ báo in trong 05 số liên tiếp","Chỉ trên trang thông tin điện tử của Ủy ban Chứng khoán Nhà nước","Trên 01 tờ báo điện tử hoặc báo in trong 03 số liên tiếp","Trên 01 tờ báo in trong 01 số và niêm yết tại trụ sở công ty"],"a":2,"e":"Khoản 3 Điều 25: trong 07 ngày làm việc kể từ ngày Giấy chứng nhận có hiệu lực, tổ chức phát hành công bố Bản thông báo phát hành trên 01 tờ báo điện tử hoặc báo in trong 03 số liên tiếp; chứng khoán chỉ được chào bán sau khi đã công bố.","basis":"Khoản 3, 4 Điều 25 Luật Chứng khoán 2019","quote":"tổ chức phát hành phải công bố Bản thông báo phát hành trên 01 tờ báo điện tử hoặc báo in trong 03 số liên tiếp","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-029","part":"LUAT","subject":"LU","topic":"Chào bán ra công chúng","level":3,"q":"Công ty F kết thúc đợt chào bán cổ phiếu ra công chúng tháng 3/2026; cổ phiếu được đưa vào niêm yết từ tháng 5/2026. Tháng 9/2026, UBCKNN phát hiện hồ sơ đăng ký chào bán có thông tin sai lệch. Theo Luật Chứng khoán sửa đổi năm 2024, đợt chào bán:","o":["Bị hủy bỏ, F phải thu hồi cổ phiếu và hoàn tiền trong 15 ngày","Bị đình chỉ tối đa 60 ngày để F khắc phục thiếu sót","Bị Sở giao dịch chứng khoán hủy niêm yết đồng thời hủy bỏ đợt chào bán","Không bị hủy bỏ vì cổ phiếu đã được đưa vào niêm yết"],"a":3,"e":"Luật 56/2024 bổ sung điểm d khoản 1 Điều 28 (hủy bỏ khi phát hiện vi phạm sau khi kết thúc đợt chào bán nhưng cổ phiếu CHƯA niêm yết/đăng ký giao dịch) và khoản 2a Điều 28: cổ phiếu đã được đưa vào niêm yết hoặc đăng ký giao dịch thì không hủy bỏ đợt chào bán; vi phạm được xử lý theo quy định khác.","basis":"Điểm d khoản 1, khoản 2a Điều 28 Luật Chứng khoán 2019 (sửa đổi, bổ sung bởi Luật 56/2024/QH15)","quote":"Sau khi chào bán ra công chúng, cổ phiếu hoặc cổ phiếu được chuyển đổi từ trái phiếu chuyển đổi hoặc cổ phiếu được mua từ chứng quyền đã được đưa vào niêm yết hoặc đăng ký giao dịch thì không hủy bỏ.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-030","part":"LUAT","subject":"LU","topic":"Chào bán riêng lẻ","level":2,"q":"Đối tượng được tham gia đợt chào bán cổ phiếu riêng lẻ của công ty đại chúng gồm:","o":["Chỉ nhà đầu tư chiến lược và nhà đầu tư chứng khoán chuyên nghiệp","Bất kỳ nhà đầu tư nào, miễn là dưới 100 nhà đầu tư","Chỉ cổ đông hiện hữu theo tỷ lệ sở hữu","Nhà đầu tư chiến lược, nhà đầu tư chuyên nghiệp và người lao động"],"a":0,"e":"Điểm b khoản 1 Điều 31 (sửa đổi bởi Luật 56/2024): đối tượng tham gia đợt chào bán cổ phiếu, trái phiếu chuyển đổi riêng lẻ chỉ bao gồm nhà đầu tư chiến lược, nhà đầu tư chứng khoán chuyên nghiệp theo khoản 1 Điều 11.","basis":"Điểm b khoản 1 Điều 31 Luật Chứng khoán 2019 (sửa đổi, bổ sung bởi Luật 56/2024/QH15)","quote":"Đối tượng tham gia đợt chào bán chỉ bao gồm nhà đầu tư chiến lược, nhà đầu tư chứng khoán chuyên nghiệp theo quy định tại khoản 1 Điều 11 của Luật này đối với đợt chào bán cổ phiếu, trái phiếu chuyển đổi","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-031","part":"LUAT","subject":"LU","topic":"Chào bán riêng lẻ","level":3,"q":"Công ty đại chúng G hoàn thành đợt chào bán cổ phiếu riêng lẻ ngày 15/3/2026 cho Quỹ đầu tư H (nhà đầu tư chứng khoán chuyên nghiệp) và Tập đoàn K (nhà đầu tư chiến lược). Ngoài các trường hợp ngoại lệ, mỗi bên được chuyển nhượng số cổ phiếu này sớm nhất từ khi nào?","o":["Quỹ H và Tập đoàn K đều từ 15/3/2027","Quỹ H từ 15/3/2027; Tập đoàn K từ 15/3/2029","Quỹ H từ 15/9/2026; Tập đoàn K từ 15/3/2027","Quỹ H từ 15/3/2029; Tập đoàn K từ 15/3/2027"],"a":1,"e":"Điểm c khoản 1 Điều 31: cổ phiếu chào bán riêng lẻ bị hạn chế chuyển nhượng tối thiểu 03 năm đối với nhà đầu tư chiến lược và tối thiểu 01 năm đối với nhà đầu tư chứng khoán chuyên nghiệp kể từ ngày hoàn thành đợt chào bán (trừ chuyển nhượng giữa các nhà đầu tư chuyên nghiệp, theo bản án, quyết định của Tòa án, Trọng tài hoặc thừa kế).","basis":"Điểm c khoản 1 Điều 31 Luật Chứng khoán 2019 (sửa đổi, bổ sung bởi Luật 56/2024/QH15)","quote":"bị hạn chế tối thiểu là 03 năm đối với nhà đầu tư chiến lược và tối thiểu là 01 năm đối với nhà đầu tư chứng khoán chuyên nghiệp kể từ ngày hoàn thành đợt chào bán","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-032","part":"LUAT","subject":"LU","topic":"Chào bán riêng lẻ","level":1,"q":"Các đợt chào bán cổ phiếu riêng lẻ, trái phiếu chuyển đổi riêng lẻ, trái phiếu kèm chứng quyền riêng lẻ của công ty đại chúng phải cách nhau ít nhất bao lâu kể từ ngày kết thúc đợt chào bán gần nhất?","o":["03 tháng","12 tháng","06 tháng","01 tháng"],"a":2,"e":"Điểm d khoản 1 Điều 31: các đợt chào bán cổ phiếu, trái phiếu chuyển đổi, trái phiếu kèm chứng quyền riêng lẻ phải cách nhau ít nhất 06 tháng kể từ ngày kết thúc đợt chào bán gần nhất.","basis":"Điểm d khoản 1 Điều 31 Luật Chứng khoán 2019","quote":"phải cách nhau ít nhất 06 tháng kể từ ngày kết thúc đợt chào bán gần nhất","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-033","part":"LUAT","subject":"LU","topic":"Chào bán riêng lẻ","level":1,"q":"Theo Điều 31a Luật Chứng khoán (bổ sung bởi Luật 56/2024/QH15), UBCKNN có quyền đình chỉ đợt chào bán chứng khoán riêng lẻ đã đăng ký với UBCKNN tối đa bao lâu?","o":["30 ngày","90 ngày","45 ngày","60 ngày"],"a":3,"e":"Điều 31a (mới): UBCKNN đình chỉ đợt chào bán riêng lẻ tối đa 60 ngày khi hồ sơ có thông tin sai lệch, bỏ sót nội dung quan trọng hoặc việc phân phối không đúng quy định — tương tự cơ chế đình chỉ chào bán ra công chúng tại Điều 27.","basis":"Khoản 1 Điều 31a Luật Chứng khoán 2019 (sửa đổi, bổ sung bởi Luật 56/2024/QH15)","quote":"Ủy ban Chứng khoán Nhà nước có quyền đình chỉ đợt chào bán chứng khoán riêng lẻ đã đăng ký với Ủy ban Chứng khoán Nhà nước tối đa là 60 ngày","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-034","part":"LUAT","subject":"LU","topic":"Chào bán riêng lẻ","level":3,"q":"Công ty đại chúng M đã kết thúc đợt chào bán trái phiếu riêng lẻ đã đăng ký với UBCKNN. Sau đó UBCKNN phát hiện hồ sơ có thông tin sai lệch gây thiệt hại cho nhà đầu tư và quyết định hủy bỏ đợt chào bán. Nghĩa vụ của M là:","o":["Công bố việc hủy bỏ, thu hồi trái phiếu và hoàn tiền trong 15 ngày kể từ ngày bị hủy bỏ","Chỉ công bố thông tin, không phải hoàn tiền vì trái phiếu đã phát hành xong","Công bố việc hủy bỏ trong 15 ngày và hoàn tiền trong 30 ngày kể từ ngày nhà đầu tư yêu cầu","Hoàn tiền cho nhà đầu tư trong 90 ngày và được miễn bồi thường thiệt hại"],"a":0,"e":"Điều 31b (bổ sung bởi Luật 56/2024): UBCKNN hủy bỏ đợt chào bán trái phiếu riêng lẻ khi phát hiện vi phạm sau khi kết thúc đợt chào bán. Trong 07 ngày làm việc tổ chức phát hành công bố việc hủy bỏ, thu hồi chứng khoán và hoàn trả tiền trong 15 ngày kể từ ngày đợt chào bán bị hủy bỏ; quá hạn phải bồi thường thiệt hại.","basis":"Điểm c khoản 1, khoản 4 Điều 31b Luật Chứng khoán 2019 (sửa đổi, bổ sung bởi Luật 56/2024/QH15)","quote":"phải thu hồi chứng khoán đã phát hành, đồng thời hoàn trả tiền cho nhà đầu tư trong thời hạn 15 ngày kể từ ngày đợt chào bán bị hủy bỏ","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-035","part":"LUAT","subject":"LU","topic":"Công ty đại chúng","level":1,"q":"Theo điểm a khoản 1 Điều 32 Luật Chứng khoán (sửa đổi bởi Luật 56/2024/QH15), công ty cổ phần có vốn điều lệ đã góp từ 30 tỷ đồng và có tối thiểu 10% số cổ phiếu có quyền biểu quyết do ít nhất 100 nhà đầu tư không phải cổ đông lớn nắm giữ còn phải đáp ứng thêm điều kiện nào để là công ty đại chúng?","o":["Vốn chủ sở hữu từ 50 tỷ đồng trở lên","Vốn chủ sở hữu từ 30 tỷ đồng trở lên","Có ít nhất 02 năm liên tục kinh doanh có lãi","Đã niêm yết hoặc đăng ký giao dịch cổ phiếu"],"a":1,"e":"Luật 56/2024 bổ sung tiêu chí vốn chủ sở hữu từ 30 tỷ đồng trở lên (hiệu lực từ 01/01/2026) bên cạnh vốn điều lệ đã góp từ 30 tỷ đồng và cơ cấu cổ đông. Luật không đòi hỏi điều kiện lãi 02 năm (đó là điều kiện IPO) hay phải niêm yết trước; việc đăng ký giao dịch là nghĩa vụ phát sinh sau khi trở thành công ty đại chúng.","basis":"Điểm a khoản 1 Điều 32 Luật Chứng khoán 2019 (sửa đổi, bổ sung bởi Luật 56/2024/QH15)","quote":"Công ty có vốn điều lệ đã góp từ 30 tỷ đồng trở lên, có vốn chủ sở hữu từ 30 tỷ đồng trở lên và có tối thiểu 10% số cổ phiếu có quyền biểu quyết do ít nhất 100 nhà đầu tư không phải cổ đông lớn nắm giữ","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-036","part":"LUAT","subject":"LU","topic":"Công ty đại chúng","level":3,"q":"Công ty cổ phần N có vốn điều lệ đã góp 45 tỷ đồng; 300 cổ đông nhỏ (không phải cổ đông lớn) nắm 40% cổ phiếu có quyền biểu quyết. Báo cáo tài chính năm 2025 được kiểm toán cho thấy vốn chủ sở hữu của N chỉ còn 25 tỷ đồng do lỗ lũy kế. Tại tháng 11/2026, nhận định nào đúng về việc N có đáp ứng điều kiện công ty đại chúng theo điểm a khoản 1 Điều 32 Luật Chứng khoán?","o":["N vẫn đáp ứng vì chỉ cần vốn điều lệ đã góp từ 30 tỷ đồng trở lên","N vẫn đáp ứng vì tiêu chí vốn chủ sở hữu chỉ có hiệu lực từ năm 2027","N không đáp ứng điều kiện công ty đại chúng vì vốn chủ sở hữu dưới 30 tỷ đồng","N không đáp ứng vì cổ đông nhỏ phải nắm tối thiểu 50% cổ phiếu có quyền biểu quyết"],"a":2,"e":"Tiêu chí vốn chủ sở hữu từ 30 tỷ đồng tại điểm a khoản 1 Điều 32 (Luật 56/2024) có hiệu lực từ 01/01/2026. N có VCSH 25 tỷ nên không đáp ứng; nếu N đang là công ty đại chúng thì theo khoản 2 Điều 38 phải báo cáo UBCKNN trong 15 ngày và sau 01 năm vẫn không đáp ứng thì bị xem xét hủy tư cách công ty đại chúng. Cơ cấu cổ đông chỉ yêu cầu tối thiểu 10%.","basis":"Điểm a khoản 1 Điều 32; khoản 2 Điều 38 Luật Chứng khoán 2019 (sửa đổi, bổ sung bởi Luật 56/2024/QH15); khoản 2 Điều 10 Luật 56/2024/QH15","quote":"đối với quy định về vốn chủ sở hữu có hiệu lực kể từ ngày 01 tháng 01 năm 2026.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-037","part":"LUAT","subject":"LU","topic":"Công ty đại chúng","level":1,"q":"Công ty cổ phần đáp ứng điều kiện tại điểm a khoản 1 Điều 32 Luật Chứng khoán phải nộp hồ sơ đăng ký công ty đại chúng cho UBCKNN trong thời hạn nào?","o":["30 ngày kể từ ngày hoàn thành việc góp vốn và có cơ cấu cổ đông đáp ứng quy định","60 ngày kể từ ngày được cấp Giấy chứng nhận đăng ký doanh nghiệp","15 ngày kể từ ngày Đại hội đồng cổ đông thông qua","90 ngày kể từ ngày hoàn thành việc góp vốn và có cơ cấu cổ đông đáp ứng quy định"],"a":3,"e":"Khoản 2 Điều 32: thời hạn nộp hồ sơ là 90 ngày kể từ ngày công ty hoàn thành việc góp vốn và có cơ cấu cổ đông đáp ứng điều kiện. UBCKNN xác nhận hoàn tất đăng ký trong 15 ngày kể từ ngày nhận hồ sơ đầy đủ, hợp lệ.","basis":"Khoản 2, 3 Điều 32 Luật Chứng khoán 2019","quote":"trong thời hạn 90 ngày kể từ ngày công ty hoàn thành việc góp vốn và có cơ cấu cổ đông đáp ứng quy định tại điểm a khoản 1 Điều này","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-038","part":"LUAT","subject":"LU","topic":"Công ty đại chúng","level":2,"q":"Công ty đại chúng hình thành theo điểm a khoản 1 Điều 32 (không qua IPO) phải đăng ký giao dịch cổ phiếu trên hệ thống giao dịch cho chứng khoán chưa niêm yết trong thời hạn nào?","o":["30 ngày kể từ ngày UBCKNN xác nhận hoàn tất đăng ký công ty đại chúng","90 ngày kể từ ngày nộp hồ sơ đăng ký công ty đại chúng cho UBCKNN","01 năm kể từ ngày đáp ứng đủ điều kiện là công ty đại chúng","30 ngày kể từ ngày được cấp Giấy chứng nhận đăng ký doanh nghiệp"],"a":0,"e":"Điểm d khoản 1 Điều 34: đăng ký giao dịch trong 30 ngày kể từ ngày UBCKNN xác nhận hoàn tất đăng ký công ty đại chúng; sau 02 năm kể từ ngày giao dịch đầu tiên trên hệ thống chứng khoán chưa niêm yết, công ty có quyền nộp hồ sơ niêm yết nếu đáp ứng điều kiện.","basis":"Điểm d khoản 1 Điều 34 Luật Chứng khoán 2019","quote":"phải đăng ký giao dịch cổ phiếu trên hệ thống giao dịch cho chứng khoán chưa niêm yết trong thời hạn 30 ngày kể từ ngày Ủy ban Chứng khoán Nhà nước xác nhận hoàn tất việc đăng ký công ty đại chúng","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-039","part":"LUAT","subject":"LU","topic":"Công ty đại chúng","level":1,"q":"Tổ chức, cá nhân và người có liên quan dự kiến mua cổ phiếu có quyền biểu quyết đang lưu hành dẫn đến sở hữu đạt từ bao nhiêu phần trăm trở lên số cổ phiếu có quyền biểu quyết của 01 công ty đại chúng thì phải chào mua công khai?","o":["20%","25%","35%","51%"],"a":1,"e":"Điểm a khoản 1 Điều 35: ngưỡng chào mua công khai đầu tiên là sở hữu đạt từ 25% trở lên; với người đã nắm từ 25%, mua tiếp đạt hoặc vượt 35%, 45%, 55%, 65%, 75% cũng phải chào mua công khai.","basis":"Điểm a khoản 1 Điều 35 Luật Chứng khoán 2019","quote":"dẫn đến trực tiếp hoặc gián tiếp sở hữu đạt từ 25% trở lên số cổ phiếu có quyền biểu quyết của 01 công ty đại chúng","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-040","part":"LUAT","subject":"LU","topic":"Công ty đại chúng","level":3,"q":"Công ty Q cùng người có liên quan đang nắm 30% cổ phiếu có quyền biểu quyết của công ty đại chúng R. Q dự kiến mua thêm 6% cổ phiếu R đang lưu hành qua giao dịch khớp lệnh (không thuộc trường hợp miễn trừ). Nhận định nào đúng?","o":["Q không phải chào mua công khai vì đã vượt ngưỡng 25% từ trước","Q chỉ phải chào mua công khai khi sở hữu đạt từ 51% trở lên","Q phải chào mua công khai vì tỷ lệ sở hữu sau giao dịch vượt mức 35%","Q không phải chào mua công khai vì giao dịch qua phương thức khớp lệnh"],"a":2,"e":"Điểm b khoản 1 Điều 35: người đang nắm từ 25% trở lên dự kiến mua tiếp dẫn đến sở hữu đạt hoặc vượt các mức 35%, 45%, 55%, 65%, 75% phải chào mua công khai. 30% + 6% = 36% > 35% nên phải chào mua công khai; phương thức giao dịch không phải căn cứ miễn trừ.","basis":"Điểm b khoản 1, khoản 2 Điều 35 Luật Chứng khoán 2019","quote":"dự kiến mua tiếp dẫn đến trực tiếp hoặc gián tiếp sở hữu đạt hoặc vượt mức 35%, 45%, 55%, 65%, 75% số cổ phiếu có quyền biểu quyết","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-041","part":"LUAT","subject":"LU","topic":"Công ty đại chúng","level":2,"q":"Trường hợp nào sau đây KHÔNG phải chào mua công khai dù tỷ lệ sở hữu đạt ngưỡng quy định tại khoản 1 Điều 35 Luật Chứng khoán?","o":["Mua thỏa thuận từ một cổ đông dẫn đến sở hữu 28%, chưa được ĐHĐCĐ thông qua","Mua liên tục qua khớp lệnh trên sàn dẫn đến sở hữu 26%","Nhóm người có liên quan cùng mua dẫn đến tổng sở hữu của nhóm đạt 25%","Nhận thừa kế cổ phiếu dẫn đến sở hữu 30% cổ phiếu có quyền biểu quyết"],"a":3,"e":"Khoản 2 Điều 35 liệt kê các trường hợp miễn chào mua công khai, trong đó có tặng cho, thừa kế cổ phiếu, chứng chỉ quỹ đóng. Nhận chuyển nhượng chỉ được miễn khi đã được ĐHĐCĐ thông qua và xác định rõ đối tượng; sở hữu của nhóm người có liên quan được cộng gộp.","basis":"Điểm e khoản 2 Điều 35 Luật Chứng khoán 2019","quote":"Tặng cho, thừa kế cổ phiếu, chứng chỉ quỹ đóng;","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-042","part":"LUAT","subject":"LU","topic":"Công ty đại chúng","level":2,"q":"Sau khi thực hiện chào mua công khai (không phải chào mua toàn bộ), tổ chức cùng người có liên quan nắm giữ từ 80% trở lên số cổ phiếu có quyền biểu quyết của công ty đại chúng thì phải:","o":["Mua tiếp cổ phiếu của cổ đông còn lại trong 30 ngày, giá và cách thanh toán như đợt chào mua","Buộc các cổ đông còn lại bán cổ phiếu theo giá do Hội đồng quản trị quyết định","Làm thủ tục hủy tư cách công ty đại chúng trong 30 ngày kể từ ngày kết thúc chào mua","Mua tiếp cổ phiếu của cổ đông còn lại trong 90 ngày theo giá thị trường tại thời điểm mua"],"a":0,"e":"Điểm c khoản 1 Điều 35: sau chào mua công khai, nếu nắm từ 80% trở lên thì phải mua tiếp số cổ phiếu do các cổ đông còn lại nắm giữ trong 30 ngày theo điều kiện giá chào mua và phương thức thanh toán tương tự đợt chào mua (bảo vệ cổ đông thiểu số).","basis":"Điểm c khoản 1 Điều 35 Luật Chứng khoán 2019","quote":"phải mua tiếp số cổ phiếu, chứng chỉ quỹ đóng do các cổ đông, nhà đầu tư còn lại nắm giữ trong thời hạn 30 ngày theo các điều kiện về giá chào mua và phương thức thanh toán tương tự với đợt chào mua công khai","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-043","part":"LUAT","subject":"LU","topic":"Công ty đại chúng","level":2,"q":"Nguồn nào sau đây KHÔNG được sử dụng để công ty đại chúng mua lại cổ phiếu của chính mình theo khoản 1 Điều 36 Luật Chứng khoán?","o":["Thặng dư vốn cổ phần của công ty","Khoản vay ngắn hạn ngân hàng","Quỹ đầu tư phát triển của công ty","Lợi nhuận sau thuế chưa phân phối"],"a":1,"e":"Điểm b khoản 1 Điều 36: nguồn mua lại gồm thặng dư vốn cổ phần, quỹ đầu tư phát triển, lợi nhuận sau thuế chưa phân phối, quỹ khác thuộc vốn chủ sở hữu được sử dụng để bổ sung vốn điều lệ. Vốn vay không thuộc vốn chủ sở hữu.","basis":"Điểm b khoản 1 Điều 36 Luật Chứng khoán 2019","quote":"thặng dư vốn cổ phần, quỹ đầu tư phát triển, lợi nhuận sau thuế chưa phân phối, quỹ khác thuộc vốn chủ sở hữu được sử dụng để bổ sung vốn điều lệ theo quy định của pháp luật","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-044","part":"LUAT","subject":"LU","topic":"Công ty đại chúng","level":3,"q":"Công ty đại chúng S báo cáo kết quả đợt mua lại cổ phiếu (để giảm vốn điều lệ) ngày 10/02/2026. Ngày 01/6/2026, S muốn triển khai đợt mua lại mới không thuộc các trường hợp miễn trừ tại khoản 2 Điều 36. Nhận định nào đúng?","o":["S được mua lại ngay nếu có nghị quyết Đại hội đồng cổ đông","S được mua lại vì chỉ cần cách đợt trước tối thiểu 03 tháng","Chưa được mua lại vì chưa đủ 06 tháng từ ngày báo cáo kết quả đợt trước","S chưa được mua lại vì các đợt mua lại phải cách nhau tối thiểu 12 tháng"],"a":2,"e":"Điểm d khoản 3 Điều 36: công ty đại chúng không được mua lại cổ phiếu nếu đã thực hiện mua lại trong thời hạn 06 tháng kể từ ngày báo cáo kết quả mua lại (trừ trường hợp miễn trừ). Từ 10/02/2026 đến 01/6/2026 chưa đủ 06 tháng (sớm nhất từ 10/8/2026).","basis":"Điểm d khoản 3 Điều 36 Luật Chứng khoán 2019","quote":"Đã thực hiện việc mua lại cổ phiếu của chính mình trong thời hạn 06 tháng kể từ ngày báo cáo kết quả mua lại","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-045","part":"LUAT","subject":"LU","topic":"Công ty đại chúng","level":2,"q":"Theo khoản 6 Điều 36 Luật Chứng khoán (sửa đổi bởi Luật 56/2024/QH15), khi công ty mua lại cổ phiếu của người lao động theo quy chế phát hành cổ phiếu cho người lao động thì:","o":["Phải làm thủ tục giảm vốn điều lệ trong 10 ngày kể từ ngày báo cáo ĐHĐCĐ thường niên","Phải được UBCKNN chấp thuận trước và giảm vốn điều lệ trong 30 ngày","Phải hủy toàn bộ số cổ phiếu đã mua lại trong thời hạn 06 tháng","Báo cáo tại ĐHĐCĐ thường niên gần nhất, không phải làm thủ tục giảm vốn điều lệ"],"a":3,"e":"Luật 56/2024 sửa khoản 6 Điều 36: tổng số cổ phiếu của người lao động được mua lại phải báo cáo tại ĐHĐCĐ thường niên gần nhất; công ty không phải làm thủ tục giảm vốn điều lệ đối với số cổ phiếu này. Quy định cũ buộc giảm vốn điều lệ trong 10 ngày kể từ ngày báo cáo ĐHĐCĐ.","basis":"Khoản 6 Điều 36 Luật Chứng khoán 2019 (sửa đổi, bổ sung bởi Luật 56/2024/QH15)","quote":"Công ty không phải làm thủ tục giảm vốn điều lệ đối với số cổ phiếu được công ty mua lại.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-046","part":"LUAT","subject":"LU","topic":"Công ty đại chúng","level":2,"q":"Công ty đại chúng T đã nhận được thông báo của UBCKNN về việc nhận đủ tài liệu báo cáo mua lại cổ phiếu và đã công bố thông tin theo quy định. Phát biểu nào đúng về thời gian thực hiện giao dịch mua lại của T?","o":["Mua sau 07 ngày làm việc kể từ ngày công bố; kết thúc trong 30 ngày kể từ ngày bắt đầu","Được mua lại ngay ngày làm việc kế tiếp sau ngày công bố; kết thúc tối đa 90 ngày","Được mua lại sau 15 ngày kể từ ngày công bố thông tin; không giới hạn thời gian kết thúc","Chỉ được mua lại sau khi UBCKNN cấp Giấy chứng nhận mua lại cổ phiếu"],"a":0,"e":"Khoản 4 Điều 37: công ty được thực hiện mua lại sau 07 ngày làm việc kể từ ngày công bố thông tin. Khoản 6 Điều 37: phải kết thúc theo thời gian đã công bố nhưng tối đa 30 ngày kể từ ngày bắt đầu giao dịch; báo cáo kết quả trong 10 ngày kể từ ngày kết thúc giao dịch.","basis":"Khoản 4, 6 Điều 37 Luật Chứng khoán 2019","quote":"Công ty đại chúng được thực hiện mua lại cổ phiếu sau 07 ngày làm việc kể từ ngày công bố thông tin.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-047","part":"LUAT","subject":"LU","topic":"Công ty đại chúng","level":2,"q":"Theo Điều 38 Luật Chứng khoán (sửa đổi bởi Luật 56/2024/QH15), trường hợp nào sau đây công ty đại chúng bị hủy tư cách công ty đại chúng?","o":["Kết quả kinh doanh thua lỗ trong 02 năm tài chính liên tục gần nhất","Không công bố BCTC năm được kiểm toán trong 02 năm liên tục","Chậm công bố báo cáo tài chính quý 02 lần trong cùng một năm tài chính","Bị hủy niêm yết và chuyển sang đăng ký giao dịch trên hệ thống UPCoM"],"a":1,"e":"Khoản 1 Điều 38 (Luật 56/2024): hủy tư cách khi không còn đáp ứng điều kiện tại điểm a khoản 1 Điều 32; không công bố BCTC năm được kiểm toán hoặc nghị quyết ĐHĐCĐ thường niên trong 02 năm liên tục; hoặc trong 01 năm không đăng ký cổ phiếu tại VSDC/không đăng ký niêm yết, đăng ký giao dịch.","basis":"Điểm b khoản 1 Điều 38 Luật Chứng khoán 2019 (sửa đổi, bổ sung bởi Luật 56/2024/QH15)","quote":"Không thực hiện công bố thông tin trong 02 năm liên tục về báo cáo tài chính năm được kiểm toán","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-048","part":"LUAT","subject":"LU","topic":"Công ty đại chúng","level":1,"q":"Theo Điều 41 Luật Chứng khoán, Hội đồng quản trị công ty đại chúng phải tổ chức họp với tần suất tối thiểu nào?","o":["Mỗi tháng 01 lần","06 tháng 01 lần","Mỗi quý 01 lần","Mỗi năm 02 lần"],"a":2,"e":"Điểm c khoản 3 Điều 41: Hội đồng quản trị phải tổ chức họp ít nhất mỗi quý 01 lần theo trình tự, thủ tục tại Điều lệ công ty và Quy chế nội bộ về quản trị công ty.","basis":"Điểm c khoản 3 Điều 41 Luật Chứng khoán 2019","quote":"Hội đồng quản trị phải tổ chức họp ít nhất mỗi quý 01 lần","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-049","part":"LUAT","subject":"LU","topic":"SGDCK & VSDC","level":1,"q":"Theo Luật Chứng khoán, Sở giao dịch chứng khoán Việt Nam là doanh nghiệp do Nhà nước nắm giữ:","o":["100% vốn điều lệ hoặc tổng số cổ phần có quyền biểu quyết","Từ 65% vốn điều lệ hoặc tổng số cổ phần có quyền biểu quyết","Từ 36% vốn điều lệ hoặc tổng số cổ phần có quyền biểu quyết","Trên 50% vốn điều lệ hoặc tổng số cổ phần có quyền biểu quyết"],"a":3,"e":"Khoản 1 Điều 43: SGDCK Việt Nam là doanh nghiệp thành lập và hoạt động theo Luật Chứng khoán và Luật Doanh nghiệp, do Nhà nước nắm giữ trên 50% vốn điều lệ hoặc tổng số cổ phần có quyền biểu quyết. VSDC cũng có quy định tương tự (Điều 52).","basis":"Khoản 1 Điều 43 Luật Chứng khoán 2019","quote":"do Nhà nước nắm giữ trên 50% vốn điều lệ hoặc tổng số cổ phần có quyền biểu quyết","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-050","part":"LUAT","subject":"LU","topic":"SGDCK & VSDC","level":1,"q":"Cơ quan nào quyết định thành lập, giải thể, mô hình hoạt động, hình thức sở hữu của Sở giao dịch chứng khoán Việt Nam?","o":["Thủ tướng Chính phủ, theo đề nghị của Bộ trưởng Bộ Tài chính","Bộ trưởng Bộ Tài chính, theo đề nghị của Chủ tịch UBCKNN","Chủ tịch Ủy ban Chứng khoán Nhà nước","Quốc hội, theo đề nghị của Chính phủ"],"a":0,"e":"Khoản 2 Điều 43: Thủ tướng Chính phủ quyết định thành lập, giải thể, mô hình hoạt động, hình thức sở hữu, chức năng, quyền và nghĩa vụ của SGDCK Việt Nam và việc thành lập công ty con theo đề nghị của Bộ trưởng Bộ Tài chính.","basis":"Khoản 2 Điều 43 Luật Chứng khoán 2019","quote":"Thủ tướng Chính phủ quyết định thành lập, giải thể, mô hình hoạt động, hình thức sở hữu, chức năng, quyền và nghĩa vụ của Sở giao dịch chứng khoán Việt Nam","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-051","part":"LUAT","subject":"LU","topic":"SGDCK & VSDC","level":2,"q":"Ngân hàng thương mại có thể trở thành loại thành viên nào của Sở giao dịch chứng khoán Việt Nam?","o":["Thành viên giao dịch thông thường như công ty chứng khoán","Thành viên giao dịch đặc biệt của Sở giao dịch chứng khoán","Thành viên lưu ký của Sở giao dịch chứng khoán","Thành viên bù trừ của Sở giao dịch chứng khoán"],"a":1,"e":"Khoản 1 Điều 47: thành viên của SGDCK gồm thành viên giao dịch (công ty chứng khoán) và thành viên giao dịch đặc biệt (ngân hàng thương mại, chi nhánh ngân hàng nước ngoài và tổ chức khác được chấp thuận). Thành viên lưu ký, thành viên bù trừ là thành viên của VSDC (Điều 56).","basis":"Khoản 1 Điều 47 Luật Chứng khoán 2019","quote":"Thành viên giao dịch đặc biệt là ngân hàng thương mại, chi nhánh ngân hàng nước ngoài và các tổ chức khác được Sở giao dịch chứng khoán Việt Nam chấp thuận trở thành thành viên giao dịch đặc biệt.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-052","part":"LUAT","subject":"LU","topic":"SGDCK & VSDC","level":2,"q":"Chứng khoán niêm yết, đăng ký giao dịch có được giao dịch bên ngoài hệ thống giao dịch chứng khoán do SGDCK Việt Nam và công ty con tổ chức không?","o":["Được, nếu hai bên lập hợp đồng chuyển nhượng có công chứng hợp lệ","Được, nếu giá trị mỗi giao dịch dưới 100 triệu đồng và báo cáo SGDCK","Không, trừ giao dịch không mang tính mua bán hoặc không thể qua hệ thống","Không, trong mọi trường hợp kể cả thừa kế, tặng cho cổ phiếu"],"a":2,"e":"Khoản 2 Điều 50: chứng khoán niêm yết, đăng ký giao dịch không được giao dịch bên ngoài hệ thống, trừ giao dịch không mang tính chất mua bán (ví dụ thừa kế, tặng cho) hoặc giao dịch khác không thể thực hiện được thông qua hệ thống; Bộ trưởng Bộ Tài chính quy định chi tiết các trường hợp này.","basis":"Khoản 2, 4 Điều 50 Luật Chứng khoán 2019","quote":"Chứng khoán niêm yết, đăng ký giao dịch không được giao dịch bên ngoài hệ thống giao dịch chứng khoán do Sở giao dịch chứng khoán Việt Nam và công ty con tổ chức, trừ trường hợp giao dịch không mang tính chất mua bán","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-053","part":"LUAT","subject":"LU","topic":"SGDCK & VSDC","level":2,"q":"Đối với chứng khoán đã lưu ký tại Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam (VSDC), việc chuyển quyền sở hữu chứng khoán có hiệu lực vào ngày nào?","o":["Ngày khớp lệnh giao dịch trên hệ thống của SGDCK","Ngày nhà đầu tư thanh toán đủ tiền cho công ty chứng khoán","Ngày tổ chức phát hành ghi tên người mua vào sổ cổ đông","Ngày ghi sổ bút toán trên tài khoản lưu ký tại VSDC"],"a":3,"e":"Khoản 2 Điều 64: chuyển quyền sở hữu chứng khoán đã lưu ký tại VSDC có hiệu lực vào ngày thực hiện bút toán ghi sổ trên tài khoản lưu ký tại VSDC; với chứng khoán đăng ký tập trung nhưng chưa lưu ký, hiệu lực vào ngày ghi Sổ đăng ký người sở hữu do VSDC quản lý.","basis":"Khoản 2 Điều 64 Luật Chứng khoán 2019","quote":"việc chuyển quyền sở hữu chứng khoán có hiệu lực vào ngày thực hiện bút toán ghi sổ trên tài khoản lưu ký chứng khoán tại Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-054","part":"LUAT","subject":"LU","topic":"SGDCK & VSDC","level":1,"q":"Ngân hàng thương mại V là thành viên bù trừ của VSDC. Đối với giao dịch chứng khoán phái sinh, V được thực hiện bù trừ, thanh toán giao dịch cho đối tượng nào?","o":["Chỉ cho chính ngân hàng V, không cho khách hàng","Cho mọi nhà đầu tư mở tài khoản tại V","Cho các công ty chứng khoán chưa là thành viên bù trừ","Cho khách hàng là tổ chức, không cho khách hàng cá nhân"],"a":0,"e":"Điểm a khoản 4 Điều 56 (sửa đổi bởi Luật 56/2024): thành viên bù trừ là ngân hàng thương mại, chi nhánh ngân hàng nước ngoài khi bù trừ, thanh toán giao dịch chứng khoán phái sinh chỉ được thực hiện cho chính mình.","basis":"Điểm a khoản 4 Điều 56 Luật Chứng khoán 2019 (sửa đổi, bổ sung bởi Luật 56/2024/QH15)","quote":"thành viên bù trừ là ngân hàng thương mại, chi nhánh ngân hàng nước ngoài chỉ được thực hiện bù trừ, thanh toán giao dịch cho chính thành viên bù trừ là ngân hàng thương mại, chi nhánh ngân hàng nước ngoài","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-055","part":"LUAT","subject":"LU","topic":"SGDCK & VSDC","level":3,"q":"Ngân hàng thương mại W có vốn điều lệ 9.500 tỷ đồng, kinh doanh có lãi 03 năm liên tục, đáp ứng tỷ lệ an toàn vốn tối thiểu và các yêu cầu kỹ thuật kết nối với VSDC, NHNN. W muốn được UBCKNN lựa chọn làm ngân hàng thanh toán. Nhận định nào đúng?","o":["W đủ điều kiện vì đã có lãi trong 02 năm gần nhất","W chưa đủ điều kiện vì vốn điều lệ phải trên 10.000 tỷ đồng","W chưa đủ điều kiện vì phải có lãi 05 năm liên tục","W đủ điều kiện nếu được Ngân hàng Nhà nước chấp thuận"],"a":1,"e":"Khoản 2 Điều 69: ngân hàng thương mại được chọn làm ngân hàng thanh toán phải có vốn điều lệ trên 10.000 tỷ đồng, có lãi 02 năm gần nhất, đáp ứng tỷ lệ an toàn vốn, có hệ thống kết nối với VSDC và NHNN, lưu trữ dữ liệu ít nhất 10 năm. W thiếu điều kiện vốn điều lệ.","basis":"Điểm b khoản 2 Điều 69 Luật Chứng khoán 2019","quote":"Có vốn điều lệ trên 10.000 tỷ đồng;","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-056","part":"LUAT","subject":"LU","topic":"CTCK & CTQLQ","level":1,"q":"Nghiệp vụ nào sau đây KHÔNG thuộc nghiệp vụ kinh doanh của công ty chứng khoán theo Điều 72 Luật Chứng khoán?","o":["Tư vấn đầu tư chứng khoán","Bảo lãnh phát hành chứng khoán","Quản lý quỹ đầu tư chứng khoán","Tự doanh chứng khoán"],"a":2,"e":"Công ty chứng khoán được cấp phép một, một số hoặc toàn bộ nghiệp vụ: môi giới, tự doanh, bảo lãnh phát hành, tư vấn đầu tư chứng khoán. Quản lý quỹ đầu tư chứng khoán là nghiệp vụ của công ty quản lý quỹ (Điều 73).","basis":"Khoản 1 Điều 72 Luật Chứng khoán 2019","quote":"Công ty chứng khoán được cấp phép thực hiện một, một số hoặc toàn bộ nghiệp vụ kinh doanh sau đây","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-057","part":"LUAT","subject":"LU","topic":"CTCK & CTQLQ","level":2,"q":"Công ty chứng khoán X hiện chỉ được cấp phép nghiệp vụ môi giới chứng khoán và muốn bổ sung nghiệp vụ bảo lãnh phát hành. Nhận định nào đúng?","o":["X được cấp phép bảo lãnh phát hành ngay vì đã có nghiệp vụ môi giới","X phải có nghiệp vụ tư vấn đầu tư chứng khoán mới được cấp phép bảo lãnh","X không thể được cấp phép vì bảo lãnh phát hành chỉ dành cho ngân hàng","Chỉ được cấp phép bảo lãnh khi X đã có nghiệp vụ tự doanh chứng khoán"],"a":3,"e":"Khoản 2, 3 Điều 72: chỉ được cấp phép tự doanh khi đã có phép môi giới; chỉ được cấp phép bảo lãnh phát hành khi đã có phép tự doanh. Do đó X cần có nghiệp vụ tự doanh trước khi được cấp phép bảo lãnh phát hành.","basis":"Khoản 2, 3 Điều 72 Luật Chứng khoán 2019","quote":"Công ty chứng khoán chỉ được cấp phép thực hiện nghiệp vụ bảo lãnh phát hành chứng khoán khi được cấp phép thực hiện nghiệp vụ tự doanh chứng khoán.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-058","part":"LUAT","subject":"LU","topic":"CTCK & CTQLQ","level":2,"q":"Phát biểu nào đúng về nghiệp vụ kinh doanh của công ty quản lý quỹ đầu tư chứng khoán theo Luật Chứng khoán?","o":["Quản lý quỹ, quản lý danh mục và tư vấn đầu tư, cấp chung trong Giấy phép","Gồm quản lý quỹ và môi giới chứng khoán, được cấp phép riêng từng nghiệp vụ","Gồm quản lý quỹ, tự doanh và bảo lãnh phát hành chứng khoán","Chỉ gồm quản lý quỹ; các nghiệp vụ khác phải đề nghị cấp phép bổ sung"],"a":0,"e":"Điều 73: công ty quản lý quỹ được thực hiện quản lý quỹ đầu tư chứng khoán, quản lý danh mục đầu tư chứng khoán, tư vấn đầu tư chứng khoán; các nghiệp vụ này được cấp chung trong Giấy phép thành lập và hoạt động kinh doanh chứng khoán.","basis":"Điều 73 Luật Chứng khoán 2019","quote":"Các nghiệp vụ kinh doanh quy định tại khoản 1 Điều này được cấp chung trong Giấy phép thành lập và hoạt động kinh doanh chứng khoán của công ty quản lý quỹ đầu tư chứng khoán.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-059","part":"LUAT","subject":"LU","topic":"CTCK & CTQLQ","level":3,"q":"Nhóm sáng lập dự kiến thành lập công ty chứng khoán Z (công ty cổ phần) với cơ cấu: Công ty sản xuất A góp 40%, Ngân hàng thương mại B góp 20%, 05 cá nhân góp 40% vốn điều lệ. Cơ cấu này:","o":["Đáp ứng vì đã có tối thiểu 02 cổ đông sáng lập là tổ chức góp vốn","Chưa đáp ứng tỷ lệ vốn góp tối thiểu của tổ chức và của ngân hàng, bảo hiểm","Đáp ứng vì các tổ chức nắm giữ trên 51% vốn điều lệ của công ty","Chưa đáp ứng chỉ vì cá nhân không được góp vốn thành lập công ty chứng khoán"],"a":1,"e":"Khoản 3 Điều 74: tối thiểu 02 cổ đông sáng lập là tổ chức; tổng tỷ lệ vốn góp của các tổ chức tối thiểu 65% vốn điều lệ, trong đó doanh nghiệp bảo hiểm, ngân hàng thương mại sở hữu tối thiểu 30%. Z: tổ chức 60% < 65%, ngân hàng 20% < 30% nên không đạt. Cá nhân vẫn được góp vốn.","basis":"Khoản 3 Điều 74 Luật Chứng khoán 2019","quote":"Tổng tỷ lệ vốn góp của các tổ chức tối thiểu là 65% vốn điều lệ, trong đó các tổ chức là doanh nghiệp bảo hiểm, ngân hàng thương mại sở hữu tối thiểu là 30% vốn điều lệ.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-060","part":"LUAT","subject":"LU","topic":"CTCK & CTQLQ","level":1,"q":"Theo Điều 74 Luật Chứng khoán, Tổng giám đốc (Giám đốc) công ty chứng khoán phải có loại chứng chỉ hành nghề nào?","o":["CCHN môi giới chứng khoán hoặc CCHN phân tích tài chính","Bất kỳ loại CCHN chứng khoán nào do UBCKNN cấp","CCHN phân tích tài chính hoặc CCHN quản lý quỹ","Chỉ CCHN quản lý quỹ, không chấp nhận loại khác"],"a":2,"e":"Điểm c khoản 5 Điều 74: Tổng giám đốc công ty chứng khoán phải có CCHN phân tích tài chính hoặc CCHN quản lý quỹ, có tối thiểu 02 năm kinh nghiệm và không bị xử phạt VPHC trong lĩnh vực chứng khoán trong 06 tháng gần nhất.","basis":"Điểm c khoản 5 Điều 74 Luật Chứng khoán 2019","quote":"Có chứng chỉ hành nghề phân tích tài chính hoặc chứng chỉ hành nghề quản lý quỹ;","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-061","part":"LUAT","subject":"LU","topic":"CTCK & CTQLQ","level":2,"q":"Điều kiện nhân sự để cấp Giấy phép thành lập và hoạt động cho công ty quản lý quỹ đầu tư chứng khoán gồm:","o":["Tổng giám đốc, tối thiểu 03 nhân viên có CCHN quản lý quỹ và 01 nhân viên kiểm soát tuân thủ","Tổng giám đốc, tối thiểu 05 nhân viên có CCHN bất kỳ và 01 nhân viên kiểm toán nội bộ","Tổng giám đốc, tối thiểu 02 nhân viên có CCHN quản lý quỹ, không bắt buộc kiểm soát tuân thủ","Tổng giám đốc, tối thiểu 05 nhân viên có CCHN quản lý quỹ và 01 nhân viên kiểm soát tuân thủ"],"a":3,"e":"Khoản 5 Điều 75: công ty quản lý quỹ phải có Tổng giám đốc, tối thiểu 05 nhân viên có CCHN quản lý quỹ và tối thiểu 01 nhân viên kiểm soát tuân thủ; Tổng giám đốc cần tối thiểu 04 năm kinh nghiệm. Con số 03 nhân viên/nghiệp vụ là điều kiện của công ty chứng khoán.","basis":"Khoản 5 Điều 75 Luật Chứng khoán 2019","quote":"Có Tổng giám đốc (Giám đốc), tối thiểu 05 nhân viên có chứng chỉ hành nghề quản lý quỹ và tối thiểu 01 nhân viên kiểm soát tuân thủ.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-062","part":"LUAT","subject":"LU","topic":"CTCK & CTQLQ","level":3,"q":"Công ty chứng khoán P được cấp Giấy phép thành lập và hoạt động ngày 01/7/2024. Tháng 10/2026, cổ đông sáng lập Q muốn chuyển nhượng toàn bộ cổ phần của mình cho một nhà đầu tư không phải cổ đông sáng lập. Nhận định nào đúng?","o":["Không được, vì chưa hết 03 năm kể từ ngày P được cấp giấy phép","Được, vì đã quá 01 năm kể từ ngày P được cấp giấy phép","Được, nếu Đại hội đồng cổ đông của P thông qua việc chuyển nhượng","Không được, vì cổ đông sáng lập bị hạn chế chuyển nhượng 05 năm"],"a":0,"e":"Khoản 4 Điều 91: cổ đông sáng lập, thành viên góp vốn khi thành lập công ty chứng khoán, công ty quản lý quỹ không được chuyển nhượng cổ phần, phần vốn góp trong 03 năm kể từ ngày được cấp giấy phép, trừ chuyển nhượng giữa các cổ đông sáng lập. Hạn chế kéo dài đến 01/7/2027.","basis":"Khoản 4 Điều 91 Luật Chứng khoán 2019","quote":"không được chuyển nhượng cổ phần hoặc phần vốn góp của mình trong thời hạn 03 năm kể từ ngày được cấp giấy phép, trừ trường hợp chuyển nhượng giữa các cổ đông sáng lập, thành viên góp vốn khi thành lập công ty","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-063","part":"LUAT","subject":"LU","topic":"CTCK & CTQLQ","level":2,"q":"Hành vi nào sau đây công ty chứng khoán KHÔNG được thực hiện?","o":["Ưu tiên thực hiện lệnh của khách hàng trước lệnh tự doanh của công ty","Cam kết bảo đảm khách hàng không bị thua lỗ khi đầu tư cổ phiếu","Cung cấp thông tin khách hàng theo yêu cầu của cơ quan có thẩm quyền","Ký hợp đồng bằng văn bản với khách hàng khi cung cấp dịch vụ"],"a":1,"e":"Khoản 1 Điều 91 cấm đưa ra nhận định hoặc bảo đảm về mức thu nhập, lợi nhuận hoặc bảo đảm khách hàng không bị thua lỗ, trừ chứng khoán có thu nhập cố định. Ưu tiên lệnh khách hàng và ký hợp đồng bằng văn bản là nghĩa vụ (Điều 89); cung cấp thông tin theo yêu cầu cơ quan có thẩm quyền là ngoại lệ được phép (khoản 2 Điều 91).","basis":"Khoản 1, 2 Điều 91; khoản 4, 5 Điều 89 Luật Chứng khoán 2019","quote":"Không được đưa ra nhận định hoặc bảo đảm với khách hàng về mức thu nhập hoặc lợi nhuận đạt được trên khoản đầu tư của mình hoặc bảo đảm khách hàng không bị thua lỗ, trừ trường hợp đầu tư vào chứng khoán có thu nhập cố định.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-064","part":"LUAT","subject":"LU","topic":"CTCK & CTQLQ","level":3,"q":"Ngày 05/8/2026, vốn chủ sở hữu của công ty chứng khoán R xuống thấp hơn vốn điều lệ tối thiểu theo quy định. Theo Điều 85 Luật Chứng khoán, R phải xử lý thế nào?","o":["Thông qua phương án khắc phục, báo cáo UBCKNN trong 15 ngày; thời gian khắc phục tối đa 03 tháng","Thông qua phương án khắc phục, báo cáo UBCKNN trong 30 ngày; thời gian khắc phục tối đa 12 tháng","Thông qua phương án khắc phục, báo cáo UBCKNN trong 30 ngày; thời gian khắc phục tối đa 06 tháng","Không phải lập phương án khắc phục; UBCKNN thu hồi ngay Giấy phép thành lập và hoạt động"],"a":2,"e":"Khoản 2 Điều 85: trong 30 ngày kể từ ngày không đáp ứng điều kiện hoặc VCSH thấp hơn vốn điều lệ tối thiểu, phải thông qua phương án khắc phục và báo cáo UBCKNN; thời gian khắc phục tối đa 06 tháng đối với điều kiện VCSH, 03 tháng đối với điều kiện khác. Trong thời gian này CTCK không được mở rộng hoạt động, chia lợi nhuận.","basis":"Khoản 2, 3 Điều 85 Luật Chứng khoán 2019","quote":"Thời gian thực hiện phương án khắc phục tối đa là 06 tháng đối với điều kiện về vốn chủ sở hữu, tối đa là 03 tháng đối với các điều kiện khác kể từ ngày không đáp ứng điều kiện.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-065","part":"LUAT","subject":"LU","topic":"Chứng chỉ hành nghề & quy chế thi 2026","level":1,"q":"Loại nào sau đây KHÔNG phải là chứng chỉ hành nghề chứng khoán theo Điều 97 Luật Chứng khoán?","o":["Chứng chỉ hành nghề môi giới chứng khoán","Chứng chỉ hành nghề phân tích tài chính","Chứng chỉ hành nghề quản lý quỹ","Chứng chỉ hành nghề bảo lãnh phát hành"],"a":3,"e":"Khoản 1 Điều 97: CCHN chứng khoán gồm 03 loại: môi giới chứng khoán, phân tích tài chính, quản lý quỹ. Không có CCHN riêng cho bảo lãnh phát hành (người có CCHN phân tích tài chính hoặc quản lý quỹ được thực hiện nghiệp vụ bảo lãnh phát hành).","basis":"Khoản 1 Điều 97 Luật Chứng khoán 2019","quote":"Chứng chỉ hành nghề môi giới chứng khoán; b) Chứng chỉ hành nghề phân tích tài chính; c) Chứng chỉ hành nghề quản lý quỹ.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-066","part":"LUAT","subject":"LU","topic":"Chứng chỉ hành nghề & quy chế thi 2026","level":3,"q":"Bà L được cấp CCHN môi giới chứng khoán năm 2019, làm việc tại công ty chứng khoán đến tháng 6/2022 rồi chuyển sang làm kế toán cho doanh nghiệp sản xuất, không hành nghề chứng khoán đến nay (tháng 11/2026). Nhận định nào đúng?","o":["Bà L bị thu hồi CCHN do không hành nghề chứng khoán 03 năm liên tục","CCHN của bà L vẫn có hiệu lực vì CCHN không ghi thời hạn sử dụng","Bà L chỉ bị thu hồi CCHN nếu không tham gia tập huấn kiến thức hằng năm","Bà L bị thu hồi CCHN và vĩnh viễn không được cấp lại"],"a":0,"e":"Điểm c khoản 3 Điều 97: CCHN bị thu hồi khi không hành nghề chứng khoán trong 03 năm liên tục (bà L ngừng từ 6/2022 đến 11/2026 > 03 năm). Theo khoản 4 Điều 97, chỉ trường hợp thu hồi do vi phạm Điều 12, khoản 2 Điều 98 mới không được cấp lại; bà L có thể đề nghị cấp lại khi đáp ứng điều kiện như cấp lần đầu (NĐ 245/2025).","basis":"Điểm c khoản 3, khoản 4 Điều 97 Luật Chứng khoán 2019; điểm a khoản 1 Điều 214 NĐ 155/2020/NĐ-CP (sửa đổi bởi khoản 74 Điều 1 NĐ 245/2025/NĐ-CP)","quote":"Không hành nghề chứng khoán trong 03 năm liên tục.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-067","part":"LUAT","subject":"LU","topic":"Chứng chỉ hành nghề & quy chế thi 2026","level":2,"q":"Người
