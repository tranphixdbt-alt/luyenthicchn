 sự hoặc đã bị kết án về một trong các tội xâm phạm trật tự quản lý kinh tế mà chưa được xóa án tích;","g) Có công ty chứng khoán tư vấn hồ sơ đăng ký chào bán cổ phiếu ra công chúng, trừ trường hợp tổ chức phát hành là công ty chứng khoán;","h) Có cam kết và phải thực hiện niêm yết hoặc đăng ký giao dịch cổ phiếu trên hệ thống giao dịch chứng khoán sau khi kết thúc đợt chào bán;","i) Tổ chức phát hành phải mở tài khoản phong tỏa nhận tiền mua cổ phiếu của đợt chào bán.","2. Điều kiện chào bán thêm cổ phiếu ra công chúng của công ty đại chúng bao gồm:","a) Đáp ứng quy định tại các điểm a, c, e, g, h và i khoản 1 Điều này;","b) Hoạt động kinh doanh của năm liền trước năm đăng ký chào bán phải có lãi, đồng thời không có lỗ lũy kế tính đến năm đăng ký chào bán;","c) Giá trị cổ phiếu phát hành thêm theo mệnh giá không lớn hơn tổng giá trị cổ phiếu đang lưu hành tính theo mệnh giá, trừ trường hợp có bảo lãnh phát hành với cam kết nhận mua toàn bộ cổ phiếu của tổ chức phát hành để bán lại hoặc mua số cổ phiếu còn lại chưa được phân phối hết của tổ chức phát hành, phát hành tăng vốn từ nguồn vốn chủ sở hữu, phát hành để hoán đổi, hợp nhất, sáp nhập doanh nghiệp;","d) Đối với đợt chào bán ra công chúng nhằm mục đích huy động phần vốn để thực hiện dự án của tổ chức phát hành, số cổ phiếu được bán cho các nhà đầu tư phải đạt tối thiểu 70% số cổ phiếu dự kiến được chào bán, trừ trường hợp chào bán cho các cổ đông hiện hữu theo tỷ lệ sở hữu. Tổ chức phát hành phải có phương án bù đắp phần thiếu hụt vốn dự kiến huy động để thực hiện dự án.","3. Điều kiện chào bán trái phiếu ra công chúng bao gồm:","a) Doanh nghiệp có mức vốn điều lệ đã góp tại thời điểm đăng ký chào bán từ 30 tỷ đồng trở lên tính theo giá trị ghi trên sổ kế toán;","b) Hoạt động kinh doanh của năm liền trước năm đăng ký chào bán phải có lãi, đồng thời không có lỗ lũy kế tính đến năm đăng ký chào bán; không có các khoản nợ phải trả quá hạn trên 01 năm;","c) Có phương án phát hành, phương án sử dụng và trả nợ vốn thu được từ đợt chào bán được Đại hội đồng cổ đông hoặc Hội đồng quản trị hoặc Hội đồng thành viên hoặc chủ sở hữu công ty thông qua;","d) Có cam kết thực hiện nghĩa vụ của tổ chức phát hành đối với nhà đầu tư về điều kiện phát hành, thanh toán, bảo đảm quyền và lợi ích hợp pháp của nhà đầu tư và các điều kiện khác;","đ) Có công ty chứng khoán tư vấn hồ sơ đăng ký chào bán trái phiếu ra công chúng, trừ trường hợp tổ chức phát hành là công ty chứng khoán;","e) Đáp ứng quy định tại điểm e khoản 1 Điều này;","g) Đáp ứng quy định của Chính phủ về đại diện người sở hữu trái phiếu, hệ số nợ, giá trị phát hành trên vốn chủ sở hữu và xếp hạng tín nhiệm;","h) Tổ chức phát hành phải mở tài khoản phong tỏa nhận tiền mua trái phiếu của đợt chào bán;","i) Tổ chức phát hành có cam kết và phải thực hiện niêm yết trái phiếu trên hệ thống giao dịch chứng khoán sau khi kết thúc đợt chào bán.","4. Điều kiện chào bán trái phiếu chuyển đổi ra công chúng áp dụng theo quy định tại khoản 2 và điểm d khoản 3 Điều này.","5. Điều kiện chào bán chứng chỉ quỹ lần đầu ra công chúng bao gồm:","a) Tổng giá trị chứng chỉ quỹ đăng ký chào bán tối thiểu là 50 tỷ đồng;","b) Có phương án phát hành và phương án đầu tư vốn thu được từ đợt chào bán chứng chỉ quỹ phù hợp với quy định của Luật này;","c) Phải được giám sát bởi ngân hàng giám sát theo quy định của Luật này;","d) Chứng chỉ quỹ chào bán ra công chúng phải được niêm yết trên hệ thống giao dịch chứng khoán sau khi kết thúc đợt chào bán, trừ trường hợp chào bán chứng chỉ quỹ mở.","6. Chính phủ quy định điều kiện, hồ sơ chào bán chứng khoán ra công chúng để chuyển doanh nghiệp nhà nước, công ty trách nhiệm hữu hạn một thành viên do doanh nghiệp nhà nước nắm giữ 100% vốn điều lệ, đơn vị sự nghiệp công lập thành công ty cổ phần; chào bán cổ phiếu với giá thấp hơn mệnh giá; chào bán chứng khoán ra công chúng của cổ đông công ty đại chúng; chào bán chứng khoán ra công chúng của tổ chức tín dụng được kiểm soát đặc biệt; chào bán chứng khoán ra nước ngoài và các trường hợp chào bán, phát hành khác."],"sua_doi":true,"ghi_chu":["Điểm này được sửa đổi, bổ sung theo quy định tại điểm a khoản 6 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025.","Điểm này được sửa đổi, bổ sung theo quy định tại điểm a khoản 6 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025.","Điểm này được sửa đổi, bổ sung theo quy định tại điểm b khoản 6 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"16","ten":"Đăng ký chào bán chứng khoán ra công chúng","chuong":"Chương II. CHÀO BÁN CHỨNG KHOÁN","doan":["1. Tổ chức phát hành, cổ đông công ty đại chúng trước khi chào bán chứng khoán ra công chúng phải đăng ký với Ủy ban Chứng khoán Nhà nước, trừ trường hợp quy định tại khoản 2 Điều này.","2. Các trường hợp sau đây không phải đăng ký chào bán chứng khoán ra công chúng:","a) Chào bán công cụ nợ của Chính phủ, trái phiếu được Chính phủ bảo lãnh do ngân hàng chính sách phát hành, trái phiếu chính quyền địa phương;","b) Chào bán trái phiếu của tổ chức tài chính quốc tế được Chính phủ Việt Nam chấp thuận;","c) Chào bán cổ phiếu ra công chúng để chuyển doanh nghiệp nhà nước, công ty trách nhiệm hữu hạn một thành viên do doanh nghiệp nhà nước nắm giữ 100% vốn điều lệ, đơn vị sự nghiệp công lập thành công ty cổ phần;","d) Việc bán chứng khoán theo bản án, quyết định của Tòa án đã có hiệu lực pháp luật, quyết định của Trọng tài hoặc việc bán chứng khoán của người quản lý hoặc người được nhận tài sản trong trường hợp phá sản hoặc mất khả năng thanh toán."],"sua_doi":false,"ghi_chu":[]},{"so":"17","ten":"Điều kiện thực hiện bảo lãnh phát hành chứng khoán ra công chúng","chuong":"Chương II. CHÀO BÁN CHỨNG KHOÁN","doan":["1. Tổ chức thực hiện bảo lãnh phát hành chứng khoán ra công chúng là công ty chứng khoán, tổ chức đáp ứng các điều kiện sau đây:","a) Được Ủy ban Chứng khoán Nhà nước cấp phép thực hiện hoạt động bảo lãnh phát hành chứng khoán theo quy định của Luật này;","b) Đáp ứng các chỉ tiêu an toàn tài chính theo quy định của pháp luật;","c) Không phải là người có liên quan với tổ chức phát hành.","2. Tổ chức thực hiện bảo lãnh phát hành chứng khoán ra công chúng thực hiện bảo lãnh theo phương thức nhận mua một phần hoặc toàn bộ chứng khoán của tổ chức phát hành chỉ được phép bảo lãnh phát hành tổng giá trị chứng khoán không được lớn hơn vốn chủ sở hữu và không quá 15 lần hiệu số giữa giá trị tài sản ngắn hạn và nợ ngắn hạn tính theo báo cáo tài chính quý gần nhất."],"sua_doi":false,"ghi_chu":[]},{"so":"18","ten":"Hồ sơ đăng ký chào bán chứng khoán ra công chúng","chuong":"Chương II. CHÀO BÁN CHỨNG KHOÁN","doan":["1. Hồ sơ đăng ký chào bán cổ phiếu lần đầu ra công chúng của công ty cổ phần bao gồm:","a) Giấy đăng ký chào bán cổ phiếu lần đầu ra công chúng;","b) Bản cáo bạch;","c) Điều lệ của tổ chức phát hành;","d) Quyết định của Đại hội đồng cổ đông thông qua phương án phát hành, phương án sử dụng vốn thu được từ đợt chào bán và văn bản cam kết niêm yết hoặc đăng ký giao dịch cổ phiếu trên hệ thống giao dịch chứng khoán;","đ) Văn bản cam kết đáp ứng quy định tại điểm d và điểm e khoản 1 Điều 15 của Luật này;","e) Văn bản cam kết của các cổ đông lớn trước thời điểm chào bán cổ phiếu lần đầu ra công chúng của tổ chức phát hành về việc cùng nhau nắm giữ ít nhất 20% vốn điều lệ của tổ chức phát hành tối thiểu là 01 năm kể từ ngày kết thúc đợt chào bán;","g) Hợp đồng tư vấn hồ sơ đăng ký chào bán cổ phiếu ra công chúng với công ty chứng khoán;","h) Văn bản xác nhận của ngân hàng, chi nhánh ngân hàng nước ngoài về việc mở tài khoản phong tỏa nhận tiền mua cổ phiếu của đợt chào bán;","i) Cam kết bảo lãnh phát hành (nếu có);","k) Báo cáo về vốn điều lệ đã góp tính đến thời điểm đăng ký chào bán cổ phiếu lần đầu ra công chúng được kiểm toán bởi tổ chức kiểm toán độc lập theo quy định của Bộ trưởng Bộ Tài chính.","2. Hồ sơ đăng ký chào bán thêm cổ phiếu ra công chúng của công ty đại chúng bao gồm:","a) Giấy đăng ký chào bán thêm cổ phiếu ra công chúng;","b) Tài liệu quy định tại các điểm b, c, d, g, h và i khoản 1 Điều này và văn bản cam kết đáp ứng quy định tại điểm e khoản 1 Điều 15 của Luật này;","c) Quyết định của cơ quan có thẩm quyền phê duyệt dự án, phương án bù đắp phần thiếu hụt vốn dự kiến huy động từ đợt chào bán để thực hiện dự án đối với trường hợp quy định tại điểm d khoản 2 Điều 15 của Luật này;","d) Báo cáo sử dụng vốn thu được từ đợt chào bán gần nhất được kiểm toán trong 02 năm tính đến thời điểm nộp hồ sơ, trừ trường hợp báo cáo tài chính được kiểm toán đã có thuyết minh chi tiết việc sử dụng vốn thu được từ đợt chào bán gần nhất.","3. Hồ sơ đăng ký chào bán trái phiếu ra công chúng bao gồm:","a) Giấy đăng ký chào bán trái phiếu ra công chúng;","b) Tài liệu quy định tại điểm b và điểm c khoản 1 Điều này và văn bản cam kết đáp ứng quy định tại điểm e khoản 1 Điều 15 của Luật này;","c) Quyết định của Đại hội đồng cổ đông hoặc Hội đồng quản trị hoặc Hội đồng thành viên hoặc chủ sở hữu công ty thông qua phương án phát hành, phương án sử dụng và trả nợ vốn thu được từ đợt chào bán trái phiếu ra công chúng và văn bản cam kết niêm yết trái phiếu trên hệ thống giao dịch chứng khoán;","d) Cam kết thực hiện nghĩa vụ của tổ chức phát hành đối với nhà đầu tư về điều kiện phát hành, thanh toán, bảo đảm quyền và lợi ích hợp pháp của nhà đầu tư và các điều kiện khác;","đ) Báo cáo kết quả xếp hạng tín nhiệm theo quy định tại điểm g khoản 3 Điều 15 của Luật này;","e) Hợp đồng tư vấn hồ sơ đăng ký chào bán trái phiếu ra công chúng với công ty chứng khoán;","g) Văn bản xác nhận của ngân hàng, chi nhánh ngân hàng nước ngoài về việc mở tài khoản phong tỏa nhận tiền mua trái phiếu của đợt chào bán;","h) Cam kết bảo lãnh phát hành (nếu có);","i) Hợp đồng giữa tổ chức phát hành với đại diện người sở hữu trái phiếu.","4. Hồ sơ đăng ký chào bán trái phiếu chuyển đổi ra công chúng bao gồm:","a) Giấy đăng ký chào bán trái phiếu chuyển đổi ra công chúng;","b) Tài liệu quy định tại các điểm b, c, g và h khoản 1, điểm d khoản 2 Điều này và văn bản cam kết đáp ứng quy định tại điểm e khoản 1 Điều 15 của Luật này;","c) Quyết định của Đại hội đồng cổ đông thông qua phương án phát hành, phương án sử dụng vốn thu được từ đợt chào bán và văn bản cam kết niêm yết hoặc đăng ký giao dịch chứng khoán trên hệ thống giao dịch chứng khoán;","d) Cam kết thực hiện nghĩa vụ của tổ chức phát hành đối với nhà đầu tư về điều kiện phát hành, thanh toán, bảo đảm quyền và lợi ích hợp pháp của nhà đầu tư và các điều kiện khác;","đ) Các tài liệu khác liên quan đến việc chuyển đổi thành cổ phiếu;","e) Cam kết bảo lãnh phát hành (nếu có).","5. Hồ sơ đăng ký chào bán chứng chỉ quỹ ra công chúng bao gồm:","a) Giấy đăng ký chào bán chứng chỉ quỹ ra công chúng;","b) Bản cáo bạch;","c) Dự thảo Điều lệ quỹ đầu tư chứng khoán;","d) Hợp đồng nguyên tắc về việc giám sát giữa ngân hàng giám sát và công ty quản lý quỹ đầu tư chứng khoán; hợp đồng nguyên tắc về việc phân phối; hợp đồng nguyên tắc ký với các tổ chức cung cấp dịch vụ có liên quan (nếu có);","đ) Cam kết bảo lãnh phát hành (nếu có).","6. Hồ sơ đăng ký chào bán cổ phiếu, trái phiếu ra công chúng phải kèm theo quyết định của Hội đồng quản trị hoặc Hội đồng thành viên hoặc chủ sở hữu công ty thông qua hồ sơ. Đối với việc chào bán cổ phiếu ra công chúng của tổ chức tín dụng, hồ sơ phải có văn bản chấp thuận của Ngân hàng Nhà nước Việt Nam về thay đổi vốn điều lệ. Đối với việc chào bán chứng khoán ra công chúng của tổ chức kinh doanh bảo hiểm làm thay đổi vốn điều lệ, hồ sơ phải có văn bản chấp thuận của Bộ Tài chính về thay đổi vốn điều lệ.","7. Trường hợp một phần hoặc toàn bộ hồ sơ đăng ký chào bán chứng khoán ra công chúng được tổ chức, cá nhân có liên quan xác nhận thì tổ chức phát hành phải gửi văn bản xác nhận của tổ chức, cá nhân đó đến Ủy ban Chứng khoán Nhà nước.","8. Các thông tin trong hồ sơ đăng ký chào bán chứng khoán ra công chúng phải chính xác, trung thực, không gây hiểu nhầm và có đầy đủ những nội dung quan trọng ảnh hưởng đến việc quyết định của nhà đầu tư.","9. Tổ chức phát hành khi nộp hồ sơ đăng ký chào bán chứng khoán ra công chúng đến Ủy ban Chứng khoán Nhà nước thì đồng thời phải nộp hồ sơ đăng ký niêm yết hoặc đăng ký giao dịch chứng khoán theo quy định tại khoản 4 Điều 48 của Luật này, trừ trường hợp chào bán chứng chỉ quỹ mở."],"sua_doi":true,"ghi_chu":["Điểm này được bổ sung theo quy định tại điểm a khoản 7 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025.","Điểm này được bổ sung theo quy định tại điểm a khoản 7 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025.","Điểm này được bổ sung theo quy định tại điểm b khoản 7 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"19","ten":"Bản cáo bạch","chuong":"Chương II. CHÀO BÁN CHỨNG KHOÁN","doan":["1. Đối với việc chào bán cổ phiếu, trái phiếu ra công chúng, Bản cáo bạch bao gồm các nội dung sau đây:","a) Thông tin tóm tắt về tổ chức phát hành bao gồm mô hình tổ chức bộ máy, hoạt động kinh doanh, tài sản, tình hình tài chính, Hội đồng quản trị hoặc Hội đồng thành viên hoặc chủ sở hữu công ty, Tổng giám đốc (Giám đốc), Phó Tổng giám đốc (Phó Giám đốc), Kế toán trưởng và cơ cấu cổ đông (nếu có);","b) Thông tin về đợt chào bán và chứng khoán chào bán bao gồm: điều kiện chào bán, các yếu tố rủi ro, dự kiến kế hoạch lợi nhuận và cổ tức của năm gần nhất sau khi phát hành chứng khoán, phương án phát hành và phương án sử dụng số tiền thu được từ đợt chào bán;","c) Báo cáo tài chính của tổ chức phát hành trong 02 năm gần nhất theo quy định tại Điều 20 của Luật này;","d) Thông tin khác quy định trong mẫu Bản cáo bạch.","2. Đối với việc chào bán chứng chỉ quỹ ra công chúng, Bản cáo bạch bao gồm các nội dung sau đây:","a) Loại hình và quy mô quỹ đầu tư chứng khoán;","b) Mục tiêu đầu tư, chiến lược đầu tư, phương pháp và quy trình đầu tư, hạn chế đầu tư, các yếu tố rủi ro của quỹ đầu tư chứng khoán;","c) Tóm tắt các nội dung cơ bản của dự thảo Điều lệ quỹ đầu tư chứng khoán;","d) Phương án phát hành chứng chỉ quỹ và các thông tin hướng dẫn tham gia đầu tư vào quỹ đầu tư chứng khoán;","đ) Thông tin tóm tắt về công ty quản lý quỹ đầu tư chứng khoán, ngân hàng giám sát và quy định về giao dịch với người có liên quan của công ty quản lý quỹ đầu tư chứng khoán và ngân hàng giám sát;","e) Thông tin khác quy định trong mẫu Bản cáo bạch.","3. Chữ ký trong Bản cáo bạch thực hiện theo quy định sau đây:","a) Đối với việc chào bán cổ phiếu, trái phiếu ra công chúng, Bản cáo bạch phải có chữ ký của những người sau đây: Chủ tịch Hội đồng quản trị hoặc Chủ tịch Hội đồng thành viên, Chủ tịch công ty; Tổng giám đốc (Giám đốc); Giám đốc tài chính hoặc Kế toán trưởng của tổ chức phát hành; người đại diện theo pháp luật của tổ chức tư vấn hồ sơ đăng ký chào bán chứng khoán ra công chúng, tổ chức bảo lãnh phát hành hoặc tổ chức bảo lãnh phát hành chính (nếu có). Trường hợp ký thay phải có văn bản ủy quyền;","b) Đối với việc chào bán chứng chỉ quỹ ra công chúng, Bản cáo bạch phải có chữ ký của những người sau đây: Chủ tịch Hội đồng quản trị hoặc Chủ tịch Hội đồng thành viên, Chủ tịch công ty; Tổng giám đốc (Giám đốc) của công ty quản lý quỹ đầu tư chứng khoán; người đại diện theo pháp luật của tổ chức bảo lãnh phát hành (nếu có). Trường hợp ký thay phải có văn bản ủy quyền.","4. Bộ trưởng Bộ Tài chính ban hành mẫu Bản cáo bạch."],"sua_doi":false,"ghi_chu":[]},{"so":"20","ten":"Báo cáo tài chính","chuong":"Chương II. CHÀO BÁN CHỨNG KHOÁN","doan":["1. Báo cáo tài chính được lập theo quy định của pháp luật về kế toán.","2. Trường hợp tổ chức phát hành là công ty mẹ thì tổ chức phát hành phải nộp báo cáo tài chính hợp nhất theo quy định của pháp luật về kế toán.","3. Báo cáo tài chính năm phải được kiểm toán bởi tổ chức kiểm toán được chấp thuận thực hiện kiểm toán cho đơn vị có lợi ích công chúng thuộc lĩnh vực chứng khoán. Ý kiến kiểm toán đối với các báo cáo tài chính là ý kiến chấp nhận toàn phần; trường hợp ý kiến kiểm toán là ý kiến ngoại trừ thì khoản ngoại trừ không ảnh hưởng đến điều kiện chào bán; tổ chức phát hành phải có tài liệu giải thích hợp lý và có xác nhận của tổ chức kiểm toán về ảnh hưởng của việc ngoại trừ.","4. Trường hợp hồ sơ được nộp trong thời gian 60 ngày kể từ ngày kết thúc kỳ kế toán năm, báo cáo tài chính năm của năm trước đó trong hồ sơ ban đầu có thể là báo cáo tài chính chưa có kiểm toán, nhưng phải có báo cáo tài chính được kiểm toán của 02 năm trước liền kề.","5. Trường hợp ngày kết thúc kỳ kế toán của báo cáo tài chính gần nhất cách thời điểm gửi hồ sơ đăng ký chào bán chứng khoán ra công chúng đầy đủ và hợp lệ đến Ủy ban Chứng khoán Nhà nước quá 90 ngày, tổ chức phát hành phải lập báo cáo tài chính bổ sung đến tháng hoặc quý gần nhất."],"sua_doi":false,"ghi_chu":[]},{"so":"21","ten":"Tổ chức kiểm toán và kiểm toán viên hành nghề được chấp thuận","chuong":"Chương II. CHÀO BÁN CHỨNG KHOÁN","doan":["1. Ủy ban Chứng khoán Nhà nước xem xét, chấp thuận và công khai danh sách tổ chức kiểm toán và danh sách kiểm toán viên hành nghề được chấp thuận để thực hiện kiểm toán cho đơn vị có lợi ích công chúng thuộc lĩnh vực chứng khoán.","2. Đơn vị có lợi ích công chúng thuộc lĩnh vực chứng khoán bao gồm công ty đại chúng, tổ chức niêm yết, tổ chức đăng ký giao dịch, tổ chức chào bán chứng khoán ra công chúng, công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán, công ty đầu tư chứng khoán, quỹ đầu tư chứng khoán.","3. Tổ chức kiểm toán được chấp thuận thực hiện kiểm toán cho đơn vị có lợi ích công chúng thuộc lĩnh vực chứng khoán phải tuân thủ quy định của pháp luật về kiểm toán độc lập và có các nghĩa vụ sau đây:","a) Báo cáo Ủy ban Chứng khoán Nhà nước trong thời hạn 10 ngày kể từ ngày có thay đổi tên gọi, địa chỉ trụ sở chính, lĩnh vực hành nghề, danh sách kiểm toán viên hành nghề hoặc thay đổi dẫn đến việc không còn đủ điều kiện được chấp thuận kiểm toán;","b) Giải trình, cung cấp thông tin, số liệu liên quan đến hoạt động kiểm toán cho đơn vị có lợi ích công chúng thuộc lĩnh vực chứng khoán theo yêu cầu của Ủy ban Chứng khoán Nhà nước;","c) Sau khi phát hành báo cáo kiểm toán cho đơn vị có lợi ích công chúng thuộc lĩnh vực chứng khoán, trường hợp phát hiện đơn vị được kiểm toán có những sai phạm trọng yếu do không tuân thủ pháp luật và các quy định liên quan đến báo cáo tài chính đã được kiểm toán thì tổ chức kiểm toán được chấp thuận phải thông báo bằng văn bản cho Ủy ban Chứng khoán Nhà nước;","d) Bảo mật thông tin theo quy định của pháp luật.","4. Chính phủ quy định chi tiết Điều này."],"sua_doi":false,"ghi_chu":[]},{"so":"22","ten":"Sửa đổi, bổ sung hồ sơ đăng ký chào bán chứng khoán ra công chúng","chuong":"Chương II. CHÀO BÁN CHỨNG KHOÁN","doan":["1. Trong thời gian hồ sơ đăng ký chào bán chứng khoán ra công chúng đang được xem xét, tổ chức phát hành có nghĩa vụ sửa đổi, bổ sung hồ sơ nếu phát hiện thông tin không chính xác hoặc còn thiếu nội dung quan trọng theo quy định phải có trong hồ sơ hoặc thấy cần thiết phải giải trình về vấn đề có thể gây hiểu nhầm.","2. Trong thời gian xem xét hồ sơ, Ủy ban Chứng khoán Nhà nước có quyền yêu cầu tổ chức phát hành sửa đổi, bổ sung hồ sơ đăng ký chào bán chứng khoán ra công chúng để bảo đảm thông tin được công bố chính xác, trung thực, đầy đủ, bảo vệ quyền và lợi ích hợp pháp của nhà đầu tư.","3. Sau khi Ủy ban Chứng khoán Nhà nước cấp Giấy chứng nhận đăng ký chào bán chứng khoán ra công chúng mà phát sinh thông tin quan trọng liên quan đến hồ sơ đăng ký chào bán chứng khoán ra công chúng thì trong thời hạn 07 ngày làm việc, tổ chức phát hành phải công bố thông tin phát sinh theo phương thức quy định tại khoản 3 Điều 25 của Luật này và thực hiện việc sửa đổi, bổ sung hồ sơ.","4. Văn bản sửa đổi, bổ sung gửi đến Ủy ban Chứng khoán Nhà nước phải có chữ ký của những người đã ký trong hồ sơ đăng ký chào bán chứng khoán ra công chúng hoặc của những người có cùng chức danh với những người đó.","5. Thời hạn xem xét hồ sơ đối với các trường hợp quy định tại khoản 1 và khoản 2 Điều này được tính từ ngày Ủy ban Chứng khoán Nhà nước nhận được văn bản sửa đổi, bổ sung đầy đủ và hợp lệ. Điều 23.14 (được bãi bỏ)"],"sua_doi":false,"ghi_chu":[]},{"so":"24","ten":"Thông tin trước khi chào bán chứng khoán ra công chúng","chuong":"Chương II. CHÀO BÁN CHỨNG KHOÁN","doan":["Trong thời gian Ủy ban Chứng khoán Nhà nước xem xét hồ sơ đăng ký chào bán chứng khoán ra công chúng, tổ chức phát hành, tổ chức bảo lãnh phát hành và tổ chức, cá nhân có liên quan chỉ được sử dụng trung thực và chính xác các thông tin trong Bản cáo bạch đã gửi Ủy ban Chứng khoán Nhà nước để thăm dò thị trường, trong đó phải nêu rõ các thông tin về ngày phát hành và giá bán chứng khoán là thông tin dự kiến."],"sua_doi":false,"ghi_chu":[]},{"so":"25","ten":"Cấp Giấy chứng nhận đăng ký chào bán chứng khoán ra công chúng","chuong":"Chương II. CHÀO BÁN CHỨNG KHOÁN","doan":["1. Trong thời hạn 30 ngày kể từ ngày nhận được hồ sơ đăng ký chào bán chứng khoán ra công chúng đầy đủ và hợp lệ, Ủy ban Chứng khoán Nhà nước cấp Giấy chứng nhận đăng ký chào bán chứng khoán ra công chúng; trường hợp từ chối, phải trả lời bằng văn bản và nêu rõ lý do.","2. Giấy chứng nhận đăng ký chào bán chứng khoán ra công chúng của Ủy ban Chứng khoán Nhà nước là văn bản xác nhận hồ sơ đăng ký chào bán chứng khoán ra công chúng đáp ứng đủ điều kiện, thủ tục theo quy định của pháp luật.","3. Trong thời hạn 07 ngày làm việc kể từ ngày Giấy chứng nhận đăng ký chào bán chứng khoán ra công chúng có hiệu lực, tổ chức phát hành phải công bố Bản thông báo phát hành trên 01 tờ báo điện tử hoặc báo in trong 03 số liên tiếp.","4. Chứng khoán chỉ được chào bán ra công chúng sau khi đã công bố theo quy định tại khoản 3 Điều này."],"sua_doi":false,"ghi_chu":[]},{"so":"26","ten":"Phân phối chứng khoán","chuong":"Chương II. CHÀO BÁN CHỨNG KHOÁN","doan":["1. Việc phân phối chứng khoán chỉ được thực hiện sau khi tổ chức phát hành bảo đảm người mua chứng khoán tiếp cận Bản cáo bạch trong hồ sơ đăng ký chào bán chứng khoán ra công chúng được công bố tại các địa điểm ghi trong Bản thông báo phát hành.","2. Tổ chức phát hành, tổ chức bảo lãnh phát hành hoặc tổ chức đại lý phải phân phối chứng khoán công bằng, công khai và bảo đảm thời hạn đăng ký mua chứng khoán cho nhà đầu tư tối thiểu là 20 ngày; trừ trường hợp chứng khoán chào bán là chứng quyền có bảo đảm, thời hạn này phải được ghi trong Bản thông báo phát hành. Trường hợp số lượng chứng khoán đăng ký mua vượt quá số lượng chứng khoán được phép phát hành thì tổ chức phát hành hoặc tổ chức bảo lãnh phát hành phải phân phối hết số chứng khoán được phép phát hành cho nhà đầu tư tương ứng với tỷ lệ đăng ký mua của từng nhà đầu tư.","3. Tiền mua chứng khoán phải được chuyển vào tài khoản phong tỏa mở tại ngân hàng, chi nhánh ngân hàng nước ngoài cho đến khi hoàn tất đợt chào bán và báo cáo Ủy ban Chứng khoán Nhà nước.","4. Tổ chức phát hành phải hoàn thành việc phân phối chứng khoán trong thời hạn 90 ngày kể từ ngày Giấy chứng nhận đăng ký chào bán chứng khoán ra công chúng có hiệu lực. Trường hợp tổ chức phát hành không thể hoàn thành việc phân phối chứng khoán ra công chúng trong thời hạn này, Ủy ban Chứng khoán Nhà nước xem xét gia hạn việc phân phối chứng khoán nhưng tối đa không quá 30 ngày. Trường hợp đăng ký chào bán chứng khoán cho nhiều đợt thì khoảng cách giữa đợt chào bán sau với đợt chào bán trước không quá 12 tháng.","5. Tổ chức phát hành hoặc tổ chức bảo lãnh phát hành phải báo cáo kết quả đợt chào bán cho Ủy ban Chứng khoán Nhà nước trong thời hạn 10 ngày kể từ ngày kết thúc đợt chào bán, kèm theo văn bản xác nhận của ngân hàng, chi nhánh ngân hàng nước ngoài nơi mở tài khoản phong tỏa về số tiền thu được từ đợt chào bán.","6. Tổ chức phát hành, tổ chức bảo lãnh phát hành hoặc tổ chức đại lý phải chuyển giao chứng khoán hoặc giấy chứng nhận quyền sở hữu chứng khoán cho người mua trong thời hạn 30 ngày kể từ ngày kết thúc đợt chào bán."],"sua_doi":false,"ghi_chu":[]},{"so":"27","ten":"Đình chỉ chào bán chứng khoán ra công chúng","chuong":"Chương II. CHÀO BÁN CHỨNG KHOÁN","doan":["1. Ủy ban Chứng khoán Nhà nước có quyền đình chỉ chào bán chứng khoán ra công chúng tối đa là 60 ngày trong các trường hợp sau đây:","a) Hồ sơ đăng ký chào bán chứng khoán ra công chúng có thông tin sai lệch, bỏ sót nội dung quan trọng có thể ảnh hưởng tới quyết định đầu tư và gây thiệt hại cho nhà đầu tư;","b) Việc phân phối chứng khoán không thực hiện đúng quy định tại Điều 26 của Luật này.","2. Trong thời hạn 07 ngày làm việc kể từ ngày đợt chào bán chứng khoán ra công chúng bị đình chỉ, tổ chức phát hành phải công bố việc đình chỉ chào bán chứng khoán ra công chúng theo phương thức quy định tại khoản 3 Điều 25 của Luật này và phải thu hồi chứng khoán đã phát hành nếu nhà đầu tư có yêu cầu, đồng thời hoàn trả tiền cho nhà đầu tư trong thời hạn 15 ngày kể từ ngày nhận được yêu cầu.","3. Khi những thiếu sót dẫn đến việc đình chỉ đợt chào bán chứng khoán ra công chúng được khắc phục, Ủy ban Chứng khoán Nhà nước ra văn bản thông báo hủy đình chỉ và chứng khoán được tiếp tục chào bán.","4. Trong thời hạn 07 ngày làm việc kể từ ngày có thông báo hủy đình chỉ, tổ chức phát hành phải công bố việc hủy đình chỉ theo phương thức quy định tại khoản 3 Điều 25 của Luật này."],"sua_doi":false,"ghi_chu":[]},{"so":"28","ten":"Hủy bỏ chào bán chứng khoán ra công chúng","chuong":"Chương II. CHÀO BÁN CHỨNG KHOÁN","doan":["1. Ủy ban Chứng khoán Nhà nước quyết định hủy bỏ đợt chào bán chứng khoán ra công chúng trong các trường hợp sau đây:","a) Hết thời hạn đình chỉ quy định tại khoản 1 Điều 27 của Luật này mà không khắc phục được những thiếu sót dẫn đến việc đình chỉ đợt chào bán chứng khoán ra công chúng;","b) Đợt chào bán cổ phiếu lần đầu ra công chúng không đáp ứng được điều kiện về tỷ lệ tối thiểu số cổ phiếu có quyền biểu quyết của tổ chức phát hành được bán cho ít nhất 100 nhà đầu tư không phải là cổ đông lớn của tổ chức phát hành theo quy định tại điểm d khoản 1 Điều 15 của Luật này;","c) Đợt chào bán thêm cổ phiếu ra công chúng không đáp ứng được điều kiện về huy động đủ phần vốn để thực hiện dự án của tổ chức phát hành theo quy định tại điểm d khoản 2 Điều 15 của Luật này;","d) Sau khi kết thúc đợt chào bán cổ phiếu ra công chúng và cổ phiếu chưa đưa vào niêm yết hoặc đăng ký giao dịch mà phát hiện đợt chào bán vi phạm quy định tại khoản 1 Điều 27 của Luật này;","đ) Sau khi kết thúc đợt chào bán trái phiếu, chứng quyền có bảo đảm ra công chúng mà phát hiện đợt chào bán vi phạm quy định tại khoản 1 Điều 27 của Luật này.","2. Ngoài các trường hợp quy định tại khoản 1 Điều này, đợt chào bán chứng khoán ra công chúng bị hủy bỏ theo bản án, quyết định của Tòa án đã có hiệu lực pháp luật, quyết định của Trọng tài hoặc cơ quan có thẩm quyền theo quy định của pháp luật.","2a. Sau khi chào bán ra công chúng, cổ phiếu hoặc cổ phiếu được chuyển đổi từ trái phiếu chuyển đổi hoặc cổ phiếu được mua từ chứng quyền đã được đưa vào niêm yết hoặc đăng ký giao dịch thì không hủy bỏ.","3. Trong thời hạn 07 ngày làm việc kể từ ngày đợt chào bán chứng khoán ra công chúng bị hủy bỏ, tổ chức phát hành phải công bố việc hủy bỏ chào bán chứng khoán ra công chúng theo phương thức quy định tại khoản 3 Điều 25 của Luật này và phải thu hồi chứng khoán đã phát hành, đồng thời hoàn trả tiền cho nhà đầu tư trong thời hạn 15 ngày kể từ ngày đợt chào bán bị hủy bỏ. Hết thời hạn này, tổ chức phát hành phải bồi thường thiệt hại cho nhà đầu tư theo các điều khoản đã cam kết với nhà đầu tư."],"sua_doi":true,"ghi_chu":["Điểm này được bổ sung theo quy định tại điểm a khoản 8 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025.","Điểm này được bổ sung theo quy định tại điểm a khoản 8 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025.","Điểm này được bổ sung theo quy định tại điểm a khoản 8 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"29","ten":"Nghĩa vụ của tổ chức phát hành","chuong":"Chương II. CHÀO BÁN CHỨNG KHOÁN","doan":["1. Tổ chức phát hành đã thực hiện chào bán thành công cổ phiếu ra công chúng, trở thành công ty đại chúng theo quy định tại điểm b khoản 1 Điều 32 của Luật này không phải nộp hồ sơ đăng ký công ty đại chúng quy định tại khoản 1 Điều 33 của Luật này cho Ủy ban Chứng khoán Nhà nước.","2. Tổ chức phát hành đã thực hiện chào bán chứng khoán ra công chúng phải hoàn thiện hồ sơ đăng ký niêm yết hoặc đăng ký giao dịch chứng khoán trong thời hạn 30 ngày kể từ ngày kết thúc đợt chào bán.","3. Tổ chức phát hành hoàn thành việc chào bán trái phiếu ra công chúng phải tuân thủ nghĩa vụ công bố thông tin theo quy định của Luật này. Mục 2 CHÀO BÁN CHỨNG KHOÁN RIÊNG LẺ"],"sua_doi":false,"ghi_chu":[]},{"so":"30","ten":"Chào bán chứng khoán riêng lẻ của tổ chức phát hành không phải là","chuong":"Chương II. CHÀO BÁN CHỨNG KHOÁN","doan":["công ty đại chúng Chào bán chứng khoán riêng lẻ của tổ chức phát hành không phải là công ty đại chúng thực hiện theo quy định của Luật Doanh nghiệp và quy định khác của pháp luật có liên quan."],"sua_doi":false,"ghi_chu":[]},{"so":"31","ten":"Chào bán chứng khoán riêng lẻ của công ty đại chúng, công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán","chuong":"Chương II. CHÀO BÁN CHỨNG KHOÁN","doan":["1. Điều kiện chào bán cổ phiếu riêng lẻ, trái phiếu chuyển đổi riêng lẻ, trái phiếu kèm chứng quyền riêng lẻ của công ty đại chúng bao gồm:","a) Có quyết định của Đại hội đồng cổ đông thông qua phương án phát hành và sử dụng số tiền thu được từ đợt chào bán; xác định rõ tiêu chí nhà đầu tư; số lượng cổ phiếu, giá chào bán cổ phiếu hoặc nguyên tắc xác định giá chào bán cổ phiếu;","b) Đối tượng tham gia đợt chào bán chỉ bao gồm nhà đầu tư chiến lược, nhà đầu tư chứng khoán chuyên nghiệp theo quy định tại khoản 1 Điều 11 của Luật này đối với đợt chào bán cổ phiếu, trái phiếu chuyển đổi hoặc nhà đầu tư chiến lược, nhà đầu tư chứng khoán chuyên nghiệp theo quy định tại khoản 1a và khoản 1b Điều 11 của Luật này đối với đợt chào bán trái phiếu kèm chứng quyền;","c) Việc giao dịch, chuyển nhượng cổ phiếu chào bán riêng lẻ, trái phiếu chuyển đổi chào bán riêng lẻ, trái phiếu kèm chứng quyền chào bán riêng lẻ bị hạn chế tối thiểu là 03 năm đối với nhà đầu tư chiến lược và tối thiểu là 01 năm đối với nhà đầu tư chứng khoán chuyên nghiệp kể từ ngày hoàn thành đợt chào bán, trừ trường hợp giao dịch, chuyển nhượng giữa các nhà đầu tư chứng khoán chuyên nghiệp theo quy định tại điểm b khoản này hoặc thực hiện theo bản án, quyết định của Tòa án đã có hiệu lực pháp luật, quyết định của Trọng tài hoặc thừa kế theo quy định của pháp luật;","d) Các đợt chào bán cổ phiếu riêng lẻ, trái phiếu chuyển đổi riêng lẻ, trái phiếu kèm chứng quyền riêng lẻ phải cách nhau ít nhất 06 tháng kể từ ngày kết thúc đợt chào bán gần nhất;","đ) Việc chào bán cổ phiếu, chuyển đổi trái phiếu thành cổ phiếu, thực hiện chứng quyền phải đáp ứng quy định về tỷ lệ sở hữu của nhà đầu tư nước ngoài theo quy định của pháp luật.","2. Điều kiện chào bán trái phiếu riêng lẻ của công ty đại chúng không thuộc trường hợp quy định tại khoản 1 Điều này bao gồm:","a) Có quyết định của Đại hội đồng cổ đông hoặc Hội đồng quản trị thông qua phương án phát hành và sử dụng số tiền thu được từ đợt chào bán; xác định rõ tiêu chí, số lượng nhà đầu tư;","b) Đối tượng tham gia đợt chào bán bao gồm nhà đầu tư chứng khoán chuyên nghiệp là tổ chức. Trường hợp trái phiếu chào bán thuộc trường hợp quy định tại điểm a hoặc điểm b khoản 1b Điều 11 của Luật này, đối tượng tham gia đợt chào bán bao gồm nhà đầu tư chứng khoán chuyên nghiệp là tổ chức và nhà đầu tư chứng khoán chuyên nghiệp là cá nhân;","c) Việc giao dịch, chuyển nhượng trái phiếu doanh nghiệp riêng lẻ chỉ được thực hiện giữa các nhà đầu tư chứng khoán chuyên nghiệp theo quy định tại khoản 1a và khoản 1b Điều 11 của Luật này, trừ trường hợp thực hiện theo bản án, quyết định của Tòa án đã có hiệu lực pháp luật, quyết định của Trọng tài hoặc thừa kế theo quy định của pháp luật;","d) Thanh toán đủ cả gốc và lãi của trái phiếu đã chào bán hoặc thanh toán đủ các khoản nợ đến hạn trong 03 năm liên tiếp trước đợt chào bán trái phiếu (nếu có), trừ trường hợp chào bán trái phiếu cho các chủ nợ là tổ chức tài chính được lựa chọn;","đ) Có báo cáo tài chính năm trước liền kề của năm phát hành được kiểm toán bởi tổ chức kiểm toán được chấp thuận;","e) Đáp ứng các tỷ lệ an toàn tài chính, tỷ lệ bảo đảm an toàn trong hoạt động theo quy định của pháp luật (nếu có).","3. Công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán không phải là công ty đại chúng chào bán cổ phiếu riêng lẻ, trái phiếu chuyển đổi riêng lẻ, trái phiếu kèm chứng quyền riêng lẻ phải đáp ứng quy định tại khoản 1 Điều này.","4. Điều kiện chào bán trái phiếu riêng lẻ của công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán không phải là công ty đại chúng và không thuộc trường hợp quy định tại khoản 3 Điều này bao gồm:","a) Có quyết định của Đại hội đồng cổ đông hoặc Hội đồng quản trị hoặc Hội đồng thành viên hoặc chủ sở hữu công ty thông qua phương án phát hành và sử dụng số tiền thu được từ đợt chào bán; xác định rõ tiêu chí, số lượng nhà đầu tư;","b) Đáp ứng quy định tại các điểm b, c, đ và e khoản 2 Điều này.","5. Công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán không phải là công ty đại chúng chào bán cổ phiếu cho cổ đông hiện hữu theo tỷ lệ sở hữu hiện có phải đáp ứng điều kiện quy định tại điểm a và điểm d khoản 1 Điều này.","6. Chính phủ quy định chi tiết việc chào bán chứng khoán riêng lẻ của công ty đại chúng, công ty chứng khoán, công ty quản lý quỹ đầu tư chứng khoán quy định tại Điều này và các trường hợp chào bán, phát hành chứng khoán riêng lẻ khác của công ty đại chúng."],"sua_doi":true,"ghi_chu":["Điểm này được sửa đổi, bổ sung theo quy định tại điểm a khoản 9 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025; đối với quy định về nhà đầu tư chứng khoán chuyên nghiệp tham gia mua, giao dịch, chuyển nhượng trái phiếu doanh nghiệp riêng lẻ được sửa đổi, bổ sung có hiệu lực kể từ ngày 01 tháng 01 năm 2026.","Điểm này được sửa đổi, bổ sung theo quy định tại điểm a khoản 9 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025; đối với quy định về nhà đầu tư chứng khoán chuyên nghiệp tham gia mua, giao dịch, chuyển nhượng trái phiếu doanh nghiệp riêng lẻ được sửa đổi, bổ sung có hiệu lực kể từ ngày 01 tháng 01 năm 2026.","Điểm này được sửa đổi, bổ sung theo quy định tại điểm a khoản 9 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025; đối với quy định về nhà đầu tư chứng khoán chuyên nghiệp tham gia mua, giao dịch, chuyển nhượng trái phiếu doanh nghiệp riêng lẻ được sửa đổi, bổ sung có hiệu lực kể từ ngày 01 tháng 01 năm 2026."]},{"so":"31a","ten":"Đình chỉ chào bán chứng khoán riêng lẻ","chuong":"Chương II. CHÀO BÁN CHỨNG KHOÁN","doan":["1. Ủy ban Chứng khoán Nhà nước có quyền đình chỉ đợt chào bán chứng khoán riêng lẻ đã đăng ký với Ủy ban Chứng khoán Nhà nước tối đa là 60 ngày trong các trường hợp sau đây:","a) Hồ sơ đăng ký chào bán chứng khoán riêng lẻ có thông tin sai lệch, bỏ sót nội dung quan trọng có thể ảnh hưởng đến quyết định đầu tư và gây thiệt hại cho nhà đầu tư;","b) Việc phân phối chứng khoán không thực hiện đúng quy định của pháp luật.","2. Trong thời hạn 07 ngày làm việc kể từ ngày đợt chào bán chứng khoán riêng lẻ bị đình chỉ, tổ chức phát hành phải công bố việc đình chỉ chào bán chứng khoán riêng lẻ theo phương thức quy định tại khoản 3 Điều 25 của Luật này và phải thu hồi chứng khoán đã phát hành nếu nhà đầu tư có yêu cầu, đồng thời hoàn trả tiền cho nhà đầu tư trong thời hạn 15 ngày kể từ ngày nhận được yêu cầu.","3. Khi những thiếu sót dẫn đến việc đình chỉ đợt chào bán chứng khoán riêng lẻ được khắc phục, Ủy ban Chứng khoán Nhà nước ra văn bản thông báo hủy đình chỉ và chứng khoán được tiếp tục chào bán.","4. Trong thời hạn 07 ngày làm việc kể từ ngày có thông báo hủy đình chỉ, tổ chức phát hành phải công bố việc hủy đình chỉ theo phương thức quy định tại khoản 3 Điều 25 của Luật này."],"sua_doi":true,"ghi_chu":["Điều này được bổ sung theo quy định tại khoản 10 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"31b","ten":"Hủy bỏ chào bán chứng khoán riêng lẻ","chuong":"Chương II. CHÀO BÁN CHỨNG KHOÁN","doan":["1. Ủy ban Chứng khoán Nhà nước quyết định hủy bỏ đợt chào bán chứng khoán riêng lẻ đã đăng ký với Ủy ban Chứng khoán Nhà nước trong các trường hợp sau đây:","a) Hết thời hạn đình chỉ theo quy định tại khoản 1 Điều 31a của Luật này mà tổ chức phát hành không khắc phục được thiếu sót dẫn đến việc bị đình chỉ đợt chào bán chứng khoán riêng lẻ;","b) Sau khi kết thúc đợt chào bán cổ phiếu riêng lẻ và cổ phiếu chưa đưa vào niêm yết hoặc đăng ký giao dịch mà phát hiện đợt chào bán vi phạm quy định tại khoản 1 Điều 31a của Luật này;","c) Sau khi kết thúc đợt chào bán trái phiếu riêng lẻ mà phát hiện đợt chào bán vi phạm quy định tại khoản 1 Điều 31a của Luật này.","2. Ngoài các trường hợp quy định tại khoản 1 Điều này, đợt chào bán chứng khoán riêng lẻ bị hủy bỏ theo bản án, quyết định của Tòa án đã có hiệu lực pháp luật, quyết định của Trọng tài hoặc cơ quan có thẩm quyền theo quy định của pháp luật.","3. Sau khi chào bán riêng lẻ mà cổ phiếu hoặc cổ phiếu được chuyển đổi từ trái phiếu chuyển đổi hoặc cổ phiếu được mua từ chứng quyền đã được đưa vào niêm yết hoặc đăng ký giao dịch thì không hủy bỏ.","4. Trong thời hạn 07 ngày làm việc kể từ ngày đợt chào bán chứng khoán riêng lẻ bị hủy bỏ, tổ chức phát hành phải công bố việc hủy bỏ chào bán chứng khoán riêng lẻ theo phương thức quy định tại khoản 3 Điều 25 của Luật này và phải thu hồi chứng khoán đã phát hành, đồng thời hoàn trả tiền cho nhà đầu tư trong thời hạn 15 ngày kể từ ngày đợt chào bán bị hủy bỏ. Hết thời hạn này, tổ chức phát hành phải bồi thường thiệt hại cho nhà đầu tư theo các điều khoản đã cam kết với nhà đầu tư. Mục 1 QUY ĐỊNH CHUNG VỀ CÔNG TY ĐẠI CHÚNG"],"sua_doi":true,"ghi_chu":["Điều này được bổ sung theo quy định tại khoản 10 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"32","ten":"Công ty đại chúng","chuong":"Chương III. CÔNG TY ĐẠI CHÚNG","doan":["1. Công ty đại chúng là công ty cổ phần thuộc một trong hai trường hợp sau đây:","a) Công ty có vốn điều lệ đã góp từ 30 tỷ đồng trở lên, có vốn chủ sở hữu từ 30 tỷ đồng trở lên và có tối thiểu 10% số cổ phiếu có quyền biểu quyết do ít nhất 100 nhà đầu tư không phải cổ đông lớn nắm giữ;","b) Công ty đã thực hiện chào bán thành công cổ phiếu lần đầu ra công chúng thông qua đăng ký với Ủy ban Chứng khoán Nhà nước theo quy định tại khoản 1 Điều 16 của Luật này.","2. Công ty cổ phần quy định tại điểm a khoản 1 Điều này phải nộp hồ sơ đăng ký công ty đại chúng quy định tại khoản 1 Điều 33 của Luật này cho Ủy ban Chứng khoán Nhà nước trong thời hạn 90 ngày kể từ ngày công ty hoàn thành việc góp vốn và có cơ cấu cổ đông đáp ứng quy định tại điểm a khoản 1 Điều này.","3. Trong thời hạn 15 ngày kể từ ngày nhận được hồ sơ đăng ký công ty đại chúng đầy đủ và hợp lệ của công ty cổ phần theo quy định tại điểm a khoản 1 Điều này hoặc nhận được báo cáo kết quả hoàn thành đợt chào bán của công ty cổ phần theo quy định tại điểm b khoản 1 Điều này, Ủy ban Chứng khoán Nhà nước có trách nhiệm xác nhận hoàn tất việc đăng ký công ty đại chúng, đồng thời công bố tên, nội dung kinh doanh và các thông tin khác liên quan đến công ty đại chúng trên phương tiện công bố thông tin của Ủy ban Chứng khoán Nhà nước.","4. Bộ trưởng Bộ Tài chính quy định chi tiết việc đăng ký công ty đại chúng và trình tự, thủ tục đăng ký công ty đại chúng."],"sua_doi":true,"ghi_chu":["Điểm này được sửa đổi, bổ sung theo quy định tại điểm a khoản 11 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025; đối với quy định về vốn chủ sở hữu có hiệu lực kể từ ngày 01 tháng 01 năm 2026.","Điểm này được sửa đổi, bổ sung theo quy định tại điểm a khoản 11 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025; đối với quy định về vốn chủ sở hữu có hiệu lực kể từ ngày 01 tháng 01 năm 2026.","Khoản này được bổ sung theo quy định tại điểm b khoản 11 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"33","ten":"Hồ sơ đăng ký công ty đại chúng","chuong":"Chương III. CÔNG TY ĐẠI CHÚNG","doan":["1. Hồ sơ đăng ký công ty đại chúng bao gồm:","a) Giấy đăng ký công ty đại chúng;","b) Điều lệ công ty;","c) Giấy chứng nhận đăng ký doanh nghiệp;","d) Bản công bố thông tin về công ty đại chúng bao gồm thông tin tóm tắt về mô hình tổ chức bộ máy, hoạt động kinh doanh, bộ máy quản lý, cơ cấu cổ đông, tài sản, tình hình tài chính và các thông tin khác;","đ) Báo cáo tài chính năm gần nhất của công ty cổ phần được kiểm toán bởi tổ chức kiểm toán độc lập. Trường hợp công ty tăng vốn điều lệ sau thời điểm kết thúc kỳ kế toán năm gần nhất, công ty phải bổ sung báo cáo tài chính kỳ gần nhất được kiểm toán hoặc soát xét;","e) Danh sách cổ đông;","g) Báo cáo về vốn điều lệ đã góp tính đến thời điểm đăng ký công ty đại chúng được kiểm toán bởi tổ chức kiểm toán độc lập theo quy định của Bộ trưởng Bộ Tài chính.","2. Bộ trưởng Bộ Tài chính ban hành mẫu Bản công bố thông tin về công ty đại chúng và quy định hồ sơ đăng ký công ty đại chúng hình thành sau chia, tách, hợp nhất, sáp nhập doanh nghiệp."],"sua_doi":true,"ghi_chu":["Điểm này được sửa đổi, bổ sung theo quy định tại điểm a khoản 12 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025.","Điểm này được sửa đổi, bổ sung theo quy định tại điểm a khoản 12 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025.","Điểm này được bổ sung theo quy định tại điểm b khoản 12 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"34","ten":"Quyền và nghĩa vụ của công ty đại chúng","chuong":"Chương III. CÔNG TY ĐẠI CHÚNG","doan":["1. Sau khi Ủy ban Chứng khoán Nhà nước xác nhận hoàn tất việc đăng ký công ty đại chúng, công ty đại chúng có các quyền và nghĩa vụ sau đây:","a) Công bố thông tin theo quy định của Luật này;","b) Tuân thủ quy định về quản trị công ty theo quy định của Luật này;","c) Thực hiện đăng ký cổ phiếu tập trung tại Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam theo quy định tại Điều 61 của Luật này;","d) Công ty đại chúng quy định tại điểm a khoản 1 Điều 32 của Luật này phải đăng ký giao dịch cổ phiếu trên hệ thống giao dịch cho chứng khoán chưa niêm yết trong thời hạn 30 ngày kể từ ngày Ủy ban Chứng khoán Nhà nước xác nhận hoàn tất việc đăng ký công ty đại chúng. Sau 02 năm kể từ ngày giao dịch đầu tiên trên hệ thống giao dịch cho chứng khoán chưa niêm yết, công ty đại chúng có quyền nộp hồ sơ đăng ký niêm yết khi đáp ứng các điều kiện niêm yết chứng khoán;","đ) Công ty đại chúng quy định tại điểm b khoản 1 Điều 32 của Luật này phải đưa cổ phiếu vào niêm yết hoặc đăng ký giao dịch trên hệ thống giao dịch chứng khoán trong thời hạn 30 ngày kể từ ngày kết thúc đợt chào bán ra công chúng.","2. Ngoài các quyền và nghĩa vụ quy định tại khoản 1 Điều này, công ty đại chúng có các quyền và nghĩa vụ theo quy định của Luật Doanh nghiệp và quy định khác của pháp luật có liên quan."],"sua_doi":false,"ghi_chu":[]},{"so":"35","ten":"Chào mua công khai","chuong":"Chương III. CÔNG TY ĐẠI CHÚNG","doan":["1. Các trường hợp sau đây phải chào mua công khai và đăng ký với Ủy ban Chứng khoán Nhà nước:","a) Tổ chức, cá nhân và người có liên quan theo quy định tại các điểm a, b, c, d, e và g khoản 46 Điều 4 của Luật này dự kiến mua cổ phiếu có quyền biểu quyết, chứng chỉ quỹ đóng đang lưu hành dẫn đến trực tiếp hoặc gián tiếp sở hữu đạt từ 25% trở lên số cổ phiếu có quyền biểu quyết của 01 công ty đại chúng, chứng chỉ quỹ đóng đang lưu hành của 01 quỹ đóng;","b) Tổ chức, cá nhân và người có liên quan theo quy định tại các điểm a, b, c d, e và g khoản 46 Điều 4 của Luật này nắm giữ từ 25% trở lên số cổ phiếu có quyền biểu quyết của 01 công ty đại chúng, chứng chỉ quỹ đóng đang lưu hành của 01 quỹ đóng dự kiến mua tiếp dẫn đến trực tiếp hoặc gián tiếp sở hữu đạt hoặc vượt mức 35%, 45%, 55%, 65%, 75% số cổ phiếu có quyền biểu quyết của 01 công ty đại chúng, chứng chỉ quỹ đóng đang lưu hành của 01 quỹ đóng;","c) Trừ trường hợp việc chào mua đã được thực hiện đối với toàn bộ số cổ phiếu có quyền biểu quyết của 01 công ty đại chúng, chứng chỉ quỹ đóng đang lưu hành của 01 quỹ đóng, sau khi thực hiện chào mua công khai, tổ chức, cá nhân và người có liên quan theo quy định tại các điểm a, b, c, d, e và g khoản 46 Điều 4 của Luật này nắm giữ từ 80% trở lên số cổ phiếu có quyền biểu quyết của 01 công ty đại chúng, chứng chỉ quỹ đóng đang lưu hành của 01 quỹ đóng phải mua tiếp số cổ phiếu, chứng chỉ quỹ đóng do các cổ đông, nhà đầu tư còn lại nắm giữ trong thời hạn 30 ngày theo các điều kiện về giá chào mua và phương thức thanh toán tương tự với đợt chào mua công khai.","2. Các đối tượng quy định tại khoản 1 Điều này không phải chào mua công khai nếu thuộc một trong các trường hợp sau đây:","a) Mua cổ phiếu, chứng chỉ quỹ đóng mới phát hành dẫn đến việc sở hữu đạt các mức theo quy định tại khoản 1 Điều này theo phương án phát hành đã được Đại hội đồng cổ đông công ty đại chúng, Ban đại diện quỹ đóng thông qua;","b) Nhận chuyển nhượng cổ phiếu có quyền biểu quyết, chứng chỉ quỹ đóng đang lưu hành dẫn đến việc sở hữu đạt các mức theo quy định tại khoản 1 Điều này đã được Đại hội đồng cổ đông công ty đại chúng, Ban đại diện quỹ đóng thông qua. Trong các trường hợp này, Đại hội đồng cổ đông, Ban đại diện quỹ đóng phải xác định rõ đối tượng chuyển nhượng, nhận chuyển nhượng;","c) Chuyển nhượng cổ phiếu giữa các công ty hoạt động theo nhóm công ty bao gồm tập đoàn kinh tế, tổng công ty, công ty mẹ, công ty con và không dẫn đến trường hợp sở hữu chéo theo quy định của Luật Doanh nghiệp;","d) Tổ chức, cá nhân sở hữu cổ phiếu trong các đợt đấu giá chứng khoán chào bán ra công chúng, các đợt chào bán khi chuyển nhượng vốn nhà nước hoặc vốn của doanh nghiệp nhà nước đầu tư tại doanh nghiệp khác;","đ) Tổ chức, cá nhân sở hữu cổ phiếu từ hoạt động chia, tách, hợp nhất, sáp nhập doanh nghiệp;","e) Tặng cho, thừa kế cổ phiếu, chứng chỉ quỹ đóng;","g) Chuyển nhượng cổ phiếu, chứng chỉ quỹ đóng theo bản án, quyết định của Tòa án đã có hiệu lực pháp luật, quyết định của Trọng tài.","3. Chính phủ quy định chi tiết việc chào mua công khai cổ phiếu của công ty đại chúng, chứng chỉ quỹ đóng."],"sua_doi":false,"ghi_chu":[]},{"so":"36","ten":"Công ty đại chúng mua lại cổ phiếu của chính mình","chuong":"Chương III. CÔNG TY ĐẠI CHÚNG","doan":["1. Công ty đại chúng mua lại cổ phiếu của chính mình phải đáp ứng các điều kiện sau đây:","a) Có quyết định của Đại hội đồng cổ đông thông qua việc mua lại cổ phiếu để giảm vốn điều lệ, phương án mua lại, trong đó nêu rõ số lượng, thời gian thực hiện, nguyên tắc xác định giá mua lại;","b) Có đủ nguồn để mua lại cổ phiếu từ các nguồn sau đây: thặng dư vốn cổ phần, quỹ đầu tư phát triển, lợi nhuận sau thuế chưa phân phối, quỹ khác thuộc vốn chủ sở hữu được sử dụng để bổ sung vốn điều lệ theo quy định của pháp luật;","c) Có công ty chứng khoán được chỉ định thực hiện giao dịch, trừ trường hợp công ty chứng khoán là thành viên của Sở giao dịch chứng khoán Việt Nam mua lại cổ phiếu của chính mình;","d) Đáp ứng các điều kiện theo quy định của pháp luật trong trường hợp công ty đại chúng thuộc ngành, nghề đầu tư kinh doanh có điều kiện;","đ) Không thuộc trường hợp quy định tại khoản 3 Điều này.","2. Việc mua lại cổ phiếu được miễn trừ điều kiện quy định tại các điểm a, b, c và d khoản 1 Điều này trong các trường hợp sau đây:","a) Mua lại cổ phiếu theo yêu cầu của cổ đông theo quy định của Luật Doanh nghiệp;","b) Mua lại cổ phiếu của người lao động theo quy chế phát hành cổ phiếu cho người lao động của công ty, mua lại cổ phiếu lẻ theo phương án phát hành cổ phiếu để trả cổ tức, phát hành cổ phiếu từ nguồn vốn chủ sở hữu;","c) Công ty chứng khoán mua lại cổ phiếu của chính mình để sửa lỗi giao dịch hoặc mua lại cổ phiếu lô lẻ.","3. Công ty đại chúng không được mua lại cổ phiếu của chính mình trong các trường hợp sau đây:","a) Đang có nợ phải trả quá hạn căn cứ vào báo cáo tài chính năm gần nhất được kiểm toán; trường hợp thời điểm dự kiến mua lại cổ phiếu quá 06 tháng kể từ thời điểm kết thúc năm tài chính, việc xác định nợ quá hạn được căn cứ vào báo cáo tài chính 06 tháng gần nhất được kiểm toán hoặc soát xét; trừ trường hợp quy định tại điểm c khoản 2 Điều này;","b) Đang trong quá trình chào bán, phát hành cổ phiếu để huy động thêm vốn, trừ trường hợp quy định tại điểm c khoản 2 Điều này;","c) Cổ phiếu của công ty đang là đối tượng chào mua công khai, trừ trường hợp quy định tại khoản 2 Điều này;","d) Đã thực hiện việc mua lại cổ phiếu của chính mình trong thời hạn 06 tháng kể từ ngày báo cáo kết quả mua lại hoặc vừa kết thúc đợt chào bán, phát hành cổ phiếu để tăng vốn không quá 06 tháng kể từ ngày kết thúc đợt chào bán, phát hành, trừ trường hợp quy định tại khoản 2 Điều này.","4. Trừ trường hợp mua lại cổ phiếu tương ứng với tỷ lệ sở hữu trong công ty hoặc mua lại cổ phiếu theo bản án, quyết định của Tòa án đã có hiệu lực pháp luật, quyết định của Trọng tài hoặc mua lại cổ phiếu thông qua giao dịch thực hiện theo phương thức khớp lệnh, công ty không được mua lại cổ phiếu của các đối tượng sau đây:","a) Người nội bộ và người có liên quan của người nội bộ theo quy định của Luật này;","b) Người sở hữu cổ phiếu có hạn chế chuyển nhượng theo quy định của pháp luật và Điều lệ công ty;","c) Cổ đông lớn theo quy định của Luật này.","5. Công ty đại chúng thực hiện mua lại cổ phiếu của chính mình theo quy định tại khoản 1 và điểm a khoản 2 Điều này phải làm thủ tục giảm vốn điều lệ tương ứng với tổng giá trị tính theo mệnh giá số cổ phiếu được công ty mua lại trong thời hạn 10 ngày kể từ ngày hoàn thành việc thanh toán mua lại cổ phiếu.","6. Trường hợp công ty mua lại cổ phiếu của người lao động theo quy chế phát hành cổ phiếu cho người lao động của công ty thì thực hiện theo quy định sau đây:","a) Tổng số lượng cổ phiếu của người lao động đã được công ty mua lại phải được báo cáo tại Đại hội đồng cổ đông thường niên gần nhất;","b) Công ty không phải làm thủ tục giảm vốn điều lệ đối với số cổ phiếu được công ty mua lại.","7. Công ty chứng khoán, công ty đại chúng mua lại cổ phiếu của chính mình được bán ra cổ phiếu ngay sau khi mua lại trong các trường hợp sau đây:","a) Công ty chứng khoán mua lại cổ phiếu của chính mình để sửa lỗi giao dịch hoặc mua lại cổ phiếu lô lẻ;","b) Công ty đại chúng mua lại cổ phiếu lẻ theo phương án phát hành cổ phiếu để trả cổ tức, phương án phát hành cổ phiếu từ nguồn vốn chủ sở hữu;","c) Công ty đại chúng mua lại cổ phiếu lô lẻ theo yêu cầu của cổ đông.","8. Bộ trưởng Bộ Tài chính quy định chi tiết việc mua lại cổ phiếu của công ty đại chúng."],"sua_doi":true,"ghi_chu":["Khoản này được sửa đổi, bổ sung theo quy định tại khoản 13 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"37","ten":"Báo cáo mua lại cổ phiếu, công bố thông tin và thực hiện việc mua lại cổ phiếu","chuong":"Chương III. CÔNG TY ĐẠI CHÚNG","doan":["1. Công ty đại chúng theo quy định tại khoản 1 Điều 36 của Luật này trước khi mua lại cổ phiếu của chính mình phải gửi tài liệu báo cáo đến Ủy ban Chứng khoán Nhà nước bao gồm:","a) Báo cáo về việc mua lại cổ phiếu;","b) Quyết định của Đại hội đồng cổ đông thông qua việc mua lại cổ phiếu, phương án mua lại;","c) Văn bản xác nhận việc chỉ định thực hiện giao dịch của công ty chứng khoán, trừ trường hợp công ty chứng khoán là thành viên của Sở giao dịch chứng khoán Việt Nam mua lại cổ phiếu của chính mình;","d) Quyết định của Hội đồng quản trị thông qua phương án triển khai mua lại cổ phiếu;","đ) Báo cáo tài chính gần nhất được kiểm toán;","e) Tài liệu chứng minh công ty có đủ nguồn để mua lại cổ phiếu;","g) Tài liệu chứng minh đáp ứng các điều kiện để được mua lại cổ phiếu của chính mình theo quy định của pháp luật trong trường hợp công ty đại chúng thuộc ngành, nghề đầu tư kinh doanh có điều kiện.","2. Báo cáo về việc mua lại cổ phiếu bao gồm các nội dung sau đây:","a) Mục đích mua lại;","b) Tổng số lượng cổ phiếu đăng ký mua lại;","c) Nguồn vốn thực hiện mua lại;","d) Phương thức giao dịch;","đ) Thời gian dự kiến thực hiện;","e) Nguyên tắc xác định giá (khoảng giá).","3. Trong thời hạn 07 ngày làm việc kể từ ngày nhận được tài liệu báo cáo mua lại cổ phiếu quy định tại khoản 1 Điều này đầy đủ và hợp lệ, Ủy ban Chứng khoán Nhà nước gửi văn bản thông báo cho công ty đại chúng về việc nhận được đầy đủ tài liệu báo cáo mua lại cổ phiếu; trường hợp tài liệu chưa đầy đủ, hợp lệ, Ủy ban Chứng khoán Nhà nước có văn bản gửi công ty đại chúng nêu rõ nội dung, yêu cầu sửa đổi, bổ sung. Thời hạn sửa đổi, bổ sung tài liệu báo cáo không tính vào thời hạn quy định tại khoản này. Trường hợp từ chối, Ủy ban Chứng khoán Nhà nước phải trả lời bằng văn bản và nêu rõ lý do.","4. Trong thời hạn 07 ngày làm việc kể từ ngày Ủy ban Chứng khoán Nhà nước thông báo, công ty đại chúng phải công bố thông tin trên trang thông tin điện tử của công ty, phương tiện công bố thông tin của Ủy ban Chứng khoán Nhà nước, Sở giao dịch chứng khoán Việt Nam các nội dung theo quy định tại khoản 2 Điều này. Công ty đại chúng được thực hiện mua lại cổ phiếu sau 07 ngày làm việc kể từ ngày công bố thông tin.","5. Trong thời hạn 10 ngày kể từ ngày kết thúc giao dịch mua lại cổ phiếu, công ty đại chúng phải gửi báo cáo kết quả giao dịch đến Ủy ban Chứng khoán Nhà nước và công bố thông tin ra công chúng. Trong trường hợp công ty đại chúng không thực hiện hết số lượng cổ phiếu dự kiến giao dịch, công ty đại chúng phải báo cáo và công bố lý do không hoàn thành.","6. Công ty đại chúng phải kết thúc việc mua lại cổ phiếu theo thời gian nêu trong bản công bố thông tin nhưng tối đa không quá 30 ngày kể từ ngày bắt đầu thực hiện giao dịch.","7. Công ty đại chúng không được chào bán cổ phiếu để tăng vốn điều lệ trong vòng 06 tháng kể từ ngày kết thúc việc mua lại cổ phiếu, trừ trường hợp công ty đại chúng mua lại cổ phiếu của người lao động nghỉ việc theo chương trình phát hành cổ phiếu cho người lao động hoặc công ty chứng khoán mua lại cổ phiếu của chính mình trong trường hợp thực hiện sửa lỗi giao dịch."],"sua_doi":true,"ghi_chu":["Khoản này được sửa đổi, bổ sung theo quy định tại khoản 14 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"38","ten":"Hủy tư cách công ty đại chúng","chuong":"Chương III. CÔNG TY ĐẠI CHÚNG","doan":["1. Công ty đại chúng bị hủy tư cách công ty đại chúng khi thuộc một trong các trường hợp sau đây:","a) Không còn đáp ứng một trong các điều kiện của công ty đại chúng quy định tại điểm a khoản 1 Điều 32 của Luật này;","b) Không thực hiện công bố thông tin trong 02 năm liên tục về báo cáo tài chính năm được kiểm toán;","c) Không thực hiện công bố thông tin trong 02 năm liên tục về nghị quyết Đại hội đồng cổ đông thường niên;","d) Trong 01 năm kể từ ngày Ủy ban Chứng khoán Nhà nước xác nhận hoàn tất việc đăng ký công ty đại chúng hoặc kể từ ngày kết thúc đợt chào bán ra công chúng, công ty không thực hiện đăng ký cổ phiếu tại Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam hoặc không thực hiện đăng ký niêm yết, đăng ký giao dịch cổ phiếu trên Sở giao dịch chứng khoán.","2. Trong thời hạn 15 ngày kể từ ngày không còn đáp ứng một trong các điều kiện quy định tại điểm a khoản 1 Điều 32 của Luật này, công ty đại chúng có trách nhiệm gửi tài liệu báo cáo đến Ủy ban Chứng khoán Nhà nước. Sau 01 năm kể từ ngày không còn đáp ứng quy định tại điểm a khoản 1 Điều 32 của Luật này mà công ty vẫn không đáp ứng được điều kiện là công ty đại chúng, công ty phải gửi hồ sơ hủy tư cách công ty đại chúng đến Ủy ban Chứng khoán Nhà nước để xem xét hủy tư cách công ty đại chúng. Trường hợp công ty đại chúng không gửi hồ sơ, tài liệu báo cáo tới Ủy ban Chứng khoán Nhà nước theo quy định tại khoản này, Ủy ban Chứng khoán Nhà nước căn cứ danh sách cổ đông do Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam cung cấp hoặc Báo cáo tài chính năm gần nhất của công ty được kiểm toán để xem xét hủy tư cách công ty đại chúng.","3. Công ty phải thực hiện đầy đủ các quy định liên quan đến công ty đại chúng cho đến thời điểm Ủy ban Chứng khoán Nhà nước thông báo hủy tư cách công ty đại chúng.","4. Trong thời hạn 07 ngày làm việc kể từ ngày nhận được thông báo của Ủy ban Chứng khoán Nhà nước về việc hủy tư cách công ty đại chúng, công ty có trách nhiệm thông báo việc hủy tư cách công ty đại chúng trên trang thông tin điện tử của công ty, phương tiện công bố thông tin của Ủy ban Chứng khoán Nhà nước, Sở giao dịch chứng khoán Việt Nam và thực hiện thủ tục hủy niêm yết, đăng ký giao dịch theo quy định của pháp luật.","5. Bộ trưởng Bộ Tài chính quy định việc hủy tư cách công ty đại chúng, trình tự, thủ tục hủy tư cách công ty đại chúng và việc hủy tư cách công ty đại chúng đối với trường hợp không đáp ứng điều kiện là công ty đại chúng do tổ chức lại, giải thể, phá sản doanh nghiệp."],"sua_doi":true,"ghi_chu":["Khoản này được sửa đổi, bổ sung theo quy định tại điểm a khoản 15 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025.","Khoản này được sửa đổi, bổ sung theo quy định tại điểm a khoản 15 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025.","Khoản này được sửa đổi, bổ sung theo quy định tại điểm b khoản 15 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"39","ten":"Hồ sơ hủy tư cách công ty đại chúng","chuong":"Chương III. CÔNG TY ĐẠI CHÚNG","doan":["Công ty đại chúng thuộc trường hợp quy định tại khoản 2 Điều 38 của Luật này phải nộp hồ sơ hủy tư cách công ty đại chúng đến Ủy ban Chứng khoán Nhà nước. Hồ sơ hủy tư cách công ty đại chúng bao gồm:","1. Giấy chứng nhận đăng ký doanh nghiệp;","2. Văn bản thông báo về việc công ty đại chúng không còn đáp ứng quy định tại điểm a khoản 1 Điều 32 của Luật này;","3. Danh sách cổ đông của công ty đại chúng không còn đáp ứng điều kiện về cơ cấu cổ đông do Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam cung cấp hoặc do công ty lập đối với công ty đại chúng chưa đăng ký chứng khoán tại Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam;","4. Báo cáo tài chính năm gần nhất được kiểm toán hoặc văn bản xác nhận về vốn chủ sở hữu của tổ chức kiểm toán được chấp thuận đối với trường hợp công ty đại chúng không còn đáp ứng điều kiện về vốn điều lệ đã góp hoặc vốn chủ sở hữu. Trường hợp công ty tăng vốn điều lệ sau thời điểm kết thúc kỳ kế toán năm gần nhất, công ty phải bổ sung báo cáo tài chính kỳ gần nhất được kiểm toán hoặc soát xét. Mục 2 QUẢN TRỊ CÔNG TY ÁP DỤNG ĐỐI VỚI CÔNG TY ĐẠI CHÚNG"],"sua_doi":true,"ghi_chu":["Khoản này được sửa đổi, bổ sung theo quy định tại khoản 16 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025.","Khoản này được sửa đổi, bổ sung theo quy định tại khoản 16 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"40","ten":"Nguyên tắc quản trị công ty áp dụng đối với công ty đại chúng","chuong":"Chương III. CÔNG TY ĐẠI CHÚNG","doan":["Việc quản trị công ty đối với công ty đại chúng phải tuân thủ quy định của Luật này, Luật Doanh nghiệp, quy định khác của pháp luật có liên quan và các nguyên tắc sau đây:","1. Cơ cấu quản trị hợp lý, hiệu quả;","2. Bảo đảm hiệu quả hoạt động của Hội đồng quản trị, Ban kiểm soát; nâng cao trách nhiệm của Hội đồng quản trị đối với công ty và cổ đông;","3. Bảo đảm quyền của cổ đông, đối xử bình đẳng giữa các cổ đông;","4. Bảo đảm vai trò của nhà đầu tư, thị trường chứng khoán và các tổ chức trung gian trong việc hỗ trợ hoạt động quản trị công ty;","5. Tôn trọng và bảo đảm quyền, lợi ích hợp pháp của các bên có quyền lợi liên quan trong quản trị công ty;","6. Công bố thông tin kịp thời, đầy đủ, chính xác và minh bạch hoạt động của công ty; bảo đảm cổ đông được tiếp cận thông tin công bằng."],"sua_doi":false,"ghi_chu":[]},{"so":"41","ten":"Nội dung quản trị công ty áp dụng đối với công ty đại chúng","chuong":"Chương III. CÔNG TY ĐẠI CHÚNG","doan":["1. Cổ đông công ty đại chúng có các quyền và nghĩa vụ sau đây:","a) Được đối xử bình đẳng;","b) Được tiếp cận đầy đủ thông tin định kỳ và thông tin bất thường do công ty công bố theo quy định của pháp luật;","c) Được bảo vệ các quyền, lợi ích hợp pháp của mình; đề nghị đình chỉ, hủy bỏ nghị quyết, quyết định của Đại hội đồng cổ đông, Hội đồng quản trị theo quy định của Luật Doanh nghiệp;","d) Cổ đông lớn không được lợi dụng ưu thế của mình gây ảnh hưởng đến các quyền, lợi ích của công ty, của các cổ đông khác theo quy định của pháp luật và Điều lệ công ty; có nghĩa vụ công bố thông tin theo quy định của pháp luật;","đ) Quyền và nghĩa vụ khác theo quy định của pháp luật và Điều lệ công ty.","2. Việc triệu tập, tổ chức họp Đại hội đồng cổ đông tuân thủ các quy định sau đây:","a) Hội đồng quản trị, Ban kiểm soát, người triệu tập họp Đại hội đồng cổ đông phải tuân thủ đầy đủ trình tự, thủ tục về triệu tập họp Đại hội đồng cổ đông theo quy định của Luật Doanh nghiệp, Điều lệ công ty và Quy chế nội bộ về quản trị công ty; bố trí địa điểm, thời gian hợp lý để các cổ đông tham dự họp Đại hội đồng cổ đông;","b) Công ty đại chúng quy định tại Quy chế nội bộ về quản trị công ty việc áp dụng công nghệ thông tin hiện đại để cổ đông có thể tham dự và phát biểu ý kiến tại cuộc họp Đại hội đồng cổ đông thông qua họp trực tuyến, bỏ phiếu điện tử hoặc hình thức điện tử khác theo quy định của Luật Doanh nghiệp và Điều lệ công ty;","c) Công ty đại chúng phải mời đại diện tổ chức kiểm toán được chấp thuận thực hiện kiểm toán Báo cáo tài chính năm của công ty dự họp Đại hội đồng cổ đông thường niên trong trường hợp Báo cáo kiểm toán báo cáo tài chính năm của công ty có các khoản ngoại trừ trọng yếu;","d) Tuân thủ các quy định khác của pháp luật và Điều lệ công ty.","3. Thành phần, cơ cấu, trách nhiệm và nghĩa vụ của Hội đồng quản trị bảo đảm tuân thủ các quy định sau đây:","a) Cơ cấu Hội đồng quản trị của công ty đại chúng bảo đảm sự cân đối giữa các thành viên Hội đồng quản trị điều hành và không điều hành, số lượng thành viên Hội đồng quản trị độc lập để bảo đảm tính độc lập của Hội đồng quản trị;","b) Hội đồng quản trị phải chịu trách nhiệm trước cổ đông về hoạt động của công ty; bảo đảm hoạt động của công ty tuân thủ quy định của pháp luật, Điều lệ công ty và quy định nội bộ của công ty; xây dựng Quy chế nội bộ về quản trị công ty trình Đại hội đồng cổ đông thông qua; bổ nhiệm người phụ trách quản trị công ty và có các trách nhiệm, nghĩa vụ khác theo quy định của pháp luật, Điều lệ công ty;","c) Hội đồng quản trị phải tổ chức họp ít nhất mỗi quý 01 lần theo trình tự, thủ tục quy định tại Điều lệ công ty và Quy chế nội bộ về quản trị công ty. Việc tổ chức họp Hội đồng quản trị, chương trình họp và các tài liệu liên quan được thông báo trước cho các thành viên Hội đồng quản trị theo thời hạn quy định của pháp luật và Điều lệ công ty.","4. Việc đề cử, ứng cử thành viên Hội đồng quản trị tuân thủ quy định của Luật Doanh nghiệp, pháp luật có liên quan và các quy định sau đây:","a) Trường hợp đã xác định được ứng cử viên Hội đồng quản trị, công ty đại chúng phải công bố thông tin liên quan đến các ứng cử viên tối thiểu là 10 ngày trước ngày khai mạc họp Đại hội đồng cổ đông trên trang thông tin điện tử của công ty để cổ đông có thể tìm hiểu về các ứng cử viên này trước khi bỏ phiếu;","b) Trường hợp số lượng ứng cử viên Hội đồng quản trị thông qua đề cử và ứng cử vẫn không đủ số lượng cần thiết theo quy định của Luật Doanh nghiệp, Hội đồng quản trị đương nhiệm có thể giới thiệu thêm ứng cử viên hoặc tổ chức đề cử theo quy định tại Điều lệ công ty và Quy chế nội bộ về quản trị công ty.","5. Thành viên Hội đồng quản trị có các quyền và trách nhiệm sau đây:","a) Được cung cấp thông tin, tài liệu về tình hình tài chính, hoạt động kinh doanh của công ty và của các đơn vị trong công ty;","b) Thực hiện các nhiệm vụ của mình một cách trung thực, cẩn trọng vì lợi ích cao nhất của cổ đông và của công ty;","c) Tham dự đầy đủ các cuộc họp của Hội đồng quản trị và có ý kiến về các vấn đề được đưa ra thảo luận;","d) Báo cáo kịp thời, đầy đủ với Hội đồng quản trị các khoản thù lao nhận được từ các công ty con, công ty liên kết và các tổ chức khác;","đ) Báo cáo, công bố thông tin khi thực hiện giao dịch cổ phiếu của công ty theo quy định của pháp luật;","e) Quyền, trách nhiệm khác theo quy định của pháp luật và Điều lệ công ty.","6. Công ty đại chúng tuân thủ quy định về ngăn ngừa xung đột lợi ích và công bố thông tin minh bạch sau đây:","a) Thành viên Hội đồng quản trị, thành viên Ban kiểm soát (Kiểm soát viên), Tổng giám đốc (Giám đốc) và người quản lý khác của công ty đại chúng có trách nhiệm công khai các lợi ích liên quan, không được sử dụng những thông tin có được nhờ chức vụ của mình để tư lợi cá nhân hoặc phục vụ lợi ích của tổ chức, cá nhân khác;","b) Công ty đại chúng có trách nhiệm áp dụng các biện pháp cần thiết để ngăn ngừa thành viên Hội đồng quản trị, thành viên Ban kiểm soát (Kiểm soát viên), Tổng giám đốc (Giám đốc), người quản lý khác của công ty, cổ đông và những người có liên quan can thiệp vào hoạt động của công ty, gây tổn hại cho lợi ích của công ty; tuân thủ các quy định về giao dịch với cổ đông, người quản lý doanh nghiệp và người có liên quan của các đối tượng này; bảo đảm quyền, lợi ích hợp pháp của người có quyền lợi liên quan đến công ty;","c) Công ty đại chúng có nghĩa vụ báo cáo, công bố đầy đủ, chính xác và kịp thời thông tin định kỳ, thông tin bất thường về tình hình hoạt động sản xuất, kinh doanh, tài chính, tình hình quản trị công ty cho cổ đông, công chúng và các thông tin khác nếu thông tin đó có khả năng ảnh hưởng đến giá chứng khoán, quyết định của cổ đông và nhà đầu tư;","d) Các thông tin phải công bố và phương thức công bố thông tin được thực hiện theo quy định của Luật này, Điều lệ công ty và Quy chế về công bố thông tin của công ty.","7. Chính phủ quy định chi tiết Điều này."],"sua_doi":false,"ghi_chu":[]},{"so":"42","ten":"Tổ chức thị trường giao dịch chứng khoán","chuong":"Chương IV. THỊ TRƯỜNG GIAO DỊCH CHỨNG KHOÁN","doan":["1. Sở giao dịch chứng khoán Việt Nam và công ty con được tổ chức thị trường giao dịch chứng khoán cho chứng khoán đủ điều kiện niêm yết; chứng khoán của doanh nghiệp nhà nước, công ty trách nhiệm hữu hạn một thành viên do doanh nghiệp nhà nước nắm giữ 100% vốn điều lệ chuyển đổi thành công ty cổ phần; chứng khoán của các doanh nghiệp khác chưa đủ điều kiện niêm yết; chứng khoán của doanh nghiệp khởi nghiệp sáng tạo; chứng khoán phái sinh và các loại chứng khoán khác theo quy định của Chính phủ.","2. Ngoài Sở giao dịch chứng khoán Việt Nam và công ty con, không tổ chức, cá nhân nào được phép tổ chức và vận hành thị trường giao dịch chứng khoán."],"sua_doi":false,"ghi_chu":[]},{"so":"43","ten":"Thành lập và hoạt động của Sở giao dịch chứng khoán Việt Nam và công ty con","chuong":"Chương IV. THỊ TRƯỜNG GIAO DỊCH CHỨNG KHOÁN","doan":["1. Sở giao dịch chứng khoán Việt Nam là doanh nghiệp được thành lập và hoạt động theo quy định của Luật này và Luật Doanh nghiệp, do Nhà nước nắm giữ trên 50% vốn điều lệ hoặc tổng số cổ phần có quyền biểu quyết.","2. Thủ tướng Chính phủ quyết định thành lập, giải thể, mô hình hoạt động, hình thức sở hữu, chức năng, quyền và nghĩa vụ của Sở giao dịch chứng khoán Việt Nam và việc thành lập công ty con của Sở giao dịch chứng khoán Việt Nam theo đề nghị của Bộ trưởng Bộ Tài chính.","3. Sở giao dịch chứng khoán Việt Nam và công ty con chịu sự quản lý và giám sát của Ủy ban Chứng khoán Nhà nước."],"sua_doi":false,"ghi_chu":[]},{"so":"44","ten":"Cơ cấu tổ chức quản lý của Sở giao dịch chứng khoán Việt Nam","chuong":"Chương IV. THỊ TRƯỜNG GIAO DỊCH CHỨNG KHOÁN","doan":["1. Thủ tướng Chính phủ quyết định cơ cấu tổ chức quản lý của Sở giao dịch chứng khoán Việt Nam theo quy định của Luật này, Luật Doanh nghiệp và quy định khác của pháp luật có liên quan.","2. Chủ tịch Hội đồng thành viên hoặc Chủ tịch Hội đồng quản trị, Tổng giám đốc (Giám đốc) Sở giao dịch chứng khoán Việt Nam do Bộ trưởng Bộ Tài chính phê chuẩn hoặc bổ nhiệm, miễn nhiệm theo đề nghị của Hội đồng thành viên hoặc Hội đồng quản trị Sở giao dịch chứng khoán Việt Nam và ý kiến của Chủ tịch Ủy ban Chứng khoán Nhà nước.","3. Quyền và nhiệm vụ của Hội đồng thành viên hoặc Hội đồng quản trị, Tổng giám đốc (Giám đốc), Ban kiểm soát (Kiểm soát viên) thực hiện theo quy định của pháp luật và Điều lệ Sở giao dịch chứng khoán Việt Nam."],"sua_doi":false,"ghi_chu":[]},{"so":"45","ten":"Điều lệ Sở giao dịch chứng khoán Việt Nam","chuong":"Chương IV. THỊ TRƯỜNG GIAO DỊCH CHỨNG KHOÁN","doan":["1. Điều lệ Sở giao dịch chứng khoán Việt Nam được Bộ trưởng Bộ Tài chính phê chuẩn hoặc ban hành, sửa đổi, bổ sung theo đề nghị của Hội đồng thành viên hoặc Hội đồng quản trị Sở giao dịch chứng khoán Việt Nam và ý kiến của Chủ tịch Ủy ban Chứng khoán Nhà nước.","2. Điều lệ Sở giao dịch chứng khoán Việt Nam có các nội dung chính sau đây:","a) Tên, địa chỉ trụ sở chính, công ty con, chi nhánh;","b) Mục tiêu, phạm vi hoạt động và các dịch vụ được cung cấp;","c) Vốn điều lệ; cách thức tăng, giảm vốn điều lệ hoặc chuyển nhượng vốn;","d) Tên, địa chỉ và các thông tin cơ bản của cổ đông sáng lập hoặc thành viên góp vốn hoặc chủ sở hữu;","đ) Phần vốn góp hoặc số cổ phần và giá trị vốn góp của cổ đông sáng lập hoặc thành viên góp vốn hoặc chủ sở hữu;","e) Người đại diện theo pháp luật;","g) Cơ cấu tổ chức quản lý;","h) Quyền và nghĩa vụ của Sở giao dịch chứng khoán Việt Nam;","i) Quyền và nghĩa vụ của thành viên góp vốn, chủ sở hữu hoặc cổ đông;","k) Quyền và nghĩa vụ của Hội đồng thành viên hoặc Hội đồng quản trị, Tổng giám đốc (Giám đốc) và Ban kiểm soát (Kiểm soát viên);","l) Thể thức thông qua quyết định của Sở giao dịch chứng khoán Việt Nam;","m) Thể thức sửa đổi, bổ sung Điều lệ;","n) Chế độ kế toán, kiểm toán được áp dụng;","o) Việc thành lập các quỹ, cơ chế sử dụng quỹ; nguyên tắc sử dụng lợi nhuận, xử lý lỗ và chế độ tài chính khác;","p) Nguyên tắc giải quyết tranh chấp nội bộ."],"sua_doi":false,"ghi_chu":[]},{"so":"46","ten":"Quyền và nghĩa vụ của Sở giao dịch chứng khoán Việt Nam","chuong":"Chương IV. THỊ TRƯỜNG GIAO DỊCH CHỨNG KHOÁN","doan":["1. Sở giao dịch chứng khoán Việt Nam có các quyền sau đây:","a) Ban hành các quy chế về niêm yết chứng khoán, giao dịch chứng khoán, công bố thông tin, thành viên của Sở giao dịch chứng khoán Việt Nam và các quy chế nghiệp vụ khác liên quan đến tổ chức và hoạt động thị trường giao dịch chứng khoán sau khi được Ủy ban Chứng khoán Nhà nước chấp thuận;","b) Tổ chức, vận hành thị trường giao dịch chứng khoán;","c) Cảnh báo, kiểm soát, hạn chế giao dịch chứng khoán theo quy định của pháp luật và quy chế của Sở giao dịch chứng khoán Việt Nam;","d) Tạm ngừng, đình chỉ giao dịch đối với một hoặc một số chứng khoán trong trường hợp giá, khối lượng giao dịch chứng khoán có biến động bất thường, tổ chức niêm yết, tổ chức đăng ký giao dịch không có biện pháp khắc phục nguyên nhân dẫn đến việc chứng khoán bị đưa vào diện cảnh báo, kiểm soát, hạn chế giao dịch hoặc trong trường hợp cần thiết để bảo vệ quyền, lợi ích hợp pháp của nhà đầu tư và bảo đảm ổn định, an toàn của thị trường chứng khoán;","đ) Chấp thuận, thay đổi, hủy bỏ niêm yết, đăng ký giao dịch chứng khoán và giám sát việc duy trì điều kiện niêm yết chứng khoán của các tổ chức niêm yết;","e) Chấp thuận, hủy bỏ tư cách thành viên của Sở giao dịch chứng khoán Việt Nam;","g) Cung cấp dịch vụ đấu giá, đấu thầu; dịch vụ về thông tin thị trường và thông tin liên quan đến chứng khoán niêm yết, đăng ký giao dịch; dịch vụ phát triển hạ tầng công nghệ cho thị trường chứng khoán và các dịch vụ liên quan khác theo quy định tại Điều lệ Sở giao dịch chứng khoán Việt Nam;","h) Làm trung gian hòa giải theo yêu cầu của thành viên của Sở giao dịch chứng khoán Việt Nam khi phát sinh tranh chấp liên quan đến hoạt động giao dịch chứng khoán;","i) Kiểm tra, xử lý vi phạm đối với thành viên của Sở giao dịch chứng khoán Việt Nam, tổ chức niêm yết, tổ chức đăng ký giao dịch theo quy chế của Sở giao dịch chứng khoán Việt Nam;","k) Đề nghị cơ quan quản lý nhà nước cung cấp thông tin liên quan đến thành viên của Sở giao dịch chứng khoán Việt Nam, tổ chức niêm yết, tổ chức đăng ký giao dịch để phục vụ công bố thông tin theo quy định của pháp luật;","l) Quyền khác theo quy định của pháp luật và Điều lệ Sở giao dịch chứng khoán Việt Nam.","2. Sở giao dịch chứng khoán Việt Nam có các nghĩa vụ sau đây:","a) Bảo đảm hoạt động giao dịch chứng khoán trên thị trường chứng khoán được tiến hành công khai, công bằng, trật tự, an toàn và hiệu quả;","b) Thực hiện chế độ kế toán, kiểm toán, thống kê, nghĩa vụ tài chính, báo cáo, công bố thông tin theo quy định của pháp luật;","c) Giám sát hoạt động giao dịch chứng khoán, việc tuân thủ nghĩa vụ của thành viên của Sở giao dịch chứng khoán Việt Nam, hoạt động công bố thông tin của tổ chức niêm yết, tổ chức đăng ký giao dịch và nhà đầu tư thuộc đối tượng công bố thông tin quy định tại Điều 118 của Luật này;","d) Ban hành tiêu chí giám sát giao dịch, chỉ tiêu báo cáo giám sát giao dịch áp dụng cho thành viên của Sở giao dịch chứng khoán Việt Nam sau khi được Ủy ban Chứng khoán Nhà nước chấp thuận;","đ) Báo cáo, kiến nghị Ủy ban Chứng khoán Nhà nước các biện pháp ứng phó, khắc phục sự cố, sự kiện, biến động ảnh hưởng đến an toàn, ổn định và tính toàn vẹn của thị trường giao dịch chứng khoán; vi phạm của nhà đầu tư, thành viên của Sở giao dịch chứng khoán Việt Nam, tổ chức niêm yết, tổ chức đăng ký giao dịch;","e) Phối hợp thực hiện công tác tuyên truyền, phổ biến kiến thức về chứng khoán và thị trường chứng khoán cho nhà đầu tư;","g) Cung cấp thông tin và phối hợp với Tổng công ty lưu ký và bù trừ chứng khoán Việt Nam trong hoạt động nghiệp vụ chứng khoán và cơ quan có thẩm quyền trong công tác điều tra, phòng, chống vi phạm pháp luật về chứng khoán và thị trường chứng khoán;","h) Nghĩa vụ khác theo quy định của pháp luật và Điều lệ Sở giao dịch chứng khoán Việt Nam.","3. Cán bộ, nhân viên, người lao động của Sở giao dịch chứng khoán Việt Nam trong khi thực thi nhiệm vụ, quyền hạn của mình phải tuân thủ quy định của pháp luật về chứng khoán và thị trường chứng khoán, quy tắc đạo đức nghề nghiệp, quy định về bảo mật thông tin và quy định khác của pháp luật có liên quan.","4. Thủ tướng Chính phủ quyết định việc tổ chức, phân công thực hiện các quyền, nghĩa vụ của Sở giao dịch chứng khoán Việt Nam và công ty con theo quy định của Luật này trên cơ sở đề nghị của Bộ trưởng Bộ Tài chính."],"sua_doi":false,"ghi_chu":[]},{"so":"47","ten":"Thành viên của Sở giao dịch chứng khoán Việt Nam","chuong":"Chương IV. THỊ TRƯỜNG GIAO DỊCH CHỨNG KHOÁN","doan":["1. Thành viên của Sở giao dịch chứng khoán Việt Nam bao gồm:","a) Thành viên giao dịch là công ty chứng khoán được Sở giao dịch chứng khoán Việt Nam chấp thuận trở thành thành viên giao dịch;","b) Thành viên giao dịch đặc biệt là ngân hàng thương mại, chi nhánh ngân hàng nước ngoài và các tổ chức khác được Sở giao dịch chứng khoán Việt Nam chấp thuận trở thành thành viên giao dịch đặc biệt.","2. Thành viên của Sở giao dịch chứng khoán Việt Nam có các quyền sau đây:","a) Sử dụng hệ thống giao dịch chứng khoán và các dịch vụ do Sở giao dịch chứng khoán Việt Nam và công ty con cung cấp;","b) Nhận các thông tin về thị trường giao dịch chứng khoán từ Sở giao dịch chứng khoán Việt Nam và công ty con;","c) Đề nghị Sở giao dịch chứng khoán Việt Nam làm trung gian hòa giải khi có tranh chấp liên quan đến hoạt động giao dịch chứng khoán của thành viên giao dịch;","d) Đề xuất và kiến nghị các vấn đề liên quan đến hoạt động giao dịch chứng khoán của Sở giao dịch chứng khoán Việt Nam và công ty con;","đ) Quyền khác theo quy định của pháp luật và quy chế của Sở giao dịch chứng khoán Việt Nam.","3. Thành viên của Sở giao dịch chứng khoán Việt Nam có các nghĩa vụ sau đây:","a) Chịu sự giám sát của Sở giao dịch chứng khoán Việt Nam và công ty con đối với hoạt động giao dịch chứng khoán và hoạt động công bố thông tin theo quy định tại quy chế của Sở giao dịch chứng khoán Việt Nam;","b) Công bố thông tin theo quy định của pháp luật và quy chế của Sở giao dịch chứng khoán Việt Nam;","c) Hỗ trợ các thành viên giao dịch khác theo yêu cầu của Sở giao dịch chứng khoán Việt Nam và công ty con trong trường hợp cần thiết;","d) Nghĩa vụ khác theo quy định của pháp luật và quy chế của Sở giao dịch chứng khoán Việt Nam.","4. Chính phủ quy định điều kiện, hồ sơ, trình tự, thủ tục trở thành thành viên của Sở giao dịch chứng khoán Việt Nam."],"sua_doi":false,"ghi_chu":[]},{"so":"48","ten":"Niêm yết, đăng ký giao dịch chứng khoán","chuong":"Chương IV. THỊ TRƯỜNG GIAO DỊCH CHỨNG KHOÁN","doan":["1. Chứng khoán đã chào bán ra công chúng, cổ phiếu của công ty đại chúng, chứng chỉ quỹ đóng, chứng chỉ quỹ hoán đổi danh mục, chứng quyền có bảo đảm, hợp đồng tương lai, hợp đồng quyền chọn do Ủy ban Chứng khoán Nhà nước chấp thuận phải được niêm yết, đăng ký giao dịch trên hệ thống giao dịch chứng khoán.","2. Công cụ nợ của Chính phủ, trái phiếu được Chính phủ bảo lãnh và trái phiếu chính quyền địa phương được niêm yết trên hệ thống giao dịch chứng khoán theo đề nghị của tổ chức phát hành hoặc tổ chức được ủy quyền phát hành theo quy định của pháp luật.","3. (được bãi bỏ)","4. Chính phủ quy định các loại chứng khoán khác phải được niêm yết, đăng ký giao dịch; việc phân bảng niêm yết, điều kiện niêm yết chứng khoán; hồ sơ, thủ tục niêm yết, đăng ký giao dịch chứng khoán; thay đổi, hủy bỏ niêm yết, đăng ký giao dịch chứng khoán của tổ chức phát hành Việt Nam, tổ chức phát hành nước ngoài; việc niêm yết chứng khoán của tổ chức phát hành Việt Nam ở nước ngoài."],"sua_doi":true,"ghi_chu":["Khoản này được bãi bỏ theo quy định tại điểm a khoản 20 Điều 1 của Luật số 56/2024/QH15, có hiệu lực kể từ ngày 01 tháng 01 năm 2025."]},{"so":"49","ten":"Tạm ngừng, đình chỉ, khôi phục hoạt động giao dịch của Sở giao dịch chứng khoán Việt Nam và công ty con","chuong":"Chương IV. THỊ TRƯỜNG GIAO DỊCH CHỨNG KHOÁN","doan":["1. Ủy ban Chứng khoán Nhà nước thực hiện tạm ngừng, đình chỉ một phần hoặc toàn bộ hoạt động giao dịch của Sở giao dịch chứng khoán Việt Nam và công ty con trong trường hợp sau đây:","a) Khi xảy ra chiến tranh, thảm họa tự nhiên, biến động lớn của nền kinh tế, sự cố hệ thống giao dịch hoặc các sự kiện bất khả kháng khác làm ảnh hưởng đến hoạt động giao dịch bình thường của thị trường giao dịch chứng khoán;","b) Khi thị trường giao dịch chứng khoán có biến động bất thường hoặc trong trường hợp cần thiết để bảo vệ quyền, lợi ích hợp pháp của nhà đầu tư và bảo đảm ổn định, an toàn, tính toàn vẹn của thị trường chứng khoán.","2. Ủy ban Chứng khoán Nhà nước thực hiện việc khôi phục một phần hoặc toàn bộ hoạt động giao dịch của Sở giao dịch chứng khoán Việt Nam và công ty con khi những nguyên nhân dẫn đến việc tạm ngừng, đình chỉ một phần hoặc toàn bộ hoạt động giao dịch của Sở giao dịch chứng khoán Việt Nam và công ty con được khắc phục."],"sua_doi":false,"ghi_chu":[]},{"so":"50","ten":"Giao dịch chứng khoán","chuong":"Chương IV. THỊ TRƯỜNG GIAO DỊCH CHỨNG KHOÁN","doan":["1. Chứng khoán niêm yết, đăng ký giao dịch được tổ chức giao dịch theo phương thức khớp lệnh tập trung, phương thức giao dịch thỏa thuận và phương thức giao dịch khác quy định tại Quy chế giao dịch chứng khoán của Sở giao dịch chứng khoán Việt Nam.","2. Chứng khoán niêm yết, đăng ký giao dịch không được giao dịch bên ngoài hệ thống giao dịch chứng khoán do Sở giao dịch chứng khoán Việt Nam và công ty con tổ chức, trừ trường hợp giao dịch không mang tính chất mua bán hoặc giao dịch khác không thể thực hiện được thông qua hệ thống giao dịch chứng khoán.","3. Việc tổ chức giao dịch loại chứng khoán mới, thay đổi và áp dụng phương thức giao dịch mới, đưa vào vận hành hệ thống giao dịch mới phải được Ủy ban Chứng khoán Nhà nước chấp thuận.","4. Bộ trưởng Bộ Tài chính quy định chi tiết về giao dịch chứng khoán, giám sát giao dịch chứng khoán và các trường hợp giao dịch không mang tính chất mua bán, giao dịch chứng khoán không thể thực hiện được thông qua hệ th
