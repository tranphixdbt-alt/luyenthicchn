bị thu hồi chứng chỉ hành nghề chứng khoán trong trường hợp nào thì KHÔNG được cấp lại chứng chỉ hành nghề?","o":["Không còn đáp ứng điều kiện cấp chứng chỉ hành nghề","Vi phạm Điều 12 hoặc khoản 2 Điều 98 Luật Chứng khoán","Không hành nghề chứng khoán trong 03 năm liên tục","Chứng chỉ hành nghề bị mất, bị hỏng hoặc rách nát"],"a":1,"e":"Khoản 4 Điều 97: người bị thu hồi CCHN theo điểm b khoản 3 (vi phạm Điều 12 hoặc khoản 2 Điều 98) không được cấp lại. Các trường hợp không còn đáp ứng điều kiện, không hành nghề 03 năm liên tục hoặc mất, hỏng chứng chỉ vẫn có thể được cấp lại.","basis":"Khoản 3, 4 Điều 97 Luật Chứng khoán 2019","quote":"Người bị thu hồi chứng chỉ hành nghề chứng khoán trong trường hợp quy định tại điểm b khoản 3 Điều này không được cấp lại chứng chỉ hành nghề","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-068","part":"LUAT","subject":"LU","topic":"Chứng chỉ hành nghề & quy chế thi 2026","level":2,"q":"Anh D có CCHN, làm chuyên viên phân tích tại công ty chứng khoán F (F có nghiệp vụ môi giới). Anh D muốn mở tài khoản giao dịch chứng khoán đứng tên mình tại công ty chứng khoán G để tự đầu tư. Nhận định nào đúng?","o":["Được, nếu anh D thông báo bằng văn bản cho công ty F","Được, vì quy định chỉ áp dụng với người có CCHN môi giới","Không được, vì công ty F có nghiệp vụ môi giới chứng khoán","Được, nếu tổng giá trị giao dịch dưới 02 tỷ đồng mỗi năm"],"a":2,"e":"Điểm b khoản 2 Điều 98: người hành nghề chứng khoán không được mở, quản lý tài khoản giao dịch tại công ty chứng khoán nơi mình không làm việc, trừ khi công ty chứng khoán nơi mình làm việc không có nghiệp vụ môi giới. Quy định áp dụng cho mọi người hành nghề, không phân biệt loại CCHN.","basis":"Điểm b khoản 2 Điều 98 Luật Chứng khoán 2019","quote":"Mở, quản lý tài khoản giao dịch chứng khoán tại công ty chứng khoán nơi mình không làm việc, trừ trường hợp công ty chứng khoán nơi mình đang làm việc không có nghiệp vụ môi giới chứng khoán","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-069","part":"LUAT","subject":"LU","topic":"Chứng chỉ hành nghề & quy chế thi 2026","level":1,"q":"Theo quy định hiện hành và thông báo của UBCKNN năm 2026, nội dung thi sát hạch cấp chứng chỉ hành nghề chứng khoán gồm:","o":["Phần lý thuyết nghiệp vụ và phần thực hành trên phần mềm giao dịch","Phần kiến thức cơ bản, phần pháp luật và phần phỏng vấn trực tiếp","Một bài thi tổng hợp duy nhất về chuyên môn chứng khoán","Phần pháp luật về chứng khoán và TTCK Việt Nam và phần chuyên môn"],"a":3,"e":"Khoản 5a Điều 213 NĐ 155/2020 (bổ sung bởi NĐ 245/2025) và thông báo kế hoạch thi 2026 của UBCKNN: nội dung sát hạch gồm hai phần — Phần pháp luật về chứng khoán và TTCK Việt Nam và Phần chuyên môn; hình thức thi trắc nghiệm trên máy vi tính.","basis":"Khoản 5a Điều 213 NĐ 155/2020/NĐ-CP (bổ sung bởi điểm d khoản 73 Điều 1 NĐ 245/2025/NĐ-CP); Thông báo kế hoạch thi sát hạch 2026 của UBCKNN","quote":"Nội dung sát hạch cấp chứng chỉ hành nghề chứng khoán gồm hai phần: Phần pháp luật về chứng khoán và thị trường chứng khoán Việt Nam và phần chuyên môn.","src":"UBCK_thong_bao_thi_sat_hach_2026_va_gioi_thieu_TT135_ND245.md","as_of":"2026-11"},{"id":"L1-070","part":"LUAT","subject":"LU","topic":"Chứng chỉ hành nghề & quy chế thi 2026","level":2,"q":"Theo Thông báo số 11 của Hội đồng thi sát hạch (đợt III/2026), phát biểu nào ĐÚNG về thời gian làm bài thi sát hạch?","o":["Phân tích tài chính: 150 phút, mỗi phần 75 phút","Môi giới chứng khoán: 150 phút, mỗi phần 75 phút","Quản lý quỹ: 120 phút, mỗi phần 60 phút","Phân tích tài chính: 180 phút, mỗi phần 90 phút"],"a":0,"e":"Thời gian làm bài: Môi giới chứng khoán 120 phút (mỗi phần 60 phút); Phân tích tài chính 150 phút (mỗi phần 75 phút); Quản lý quỹ 180 phút (mỗi phần 90 phút).","basis":"Thông báo số 11/TB-HĐTSH về lịch trình thi, ca thi, thời gian làm bài đợt III năm 2026","quote":"Thời gian làm bài thi sát hạch cấp chứng chỉ hành nghề Phân tích tài chính là 150 phút, mỗi phần 75 phút.","src":"UBCK_thong_bao_thi_sat_hach_2026_va_gioi_thieu_TT135_ND245.md","as_of":"2026-11"},{"id":"L1-071","part":"LUAT","subject":"LU","topic":"Chứng chỉ hành nghề & quy chế thi 2026","level":3,"q":"Thí sinh X thi sát hạch CCHN môi giới năm 2026: phần pháp luật trả lời đúng 58% số câu, phần chuyên môn trả lời đúng 85% số câu. Kết quả của X được xác định thế nào?","o":["Đạt, vì tỷ lệ trả lời đúng bình quân của hai phần thi trên 60%","Chưa đạt; X thi lại phần pháp luật, đạt khi đúng từ 60% số câu phần đó","Chưa đạt, X phải thi lại cả hai phần thi ở kỳ thi tiếp theo","Đạt, vì tổng số câu trả lời đúng của hai phần đạt từ 50% trở lên"],"a":1,"e":"Từ năm 2026, thí sinh đạt khi trả lời đúng từ 60% câu hỏi trở lên của MỖI phần thi; không lấy bình quân. X chưa đạt phần pháp luật (58%) nên thi lại phần này (trong thời hạn quy định) và đạt khi đúng từ 60% số câu của phần thi lại.","basis":"Thông báo số 01/TB-HĐTSH đợt I năm 2026 (mục 8); điểm c khoản 6 Điều 213 NĐ 155/2020/NĐ-CP (sửa đổi bởi NĐ 245/2025/NĐ-CP)","quote":"Từ năm 2026, người dự thi được công nhận là đạt yêu cầu khi trả lời đúng từ 60% câu hỏi trở lên của mỗi phần thi tại cả hai phần nội dung thi.","src":"UBCK_thong_bao_thi_sat_hach_2026_va_gioi_thieu_TT135_ND245.md","as_of":"2026-11"},{"id":"L1-072","part":"LUAT","subject":"LU","topic":"Chứng chỉ hành nghề & quy chế thi 2026","level":3,"q":"Thí sinh Y dự thi đợt I/2026 (kết quả được UBCKNN thông báo tháng 5/2026), đạt phần chuyên môn nhưng chưa đạt phần pháp luật. Y không dự các kỳ thi tiếp theo trong năm 2026 và đến tháng 11/2027 mới đăng ký thi lại. Theo NĐ 245/2025, Y phải:","o":["Chỉ thi lại phần pháp luật vì kết quả phần đạt được bảo lưu không thời hạn","Chỉ thi lại phần pháp luật vì kết quả phần đạt được bảo lưu 02 năm","Thi lại cả hai phần vì đã quá thời hạn được thi lại phần chưa đạt","Học lại khóa chuyên môn trước khi được đăng ký thi lại phần pháp luật"],"a":2,"e":"Điểm c khoản 6 Điều 213 NĐ 155 (sửa đổi bởi NĐ 245/2025): thí sinh chưa đạt một phần được thi lại phần chưa đạt trong vòng 01 năm kể từ ngày UBCKNN thông báo kết quả thi lần đầu hoặc kỳ thi gần nhất liền sau kỳ thi đã dự; quá thời hạn phải thi lại cả hai phần. Tháng 11/2027 đã quá 01 năm kể từ tháng 5/2026.","basis":"Điểm c khoản 6 Điều 213 NĐ 155/2020/NĐ-CP (sửa đổi bởi điểm đ khoản 73 Điều 1 NĐ 245/2025/NĐ-CP)","quote":"thí sinh được thi lại phần chưa đạt trong vòng 01 năm kể từ ngày Ủy ban Chứng khoán Nhà nước thông báo kết quả thi lần đầu","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L1-073","part":"LUAT","subject":"LU","topic":"Chứng chỉ hành nghề & quy chế thi 2026","level":2,"q":"Từ năm 2026, thí sinh không đồng ý với kết quả bài thi sát hạch trắc nghiệm trên máy vi tính có được đề nghị phúc khảo không?","o":["Có, trong thời hạn 15 ngày kể từ ngày công bố kết quả thi","Có, nếu thí sinh nộp chi phí phúc khảo theo mức quy định của HĐTSH","Chỉ được phúc khảo phần thi pháp luật, không phúc khảo phần chuyên môn","Không, HĐTSH không tổ chức phúc khảo bài thi trắc nghiệm trên máy tính"],"a":3,"e":"Thông báo của HĐTSH năm 2026: từ năm 2026, HĐTSH không tổ chức việc phúc khảo bài thi trắc nghiệm trên máy vi tính; điểm được báo ngay trên màn hình sau khi nộp bài và thí sinh được xem lại câu đúng/sai.","basis":"Thông báo số 01/TB-HĐTSH đợt I năm 2026 (mục 8)","quote":"Về phúc khảo bài thi: Từ năm 2026, HĐTSH không tổ chức việc phúc khảo bài thi trắc nghiệm trên máy vi tính.","src":"UBCK_thong_bao_thi_sat_hach_2026_va_gioi_thieu_TT135_ND245.md","as_of":"2026-11"},{"id":"L1-074","part":"LUAT","subject":"LU","topic":"Chứng chỉ hành nghề & quy chế thi 2026","level":1,"q":"Mức chi phí dự thi sát hạch cấp chứng chỉ hành nghề chứng khoán từ năm 2026 (áp dụng cho cả thi mới và thi lại) là:","o":["1.000.000 đồng/thí sinh/loại chứng chỉ","500.000 đồng/thí sinh/phần thi","1.000.000 đồng/thí sinh cho cả 03 loại chứng chỉ","2.000.000 đồng/thí sinh/loại chứng chỉ"],"a":0,"e":"HĐTSH thông báo mức thu chi phí dự thi sát hạch (cho thí sinh thi mới và thi lại của 03 loại CCHN) từ năm 2026 là 1.000.000 đồng/thí sinh/loại chứng chỉ, nộp bằng chuyển khoản.","basis":"Thông báo số 01/TB-HĐTSH đợt I năm 2026 (mục 5.1)","quote":"từ năm 2026 là 1.000.000 đồng (một triệu đồng)/thí sinh/loại chứng chỉ.","src":"UBCK_thong_bao_thi_sat_hach_2026_va_gioi_thieu_TT135_ND245.md","as_of":"2026-11"},{"id":"L1-075","part":"LUAT","subject":"LU","topic":"Chứng chỉ hành nghề & quy chế thi 2026","level":2,"q":"Chị N có bằng cử nhân Luật Kinh tế. Theo Thông tư 135/2025/TT-BTC, đối với chứng chỉ chuyên môn Pháp luật về chứng khoán và thị trường chứng khoán, chị N:","o":["Được miễn cả khóa học và kiểm tra, được cấp chứng chỉ ngay","Được miễn khóa học nhưng phải dự kiểm tra trình độ chuyên môn","Không được miễn, phải học đủ khóa học và dự kiểm tra","Chỉ được miễn khóa học Những vấn đề cơ bản về chứng khoán và TTCK"],"a":1,"e":"Khoản 5 Điều 3 TT 135/2025: người có bằng cử nhân trở lên ngành Luật Kinh tế được miễn khóa Pháp luật về chứng khoán và TTCK nhưng vẫn phải dự kiểm tra trình độ chuyên môn; người có bằng Kinh tế, Kinh doanh, Tài chính – Ngân hàng – Bảo hiểm, Kế toán – Kiểm toán được miễn khóa Những vấn đề cơ bản về chứng khoán và TTCK.","basis":"Khoản 5 Điều 3 Thông tư 135/2025/TT-BTC","quote":"Cases exempted from attending professional training courses but required to take professional proficiency examinations in order to be issued securities professional certificates include","src":"TT_135_2025_TT-BTC_English_SSC.txt","as_of":"2026-11"},{"id":"L1-076","part":"LUAT","subject":"LU","topic":"Chứng chỉ hành nghề & quy chế thi 2026","level":2,"q":"Theo Thông tư 135/2025/TT-BTC, chứng chỉ CIIA hoặc văn bản xác nhận đạt kỳ thi CFA bậc II trở lên được coi là tương đương chứng chỉ chuyên môn nào sau đây?","o":["Pháp luật về chứng khoán và thị trường chứng khoán","Môi giới chứng khoán và tư vấn đầu tư chứng khoán","Chứng khoán phái sinh và thị trường chứng khoán phái sinh","Tư vấn tài chính và bảo lãnh phát hành chứng khoán"],"a":2,"e":"Khoản 1 Điều 4 TT 135/2025: CIIA hoặc CFA bậc II trở lên tương đương các chứng chỉ: Những vấn đề cơ bản về CK và TTCK; Phân tích và đầu tư CK; Phân tích BCTC doanh nghiệp; Quản lý quỹ và tài sản; Chứng khoán phái sinh và TTCK phái sinh. Không bao gồm Pháp luật, Môi giới – tư vấn, Tư vấn tài chính – bảo lãnh.","basis":"Khoản 1 Điều 4 Thông tư 135/2025/TT-BTC","quote":"Chartered Financial Analyst (CFA) level II exam or higher is equivalent to certificates in: Basic issues of securities and the securities market, Securities analysis and investment, Corporate financial statement analysis, Fund and asset management, Derivatives and the derivatives market","src":"TT_135_2025_TT-BTC_English_SSC.txt","as_of":"2026-11"},{"id":"L1-077","part":"LUAT","subject":"LU","topic":"Chứng chỉ hành nghề & quy chế thi 2026","level":2,"q":"Theo Thông tư 135/2025/TT-BTC, khi UBCKNN triển khai cấp chứng chỉ hành nghề chứng khoán điện tử, người đã được cấp CCHN bản giấy phải:","o":["Tiếp tục sử dụng song song CCHN bản giấy không giới hạn thời gian","Chuyển đổi trong 06 tháng kể từ khi có hướng dẫn, quá hạn bị thu hồi CCHN","Thi lại phần thi pháp luật để được cấp chứng chỉ hành nghề điện tử","Chuyển đổi sang CCHN điện tử trong 01 năm kể từ khi có hướng dẫn chuyển đổi"],"a":3,"e":"Điều 5 TT 135/2025: người được cấp CCHN và tổ chức sử dụng người hành nghề phải chuyển đổi CCHN giấy sang điện tử trong 01 năm kể từ ngày UBCKNN ban hành hướng dẫn chuyển đổi; CCHN giấy hết hiệu lực khi chuyển đổi; quá hạn chưa chuyển đổi thì không được ghi nhận trạng thái 'người hành nghề chứng khoán' trên hệ thống của UBCKNN.","basis":"Khoản 2, 3 Điều 5 Thông tư 135/2025/TT-BTC","quote":"converting previously issued paper-based securities practicing certificates into electronic ones within 01 (one) year from the date the SSC issues the conversion guidelines.","src":"TT_135_2025_TT-BTC_English_SSC.txt","as_of":"2026-11"},{"id":"L1-078","part":"LUAT","subject":"LU","topic":"Chứng chỉ hành nghề & quy chế thi 2026","level":2,"q":"Theo Thông tư 135/2025/TT-BTC, nghĩa vụ tập huấn kiến thức hằng năm của người hành nghề chứng khoán được quy định như thế nào?","o":["Tối thiểu 08 giờ/năm từ 01/01/2027; không bắt buộc trong năm được cấp CCHN","Tối thiểu 16 giờ/năm từ 09/02/2026; bắt buộc cả trong năm được cấp CCHN","Tối thiểu 08 giờ mỗi 02 năm, áp dụng cả trong năm được cấp CCHN","Không bắt buộc, chỉ khuyến khích người hành nghề tự cập nhật"],"a":0,"e":"Điều 8, 10, 12 TT 135/2025: người hành nghề phải tham gia tập huấn hằng năm (01/01–31/12), thời lượng tối thiểu 08 giờ/năm; không bắt buộc trong năm được cấp CCHN; Chương IV về tập huấn áp dụng từ 01/01/2027. Trước 31/01 hằng năm UBCKNN công khai danh sách người không hoàn thành.","basis":"Điều 8, khoản 3 Điều 10, khoản 3 Điều 12 Thông tư 135/2025/TT-BTC","quote":"ensuring a minimum training duration of 08 hours per year.","src":"TT_135_2025_TT-BTC_English_SSC.txt","as_of":"2026-11"},{"id":"L1-079","part":"LUAT","subject":"LU","topic":"Quỹ đầu tư","level":1,"q":"Quỹ đại chúng (không phải quỹ hoán đổi danh mục) được thành lập khi đáp ứng điều kiện nào sau đây?","o":["Ít nhất 50 nhà đầu tư và tổng giá trị chứng chỉ quỹ đã bán ít nhất 100 tỷ đồng","Ít nhất 100 nhà đầu tư (không kể NĐT chuyên nghiệp) và đã bán ít nhất 50 tỷ đồng","Ít nhất 100 nhà đầu tư kể cả NĐT chuyên nghiệp và đã bán ít nhất 30 tỷ đồng","Từ 02 nhà đầu tư trở lên và tổng giá trị chứng chỉ quỹ đã bán ít nhất 50 tỷ đồng"],"a":1,"e":"Khoản 1 Điều 108: huy động vốn trong 90 ngày kể từ ngày Giấy chứng nhận chào bán có hiệu lực; quỹ được thành lập khi có ít nhất 100 nhà đầu tư, không kể NĐT chuyên nghiệp (trừ quỹ ETF) và tổng giá trị chứng chỉ quỹ đã bán đạt ít nhất 50 tỷ đồng.","basis":"Khoản 1 Điều 108 Luật Chứng khoán 2019","quote":"Có ít nhất 100 nhà đầu tư, không kể nhà đầu tư chứng khoán chuyên nghiệp mua chứng chỉ quỹ, trừ quỹ hoán đổi danh mục","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-080","part":"LUAT","subject":"LU","topic":"Quỹ đầu tư","level":3,"q":"Quỹ đóng ABC có tổng giá trị tài sản 500 tỷ đồng. Công ty XYZ có tổng giá trị chứng khoán đang lưu hành 800 tỷ đồng (không có trái phiếu Chính phủ). Giá trị tối đa quỹ ABC được đầu tư vào chứng khoán của XYZ là:","o":["100 tỷ đồng","50 tỷ đồng","80 tỷ đồng","160 tỷ đồng"],"a":2,"e":"Áp dụng đồng thời hai hạn chế tại khoản 1 Điều 110: (1) không quá 10% tổng giá trị chứng khoán đang lưu hành của XYZ = 10% × 800 = 80 tỷ; (2) không quá 20% tổng giá trị tài sản của quỹ = 20% × 500 = 100 tỷ. Mức tối đa = min(80; 100) = 80 tỷ đồng. 50 tỷ là nhầm 10% × tài sản quỹ; 160 tỷ là nhầm 20% × 800.","basis":"Điểm b, c khoản 1 Điều 110 Luật Chứng khoán 2019","quote":"Đầu tư vào chứng khoán của 01 tổ chức phát hành quá 10% tổng giá trị chứng khoán đang lưu hành của tổ chức đó, trừ trái phiếu Chính phủ","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-081","part":"LUAT","subject":"LU","topic":"Quỹ đầu tư","level":2,"q":"Quy định nào sau đây đúng về việc vay của quỹ đại chúng?","o":["Chỉ vay ngắn hạn để trang trải chi phí; tổng vay không quá 10% NAV, tối đa 90 ngày","Được vay để đầu tư thêm nếu tổng dư nợ vay không quá 20% NAV của quỹ","Không được vay dưới bất kỳ hình thức nào, kể cả vay ngắn hạn ngân hàng","Chỉ vay ngắn hạn cho chi phí, thanh toán chứng chỉ quỹ; tối đa 5% NAV, tối đa 30 ngày"],"a":3,"e":"Khoản 2 Điều 110: công ty quản lý quỹ không được vay để tài trợ hoạt động của quỹ đại chúng, trừ vay ngắn hạn để trang trải chi phí cần thiết hoặc thanh toán giao dịch chứng chỉ quỹ với nhà đầu tư; tổng các khoản vay ngắn hạn không quá 5% giá trị tài sản ròng tại mọi thời điểm, thời hạn vay tối đa 30 ngày.","basis":"Khoản 2 Điều 110 Luật Chứng khoán 2019","quote":"Tổng giá trị các khoản vay ngắn hạn của quỹ đại chúng không được quá 5% giá trị tài sản ròng của quỹ đại chúng tại mọi thời điểm và thời hạn vay tối đa là 30 ngày.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-082","part":"LUAT","subject":"LU","topic":"Quỹ đầu tư","level":1,"q":"Ban đại diện quỹ đại chúng có số lượng thành viên và cơ cấu thành viên độc lập như thế nào?","o":["Từ 03 đến 11 thành viên, trong đó ít nhất hai phần ba là thành viên độc lập","Từ 03 đến 11 thành viên, trong đó ít nhất một nửa là thành viên độc lập","Từ 05 đến 11 thành viên, trong đó ít nhất một phần ba là thành viên độc lập","Từ 02 đến 09 thành viên, tất cả đều là thành viên độc lập"],"a":0,"e":"Khoản 3 Điều 109: Ban đại diện quỹ đại chúng có từ 03 đến 11 thành viên, ít nhất hai phần ba là thành viên độc lập, không phải người có liên quan của công ty quản lý quỹ và ngân hàng giám sát.","basis":"Khoản 3 Điều 109 Luật Chứng khoán 2019","quote":"Ban đại diện quỹ đại chúng có từ 03 đến 11 thành viên, trong đó có ít nhất hai phần ba số thành viên Ban đại diện quỹ là thành viên độc lập","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-083","part":"LUAT","subject":"LU","topic":"Quỹ đầu tư","level":3,"q":"Quỹ mở M có giá trị tài sản ròng giảm xuống và duy trì dưới 10 tỷ đồng liên tục từ tháng 01 đến hết tháng 6/2026. Theo Luật Chứng khoán, nhận định nào đúng?","o":["Quỹ tiếp tục hoạt động vì chỉ giải thể khi NAV dưới 05 tỷ đồng","Phải giải thể; triệu tập Đại hội nhà đầu tư trong 30 ngày kể từ ngày phát sinh","Quỹ tự động chuyển đổi thành quỹ thành viên do cùng công ty quản lý","Phải giải thể; triệu tập Đại hội nhà đầu tư 03 tháng trước ngày giải thể"],"a":1,"e":"Điểm đ khoản 1 Điều 104: quỹ giải thể khi NAV xuống dưới 10 tỷ đồng liên tục trong 06 tháng. Khoản 2 Điều 104: với trường hợp tại các điểm c, d, đ, e, công ty quản lý quỹ hoặc ngân hàng giám sát và Ban đại diện quỹ phải triệu tập Đại hội nhà đầu tư trong 30 ngày; mốc 03 tháng trước ngày giải thể áp dụng cho trường hợp hết thời hạn hoạt động hoặc ĐHNĐT quyết định.","basis":"Điểm đ khoản 1, khoản 2 Điều 104 Luật Chứng khoán 2019","quote":"Giá trị tài sản ròng của quỹ đầu tư chứng khoán xuống dưới 10 tỷ đồng liên tục trong 06 tháng;","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-084","part":"LUAT","subject":"LU","topic":"Quỹ đầu tư","level":2,"q":"Điều kiện nào sau đây KHÔNG thuộc điều kiện để quỹ đóng được tăng vốn theo Điều 112 Luật Chứng khoán?","o":["Lợi nhuận của quỹ năm liền trước năm đề nghị tăng vốn là số dương","Công ty quản lý quỹ không bị xử phạt VPHC về chứng khoán trong 02 năm gần nhất","Giá trị tài sản ròng của quỹ tại kỳ định giá gần nhất tối thiểu 100 tỷ đồng","Phương án phát hành thêm chứng chỉ quỹ đóng được Đại hội nhà đầu tư thông qua"],"a":2,"e":"Khoản 1 Điều 112: tăng vốn quỹ đóng phải được UBCKNN chấp thuận và đáp ứng: Điều lệ quỹ có quy định; lợi nhuận năm liền trước dương; công ty quản lý quỹ không bị xử phạt VPHC trong 02 năm; phương án phát hành được ĐHNĐT thông qua. Không có điều kiện NAV tối thiểu 100 tỷ (mốc NAV 50 tỷ áp dụng khi gia hạn thời hạn hoạt động).","basis":"Khoản 1, 3 Điều 112 Luật Chứng khoán 2019","quote":"Lợi nhuận của quỹ trong năm liền trước năm đề nghị tăng vốn phải là số dương;","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-085","part":"LUAT","subject":"LU","topic":"Quỹ đầu tư","level":2,"q":"Điều kiện thành lập quỹ thành viên theo Điều 113 Luật Chứng khoán gồm:","o":["Vốn góp tối thiểu 10 tỷ đồng, có từ 02 đến 99 thành viên là nhà đầu tư bất kỳ","Vốn góp tối thiểu 50 tỷ đồng, có tối đa 100 thành viên, do 02 công ty quản lý quỹ cùng quản lý","Vốn góp tối thiểu 50 tỷ đồng, tài sản lưu ký tại chính công ty quản lý quỹ","Vốn góp tối thiểu 50 tỷ đồng, từ 02 đến 99 thành viên, chỉ gồm NĐT chuyên nghiệp"],"a":3,"e":"Khoản 2 Điều 113: vốn góp tối thiểu 50 tỷ đồng; từ 02 đến 99 thành viên và chỉ gồm nhà đầu tư chứng khoán chuyên nghiệp; do 01 công ty quản lý quỹ quản lý; tài sản lưu ký tại 01 ngân hàng lưu ký độc lập với công ty quản lý quỹ.","basis":"Khoản 2 Điều 113 Luật Chứng khoán 2019","quote":"Vốn góp tối thiểu là 50 tỷ đồng; b) Có từ 02 đến 99 thành viên góp vốn và chỉ bao gồm thành viên là nhà đầu tư chứng khoán chuyên nghiệp","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-086","part":"LUAT","subject":"LU","topic":"Công bố thông tin","level":1,"q":"Theo Điều 119 Luật Chứng khoán, việc công bố thông tin phải bảo đảm nguyên tắc nào?","o":["Đầy đủ, chính xác, kịp thời","Công khai, minh bạch, công bằng","Trung thực, khách quan, bảo mật","Nhanh chóng, đơn giản, tiết kiệm"],"a":0,"e":"Khoản 1 Điều 119: việc công bố thông tin phải đầy đủ, chính xác, kịp thời; đối tượng công bố chịu trách nhiệm trước pháp luật về nội dung và phải đồng thời báo cáo UBCKNN, nơi chứng khoán niêm yết/đăng ký giao dịch.","basis":"Khoản 1 Điều 119 Luật Chứng khoán 2019","quote":"Việc công bố thông tin phải đầy đủ, chính xác, kịp thời.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-087","part":"LUAT","subject":"LU","topic":"Công bố thông tin","level":2,"q":"Trường hợp nào cổ đông lớn KHÔNG phải công bố thông tin dù tỷ lệ sở hữu thay đổi qua ngưỡng 1% số cổ phiếu có quyền biểu quyết?","o":["Cổ đông lớn bán cổ phiếu qua phương thức giao dịch thỏa thuận trên sàn","Thay đổi do công ty đại chúng mua lại cổ phiếu của chính mình hoặc phát hành thêm","Cổ đông lớn là tổ chức nước ngoài mua thêm cổ phiếu qua hệ thống giao dịch","Cổ đông lớn mua thêm cổ phiếu qua phương thức khớp lệnh tập trung trên sàn"],"a":1,"e":"Khoản 3 Điều 127: nghĩa vụ công bố khi trở thành/không còn là cổ đông lớn và khi thay đổi qua ngưỡng 1% không áp dụng đối với thay đổi tỷ lệ phát sinh do công ty đại chúng mua lại cổ phiếu của chính mình hoặc phát hành thêm cổ phiếu, quỹ ETF thực hiện giao dịch hoán đổi và trường hợp khác theo pháp luật.","basis":"Điểm a khoản 3 Điều 127 Luật Chứng khoán 2019","quote":"Thay đổi tỷ lệ nắm giữ cổ phiếu có quyền biểu quyết phát sinh do công ty đại chúng mua lại cổ phiếu của chính mình hoặc phát hành thêm cổ phiếu","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-088","part":"LUAT","subject":"LU","topic":"Công bố thông tin","level":3,"q":"Quỹ đầu tư Z đang sở hữu 6,4% số cổ phiếu có quyền biểu quyết của công ty đại chúng Y. Z mua thêm qua sàn, tỷ lệ sở hữu tăng lên 7,2%. Nghĩa vụ công bố thông tin của Z là:","o":["Không phải công bố vì mức thay đổi 0,8% chưa đủ 1%","Chỉ phải công bố khi tỷ lệ sở hữu đạt 10% số cổ phiếu có quyền biểu quyết","Phải công bố thông tin vì số cổ phiếu sở hữu thay đổi qua ngưỡng 7%","Không phải công bố vì Z là nhà đầu tư chứng khoán chuyên nghiệp"],"a":2,"e":"Khoản 2 Điều 127: cổ đông lớn phải công bố thông tin khi số cổ phiếu sở hữu thay đổi QUA các ngưỡng 1% (6%, 7%, 8%...). Từ 6,4% lên 7,2% đã vượt ngưỡng 7% nên phải công bố, dù mức thay đổi chỉ 0,8%.","basis":"Khoản 2 Điều 127 Luật Chứng khoán 2019","quote":"phải công bố thông tin khi có thay đổi về số lượng cổ phiếu sở hữu qua các ngưỡng 1% số cổ phiếu có quyền biểu quyết của công ty đại chúng","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-089","part":"LUAT","subject":"LU","topic":"Công bố thông tin","level":1,"q":"Công ty đại chúng phải công bố thông tin bất thường khi quyết định mua, bán tài sản hoặc thực hiện giao dịch có giá trị lớn hơn bao nhiêu phần trăm tổng tài sản của công ty (theo BCTC năm gần nhất được kiểm toán hoặc BCTC 06 tháng gần nhất được soát xét)?","o":["10%","20%","35%","15%"],"a":3,"e":"Điểm h khoản 2 Điều 120: công ty đại chúng công bố thông tin bất thường khi quyết định mua, bán tài sản hoặc thực hiện các giao dịch có giá trị lớn hơn 15% tổng tài sản căn cứ BCTC năm gần nhất được kiểm toán hoặc BCTC 06 tháng gần nhất được soát xét. Mốc 35% là tiêu chí xác định giao dịch cơ cấu lại doanh nghiệp theo NĐ 155.","basis":"Điểm h khoản 2 Điều 120 Luật Chứng khoán 2019","quote":"Quyết định mua, bán tài sản hoặc thực hiện các giao dịch có giá trị lớn hơn 15% tổng tài sản của công ty","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-090","part":"LUAT","subject":"LU","topic":"Công bố thông tin","level":2,"q":"Bà G là vợ của Tổng giám đốc công ty niêm yết H; bà G không giữ chức vụ nào tại H. Bà G dự định mua 50.000 cổ phiếu H (giá trị vượt mức tối thiểu phải công bố). Nhận định nào đúng?","o":["Bà G phải công bố trước và sau giao dịch vì là người có liên quan","Bà G không phải công bố thông tin vì không giữ chức vụ tại công ty H","Chỉ Tổng giám đốc phải công bố thông tin sau khi bà G giao dịch xong","Bà G chỉ phải công bố nếu sau giao dịch trở thành cổ đông lớn"],"a":0,"e":"Khoản 1 Điều 128: người nội bộ của công ty đại chúng và người có liên quan của người nội bộ phải công bố thông tin trước và sau giao dịch cổ phiếu (trừ giao dịch chưa đạt giá trị tối thiểu phải công bố). Vợ là người có liên quan theo điểm d khoản 46 Điều 4.","basis":"Khoản 1 Điều 128; điểm d khoản 46 Điều 4 Luật Chứng khoán 2019","quote":"Người nội bộ của công ty đại chúng, công ty đầu tư chứng khoán đại chúng, quỹ đại chúng và người có liên quan của các đối tượng này phải công bố thông tin trước và sau giao dịch","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-091","part":"LUAT","subject":"LU","topic":"Công bố thông tin","level":2,"q":"Báo cáo tài chính nào sau đây công ty đại chúng phải công bố thông tin định kỳ theo Điều 120 Luật Chứng khoán?","o":["Chỉ BCTC năm đã kiểm toán; BCTC bán niên, BCTC quý không bắt buộc","BCTC năm đã kiểm toán, BCTC 06 tháng đã được soát xét và BCTC quý","BCTC năm và BCTC 06 tháng đều đã kiểm toán, không yêu cầu BCTC quý","BCTC quý đã được kiểm toán và BCTC năm đã được soát xét"],"a":1,"e":"Điểm a khoản 1 Điều 120: công ty đại chúng công bố định kỳ BCTC năm đã được kiểm toán, BCTC 06 tháng đã được soát xét bởi tổ chức kiểm toán được chấp thuận và BCTC quý; cùng với báo cáo thường niên, báo cáo tình hình quản trị, nghị quyết ĐHĐCĐ thường niên.","basis":"Điểm a khoản 1 Điều 120 Luật Chứng khoán 2019","quote":"Báo cáo tài chính năm đã được kiểm toán, báo cáo tài chính 06 tháng đã được soát xét bởi tổ chức kiểm toán được chấp thuận, báo cáo tài chính quý","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-092","part":"LUAT","subject":"LU","topic":"Công bố thông tin","level":2,"q":"Ngoài báo cáo tài chính, công ty chứng khoán phải công bố thông tin định kỳ về báo cáo tỷ lệ an toàn tài chính như thế nào?","o":["Hằng quý, không yêu cầu soát xét hay kiểm toán bởi tổ chức kiểm toán","Chỉ tại ngày 31/12, đã được kiểm toán bởi tổ chức kiểm toán được chấp thuận","Tại 30/6 đã soát xét và tại 31/12 đã kiểm toán bởi tổ chức được chấp thuận","Hằng tháng, chỉ gửi UBCKNN và không phải công bố ra công chúng"],"a":2,"e":"Điểm b khoản 1 Điều 123: công ty chứng khoán, công ty quản lý quỹ công bố định kỳ báo cáo tỷ lệ an toàn tài chính tại ngày 30 tháng 6 đã được soát xét và tại ngày 31 tháng 12 đã được kiểm toán bởi tổ chức kiểm toán được chấp thuận.","basis":"Điểm b khoản 1 Điều 123 Luật Chứng khoán 2019","quote":"Báo cáo tỷ lệ an toàn tài chính tại ngày 30 tháng 6 đã được soát xét và tại ngày 31 tháng 12 đã được kiểm toán bởi tổ chức kiểm toán được chấp thuận","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-093","part":"LUAT","subject":"LU","topic":"Thanh tra & xử lý vi phạm","level":1,"q":"Mức phạt tiền tối đa trong xử phạt vi phạm hành chính đối với tổ chức có hành vi vi phạm khác trong lĩnh vực chứng khoán (ngoài các hành vi tại khoản 2, khoản 3 Điều 12) là:","o":["02 tỷ đồng","05 tỷ đồng","1,5 tỷ đồng","03 tỷ đồng"],"a":3,"e":"Khoản 4 Điều 132: mức phạt tiền tối đa đối với các hành vi vi phạm khác là 03 tỷ đồng. Theo khoản 5, mức này áp dụng cho tổ chức; cá nhân thực hiện cùng hành vi thì mức phạt tối đa bằng một phần hai (1,5 tỷ đồng).","basis":"Khoản 4, 5 Điều 132 Luật Chứng khoán 2019","quote":"Mức phạt tiền tối đa trong xử phạt vi phạm hành chính đối với các hành vi vi phạm khác trong lĩnh vực chứng khoán là 03 tỷ đồng.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-094","part":"LUAT","subject":"LU","topic":"Thanh tra & xử lý vi phạm","level":3,"q":"Cá nhân K thực hiện hành vi thao túng thị trường chứng khoán, thu lợi bất hợp pháp 800 triệu đồng. Mức phạt tiền tối đa có thể áp dụng đối với K theo Luật Chứng khoán là:","o":["04 tỷ đồng","08 tỷ đồng","1,5 tỷ đồng","03 tỷ đồng"],"a":0,"e":"Khoản 3 Điều 132: với hành vi tại khoản 2, 3 Điều 12, mức phạt tối đa (cho tổ chức) là 10 lần khoản thu trái pháp luật = 10 × 0,8 = 8 tỷ đồng (cao hơn 03 tỷ nên áp dụng 8 tỷ). Khoản 5: cá nhân tối đa bằng 1/2 mức của tổ chức = 8 : 2 = 4 tỷ đồng. 8 tỷ là quên chia đôi; 1,5 tỷ và 3 tỷ là áp nhầm khoản 4.","basis":"Khoản 3, 4, 5 Điều 132 Luật Chứng khoán 2019","quote":"cá nhân thực hiện cùng hành vi vi phạm thì mức phạt tiền tối đa bằng một phần hai mức phạt tiền tối đa đối với tổ chức","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L1-095","part":"LUAT","subject":"LU","topic":"Thanh tra & xử lý vi phạm","level":2,"q":"Trong thanh tra, xử lý vi phạm, UBCKNN có quyền yêu cầu doanh nghiệp viễn thông cung cấp thông tin nào?","o":["Nội dung ghi âm các cuộc gọi của mọi nhà đầu tư trên thị trường chứng khoán","Tên, địa chỉ, số máy gọi, số máy được gọi, thời gian gọi để xác minh vi phạm Điều 12","Toàn bộ danh bạ thuê bao để phục vụ giám sát giao dịch chứng khoán thường xuyên","Tin nhắn và dữ liệu mạng xã hội của người hành nghề chứng khoán khi có yêu cầu"],"a":1,"e":"Điểm c khoản 1 Điều 130: UBCKNN được yêu cầu doanh nghiệp viễn thông cung cấp tên, địa chỉ, số máy gọi, số máy được gọi, thời gian gọi để xác minh, xử lý hành vi bị nghiêm cấm tại Điều 12; yêu cầu phải được Chủ tịch UBCKNN phê duyệt, bằng văn bản và thông tin được bảo mật.","basis":"Điểm c khoản 1, khoản 2, 3 Điều 130 Luật Chứng khoán 2019","quote":"Yêu cầu doanh nghiệp viễn thông cung cấp tên, địa chỉ, số máy gọi, số máy được gọi, thời gian gọi để xác minh, xử lý hành vi bị nghiêm cấm quy định tại Điều 12 của Luật này.","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"L2-001","part":"LUAT","subject":"LU","topic":"Chào bán trái phiếu","level":2,"q":"Theo Nghị định 155/2020/NĐ-CP (sửa đổi bởi Nghị định 245/2025/NĐ-CP), khi chào bán trái phiếu ra công chúng, trường hợp nào sau đây được miễn điều kiện tổ chức phát hành hoặc trái phiếu phải được xếp hạng tín nhiệm?","o":["Tổng giá trị trái phiếu huy động trong 12 tháng không quá 500 tỷ đồng","Tổng dư nợ trái phiếu không vượt quá 100% vốn chủ sở hữu","Trái phiếu do tổ chức tín dụng phát hành","Tổ chức phát hành là công ty chứng khoán niêm yết"],"a":2,"e":"NĐ 245 sửa khoản 2 Điều 19: mọi đợt chào bán trái phiếu ra công chúng phải được tổ chức xếp hạng tín nhiệm độc lập xếp hạng, trừ trái phiếu của tổ chức tín dụng hoặc trái phiếu được TCTD, chi nhánh NHNNg, tổ chức tài chính nước ngoài/quốc tế bảo lãnh thanh toán toàn bộ gốc, lãi. Các ngưỡng 500 tỷ đồng/50% VCSH và 100% VCSH là quy định cũ đã bị thay thế.","basis":"Khoản 2 Điều 19 Nghị định 155/2020/NĐ-CP (sửa đổi bởi điểm a khoản 8 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"Tổ chức phát hành hoặc trái phiếu đăng ký chào bán phải được xếp hạng tín nhiệm bởi tổ chức xếp hạng tín nhiệm độc lập, ngoại trừ trường hợp trái phiếu phát hành của tổ chức tín dụng","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-002","part":"LUAT","subject":"LU","topic":"Chào bán trái phiếu","level":1,"q":"Theo Nghị định 155/2020/NĐ-CP (bổ sung bởi Nghị định 245/2025/NĐ-CP), điều kiện về nợ phải trả của tổ chức phát hành thông thường khi chào bán trái phiếu ra công chúng là gì?","o":["Nợ phải trả, chưa gồm trái phiếu dự kiến phát hành, không vượt quá 05 lần vốn chủ sở hữu","Nợ phải trả, gồm cả trái phiếu dự kiến phát hành, không vượt quá 03 lần vốn chủ sở hữu","Nợ phải trả, gồm cả trái phiếu dự kiến phát hành, không vượt quá 05 lần vốn điều lệ","Nợ phải trả, gồm cả trái phiếu dự kiến phát hành, không vượt quá 05 lần vốn chủ sở hữu"],"a":3,"e":"Khoản 4 Điều 19 (bổ sung bởi NĐ 245): nợ phải trả (bao gồm giá trị trái phiếu dự kiến phát hành) không vượt quá 05 lần vốn chủ sở hữu theo BCTC kỳ gần nhất được kiểm toán; một số loại doanh nghiệp (DNNN, TCTD, bảo hiểm, CTCK, CTQLQ, DN phát hành để làm dự án BĐS) được loại trừ.","basis":"Khoản 4 Điều 19 Nghị định 155/2020/NĐ-CP (bổ sung bởi điểm b khoản 8 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"Tổ chức phát hành có nợ phải trả (bao gồm giá trị trái phiếu dự kiến phát hành) không vượt quá 05 lần vốn chủ sở hữu của tổ chức phát hành theo báo cáo tài chính kỳ kế toán gần nhất được kiểm toán","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-003","part":"LUAT","subject":"LU","topic":"Chào bán trái phiếu","level":3,"q":"Công ty cổ phần X (sản xuất hàng tiêu dùng, không thuộc diện loại trừ) có vốn chủ sở hữu 400 tỷ đồng, nợ phải trả 1.500 tỷ đồng theo BCTC kiểm toán gần nhất. X dự kiến chào bán trái phiếu ra công chúng một đợt, không nhằm cơ cấu nợ và không có bảo lãnh thanh toán. Giá trị trái phiếu tối đa X có thể chào bán để đáp ứng điều kiện về nợ phải trả là:","o":["500 tỷ đồng","400 tỷ đồng","2.000 tỷ đồng","1.200 tỷ đồng"],"a":0,"e":"Nợ phải trả sau phát hành (gồm cả trái phiếu dự kiến phát hành) ≤ 5 × 400 = 2.000 tỷ đồng → trái phiếu tối đa = 2.000 − 1.500 = 500 tỷ đồng. 2.000 tỷ là lỗi quên trừ nợ hiện hữu; 400 tỷ nhầm với giới hạn từng đợt khi chào bán nhiều đợt.","basis":"Khoản 4 Điều 19 Nghị định 155/2020/NĐ-CP (bổ sung bởi điểm b khoản 8 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"không vượt quá 05 lần vốn chủ sở hữu của tổ chức phát hành theo báo cáo tài chính kỳ kế toán gần nhất được kiểm toán, ngoại trừ tổ chức phát hành là doanh nghiệp nhà nước","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-004","part":"LUAT","subject":"LU","topic":"Chào bán trái phiếu","level":1,"q":"Theo Nghị định 155/2020/NĐ-CP (bổ sung bởi Nghị định 245/2025/NĐ-CP), \"tổ chức xếp hạng tín nhiệm độc lập\" bao gồm những tổ chức nào?","o":["Chỉ các doanh nghiệp XHTN được Bộ Tài chính cấp Giấy chứng nhận","Moody’s, S&P, Fitch Ratings và doanh nghiệp XHTN được Bộ Tài chính cấp phép","Chỉ ba tổ chức quốc tế Moody’s, Standard & Poor’s và Fitch Ratings","Bất kỳ tổ chức xếp hạng tín nhiệm nào được UBCKNN chấp thuận"],"a":1,"e":"Khoản 57 Điều 3 (bổ sung bởi NĐ 245): tổ chức XHTN độc lập gồm Moody’s, Standard & Poor’s, Fitch Ratings và các doanh nghiệp XHTN được Bộ Tài chính cấp Giấy chứng nhận đủ điều kiện kinh doanh.","basis":"Khoản 57 Điều 3 Nghị định 155/2020/NĐ-CP (bổ sung bởi điểm c khoản 1 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"Tổ chức xếp hạng tín nhiệm Moody’s, Standard & Poor’s, Fitch Ratings; b) Các doanh nghiệp xếp hạng tín nhiệm được Bộ Tài chính cấp Giấy chứng nhận đủ điều kiện kinh doanh.","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-005","part":"LUAT","subject":"LU","topic":"Chào bán trái phiếu","level":3,"q":"Công ty đại chúng Y chào bán ra công chúng 2.000.000 trái phiếu chuyển đổi cho nhà đầu tư (không phải chào bán cho cổ đông hiện hữu theo tỷ lệ sở hữu) nhằm huy động vốn thực hiện dự án. Theo Nghị định 155/2020/NĐ-CP (sửa đổi bởi Nghị định 245/2025/NĐ-CP), số trái phiếu tối thiểu phải bán được là:","o":["1.000.000 trái phiếu","1.300.000 trái phiếu","1.400.000 trái phiếu","1.600.000 trái phiếu"],"a":2,"e":"Đợt chào bán nhằm huy động vốn thực hiện dự án phải bán được tối thiểu 70% số trái phiếu dự kiến chào bán: 70% × 2.000.000 = 1.400.000 trái phiếu. Ngoại lệ chỉ áp dụng khi chào bán cho cổ đông hiện hữu theo tỷ lệ sở hữu.","basis":"Khoản 6 Điều 21 Nghị định 155/2020/NĐ-CP (sửa đổi bởi khoản 10 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"số lượng trái phiếu chuyển đổi, trái phiếu kèm chứng quyền bán được phải đạt tối thiểu là 70% số trái phiếu chuyển đổi, trái phiếu kèm chứng quyền dự kiến chào bán để thực hiện các dự án","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-006","part":"LUAT","subject":"LU","topic":"Chào bán trái phiếu","level":2,"q":"Theo Nghị định 155/2020/NĐ-CP, khi công ty đại chúng chào bán trái phiếu chuyển đổi ra công chúng mà không có tổ chức bảo lãnh phát hành cam kết nhận mua toàn bộ hoặc mua phần còn lại, điều kiện về quy mô đợt chào bán là:","o":["Tổng mệnh giá trái phiếu không lớn hơn 50% vốn chủ sở hữu của công ty","Tổng mệnh giá trái phiếu không vượt quá 05 lần vốn chủ sở hữu của công ty","Tổng mệnh giá trái phiếu không lớn hơn giá trị vốn hóa thị trường của công ty","Tổng mệnh giá trái phiếu không lớn hơn tổng mệnh giá cổ phiếu đang lưu hành"],"a":3,"e":"Khoản 5 Điều 21 (không bị NĐ 245 sửa đổi): tổng giá trị trái phiếu chuyển đổi, trái phiếu kèm chứng quyền theo mệnh giá không lớn hơn tổng giá trị cổ phiếu đang lưu hành theo mệnh giá, trừ trường hợp có bảo lãnh phát hành cam kết nhận mua toàn bộ hoặc mua phần còn lại.","basis":"Khoản 5 Điều 21 Nghị định 155/2020/NĐ-CP","quote":"Tổng giá trị trái phiếu chuyển đổi, trái phiếu kèm chứng quyền tính theo mệnh giá không lớn hơn tổng giá trị cổ phiếu đang lưu hành tính theo mệnh giá","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-007","part":"LUAT","subject":"LU","topic":"Chào bán chứng khoán ra công chúng","level":2,"q":"Theo Nghị định 155/2020/NĐ-CP (sửa đổi bởi Nghị định 245/2025/NĐ-CP), yêu cầu phương án sử dụng vốn phải xác định tỷ lệ chào bán thành công tối thiểu 70% cho mục đích thực hiện dự án KHÔNG áp dụng đối với trường hợp nào?","o":["Chào bán cho cổ đông hiện hữu theo tỷ lệ sở hữu","Chào bán thêm cổ phiếu ra công chúng cho nhà đầu tư mới","Chào bán trái phiếu chuyển đổi ra công chúng cho nhà đầu tư","Chào bán cổ phiếu ra công chúng có tổ chức bảo lãnh phát hành"],"a":0,"e":"NĐ 245 sửa điểm b khoản 2 Điều 12 (và khoản 6 Điều 21, điểm b khoản 2 Điều 22): tỷ lệ chào bán thành công tối thiểu 70% cho mục đích dự án, trừ trường hợp chào bán cho cổ đông hiện hữu theo tỷ lệ sở hữu.","basis":"Điểm b khoản 2 Điều 12 Nghị định 155/2020/NĐ-CP (sửa đổi bởi khoản 7 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"tối thiểu là 70% tổng số cổ phiếu dự kiến chào bán để thực hiện các dự án (trừ trường hợp chào bán cho các cổ đông hiện hữu theo tỷ lệ sở hữu)","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-008","part":"LUAT","subject":"LU","topic":"Chào bán chứng khoán ra công chúng","level":1,"q":"Trong thời hạn bao lâu kể từ ngày Giấy chứng nhận đăng ký chào bán chứng khoán ra công chúng có hiệu lực, tổ chức phát hành phải công bố Bản thông báo phát hành?","o":["05 ngày làm việc","07 ngày làm việc","10 ngày","15 ngày"],"a":1,"e":"Khoản 5 Điều 41 (sửa đổi bởi NĐ 245): trong 07 ngày làm việc kể từ ngày Giấy chứng nhận có hiệu lực, phải công bố Bản thông báo phát hành trên 01 tờ báo điện tử hoặc báo in trong 03 số liên tiếp và trên trang thông tin điện tử của tổ chức phát hành, SGDCK.","basis":"Khoản 5 Điều 41 Nghị định 155/2020/NĐ-CP (sửa đổi bởi điểm b khoản 19 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"Trong thời hạn 07 ngày làm việc kể từ ngày Giấy chứng nhận đăng ký chào bán chứng khoán ra công chúng có hiệu lực, tổ chức phát hành, cổ đông đăng ký chào bán phải công bố Bản thông báo phát hành trên 01 tờ báo điện tử hoặc báo in trong 03 số liên tiếp","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-009","part":"LUAT","subject":"LU","topic":"Chào bán chứng khoán ra công chúng","level":2,"q":"Số cổ phiếu mà cổ đông hiện hữu không đăng ký mua trong đợt chào bán ra công chúng, được phân phối tiếp cho một số nhà đầu tư xác định, bị hạn chế chuyển nhượng như thế nào?","o":["Tối thiểu 06 tháng kể từ ngày kết thúc đợt chào bán","Tối thiểu 03 năm kể từ ngày kết thúc đợt chào bán","Tối thiểu 01 năm kể từ ngày kết thúc đợt chào bán","Tối thiểu 01 năm kể từ ngày được cấp Giấy chứng nhận chào bán"],"a":2,"e":"Khoản 2 Điều 42: số cổ phiếu không được đăng ký mua, không nộp tiền mua phân phối cho nhà đầu tư xác định bị hạn chế chuyển nhượng tối thiểu 01 năm kể từ ngày kết thúc đợt chào bán (không áp dụng với cổ phiếu tổ chức bảo lãnh mua theo cam kết và cổ phiếu lẻ).","basis":"Khoản 2 Điều 42 Nghị định 155/2020/NĐ-CP","quote":"Số cổ phiếu này bị hạn chế chuyển nhượng trong thời hạn tối thiểu 01 năm kể từ ngày kết thúc đợt chào bán.","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-010","part":"LUAT","subject":"LU","topic":"Chào bán chứng khoán ra công chúng","level":3,"q":"Công ty đại chúng Z (vốn điều lệ 500 tỷ đồng) chào bán thêm 10 triệu cổ phiếu ra công chúng (tổng mệnh giá 100 tỷ đồng) cho cổ đông hiện hữu theo tỷ lệ sở hữu. Số cổ phiếu cổ đông không đăng ký mua có tổng mệnh giá 70 tỷ đồng; HĐQT dự kiến phân phối toàn bộ cho một nhà đầu tư tổ chức (nhà đầu tư này và người có liên quan chưa sở hữu cổ phiếu Z). Việc phân phối này:","o":["Do HĐQT quyết định vì nhà đầu tư chưa phải là cổ đông lớn của công ty","Chỉ cần báo cáo UBCKNN trước khi HĐQT thực hiện việc phân phối","Phải được Ban kiểm soát chấp thuận bằng văn bản trước khi phân phối","Phải được Đại hội đồng cổ đông thông qua vì đạt từ 10% vốn điều lệ trở lên"],"a":3,"e":"70 tỷ đồng bằng 14% vốn điều lệ trước đợt chào bán và khoảng 11,7% vốn điều lệ sau đợt chào bán (600 tỷ đồng), cách tính nào cũng từ 10% trở lên → theo điểm b khoản 3 Điều 42, việc phân phối cho tổ chức, cá nhân và người có liên quan từ 10% vốn điều lệ trở lên (một đợt hoặc trong 12 tháng gần nhất) phải được ĐHĐCĐ thông qua.","basis":"Điểm b khoản 3 Điều 42 Nghị định 155/2020/NĐ-CP","quote":"Chào bán cho tổ chức, cá nhân và người có liên quan từ 10% vốn điều lệ trở lên của tổ chức phát hành trong một đợt chào bán hoặc trong các đợt chào bán, phát hành trong 12 tháng gần nhất.","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-011","part":"LUAT","subject":"LU","topic":"Chào bán riêng lẻ & phát hành khác","level":3,"q":"Công ty đại chúng A kết thúc đợt chào bán cổ phiếu riêng lẻ ngày 15/3/2026. A dự kiến phát hành cổ phiếu để hoán đổi nợ. Theo Nghị định 155/2020/NĐ-CP, đợt phát hành hoán đổi nợ phải đáp ứng yêu cầu nào về thời gian?","o":["Cách đợt chào bán riêng lẻ trước ít nhất 06 tháng kể từ ngày 15/3/2026","Cách đợt chào bán riêng lẻ trước ít nhất 03 tháng kể từ ngày 15/3/2026","Cách đợt chào bán riêng lẻ trước ít nhất 12 tháng kể từ ngày 15/3/2026","Không bị giới hạn vì hoán đổi nợ khác loại với chào bán cổ phiếu"],"a":0,"e":"Khoản 7 Điều 48: các đợt chào bán, phát hành riêng lẻ (bao gồm cả phát hành cổ phiếu để hoán đổi nợ) phải cách nhau ít nhất 06 tháng kể từ ngày kết thúc đợt chào bán, phát hành riêng lẻ gần nhất.","basis":"Khoản 7 Điều 48 Nghị định 155/2020/NĐ-CP","quote":"Khoảng cách giữa các đợt chào bán, phát hành chứng khoán riêng lẻ sau phải cách nhau ít nhất 06 tháng kể từ ngày kết thúc đợt chào bán, phát hành riêng lẻ gần nhất","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-012","part":"LUAT","subject":"LU","topic":"Chào bán riêng lẻ & phát hành khác","level":2,"q":"Công ty đại chúng chào bán cổ phiếu riêng lẻ với giá thấp hơn mệnh giá phải đáp ứng điều kiện nào về đối tượng mua và hạn chế chuyển nhượng?","o":["Nhà đầu tư chứng khoán chuyên nghiệp; hạn chế chuyển nhượng 01 năm","Chỉ nhà đầu tư chiến lược; hạn chế chuyển nhượng tối thiểu 03 năm","Chỉ nhà đầu tư chiến lược; hạn chế chuyển nhượng tối thiểu 01 năm","Mọi nhà đầu tư; hạn chế chuyển nhượng tối thiểu 03 năm"],"a":1,"e":"Khoản 1 Điều 44: đối tượng tham gia chỉ gồm nhà đầu tư chiến lược và cổ phiếu bị hạn chế chuyển nhượng tối thiểu 03 năm kể từ ngày kết thúc đợt chào bán (trừ theo bản án, quyết định của Tòa án, Trọng tài hoặc thừa kế).","basis":"Khoản 1 Điều 44 Nghị định 155/2020/NĐ-CP","quote":"Đối tượng tham gia đợt chào bán chỉ bao gồm nhà đầu tư chiến lược và việc chuyển nhượng cổ phiếu bị hạn chế tối thiểu là 03 năm kể từ ngày kết thúc đợt chào bán","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-013","part":"LUAT","subject":"LU","topic":"Chào bán riêng lẻ & phát hành khác","level":3,"q":"Công ty đại chúng B có 80 triệu cổ phiếu đang lưu hành và chưa phát hành cổ phiếu theo chương trình lựa chọn cho người lao động (ESOP) trong 12 tháng qua. Số cổ phiếu ESOP tối đa B được phát hành trong 12 tháng tới là:","o":["800.000 cổ phiếu","8.000.000 cổ phiếu","4.000.000 cổ phiếu","12.000.000 cổ phiếu"],"a":2,"e":"Khoản 2 Điều 64: tổng số cổ phiếu phát hành theo chương trình ESOP trong mỗi 12 tháng không vượt quá 5% số cổ phiếu đang lưu hành: 5% × 80.000.000 = 4.000.000 cổ phiếu.","basis":"Khoản 2 Điều 64 Nghị định 155/2020/NĐ-CP","quote":"Tổng số cổ phiếu phát hành theo chương trình trong mỗi 12 tháng không được vượt quá 5% số cổ phiếu đang lưu hành của công ty.","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-014","part":"LUAT","subject":"LU","topic":"Chào mua công khai","level":1,"q":"Theo Nghị định 155/2020/NĐ-CP (sửa đổi bởi Nghị định 245/2025/NĐ-CP), trong thời hạn bao lâu kể từ ngày nhận được hồ sơ hợp lệ, UBCKNN phải thông báo bằng văn bản về việc đã nhận đầy đủ hồ sơ đăng ký chào mua công khai?","o":["15 ngày","05 ngày làm việc","30 ngày","07 ngày làm việc"],"a":3,"e":"NĐ 245 sửa khoản 3 Điều 86, rút ngắn thời hạn từ 15 ngày (quy định cũ) xuống 07 ngày làm việc kể từ ngày nhận được hồ sơ hợp lệ.","basis":"Khoản 3 Điều 86 Nghị định 155/2020/NĐ-CP (sửa đổi bởi khoản 32 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"Trong thời hạn 07 ngày làm việc kể từ ngày nhận được hồ sơ hợp lệ, Ủy ban Chứng khoán Nhà nước thông báo bằng văn bản cho tổ chức, cá nhân chào","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-015","part":"LUAT","subject":"LU","topic":"Chào mua công khai","level":1,"q":"Thời gian thực hiện 01 đợt chào mua công khai theo Nghị định 155/2020/NĐ-CP là:","o":["Tối thiểu 30 ngày giao dịch, tối đa 60 ngày giao dịch","Tối thiểu 15 ngày giao dịch, tối đa 30 ngày giao dịch","Tối thiểu 20 ngày giao dịch, tối đa 45 ngày giao dịch","Tối thiểu 30 ngày giao dịch, tối đa 90 ngày giao dịch"],"a":0,"e":"Khoản 2 Điều 93: thời gian thực hiện 01 đợt chào mua công khai tối thiểu là 30 ngày giao dịch và tối đa là 60 ngày giao dịch kể từ ngày bắt đầu nhận đăng ký bán, đăng ký hoán đổi.","basis":"Khoản 2 Điều 93 Nghị định 155/2020/NĐ-CP","quote":"Thời gian thực hiện 01 đợt chào mua công khai tối thiểu là 30 ngày giao dịch và tối đa là 60 ngày giao dịch kể từ ngày bắt đầu nhận đăng ký bán, đăng ký hoán đổi","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-016","part":"LUAT","subject":"LU","topic":"Chào mua công khai","level":2,"q":"Đối với chào mua công khai thanh toán bằng tiền, giá chào mua không được thấp hơn mức nào sau đây?","o":["Bình quân giá tham chiếu 30 ngày giao dịch liền trước ngày công bố thông tin","Bình quân giá tham chiếu 60 ngày giao dịch liền trước ngày gửi giấy đăng ký","Giá đóng cửa của ngày giao dịch liền trước ngày gửi giấy đăng ký chào mua","Giá trị sổ sách một cổ phiếu theo báo cáo tài chính kiểm toán gần nhất"],"a":1,"e":"Điểm a khoản 1 Điều 91: giá chào mua không thấp hơn bình quân giá tham chiếu của 60 ngày giao dịch liền trước ngày gửi giấy đăng ký chào mua công khai và không thấp hơn giá mua cao nhất của các đợt chào mua công khai trong thời gian này.","basis":"Điểm a khoản 1 Điều 91 Nghị định 155/2020/NĐ-CP","quote":"Giá chào mua không được thấp hơn bình quân giá tham chiếu của 60 ngày giao dịch liền trước ngày gửi giấy đăng ký chào mua công khai","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-017","part":"LUAT","subject":"LU","topic":"Chào mua công khai","level":2,"q":"Trong thời gian chào mua công khai cổ phiếu của công ty mục tiêu M (Bản công bố thông tin đã nêu các trường hợp rút lại theo quy định), sự kiện nào sau đây cho phép bên chào mua đề nghị rút lại việc chào mua?","o":["M bán tài sản trị giá 20% tổng giá trị tài sản theo BCTC kỳ gần nhất","Giá cổ phiếu M trên sàn giảm 25% so với giá chào mua đã công bố","M bán tài sản trị giá 40% tổng giá trị tài sản theo BCTC kỳ gần nhất","Bên chào mua thay đổi chiến lược đầu tư sau khi đã công bố thông tin"],"a":2,"e":"Điểm đ khoản 1 Điều 92: được đề nghị rút lại khi công ty mục tiêu bán tài sản có giá trị từ 35% tổng giá trị tài sản (BCTC kỳ gần nhất). 40% ≥ 35% nên được rút; 20% chưa đạt ngưỡng; biến động giá hay thay đổi ý định không phải căn cứ rút lại.","basis":"Điểm đ khoản 1 Điều 92 Nghị định 155/2020/NĐ-CP","quote":"Công ty mục tiêu bán tài sản của công ty có giá trị từ 35% tổng giá trị tài sản căn cứ trên báo cáo tài chính kỳ gần nhất.","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-018","part":"LUAT","subject":"LU","topic":"Niêm yết & hủy niêm yết","level":1,"q":"Điều kiện về vốn để niêm yết cổ phiếu trên Sở giao dịch chứng khoán theo Nghị định 155/2020/NĐ-CP là:","o":["Vốn điều lệ đã góp từ 10 tỷ đồng, giá trị vốn hóa tối thiểu 30 tỷ đồng","Vốn điều lệ đã góp từ 30 tỷ đồng, giá trị vốn hóa tối thiểu 100 tỷ đồng","Vốn điều lệ đã góp từ 120 tỷ đồng, giá trị vốn hóa tối thiểu 120 tỷ đồng","Vốn điều lệ đã góp từ 30 tỷ đồng, giá trị vốn hóa tối thiểu 30 tỷ đồng"],"a":3,"e":"Điểm a khoản 1 Điều 109 (không bị NĐ 245 sửa đổi): công ty cổ phần có vốn điều lệ đã góp tại thời điểm đăng ký niêm yết từ 30 tỷ đồng trở lên, đồng thời giá trị vốn hóa đạt tối thiểu 30 tỷ đồng.","basis":"Điểm a khoản 1 Điều 109 Nghị định 155/2020/NĐ-CP","quote":"Là công ty cổ phần có vốn điều lệ đã góp tại thời điểm đăng ký niêm yết từ 30 tỷ đồng trở lên căn cứ trên báo cáo tài chính gần nhất được kiểm toán, đồng thời giá trị vốn hóa đạt tối thiểu 30 tỷ đồng","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-019","part":"LUAT","subject":"LU","topic":"Niêm yết & hủy niêm yết","level":2,"q":"Theo điểm c khoản 1 Điều 109 Nghị định 155/2020/NĐ-CP (sửa đổi bởi Nghị định 245/2025/NĐ-CP), nội dung nào sau đây KHÔNG còn là điều kiện niêm yết cổ phiếu?","o":["Không có nợ phải trả quá hạn trên 01 năm khi đăng ký niêm yết","ROE năm liền trước năm đăng ký niêm yết tối thiểu là 5%","Hoạt động kinh doanh của 02 năm liền trước năm đăng ký niêm yết phải có lãi","Không có lỗ lũy kế căn cứ trên BCTC năm gần nhất được kiểm toán"],"a":0,"e":"NĐ 245 viết lại điểm c khoản 1 Điều 109: giữ ROE ≥ 5%, có lãi 02 năm liền trước và không có lỗ lũy kế; điều kiện \"không có các khoản nợ phải trả quá hạn trên 01 năm\" của NĐ 155 gốc đã bị loại bỏ.","basis":"Điểm c khoản 1 Điều 109 Nghị định 155/2020/NĐ-CP (sửa đổi bởi điểm a khoản 36 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"năm đăng ký niêm yết phải có lãi; không có lỗ lũy kế căn cứ trên báo cáo tài chính năm gần nhất được kiểm toán","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-020","part":"LUAT","subject":"LU","topic":"Niêm yết & hủy niêm yết","level":3,"q":"Công ty cổ phần C (không phải doanh nghiệp cổ phần hóa) có vốn điều lệ 1.200 tỷ đồng, tương ứng 120 triệu cổ phiếu có quyền biểu quyết, đăng ký niêm yết. Yêu cầu tối thiểu về cơ cấu cổ đông là:","o":["18 triệu cổ phiếu do ít nhất 100 cổ đông không phải cổ đông lớn nắm giữ","12 triệu cổ phiếu do ít nhất 100 cổ đông không phải cổ đông lớn nắm giữ","12 triệu cổ phiếu do ít nhất 300 cổ đông không phải cổ đông lớn nắm giữ","6 triệu cổ phiếu do ít nhất 100 cổ đông không phải cổ đông lớn nắm giữ"],"a":1,"e":"Điểm d khoản 1 Điều 109: tối thiểu 15% cổ phiếu có quyền biểu quyết do ít nhất 100 cổ đông không phải cổ đông lớn nắm giữ; nếu vốn điều lệ từ 1.000 tỷ đồng trở lên thì tỷ lệ tối thiểu là 10%. 10% × 120 triệu = 12 triệu cổ phiếu (18 triệu là lỗi áp 15%).","basis":"Điểm d khoản 1 Điều 109 Nghị định 155/2020/NĐ-CP","quote":"trường hợp vốn điều lệ của tổ chức đăng ký niêm yết từ 1.000 tỷ đồng trở lên, tỷ lệ tối thiểu là 10% số cổ phiếu có quyền biểu quyết","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-021","part":"LUAT","subject":"LU","topic":"Niêm yết & hủy niêm yết","level":2,"q":"Khi niêm yết cổ phiếu, cổ đông là Chủ tịch HĐQT, thành viên HĐQT, Tổng giám đốc, Kế toán trưởng... của tổ chức đăng ký niêm yết phải cam kết nắm giữ cổ phiếu như thế nào?","o":["50% trong 06 tháng kể từ ngày giao dịch đầu tiên và 25% trong 06 tháng tiếp theo","100% trong 12 tháng kể từ ngày Sở giao dịch chứng khoán chấp thuận niêm yết","100% trong 06 tháng kể từ ngày giao dịch đầu tiên và 50% trong 06 tháng tiếp theo","100% trong 03 tháng kể từ ngày giao dịch đầu tiên và 50% trong 03 tháng tiếp theo"],"a":2,"e":"Điểm đ khoản 1 Điều 109: cam kết tiếp tục nắm giữ 100% số cổ phiếu sở hữu trong 06 tháng kể từ ngày giao dịch đầu tiên và 50% số cổ phiếu này trong 06 tháng tiếp theo (không tính cổ phiếu sở hữu nhà nước do các cá nhân này đại diện).","basis":"Điểm đ khoản 1 Điều 109 Nghị định 155/2020/NĐ-CP","quote":"phải cam kết tiếp tục nắm giữ 100% số cổ phiếu do mình sở hữu trong thời gian 06 tháng kể từ ngày giao dịch đầu tiên của cổ phiếu trên Sở giao dịch chứng khoán và 50% số cổ phiếu này trong thời gian 06 tháng tiếp theo","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-022","part":"LUAT","subject":"LU","topic":"Niêm yết & hủy niêm yết","level":1,"q":"Theo Nghị định 155/2020/NĐ-CP (sửa đổi bởi Nghị định 245/2025/NĐ-CP), cổ phiếu bị hủy niêm yết bắt buộc nếu không được đưa vào giao dịch trong thời hạn bao lâu kể từ ngày SGDCK chấp thuận đăng ký niêm yết?","o":["90 ngày","60 ngày","12 tháng","30 ngày"],"a":3,"e":"NĐ 245 sửa điểm đ khoản 1 Điều 120: rút ngắn từ 90 ngày (quy định cũ) xuống 30 ngày kể từ ngày SGDCK chấp thuận đăng ký niêm yết.","basis":"Điểm đ khoản 1 Điều 120 Nghị định 155/2020/NĐ-CP (sửa đổi bởi điểm a khoản 47 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"Cổ phiếu không đưa vào giao dịch trong thời hạn 30 ngày kể từ ngày Sở giao dịch chứng khoán chấp thuận đăng ký niêm yết","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-023","part":"LUAT","subject":"LU","topic":"Niêm yết & hủy niêm yết","level":3,"q":"Công ty niêm yết D có kết quả kinh doanh theo BCTC năm được kiểm toán: năm 2023 lỗ, 2024 lỗ, 2025 lỗ; vốn chủ sở hữu vẫn dương và lỗ lũy kế nhỏ hơn vốn điều lệ thực góp. Theo Nghị định 155/2020/NĐ-CP (sửa đổi bởi Nghị định 245/2025/NĐ-CP), cổ phiếu của D:","o":["Thuộc diện hủy bỏ niêm yết bắt buộc do thua lỗ 03 năm liên tục","Chỉ bị hủy niêm yết khi lỗ lũy kế vượt vốn điều lệ thực góp","Chỉ bị đưa vào diện cảnh báo, chưa thuộc diện hủy niêm yết","Chỉ bị hủy niêm yết khi vốn chủ sở hữu trở thành số âm"],"a":0,"e":"Điểm e khoản 1 Điều 120 (sửa đổi): thua lỗ trên BCTC năm được kiểm toán trong 03 năm liên tục gần nhất HOẶC lỗ lũy kế vượt vốn điều lệ thực góp HOẶC VCSH âm – chỉ cần một trong các trường hợp (trừ trường hợp Thủ tướng quyết định không áp dụng theo khoản 7 Điều 120).","basis":"Điểm e khoản 1 Điều 120 Nghị định 155/2020/NĐ-CP (sửa đổi bởi điểm a khoản 47 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"Hoạt động kinh doanh bị thua lỗ trên báo cáo tài chính năm được kiểm toán trong 03 năm liên tục gần nhất hoặc tổng số lỗ lũy kế vượt quá số vốn điều lệ thực góp hoặc vốn chủ sở hữu âm","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-024","part":"LUAT","subject":"LU","topic":"Niêm yết & hủy niêm yết","level":2,"q":"Cổ phiếu của công ty đại chúng thuộc diện hủy bỏ niêm yết bắt buộc (trừ các trường hợp như bị thu hồi giấy phép, không có giao dịch 12 tháng...) được tiếp tục giao dịch tối đa bao lâu kể từ ngày ra quyết định hủy niêm yết?","o":["15 ngày","30 ngày","45 ngày","60 ngày"],"a":1,"e":"Khoản 4 Điều 120 (sửa đổi bởi NĐ 245): được tiếp tục giao dịch tối đa 30 ngày kể từ ngày ra quyết định hủy niêm yết, trừ trường hợp hủy theo điểm c, d, đ, l khoản 1 và điểm c, d, đ, e khoản 3 Điều 120.","basis":"Khoản 4 Điều 120 Nghị định 155/2020/NĐ-CP (sửa đổi bởi điểm c khoản 47 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"diện hủy bỏ niêm yết bắt buộc được tiếp tục giao dịch trong thời hạn tối đa 30 ngày kể từ ngày ra quyết định hủy niêm yết","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-025","part":"LUAT","subject":"LU","topic":"Niêm yết & hủy niêm yết","level":2,"q":"Theo Nghị định 155/2020/NĐ-CP, điều kiện để tổ chức niêm yết được hủy bỏ niêm yết cổ phiếu tự nguyện là:","o":["Từ 65% phiếu của cổ đông dự họp tán thành; sau tối thiểu 01 năm niêm yết","Trên 50% phiếu của tất cả cổ đông tán thành; sau tối thiểu 01 năm niêm yết","Trên 50% phiếu của cổ đông không phải cổ đông lớn; sau tối thiểu 02 năm","Hội đồng quản trị thông qua; sau tối thiểu 02 năm kể từ ngày niêm yết"],"a":2,"e":"Khoản 1 Điều 121: quyết định hủy niêm yết tự nguyện phải được ĐHĐCĐ thông qua, trong đó trên 50% số phiếu biểu quyết của cổ đông không phải là cổ đông lớn tán thành; chỉ thực hiện sau tối thiểu 02 năm kể từ ngày có Quyết định chấp thuận niêm yết.","basis":"Khoản 1 Điều 121 Nghị định 155/2020/NĐ-CP","quote":"trong đó phải được trên 50% số phiếu biểu quyết của các cổ đông không phải là cổ đông lớn thông qua","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-026","part":"LUAT","subject":"LU","topic":"Sở hữu nước ngoài","level":2,"q":"Công ty đại chúng hoạt động trong ngành, nghề tiếp cận thị trường có điều kiện đối với nhà đầu tư nước ngoài nhưng danh mục không quy định cụ thể tỷ lệ sở hữu. Tỷ lệ sở hữu nước ngoài tối đa tại công ty là:","o":["49% vốn điều lệ","30% vốn điều lệ","Không hạn chế","50% vốn điều lệ"],"a":3,"e":"Điểm c khoản 1 Điều 139 (không bị NĐ 245 sửa đổi): trường hợp danh mục không quy định cụ thể tỷ lệ sở hữu của nhà đầu tư nước ngoài thì tỷ lệ sở hữu nước ngoài tối đa là 50% vốn điều lệ.","basis":"Điểm c khoản 1 Điều 139 Nghị định 155/2020/NĐ-CP","quote":"thì tỷ lệ sở hữu nước ngoài tối đa tại công ty là 50% vốn điều lệ","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-027","part":"LUAT","subject":"LU","topic":"Sở hữu nước ngoài","level":3,"q":"Công ty đại chúng F hoạt động trong 3 ngành: ngành A có tỷ lệ sở hữu nước ngoài tối đa 49% theo pháp luật chuyên ngành; ngành B tiếp cận thị trường có điều kiện, không quy định cụ thể tỷ lệ; ngành C không hạn chế. Tỷ lệ sở hữu nước ngoài tối đa tại F là:","o":["49%","50%","100%","Bình quân gia quyền theo doanh thu từng ngành"],"a":0,"e":"Điểm đ khoản 1 Điều 139: công ty đa ngành có quy định khác nhau thì tỷ lệ sở hữu nước ngoài không vượt quá mức thấp nhất trong các ngành có quy định. Ngành A 49%, ngành B 50% (điểm c) → mức thấp nhất 49%.","basis":"Điểm đ khoản 1 Điều 139 Nghị định 155/2020/NĐ-CP","quote":"Trường hợp công ty đại chúng hoạt động đa ngành, nghề, có quy định khác nhau về tỷ lệ sở hữu nước ngoài, tỷ lệ sở hữu nước ngoài không vượt quá mức thấp nhất trong các ngành, nghề có quy định về tỷ lệ sở hữu nước ngoài","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-028","part":"LUAT","subject":"LU","topic":"Sở hữu nước ngoài","level":2,"q":"Công ty đại chúng G trước đây đã thông báo tỷ lệ sở hữu nước ngoài tối đa 30% (thấp hơn mức 50% theo quy định) căn cứ điểm e khoản 1 Điều 139 NĐ 155. Sau khi Nghị định 245/2025/NĐ-CP bãi bỏ điểm e, G muốn thay đổi tỷ lệ này theo Nghị quyết ĐHĐCĐ. Tỷ lệ mới phải đáp ứng yêu cầu nào?","o":["Bất kỳ mức nào từ 0% đến 50%","Cao hơn 30% và không vượt quá 50%","Giữ nguyên 30% đến hết 12 tháng kể từ ngày NĐ 245 có hiệu lực","Bằng đúng 50% theo mức tối đa luật định"],"a":1,"e":"NĐ 245 bãi bỏ điểm e khoản 1 Điều 139 (công ty tự quyết định FOL thấp hơn). Theo điểm b khoản 4 Điều 3 NĐ 245 (chuyển tiếp), công ty đã thông báo FOL được thay đổi theo Nghị quyết ĐHĐCĐ nhưng phải cao hơn tỷ lệ đã thông báo gần nhất và không vượt quá tỷ lệ tại các điểm a–đ khoản 1 Điều 139.","basis":"Điểm b khoản 4 Điều 3 và khoản 5 Điều 2 Nghị định 245/2025/NĐ-CP","quote":"phải đảm bảo cao hơn tỷ lệ sở hữu nước ngoài tối đa đã thông báo tại thời điểm gần nhất và không vượt quá tỷ lệ quy định tại các điểm a, b, c, d, đ khoản 1 Điều 139","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-029","part":"LUAT","subject":"LU","topic":"Vốn điều lệ CTCK","level":1,"q":"Vốn điều lệ tối thiểu cho nghiệp vụ môi giới chứng khoán của công ty chứng khoán tại Việt Nam là:","o":["10 tỷ đồng","50 tỷ đồng","25 tỷ đồng","165 tỷ đồng"],"a":2,"e":"Khoản 1 Điều 175 (không bị NĐ 245 sửa đổi): môi giới 25 tỷ; tự doanh 50 tỷ; bảo lãnh phát hành 165 tỷ; tư vấn đầu tư 10 tỷ đồng.","basis":"Điểm a khoản 1 Điều 175 Nghị định 155/2020/NĐ-CP","quote":"a) Môi giới chứng khoán: 25 tỷ đồng; b) Tự doanh chứng khoán: 50 tỷ đồng;","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-030","part":"LUAT","subject":"LU","topic":"Vốn điều lệ CTCK","level":3,"q":"Một tổ chức đề nghị cấp Giấy phép thành lập và hoạt động công ty chứng khoán với ba nghiệp vụ: môi giới, tự doanh và tư vấn đầu tư chứng khoán. Vốn điều lệ tối thiểu là:","o":["50 tỷ đồng","75 tỷ đồng","250 tỷ đồng","85 tỷ đồng"],"a":3,"e":"Khoản 4 Điều 175: đề nghị nhiều nghiệp vụ thì vốn điều lệ tối thiểu là tổng vốn của từng nghiệp vụ: 25 + 50 + 10 = 85 tỷ đồng. (75 tỷ là quên tư vấn; 250 tỷ là đủ 4 nghiệp vụ gồm cả bảo lãnh 165 tỷ.)","basis":"Khoản 1, khoản 4 Điều 175 Nghị định 155/2020/NĐ-CP","quote":"Trường hợp tổ chức đề nghị cấp phép cho nhiều nghiệp vụ kinh doanh, vốn điều lệ tối thiểu là tổng số vốn tương ứng với từng nghiệp vụ đề nghị cấp phép.","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-031","part":"LUAT","subject":"LU","topic":"Vốn điều lệ CTCK","level":1,"q":"Vốn điều lệ tối thiểu của công ty quản lý quỹ đầu tư chứng khoán theo Nghị định 155/2020/NĐ-CP là:","o":["25 tỷ đồng","10 tỷ đồng","50 tỷ đồng","100 tỷ đồng"],"a":0,"e":"Khoản 3 Điều 175: vốn điều lệ tối thiểu của công ty quản lý quỹ, vốn tối thiểu cấp cho chi nhánh công ty quản lý quỹ nước ngoài tại Việt Nam là 25 tỷ đồng.","basis":"Khoản 3 Điều 175 Nghị định 155/2020/NĐ-CP","quote":"Vốn điều lệ tối thiểu của công ty quản lý quỹ, vốn tối thiểu cấp cho chi nhánh công ty quản lý quỹ nước ngoài tại Việt Nam là 25 tỷ đồng.","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-032","part":"LUAT","subject":"LU","topic":"Tổ chức & hoạt động CTCK","level":2,"q":"Công ty chứng khoán thực hiện giảm vốn điều lệ phải đáp ứng điều kiện nào sau đây?","o":["Tỷ lệ vốn khả dụng sau giảm vốn tối thiểu 150%; các đợt giảm vốn cách nhau tối thiểu 06 tháng","Tỷ lệ vốn khả dụng sau giảm vốn tối thiểu 180%; các đợt giảm vốn cách nhau tối thiểu 12 tháng","Tỷ lệ vốn khả dụng sau giảm vốn tối thiểu 220%; các đợt giảm vốn cách nhau tối thiểu 12 tháng","Tỷ lệ vốn khả dụng sau giảm vốn tối thiểu 180%; các đợt giảm vốn cách nhau tối thiểu 06 tháng"],"a":1,"e":"Khoản 1 Điều 188: VCSH sau giảm không thấp hơn mức vốn tại Điều 175; tỷ lệ vốn khả dụng sau giảm tối thiểu 180%; các đợt giảm vốn cách nhau tối thiểu 12 tháng; đáp ứng điều kiện mua lại cổ phiếu và tỷ lệ sở hữu nước ngoài.","basis":"Điểm b, c khoản 1 Điều 188 Nghị định 155/2020/NĐ-CP","quote":"Tỷ lệ vốn khả dụng sau khi giảm vốn đạt tối thiểu là 180%; c) Các đợt giảm vốn phải cách nhau tối thiểu 12 tháng;","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-033","part":"LUAT","subject":"LU","topic":"Tổ chức & hoạt động CTCK","level":2,"q":"Điều kiện về nhân sự khi công ty chứng khoán thành lập chi nhánh trong nước là:","o":["Giám đốc chi nhánh có CCHN phù hợp; tối thiểu 05 nhân viên có CCHN cho mỗi nghiệp vụ","Chỉ yêu cầu Giám đốc chi nhánh có CCHN, không quy định số nhân viên","Giám đốc chi nhánh có CCHN phù hợp; tối thiểu 02 nhân viên có CCHN cho mỗi nghiệp vụ","Giám đốc chi nhánh có CCHN phù hợp; tối thiểu 03 nhân viên có CCHN cho cả chi nhánh"],"a":2,"e":"Điểm đ khoản 2 Điều 190: Giám đốc chi nhánh có CCHN phù hợp với nghiệp vụ của chi nhánh và đáp ứng tiêu chuẩn tại Luật CK; có tối thiểu 02 nhân viên có CCHN phù hợp với mỗi nghiệp vụ kinh doanh của chi nhánh.","basis":"Điểm đ khoản 2 Điều 190 Nghị định 155/2020/NĐ-CP","quote":"Có tối thiểu 02 nhân viên có chứng chỉ hành nghề chứng khoán phù hợp với mỗi nghiệp vụ kinh doanh của chi nhánh.","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-034","part":"LUAT","subject":"LU","topic":"Tổ chức & hoạt động CTCK","level":2,"q":"Để được cung cấp dịch vụ cho vay chứng khoán, công ty chứng khoán phải đáp ứng điều kiện nào về tỷ lệ vốn khả dụng?","o":["Tối thiểu 180% liên tục trong 06 tháng gần nhất","Tối thiểu 220% liên tục trong 12 tháng gần nhất","Tối thiểu 260% liên tục trong 12 tháng gần nhất","Tối thiểu 220% liên tục trong 06 tháng gần nhất"],"a":3,"e":"Điểm d khoản 1 Điều 199: tỷ lệ vốn khả dụng đạt tối thiểu 220% liên tục trong 06 tháng gần nhất tính đến thời điểm đăng ký; ngoài ra phải được cấp phép môi giới và có hệ thống, quy trình phù hợp.","basis":"Điểm d khoản 1 Điều 199 Nghị định 155/2020/NĐ-CP","quote":"Tỷ lệ vốn khả dụng đạt tối thiểu 220% liên tục trong 06 tháng gần nhất tính đến thời điểm đăng ký cung cấp dịch vụ cho vay chứng khoán.","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-035","part":"LUAT","subject":"LU","topic":"Chứng quyền có bảo đảm","level":2,"q":"Theo Điều 202a Nghị định 155/2020/NĐ-CP (bổ sung bởi Nghị định 245/2025/NĐ-CP), tổ chức phát hành chứng quyền có bảo đảm phải là:","o":["CTCK được cấp phép tự doanh; vốn điều lệ và VCSH tối thiểu 1.000 tỷ đồng","CTCK được cấp phép môi giới; vốn điều lệ và VCSH tối thiểu 1.000 tỷ đồng","CTCK được cấp phép tự doanh; vốn điều lệ và VCSH tối thiểu 800 tỷ đồng","CTCK được cấp phép bảo lãnh phát hành; VCSH tối thiểu 500 tỷ đồng"],"a":0,"e":"Điểm a khoản 1 Điều 202a: CTCK được cấp phép nghiệp vụ tự doanh; vốn điều lệ và vốn chủ sở hữu tối thiểu 1.000 tỷ đồng theo BCTC năm gần nhất được kiểm toán; không đang bị tạm ngừng, đình chỉ hoạt động.","basis":"Điểm a khoản 1 Điều 202a Nghị định 155/2020/NĐ-CP (bổ sung bởi khoản 72 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"Tổ chức phát hành là công ty chứng khoán được cấp phép nghiệp vụ tự doanh chứng khoán; có vốn điều lệ và vốn chủ sở hữu tối thiểu 1.000 tỷ đồng theo báo cáo tài chính năm gần nhất được kiểm toán","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-036","part":"LUAT","subject":"LU","topic":"Chứng quyền có bảo đảm","level":2,"q":"CTCK H đã phát hành 10 triệu chứng quyền có bảo đảm mã CW1; hiện có 7,5 triệu chứng quyền đang lưu hành, còn 45 ngày đến ngày đáo hạn. Theo Nghị định 155/2020/NĐ-CP (bổ sung bởi Nghị định 245/2025/NĐ-CP), H:","o":["Được chào bán bổ sung vì thời gian còn lại đến đáo hạn lớn hơn 30 ngày","Chưa được chào bán bổ sung vì số lưu hành chưa vượt quá 80% số đã phát hành","Được chào bán bổ sung vì số đang lưu hành đã vượt quá 50% số đã phát hành","Không được chào bán bổ sung vì thời gian còn lại đến đáo hạn dưới 60 ngày"],"a":1,"e":"Khoản 2 Điều 202a: chỉ được chào bán bổ sung khi đồng thời (i) số chứng quyền đang lưu hành vượt quá 80% số đã phát hành và (ii) thời gian còn lại đến đáo hạn lớn hơn 30 ngày. 7,5/10 = 75% < 80% nên chưa đủ điều kiện.","basis":"Khoản 2 Điều 202a Nghị định 155/2020/NĐ-CP (bổ sung bởi khoản 72 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"Tổ chức phát hành chỉ được thực hiện chào bán bổ sung khi số lượng chứng quyền có bảo đảm đang lưu hành vượt quá 80% số lượng chứng quyền có bảo đảm đó đã phát hành và thời gian còn lại của chứng quyền có bảo đảm đến ngày đáo hạn lớn hơn 30 ngày.","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-037","part":"LUAT","subject":"LU","topic":"Chứng chỉ hành nghề chứng khoán","level":1,"q":"Theo Nghị định 155/2020/NĐ-CP (sửa đổi bởi Nghị định 245/2025/NĐ-CP), UBCKNN ra quyết định cấp chứng chỉ hành nghề chứng khoán cho người thi đạt trong thời hạn nào?","o":["07 ngày làm việc kể từ ngày UBCKNN nhận đủ hồ sơ đề nghị cấp hợp lệ","15 ngày kể từ ngày kết thúc đợt thi sát hạch cấp chứng chỉ hành nghề","30 ngày kể từ ngày kết quả thi được thông báo trên trang thông tin điện tử","60 ngày kể từ ngày kết quả thi được thông báo trên trang thông tin điện tử"],"a":2,"e":"Điểm a khoản 6 Điều 213 (sửa đổi bởi NĐ 245): trong 30 ngày kể từ ngày kết quả thi sát hạch được thông báo trên trang thông tin điện tử của UBCKNN, UBCKNN ra quyết định cấp CCHN (bản giấy hoặc điện tử) và thông báo nộp lệ phí. Mốc \"07 ngày làm việc từ khi nhận hồ sơ\" là quy định cũ.","basis":"Điểm a khoản 6 Điều 213 Nghị định 155/2020/NĐ-CP (sửa đổi bởi điểm đ khoản 73 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"Trong thời hạn 30 ngày kể từ ngày kết quả thi sát hạch cấp chứng chỉ hành nghề chứng khoán được thông báo trên trang thông tin điện tử của Ủy ban Chứng khoán Nhà nước, Ủy ban Chứng khoán Nhà nước ra quyết định cấp chứng chỉ hành nghề chứng khoán","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-038","part":"LUAT","subject":"LU","topic":"Chứng chỉ hành nghề chứng khoán","level":2,"q":"Thí sinh K dự thi sát hạch cấp CCHN chứng khoán, đạt phần pháp luật nhưng chưa đạt phần chuyên môn; UBCKNN thông báo kết quả ngày 10/7/2026. Theo Nghị định 155/2020/NĐ-CP (sửa đổi bởi Nghị định 245/2025/NĐ-CP), K:","o":["Được thi lại riêng phần chuyên môn trong vòng 02 năm; quá hạn phải thi lại cả hai phần","Phải thi lại cả hai phần ở kỳ thi tiếp theo do kết quả chung chưa đạt","Được bảo lưu phần pháp luật không thời hạn, chỉ cần thi lại phần chuyên môn","Được thi lại riêng phần chuyên môn trong vòng 01 năm; quá hạn phải thi lại cả hai phần"],"a":3,"e":"Điểm c khoản 6 Điều 213 (sửa đổi): kết quả chưa đạt một phần thì được thi lại phần chưa đạt trong vòng 01 năm kể từ ngày UBCKNN thông báo kết quả thi lần đầu (hoặc kỳ thi gần nhất liền sau); quá thời hạn phải thi lại cả hai phần. Khi đăng ký thi lại phải nộp hồ sơ dự thi và hồ sơ đề nghị cấp CCHN.","basis":"Điểm c khoản 6 Điều 213 Nghị định 155/2020/NĐ-CP (sửa đổi bởi điểm đ khoản 73 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"thí sinh được thi lại phần chưa đạt trong vòng 01 năm kể từ ngày Ủy ban Chứng khoán Nhà nước thông báo kết quả thi lần đầu","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-039","part":"LUAT","subject":"LU","topic":"Chứng chỉ hành nghề chứng khoán","level":2,"q":"Người có chứng chỉ hành nghề phân tích tài chính KHÔNG được thực hiện nghiệp vụ nào sau đây?","o":["Quản lý quỹ đầu tư chứng khoán","Tự doanh chứng khoán","Bảo lãnh phát hành chứng khoán","Tư vấn đầu tư chứng khoán"],"a":0,"e":"Điểm b khoản 2 Điều 216: CCHN phân tích tài chính được thực hiện môi giới, tư vấn đầu tư, tự doanh, bảo lãnh phát hành chứng khoán. Quản lý danh mục và quản lý quỹ chỉ dành cho người có CCHN quản lý quỹ (điểm c).","basis":"Điểm b khoản 2 Điều 216 Nghị định 155/2020/NĐ-CP","quote":"Người có chứng chỉ hành nghề phân tích tài chính được thực hiện nghiệp vụ môi giới chứng khoán, tư vấn đầu tư chứng khoán, tự doanh chứng khoán, bảo lãnh phát hành chứng khoán","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-040","part":"LUAT","subject":"LU","topic":"Chứng chỉ hành nghề chứng khoán","level":1,"q":"Theo Nghị định 155/2020/NĐ-CP (bổ sung bởi Nghị định 245/2025/NĐ-CP), UBCKNN thông báo kết quả thi sát hạch cấp chứng chỉ hành nghề chứng khoán trong thời hạn nào?","o":["Trong vòng 07 ngày làm việc kể từ ngày kết thúc đợt thi","Trong vòng 15 ngày kể từ ngày kết thúc đợt thi","Trong vòng 20 ngày kể từ ngày kết thúc đợt thi","Trong vòng 30 ngày kể từ ngày kết thúc đợt thi"],"a":1,"e":"Khoản 5a Điều 213 (bổ sung bởi NĐ 245): thi sát hạch gồm hai phần (pháp luật và chuyên môn); trong vòng 15 ngày kể từ ngày kết thúc đợt thi, UBCKNN thông báo kết quả trên trang thông tin điện tử.","basis":"Khoản 5a Điều 213 Nghị định 155/2020/NĐ-CP (bổ sung bởi điểm d khoản 73 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"Trong vòng 15 ngày kể từ ngày kết thúc đợt thi sát hạch cấp chứng chỉ hành nghề chứng khoán, Ủy ban Chứng khoán Nhà nước thông báo trên trang thông tin điện tử","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-041","part":"LUAT","subject":"LU","topic":"Quản trị công ty đại chúng","level":2,"q":"Theo Nghị định 155/2020/NĐ-CP (sửa đổi bởi Nghị định 245/2025/NĐ-CP), thành viên HĐQT của một công ty đại chúng được đồng thời là thành viên HĐQT ở bao nhiêu công ty khác?","o":["Tối đa 05 công ty khác, chỉ tính vị trí thành viên Hội đồng quản trị","Tối đa 03 công ty khác, tính cả vị trí thành viên Hội đồng thành viên","Tối đa 05 công ty khác, tính cả vị trí thành viên Hội đồng thành viên","Không giới hạn nếu không phải là thành viên Hội đồng quản trị độc lập"],"a":2,"e":"NĐ 245 sửa khoản 3 Điều 275: chỉ được đồng thời là thành viên HĐQT hoặc Hội đồng thành viên tại tối đa 05 công ty khác (bản gốc chỉ tính HĐQT).","basis":"Khoản 3 Điều 275 Nghị định 155/2020/NĐ-CP (sửa đổi bởi khoản 78 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"Thành viên Hội đồng quản trị của một công ty đại chúng chỉ được đồng thời là thành viên Hội đồng quản trị hoặc Hội đồng thành viên tại tối đa 05 công ty khác.","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-042","part":"LUAT","subject":"LU","topic":"Quản trị công ty đại chúng","level":3,"q":"Công ty niêm yết L có Hội đồng quản trị gồm 7 thành viên. Theo Nghị định 155/2020/NĐ-CP, số thành viên HĐQT độc lập tối thiểu của L là:","o":["01 thành viên","03 thành viên","04 thành viên","02 thành viên"],"a":3,"e":"Khoản 4 Điều 276: công ty niêm yết có HĐQT 03–05 thành viên cần tối thiểu 01 thành viên độc lập; 06–08 thành viên cần tối thiểu 02; 09–11 thành viên cần tối thiểu 03. HĐQT 7 thành viên → tối thiểu 02.","basis":"Điểm b khoản 4 Điều 276 Nghị định 155/2020/NĐ-CP","quote":"Có tối thiểu 02 thành viên độc lập trong trường hợp công ty có số thành viên Hội đồng quản trị từ 06 đến 08 thành viên;","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-043","part":"LUAT","subject":"LU","topic":"Quản trị công ty đại chúng","level":2,"q":"Theo Nghị định 155/2020/NĐ-CP (sửa đổi bởi Nghị định 245/2025/NĐ-CP), công ty đại chúng có HĐQT từ 09 đến 11 thành viên phải có tối thiểu bao nhiêu thành viên HĐQT không điều hành?","o":["Tối thiểu 03 thành viên không điều hành","Tối thiểu một phần ba tổng số thành viên HĐQT","Tối thiểu 02 thành viên không điều hành","Tối thiểu một nửa tổng số thành viên HĐQT"],"a":0,"e":"NĐ 245 sửa khoản 2 Điều 276, thay quy định cũ \"tối thiểu 1/3 tổng số thành viên\" bằng số tối thiểu theo quy mô: 03–05 thành viên → 01; 06–08 → 02; 09–11 → 03 thành viên không điều hành.","basis":"Điểm c khoản 2 Điều 276 Nghị định 155/2020/NĐ-CP (sửa đổi bởi khoản 79 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"Có tối thiểu 03 thành viên không điều hành trong trường hợp công ty có số thành viên Hội đồng quản trị từ 09 đến 11 thành viên.","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-044","part":"LUAT","subject":"LU","topic":"Quản trị công ty đại chúng","level":3,"q":"Công ty đại chúng P (tổng tài sản theo BCTC gần nhất 2.000 tỷ đồng; Điều lệ không quy định tỷ lệ khác) dự kiến ký hợp đồng mua bán hàng hóa trị giá 600 tỷ đồng với cổ đông Q sở hữu 15% vốn cổ phần phổ thông; trong 12 tháng gần nhất P chưa có giao dịch nào khác với Q. Cấp có thẩm quyền chấp thuận giao dịch là:","o":["Đại hội đồng cổ đông, vì Q sở hữu trên 10% vốn cổ phần phổ thông","Hội đồng quản trị, vì giá trị giao dịch nhỏ hơn 35% tổng giá trị tài sản","Đại hội đồng cổ đông, vì giá trị giao dịch lớn hơn 10% tổng tài sản","Tổng giám đốc tự quyết định theo phân cấp trong Quy chế nội bộ"],"a":1,"e":"600/2.000 = 30% < 35%, và không có giao dịch nào khác với Q trong 12 tháng để cộng dồn. Theo khoản 5 Điều 293 (sửa đổi bởi NĐ 245), HĐQT chấp thuận giao dịch tại điểm b khoản 4 (với cổ đông sở hữu trên 10% vốn cổ phần phổ thông...) có giá trị nhỏ hơn 35% tổng tài sản; giao dịch (hoặc tổng giao dịch trong 12 tháng) từ 35% trở lên mới thuộc thẩm quyền ĐHĐCĐ. Điểm c khoản 4 (trên 10%) chỉ áp dụng với cổ đông sở hữu từ 51%.","basis":"Điểm b khoản 4, khoản 5 Điều 293 Nghị định 155/2020/NĐ-CP (sửa đổi bởi khoản 84 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"Hội đồng quản trị chấp thuận các hợp đồng, giao dịch quy định tại điểm b khoản 4 Điều này có giá trị nhỏ hơn 35% tổng giá trị tài sản ghi trên báo cáo tài chính gần nhất","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-045","part":"LUAT","subject":"LU","topic":"Quản trị công ty đại chúng","level":3,"q":"Công ty đại chúng R dự kiến bán một tài sản cho công ty mẹ S (S sở hữu 60% tổng số cổ phần có quyền biểu quyết của R) với giá trị bằng 12% tổng giá trị tài sản theo BCTC gần nhất. Điều lệ không quy định khác. Giao dịch này:","o":["Do HĐQT chấp thuận vì giá trị dưới 35% tổng giá trị tài sản","Do Tổng giám đốc quyết định vì là giao dịch trong cùng tập đoàn","Phải được Đại hội đồng cổ đông chấp thuận trước khi thực hiện","Không cần chấp thuận, chỉ cần công bố thông tin sau giao dịch"],"a":2,"e":"Điểm c khoản 4 Điều 293 (sửa đổi bởi NĐ 245): hợp đồng vay, bán tài sản có giá trị lớn hơn 10% tổng tài sản giữa công ty và cổ đông sở hữu từ 51% cổ phần có quyền biểu quyết trở lên (hoặc người có liên quan) phải được ĐHĐCĐ chấp thuận. 12% > 10%, S sở hữu 60% ≥ 51%.","basis":"Điểm c khoản 4 Điều 293 Nghị định 155/2020/NĐ-CP (sửa đổi bởi khoản 84 Điều 1 Nghị định 245/2025/NĐ-CP)","quote":"Hợp đồng, giao dịch vay, bán tài sản có giá trị lớn hơn 10% tổng giá trị tài sản ghi trên báo cáo tài chính gần nhất giữa công ty và cổ đông sở hữu từ 51% tổng số cổ phần có quyền biểu quyết trở lên","src":"ND_245_2025_ND-CP_Cong_bao_so_1403-1408_2025.txt","as_of":"2026-11"},{"id":"L2-046","part":"LUAT","subject":"LU","topic":"Quản trị công ty đại chúng","level":2,"q":"Thành phần Ủy ban kiểm toán trực thuộc HĐQT của công ty đại chúng phải đáp ứng yêu cầu nào?","o":["Từ 03 thành viên trở lên; Chủ tịch là thành viên HĐQT độc lập","Từ 02 thành viên trở lên; Chủ tịch là thành viên HĐQT điều hành","Từ 03 đến 05 thành viên; Chủ tịch do Đại hội đồng cổ đông bầu","Từ 02 thành viên trở lên; Chủ tịch là thành viên HĐQT độc lập"],"a":3,"e":"Khoản 2 Điều 282: Ủy ban kiểm toán có từ 02 thành viên trở lên; Chủ tịch phải là thành viên HĐQT độc lập; các thành viên khác phải là thành viên HĐQT không điều hành.","basis":"Khoản 2 Điều 282 Nghị định 155/2020/NĐ-CP","quote":"Ủy ban kiểm toán có từ 02 thành viên trở lên. Chủ tịch Ủy ban kiểm toán phải là thành viên Hội đồng quản trị độc lập.","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-047","part":"LUAT","subject":"LU","topic":"Quản trị công ty đại chúng","level":1,"q":"Trường hợp đã xác định được ứng cử viên HĐQT, công ty đại chúng phải công bố thông tin về các ứng cử viên tối thiểu bao nhiêu ngày trước ngày khai mạc họp ĐHĐCĐ?","o":["10 ngày","05 ngày","15 ngày","21 ngày"],"a":0,"e":"Khoản 1 Điều 274: công bố thông tin liên quan đến ứng cử viên (họ tên, trình độ, quá trình công tác, chức danh quản lý khác, lợi ích liên quan...) tối thiểu 10 ngày trước ngày khai mạc họp ĐHĐCĐ trên trang thông tin điện tử của công ty.","basis":"Khoản 1 Điều 274 Nghị định 155/2020/NĐ-CP","quote":"công ty đại chúng phải công bố thông tin liên quan đến các ứng cử viên tối thiểu 10 ngày trước ngày khai mạc họp Đại hội đồng cổ đông","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"L2-048","part":"LUAT","subject":"LU","topic":"Giám sát & an ninh thị trường","level":2,"q":"Theo Nghị định 155/2020/NĐ-CP (bổ sung bởi Nghị định 245/2025/NĐ-CP), trong thời gian bị cấm thực hiện hoạt động giao dịch chứng khoán, tổ chức, cá nhân:","o":["Không được mua, bán chứng khoán và không được hưởng các quyền phát sinh","Chỉ được bán chứng khoán có trên tài khoản, không được mu
