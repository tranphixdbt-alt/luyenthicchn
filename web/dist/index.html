0 / (0,7 × 10.000) ≈ 28.571 đồng.","basis":"Tỷ lệ ký quỹ = (Giá trị chứng khoán − Dư nợ) / Giá trị chứng khoán (dữ kiện hợp đồng nêu trong đề)","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C1-064","part":"CM","subject":"MG","topic":"Giao dịch cổ phiếu trên thị trường chứng khoán","level":2,"q":"Bà K gọi điện cho nhân viên môi giới đề nghị đặt lệnh bán cổ phiếu trên tài khoản giao dịch đứng tên chồng là ông L; ông L chưa có văn bản ủy quyền cho bà K. Theo Thông tư 121/2020/TT-BTC, nhân viên môi giới phải:","o":["Nhận lệnh vì vợ chồng là người có liên quan theo quy định của Luật Chứng khoán","Từ chối nhận lệnh vì người đặt lệnh không có văn bản ủy quyền của chủ tài khoản","Nhận lệnh nếu bà K cung cấp đúng số tài khoản và mật khẩu giao dịch của ông L","Nhận lệnh trước, yêu cầu bổ sung văn bản ủy quyền trong vòng 05 ngày làm việc"],"a":1,"e":"Điểm d khoản 4 Điều 13 TT 121/2020: công ty chứng khoán thực hiện nghiệp vụ môi giới không được nhận lệnh giao dịch với người không phải là người đứng tên tài khoản giao dịch mà không có ủy quyền bằng văn bản của người đứng tên tài khoản. Quan hệ vợ chồng, việc biết mật khẩu hay hứa bổ sung giấy tờ sau đều không thay thế được văn bản ủy quyền.","basis":"Điểm d khoản 4 Điều 13 Thông tư 121/2020/TT-BTC (sửa đổi, bổ sung bởi khoản 2 Điều 9 Thông tư 08/2026/TT-BTC)","quote":"","src":"VBHN_09_VBHN-BTC_2026_TT121_68_08_hop_nhat.txt","as_of":"2026-11"},{"id":"C1-065","part":"CM","subject":"MG","topic":"Giao dịch trái phiếu trên thị trường chứng khoán","level":1,"q":"Theo Luật Chứng khoán, mệnh giá của trái phiếu chào bán ra công chúng là:","o":["10 nghìn đồng cho mỗi trái phiếu","1 triệu đồng và bội số của 1 triệu đồng","100 nghìn đồng và bội số của 100 nghìn đồng","Do tổ chức phát hành tự quyết định"],"a":2,"e":"Khoản 2 Điều 13: mệnh giá cổ phiếu, chứng chỉ quỹ chào bán ra công chúng là 10 nghìn đồng; mệnh giá trái phiếu chào bán ra công chúng là 100 nghìn đồng và bội số của 100 nghìn đồng.","basis":"Khoản 2 Điều 13 Luật Chứng khoán 2019","quote":"","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"C1-066","part":"CM","subject":"MG","topic":"Giao dịch trái phiếu trên thị trường chứng khoán","level":2,"q":"Khi lãi suất thị trường thay đổi, trái phiếu nào sau đây (cùng mệnh giá, cùng mức tín nhiệm, trả lãi cố định) có giá biến động mạnh nhất?","o":["Kỳ hạn còn lại 2 năm, lãi suất coupon 3%/năm","Kỳ hạn còn lại 10 năm, lãi suất coupon 9%/năm","Kỳ hạn còn lại 2 năm, lãi suất coupon 9%/năm","Kỳ hạn còn lại 10 năm, lãi suất coupon 3%/năm"],"a":3,"e":"Giá trái phiếu biến động ngược chiều lãi suất; kỳ hạn càng dài và lãi suất coupon càng thấp thì thời lượng (duration) càng lớn, giá càng nhạy cảm với thay đổi lãi suất.","basis":"Quan hệ giá – lợi suất trái phiếu; độ nhạy giá theo kỳ hạn và lãi suất coupon","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C1-067","part":"CM","subject":"MG","topic":"Giao dịch trái phiếu trên thị trường chứng khoán","level":3,"q":"Nhà đầu tư mua 10.000 trái phiếu Chính phủ mệnh giá 100.000 đồng, lãi suất coupon 6%/năm, trả lãi hằng năm, với giá yết (giá sạch) 98.500 đồng/trái phiếu. Từ ngày trả lãi gần nhất đến ngày thanh toán là 146 ngày; quy ước tính lãi thực tế/365. Tổng số tiền thanh toán (giá bẩn, chưa tính phí) là:","o":["1.009.000.000 đồng","985.000.000 đồng","961.000.000 đồng","1.024.000.000 đồng"],"a":0,"e":"Lãi cộng dồn = 100.000 × 6% × 146/365 = 2.400 đồng/trái phiếu; giá bẩn = 98.500 + 2.400 = 100.900 đồng; tổng tiền = 100.900 × 10.000 = 1.009.000.000 đồng.","basis":"Lãi cộng dồn = Mệnh giá × Lãi suất coupon × Số ngày/365; Giá bẩn = Giá sạch + Lãi cộng dồn","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C1-068","part":"CM","subject":"MG","topic":"Giao dịch trái phiếu trên thị trường chứng khoán","level":3,"q":"Nhà đầu tư thực hiện giao dịch mua bán lại (repo) trái phiếu Chính phủ: giá trị thanh toán lượt đi 10 tỷ đồng, lãi suất repo 4,38%/năm, kỳ hạn 14 ngày, quy ước 365 ngày/năm. Giá trị thanh toán lượt về là:","o":["10.438.000.000 đồng","10.016.800.000 đồng","10.017.033.333 đồng","10.001.200.000 đồng"],"a":1,"e":"Giá trị lượt về = 10.000.000.000 × (1 + 4,38% × 14/365) = 10.000.000.000 × 1,00168 = 10.016.800.000 đồng. Dùng quy ước 360 ngày sẽ ra 10.017.033.333 đồng.","basis":"Giá trị lượt về = Giá trị lượt đi × (1 + Lãi suất repo × Số ngày/365)","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C1-069","part":"CM","subject":"MG","topic":"Giao dịch trái phiếu trên thị trường chứng khoán","level":3,"q":"Trái phiếu mệnh giá 100.000 đồng, lãi suất coupon 8%/năm, trả lãi cuối mỗi năm, còn đúng 2 năm đến ngày đáo hạn (vừa trả lãi). Với lợi suất đáo hạn yêu cầu 10%/năm, giá hợp lý của trái phiếu (làm tròn đến đồng) là:","o":["100.000 đồng","96.000 đồng","96.529 đồng","103.667 đồng"],"a":2,"e":"P = 8.000/1,1 + 108.000/1,1² = 7.272,73 + 89.256,20 ≈ 96.529 đồng. Lợi suất yêu cầu cao hơn coupon nên trái phiếu được giao dịch dưới mệnh giá (103.667 đồng là giá nếu chiết khấu ở 6%).","basis":"P = Σ C/(1+r)^t + F/(1+r)^n","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C1-070","part":"CM","subject":"MG","topic":"Giao dịch trái phiếu trên thị trường chứng khoán","level":2,"q":"Theo Luật Chứng khoán (sửa đổi bởi Luật 56/2024/QH15), nhà đầu tư chứng khoán chuyên nghiệp là cá nhân chỉ được mua, giao dịch, chuyển nhượng trái phiếu doanh nghiệp riêng lẻ trong trường hợp nào?","o":["Mọi trái phiếu doanh nghiệp riêng lẻ, không phân biệt loại trái phiếu và tổ chức phát hành","Chỉ trái phiếu chuyển đổi do công ty đại chúng phát hành, có kỳ hạn dưới 01 năm","Trái phiếu chưa có xếp hạng tín nhiệm nhưng có lãi suất cố định trong suốt kỳ hạn","Trái phiếu có xếp hạng tín nhiệm và có tài sản bảo đảm hoặc bảo lãnh thanh toán của tổ chức tín dụng"],"a":3,"e":"Khoản 1b Điều 11 (bổ sung bởi Luật 56/2024, áp dụng từ 01/01/2026): cá nhân là NĐT chuyên nghiệp chỉ được tham gia trái phiếu doanh nghiệp riêng lẻ có xếp hạng tín nhiệm và có tài sản bảo đảm, hoặc có xếp hạng tín nhiệm và có bảo lãnh thanh toán của tổ chức tín dụng.","basis":"Khoản 1b Điều 11 Luật Chứng khoán 2019 (bổ sung bởi Luật 56/2024/QH15)","quote":"","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"C1-071","part":"CM","subject":"MG","topic":"Xung đột lợi ích và giải quyết xung đột lợi ích trong hoạt động môi giới và tư vấn đầu tư chứng khoán","level":1,"q":"Theo Luật Chứng khoán, công ty chứng khoán vừa môi giới vừa tự doanh phải tuân thủ nguyên tắc nào khi thực hiện lệnh?","o":["Ưu tiên thực hiện lệnh của khách hàng trước lệnh của công ty","Ưu tiên lệnh tự doanh nếu lệnh đó có khối lượng lớn hơn","Thực hiện lệnh theo giá trị giao dịch từ lớn đến nhỏ","Thực hiện lệnh tự doanh trước để ổn định giá cho khách hàng"],"a":0,"e":"Khoản 5 Điều 89 Luật CK và khoản 4 Điều 22 TT 121/2020: công ty chứng khoán phải ưu tiên thực hiện lệnh của khách hàng trước lệnh của chính mình.","basis":"Khoản 5 Điều 89 Luật Chứng khoán 2019; khoản 4 Điều 22 Thông tư 121/2020/TT-BTC","quote":"","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"C1-072","part":"CM","subject":"MG","topic":"Xung đột lợi ích và giải quyết xung đột lợi ích trong hoạt động môi giới và tư vấn đầu tư chứng khoán","level":2,"q":"Khách hàng đặt lệnh giới hạn mua 10.000 cổ phiếu X giá 25.000 đồng tại công ty chứng khoán P. Trước khi lệnh của khách hàng được thực hiện, bộ phận tự doanh của P KHÔNG được thực hiện giao dịch nào sau đây?","o":["Bán cổ phiếu Y không liên quan đang nắm giữ trong tài khoản tự doanh","Mua cổ phiếu X cho tài khoản tự doanh ở mức giá 25.000 đồng hoặc thấp hơn","Mua trái phiếu Chính phủ theo kế hoạch đầu tư đã được phê duyệt","Hủy một lệnh bán cổ phiếu Y của tài khoản tự doanh đã đặt trước đó"],"a":1,"e":"Khoản 7 Điều 22 TT 121/2020: khi khách hàng đặt lệnh giới hạn, công ty chứng khoán không được mua hoặc bán cùng chiều cùng loại chứng khoán cho mình ở mức giá bằng hoặc tốt hơn giá của khách hàng trước khi lệnh của khách hàng được thực hiện. Với lệnh mua, giá tốt hơn là giá thấp hơn.","basis":"Khoản 7 Điều 22 Thông tư 121/2020/TT-BTC","quote":"","src":"VBHN_09_VBHN-BTC_2026_TT121_68_08_hop_nhat.txt","as_of":"2026-11"},{"id":"C1-073","part":"CM","subject":"MG","topic":"Xung đột lợi ích và giải quyết xung đột lợi ích trong hoạt động môi giới và tư vấn đầu tư chứng khoán","level":3,"q":"Người hành nghề được giao quản lý tài khoản ủy thác của một khách hàng cá nhân muốn mua cho tài khoản này cổ phiếu chào bán thêm của một công ty niêm yết mà chính công ty chứng khoán của mình đang thực hiện bảo lãnh phát hành (trong thời gian bảo lãnh). Cách xử lý đúng quy định là:","o":["Được mua ngay vì cổ phiếu niêm yết thuộc phạm vi ủy thác về loại chứng khoán","Chỉ cần báo cáo Ủy ban Chứng khoán Nhà nước sau khi giao dịch hoàn tất","Công ty phải thông báo và có sự đồng ý bằng văn bản của khách hàng trước khi đầu tư","Được mua nếu giá mua không cao hơn giá chào bán của đợt phát hành"],"a":2,"e":"Điểm l khoản 6 Điều 19 TT 121/2020: công ty chứng khoán phải thông báo và có sự đồng ý bằng văn bản của khách hàng đối với trường hợp đầu tư vào chứng khoán do công ty bảo lãnh phát hành trong thời gian đang bảo lãnh – biện pháp kiểm soát xung đột lợi ích.","basis":"Điểm l khoản 6 Điều 19 Thông tư 121/2020/TT-BTC","quote":"","src":"VBHN_09_VBHN-BTC_2026_TT121_68_08_hop_nhat.txt","as_of":"2026-11"},{"id":"C1-074","part":"CM","subject":"MG","topic":"Xung đột lợi ích và giải quyết xung đột lợi ích trong hoạt động môi giới và tư vấn đầu tư chứng khoán","level":2,"q":"Biện pháp “bức tường lửa” (Chinese wall) trong công ty chứng khoán chủ yếu nhằm mục đích:","o":["Bảo vệ hệ thống giao dịch trực tuyến của công ty khỏi các cuộc tấn công mạng từ bên ngoài","Tách bạch tiền gửi giao dịch của khách hàng với tiền của công ty tại ngân hàng thương mại","Giới hạn số lượng lệnh mà mỗi nhân viên môi giới được phép nhập vào hệ thống trong một ngày","Ngăn thông tin từ bộ phận bảo lãnh, tư vấn tài chính sang môi giới, tự doanh để hạn chế xung đột lợi ích"],"a":3,"e":"Chinese wall là cơ chế ngăn cách thông tin giữa các bộ phận có thể nắm thông tin nội bộ (bảo lãnh, tư vấn tài chính doanh nghiệp) với bộ phận kinh doanh (môi giới, tự doanh, phân tích), thuộc hệ thống kiểm soát nội bộ, giám sát, ngăn ngừa xung đột lợi ích theo khoản 1 Điều 89 Luật CK.","basis":"Khoản 1 Điều 89 Luật Chứng khoán 2019; biện pháp kiểm soát xung đột lợi ích","quote":"","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"C1-075","part":"CM","subject":"MG","topic":"Xung đột lợi ích và giải quyết xung đột lợi ích trong hoạt động môi giới và tư vấn đầu tư chứng khoán","level":2,"q":"Lúc 9:20, nhân viên môi giới nhận lệnh mua cổ phiếu X giá LO 30.000 đồng của khách hàng thường M; lúc 9:22 nhận lệnh mua X cùng giá của khách hàng VIP N. Nguồn cung X tại mức giá này đang khan hiếm. Cách xử lý phù hợp là:","o":["Nhập lệnh theo đúng thứ tự thời gian nhận: lệnh của M trước, lệnh của N sau","Nhập lệnh của N trước vì N đóng góp doanh thu phí lớn hơn cho công ty","Gộp hai lệnh thành một lệnh và ưu tiên phân bổ khối lượng khớp cho N","Tạm giữ lệnh của M cho đến khi lệnh của N được khớp hết khối lượng"],"a":0,"e":"Công ty phải ghi nhận thời gian nhận lệnh và thực hiện lệnh nhanh chóng, chính xác (khoản 4, 5 Điều 16 TT 121/2020); đối xử công bằng giữa các khách hàng là nguyên tắc cơ bản khi giải quyết xung đột lợi ích giữa khách hàng với nhau.","basis":"Khoản 4, 5 Điều 16 Thông tư 121/2020/TT-BTC; nguyên tắc đối xử công bằng với khách hàng","quote":"","src":"VBHN_09_VBHN-BTC_2026_TT121_68_08_hop_nhat.txt","as_of":"2026-11"},{"id":"C1-076","part":"CM","subject":"MG","topic":"Quản lý Nhà nước đối với hoạt động môi giới và tư vấn đầu tư chứng khoán","level":1,"q":"Theo Luật Chứng khoán, loại chứng chỉ nào sau đây KHÔNG thuộc các loại chứng chỉ hành nghề chứng khoán?","o":["Chứng chỉ hành nghề môi giới chứng khoán","Chứng chỉ hành nghề tư vấn đầu tư chứng khoán","Chứng chỉ hành nghề phân tích tài chính","Chứng chỉ hành nghề quản lý quỹ"],"a":1,"e":"Khoản 1 Điều 97: chứng chỉ hành nghề chứng khoán gồm chứng chỉ hành nghề môi giới chứng khoán, phân tích tài chính và quản lý quỹ.","basis":"Khoản 1 Điều 97 Luật Chứng khoán 2019","quote":"","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"C1-077","part":"CM","subject":"MG","topic":"Quản lý Nhà nước đối với hoạt động môi giới và tư vấn đầu tư chứng khoán","level":2,"q":"Bà C là người hành nghề môi giới tại công ty chứng khoán A (A có nghiệp vụ môi giới). Bà C muốn mở tài khoản giao dịch chứng khoán cho mình tại công ty chứng khoán B vì phí thấp hơn. Theo Luật Chứng khoán:","o":["Bà C được mở nếu báo cáo bằng văn bản cho công ty A trước khi mở","Bà C được mở nếu chỉ giao dịch cổ phiếu niêm yết trên HOSE","Bà C không được mở, vì công ty A nơi bà làm việc có nghiệp vụ môi giới","Bà C được mở nếu tổng giá trị tài khoản dưới 02 tỷ đồng"],"a":2,"e":"Điểm b khoản 2 Điều 98: người hành nghề chứng khoán không được mở, quản lý tài khoản giao dịch chứng khoán tại công ty chứng khoán nơi mình không làm việc, trừ trường hợp công ty nơi mình làm việc không có nghiệp vụ môi giới.","basis":"Điểm b khoản 2 Điều 98 Luật Chứng khoán 2019","quote":"","src":"VBHN_24_VBHN-VPQH_2025_Luat_Chung_khoan_hop_nhat_Cong_bao.txt","as_of":"2026-11"},{"id":"C1-078","part":"CM","subject":"MG","topic":"Quản lý Nhà nước đối với hoạt động môi giới và tư vấn đầu tư chứng khoán","level":2,"q":"Theo Nghị định 155/2020/NĐ-CP, để được cấp chứng chỉ hành nghề môi giới chứng khoán, ngoài các điều kiện chung, cá nhân phải có những chứng chỉ chuyên môn (hoặc tương đương) nào?","o":["Cơ bản về CK và TTCK; Pháp luật về CK và TTCK; Phân tích báo cáo tài chính; Môi giới và tư vấn đầu tư CK","Pháp luật về CK và TTCK; Phân tích và đầu tư CK; Môi giới và tư vấn đầu tư CK; Quản lý quỹ và tài sản","Cơ bản về CK và TTCK; Phân tích và đầu tư CK; Tư vấn tài chính và bảo lãnh; Môi giới và tư vấn đầu tư CK","Cơ bản về CK và TTCK; Pháp luật về CK và TTCK; Phân tích và đầu tư CK; Môi giới và tư vấn đầu tư CK"],"a":3,"e":"Điểm b khoản 1 Điều 213 NĐ 155/2020: cần các chứng chỉ Những vấn đề cơ bản về chứng khoán và TTCK, Pháp luật về chứng khoán và TTCK, Phân tích và đầu tư chứng khoán, Môi giới chứng khoán và tư vấn đầu tư chứng khoán hoặc chứng chỉ tương đương.","basis":"Điểm b khoản 1 Điều 213 Nghị định 155/2020/NĐ-CP","quote":"","src":"ND_155_2020_ND-CP_Cong_bao_so_45-56_2021.txt","as_of":"2026-11"},{"id":"C1-079","part":"CM","subject":"MG","topic":"Quản lý Nhà nước đối với hoạt động môi giới và tư vấn đầu tư chứng khoán","level":1,"q":"Theo Thông tư 135/2025/TT-BTC, từ ngày 01/01/2027, người hành nghề chứng khoán phải tham gia tập huấn kiến thức chuyên môn hằng năm với thời lượng tối thiểu là:","o":["08 giờ mỗi năm","04 giờ mỗi năm","16 giờ mỗi năm","24 giờ mỗi năm"],"a":0,"e":"TT 135/2025 (hiệu lực từ 09/02/2026, thay thế TT 197/2015) quy định tập huấn kiến thức cho người hành nghề tối thiểu 08 giờ mỗi năm; nội dung tập huấn tại Chương IV được triển khai từ ngày 01/01/2027.","basis":"Khoản 3 Điều 10, khoản 3 Điều 12 Thông tư 135/2025/TT-BTC","quote":"","src":"TT_135_2025_TT-BTC_English_SSC.txt","as_of":"2026-11"},{"id":"C1-080","part":"CM","subject":"MG","topic":"Quản lý Nhà nước đối với hoạt động môi giới và tư vấn đầu tư chứng khoán","level":2,"q":"Theo Thông tư 121/2020/TT-BTC, khi thực hiện nghiệp vụ môi giới, công ty chứng khoán KHÔNG bắt buộc phải bố trí người hành nghề chứng khoán tại vị trí nào sau đây?","o":["Tư vấn, giải thích hợp đồng và làm thủ tục mở tài khoản","Nhân viên công nghệ thông tin vận hành hệ thống máy chủ","Nhận lệnh, kiểm soát lệnh giao dịch của khách hàng","Trưởng các bộ phận liên quan đến nghiệp vụ môi giới"],"a":1,"e":"Khoản 1 Điều 13 TT 121/2020: phải bố trí người hành nghề tại các vị trí tư vấn, giải thích hợp đồng, mở tài khoản; tư vấn giao dịch; nhận lệnh, kiểm soát lệnh; trưởng các bộ phận liên quan đến nghiệp vụ môi giới. Vị trí vận hành công nghệ thông tin không thuộc danh sách này.","basis":"Khoản 1 Điều 13 Thông tư 121/2020/TT-BTC","quote":"","src":"VBHN_09_VBHN-BTC_2026_TT121_68_08_hop_nhat.txt","as_of":"2026-11"},{"id":"C2-001","part":"CM","subject":"PT","topic":"Tổng quan về phân tích và đầu tư","level":3,"q":"Một khoản vay kỳ hạn 1 năm, số tiền 500 triệu đồng, lãi suất danh nghĩa 10%/năm, tiền lãi được khấu trừ trả trước ngay khi giải ngân (người vay thực nhận 450 triệu đồng và cuối năm trả 500 triệu đồng). Lãi suất thực tế người vay phải chịu là bao nhiêu?","o":["10,00%","9,09%","11,11%","11,00%"],"a":2,"e":"Lãi trả trước = 500 × 10% = 50 triệu đồng; số tiền thực nhận = 500 − 50 = 450 triệu đồng. Lãi suất thực tế = 50/450 = 11,11%/năm (tức 10/90). Lỗi thường gặp: giữ nguyên 10% hoặc chia cho 550 (9,09%).","basis":"Lãi suất thực tế khi trả lãi trước: r = i/(1 − i) = 10/90","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-002","part":"CM","subject":"PT","topic":"Tổng quan về phân tích và đầu tư","level":2,"q":"Với cùng một mức lãi suất danh nghĩa năm, khi tần suất ghép lãi trong năm tăng lên (ví dụ từ ghép lãi năm sang ghép lãi tháng), lãi suất thực tế năm (EAR) thay đổi như thế nào?","o":["Giảm xuống, vì lãi suất áp dụng cho mỗi kỳ ghép lãi nhỏ hơn","Không đổi, vì lãi suất danh nghĩa năm vẫn giữ nguyên","Tăng hoặc giảm tùy theo số năm của khoản đầu tư","Tăng lên, vì tiền lãi được nhập vào gốc sớm hơn và tiếp tục sinh lãi"],"a":3,"e":"EAR = (1 + i/m)^m − 1 tăng khi số lần ghép lãi m tăng, vì lãi được nhập gốc sớm hơn (ví dụ 12%/năm: ghép năm 12,00%, ghép tháng 12,68%).","basis":"Lãi suất thực tế năm: EAR = (1 + i/m)^m − 1","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-003","part":"CM","subject":"PT","topic":"Tổng quan về phân tích và đầu tư","level":3,"q":"Nhà đầu tư sẽ nhận 20 triệu đồng vào cuối mỗi năm trong 5 năm liên tiếp. Với lãi suất chiết khấu 10%/năm (ghép lãi hằng năm), giá trị hiện tại của dòng tiền này là bao nhiêu?","o":["75,82 triệu đồng","100,00 triệu đồng","83,40 triệu đồng","62,09 triệu đồng"],"a":0,"e":"PV = 20 × [1 − 1,1^(−5)]/0,1 = 20 × 3,7908 = 75,82 triệu đồng. Lỗi thường gặp: không chiết khấu (100), coi là niên kim đầu kỳ (83,40), chiết khấu tổng 100 một lần (62,09).","basis":"Giá trị hiện tại của niên kim cuối kỳ: PV = A × [1 − (1 + r)^(−n)]/r","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-004","part":"CM","subject":"PT","topic":"Tổng quan về phân tích và đầu tư","level":1,"q":"Trong quy trình đầu tư, bước nào cần được thực hiện đầu tiên?","o":["Phân tích và lựa chọn các chứng khoán cụ thể đưa vào danh mục","Xác định mục tiêu và các ràng buộc của nhà đầu tư (chính sách đầu tư)","Phân bổ tài sản và xây dựng danh mục đầu tư theo kỳ vọng","Đánh giá kết quả đầu tư và tái cơ cấu danh mục định kỳ"],"a":1,"e":"Quy trình đầu tư bắt đầu bằng xây dựng chính sách đầu tư (mục tiêu sinh lời – rủi ro và các ràng buộc), sau đó mới phân tích, xây dựng danh mục, theo dõi và đánh giá.","basis":"Quy trình đầu tư: chính sách đầu tư → phân tích → xây dựng danh mục → đánh giá, điều chỉnh","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-005","part":"CM","subject":"PT","topic":"Tổng quan về phân tích và đầu tư","level":1,"q":"Yếu tố nào sau đây thuộc nhóm ràng buộc trong chính sách đầu tư, thay vì nhóm mục tiêu sinh lời – rủi ro?","o":["Mức sinh lời yêu cầu hằng năm của nhà đầu tư","Mức độ sẵn sàng chấp nhận rủi ro của nhà đầu tư","Nhu cầu thanh khoản và thời hạn đầu tư của nhà đầu tư","Khả năng chịu đựng rủi ro về mặt tài chính"],"a":2,"e":"Mục tiêu gồm sinh lời và rủi ro (mức sẵn sàng, khả năng chấp nhận rủi ro); ràng buộc gồm thanh khoản, thời hạn, thuế, pháp lý và các yếu tố đặc thù.","basis":"Chính sách đầu tư: mục tiêu (sinh lời, rủi ro) và ràng buộc (thanh khoản, thời hạn, thuế, pháp lý, đặc thù)","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-006","part":"CM","subject":"PT","topic":"Mức sinh lời và rủi ro","level":3,"q":"Nhà đầu tư mua cổ phiếu ABC giá 40.000 đồng/cp, trong thời gian nắm giữ nhận cổ tức tiền mặt 2.000 đồng/cp và bán ra với giá 46.000 đồng/cp. Bỏ qua thuế, phí. Mức sinh lời trong thời gian nắm giữ (HPR) là bao nhiêu?","o":["15,00%","17,39%","5,00%","20,00%"],"a":3,"e":"HPR = (P1 − P0 + D)/P0 = (46.000 − 40.000 + 2.000)/40.000 = 20,00%. Lỗi thường gặp: bỏ cổ tức (15%), chia cho giá bán (17,39%), chỉ tính cổ tức (5%).","basis":"HPR = (P1 − P0 + D)/P0","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-007","part":"CM","subject":"PT","topic":"Mức sinh lời và rủi ro","level":3,"q":"Dự báo mức sinh lời của cổ phiếu XYZ trong năm tới: kịch bản tăng trưởng (xác suất 30%) 25%; kịch bản bình thường (xác suất 50%) 10%; kịch bản suy thoái (xác suất 20%) −10%. Độ lệch chuẩn của mức sinh lời là bao nhiêu?","o":["12,13%","14,34%","8,70%","10,50%"],"a":0,"e":"E(R) = 0,3×25% + 0,5×10% + 0,2×(−10%) = 10,50%. σ² = 0,3×(14,5%)² + 0,5×(−0,5%)² + 0,2×(−20,5%)² = 0,014725; σ = 12,13%. Lỗi thường gặp: bỏ xác suất (14,34%), không bình phương độ lệch (8,70%), nhầm với lợi suất kỳ vọng.","basis":"σ = √Σ pᵢ[Rᵢ − E(R)]²","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-008","part":"CM","subject":"PT","topic":"Mức sinh lời và rủi ro","level":3,"q":"Danh mục gồm 60% cổ phiếu A (độ lệch chuẩn 20%) và 40% cổ phiếu B (độ lệch chuẩn 30%); hệ số tương quan giữa A và B là 0,2. Độ lệch chuẩn của danh mục là bao nhiêu?","o":["24,00%","18,59%","16,97%","3,46%"],"a":1,"e":"σp² = 0,6²×0,2² + 0,4²×0,3² + 2×0,6×0,4×0,2×0,2×0,3 = 0,0144 + 0,0144 + 0,00576 = 0,03456; σp = 18,59%. Thấp hơn bình quân gia quyền 24% vì ρ < 1. Lỗi thường gặp: bình quân gia quyền (24%), bỏ hiệp phương sai (16,97%), lấy phương sai làm độ lệch chuẩn (3,46%).","basis":"σp² = w₁²σ₁² + w₂²σ₂² + 2w₁w₂ρσ₁σ₂","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-009","part":"CM","subject":"PT","topic":"Mức sinh lời và rủi ro","level":2,"q":"Danh mục gồm hai cổ phiếu có rủi ro với tỷ trọng đều dương. Độ lệch chuẩn của danh mục nhỏ hơn bình quân gia quyền độ lệch chuẩn của hai cổ phiếu (có lợi ích đa dạng hóa) trong trường hợp nào?","o":["Chỉ khi hệ số tương quan giữa hai cổ phiếu là số âm","Chỉ khi hệ số tương quan giữa hai cổ phiếu bằng −1","Khi hệ số tương quan giữa hai cổ phiếu nhỏ hơn +1","Chỉ khi hai cổ phiếu có độ lệch chuẩn bằng nhau"],"a":2,"e":"σp = w₁σ₁ + w₂σ₂ chỉ khi ρ = +1; với mọi ρ < +1 thì σp nhỏ hơn bình quân gia quyền, nên đa dạng hóa có tác dụng (ρ càng thấp, tác dụng càng lớn; ρ = −1 có thể triệt tiêu rủi ro).","basis":"Đa dạng hóa danh mục: mọi ρ < +1 đều làm giảm rủi ro danh mục","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-010","part":"CM","subject":"PT","topic":"Mức sinh lời và rủi ro","level":2,"q":"Theo mô hình CAPM, lãi suất phi rủi ro (dương) và mức bù rủi ro thị trường không đổi. Nếu hệ số beta của một cổ phiếu tăng từ 0,8 lên 1,6 thì","o":["Mức bù rủi ro và lợi suất yêu cầu của cổ phiếu đều tăng đúng gấp đôi","Mức bù rủi ro thị trường tăng gấp đôi, lợi suất yêu cầu của cổ phiếu không đổi","Rủi ro phi hệ thống tăng gấp đôi, lợi suất yêu cầu tăng chưa tới gấp đôi","Mức bù rủi ro của cổ phiếu tăng gấp đôi, lợi suất yêu cầu tăng chưa tới gấp đôi"],"a":3,"e":"E(Ri) = Rf + β[E(Rm) − Rf]. Mức bù rủi ro của cổ phiếu β[E(Rm) − Rf] tỷ lệ thuận với β nên tăng gấp đôi; do có thành phần Rf > 0 không đổi nên lợi suất yêu cầu tăng ít hơn gấp đôi.","basis":"CAPM: E(Ri) = Rf + βi[E(Rm) − Rf]","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-011","part":"CM","subject":"PT","topic":"Mức sinh lời và rủi ro","level":3,"q":"Lãi suất phi rủi ro 4%, lợi suất kỳ vọng của danh mục thị trường 11%. Cổ phiếu DEF có beta 0,8; nhà phân tích dự báo lợi suất kỳ vọng của DEF là 13%. Theo CAPM, nhận định nào đúng?","o":["Lợi suất yêu cầu 9,6%; DEF nằm phía trên đường SML, đang bị định giá thấp","Lợi suất yêu cầu 9,6%; DEF nằm phía dưới đường SML, đang bị định giá cao","Lợi suất yêu cầu 12,8%; DEF được định giá xấp xỉ hợp lý theo SML","Lợi suất yêu cầu 14,4%; DEF nằm phía dưới đường SML, đang bị định giá cao"],"a":0,"e":"Lợi suất yêu cầu = 4% + 0,8×(11% − 4%) = 9,6%. Lợi suất kỳ vọng 13% > 9,6% (alpha = 3,4%) nên DEF nằm phía trên đường SML, bị định giá thấp – tín hiệu mua. Lỗi thường gặp: nhân beta với cả lợi suất thị trường (12,8%).","basis":"CAPM/SML: E(Ri) = Rf + βi[E(Rm) − Rf]; alpha > 0 ⇒ nằm phía trên đường SML","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-012","part":"CM","subject":"PT","topic":"Mức sinh lời và rủi ro","level":1,"q":"Loại rủi ro nào sau đây KHÔNG thể loại bỏ bằng cách đa dạng hóa danh mục đầu tư?","o":["Rủi ro do công ty bị mất một khách hàng lớn","Rủi ro do lãi suất và lạm phát của nền kinh tế thay đổi","Rủi ro do ban điều hành công ty thay đổi đột ngột","Rủi ro do một nhà máy của công ty bị hỏa hoạn"],"a":1,"e":"Rủi ro lãi suất, lạm phát là rủi ro hệ thống (rủi ro thị trường), tác động lên mọi chứng khoán nên không loại bỏ được bằng đa dạng hóa; các rủi ro riêng của từng công ty là rủi ro phi hệ thống.","basis":"Phân loại rủi ro: rủi ro hệ thống và rủi ro phi hệ thống","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-013","part":"CM","subject":"PT","topic":"Mức sinh lời và rủi ro","level":3,"q":"Hiệp phương sai giữa lợi suất cổ phiếu GHI và lợi suất danh mục thị trường là 0,018; độ lệch chuẩn lợi suất của danh mục thị trường là 12%. Hệ số beta của cổ phiếu GHI là bao nhiêu?","o":["0,15","0,80","1,25","1,50"],"a":2,"e":"β = Cov(Ri, Rm)/σm² = 0,018/0,12² = 0,018/0,0144 = 1,25. Lỗi thường gặp: chia cho σm thay vì σm² (0,15) hoặc đảo ngược tỷ số (0,80).","basis":"β = Cov(Ri, Rm)/σm²","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-014","part":"CM","subject":"PT","topic":"Mức sinh lời và rủi ro","level":1,"q":"Chỉ số Sharpe đo lường điều gì?","o":["Mức sinh lời vượt lãi suất phi rủi ro trên mỗi đơn vị rủi ro hệ thống (beta)","Chênh lệch giữa lợi suất thực tế và lợi suất yêu cầu theo mô hình CAPM","Mức độ chênh lệch lợi suất của danh mục so với chỉ số tham chiếu","Mức sinh lời vượt lãi suất phi rủi ro trên mỗi đơn vị tổng rủi ro (độ lệch chuẩn)"],"a":3,"e":"Sharpe = (Rp − Rf)/σp. Chia cho beta là chỉ số Treynor; chênh lệch so với CAPM là alpha Jensen; chênh lệch so với chỉ số tham chiếu là tracking error.","basis":"Chỉ số Sharpe = (Rp − Rf)/σp","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-015","part":"CM","subject":"PT","topic":"Thị trường hiệu quả và tài chính hành vi","level":1,"q":"Theo giả thuyết thị trường hiệu quả dạng yếu, giá chứng khoán đã phản ánh đầy đủ","o":["Toàn bộ thông tin về giá và khối lượng giao dịch trong quá khứ","Toàn bộ thông tin đã công bố công khai, kể cả báo cáo tài chính","Toàn bộ thông tin công khai và cả thông tin nội bộ chưa công bố","Chỉ các thông tin kinh tế vĩ mô do cơ quan nhà nước công bố"],"a":0,"e":"Dạng yếu: giá phản ánh thông tin giá, khối lượng quá khứ (nên phân tích kỹ thuật không tạo lợi suất vượt trội). Dạng trung bình: thêm mọi thông tin công khai. Dạng mạnh: mọi thông tin kể cả nội bộ.","basis":"Giả thuyết thị trường hiệu quả (EMH) – dạng yếu","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-016","part":"CM","subject":"PT","topic":"Thị trường hiệu quả và tài chính hành vi","level":2,"q":"Nếu thị trường hiệu quả ở dạng trung bình (bán mạnh) nhưng chưa đạt dạng mạnh, nhà đầu tư nào có khả năng đạt lợi suất vượt trội (sau điều chỉnh rủi ro) một cách nhất quán?","o":["Người phân tích kỹ lưỡng các báo cáo tài chính đã công bố","Người giao dịch dựa trên thông tin nội bộ chưa được công bố","Người giao dịch theo các mô hình đồ thị giá và khối lượng","Người mua ngay sau khi công ty công bố tăng mức cổ tức"],"a":1,"e":"Ở dạng trung bình, mọi thông tin công khai (BCTC, công bố cổ tức, dữ liệu giá) đã phản ánh vào giá; chỉ thông tin nội bộ chưa công bố mới có thể tạo lợi suất vượt trội vì thị trường chưa đạt dạng mạnh.","basis":"Giả thuyết thị trường hiệu quả (EMH) – dạng trung bình và dạng mạnh","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-017","part":"CM","subject":"PT","topic":"Thị trường hiệu quả và tài chính hành vi","level":1,"q":"Dạng hiệu quả nào của thị trường cho rằng giá chứng khoán phản ánh mọi thông tin, bao gồm cả thông tin nội bộ?","o":["Dạng trung bình (bán mạnh)","Dạng yếu","Dạng mạnh","Dạng hiệu quả về phân bổ vốn"],"a":2,"e":"Dạng mạnh: giá phản ánh mọi thông tin (quá khứ, công khai và nội bộ), nên không ai đạt lợi suất vượt trội một cách nhất quán.","basis":"Giả thuyết thị trường hiệu quả (EMH) – dạng mạnh","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-018","part":"CM","subject":"PT","topic":"Thị trường hiệu quả và tài chính hành vi","level":2,"q":"Nhà đầu tư thường bán sớm cổ phiếu đang có lãi để “chốt lời” nhưng lại tiếp tục nắm giữ cổ phiếu đang thua lỗ với hy vọng giá sẽ hồi phục. Theo tài chính hành vi, đây là biểu hiện của","o":["Hiệu ứng mỏ neo (anchoring)","Tâm lý bầy đàn (herding)","Thiên lệch quá tự tin (overconfidence)","Hiệu ứng bán lời, giữ lỗ (disposition effect)"],"a":3,"e":"Disposition effect xuất phát từ tâm lý né tránh thua lỗ: nhà đầu tư ngại hiện thực hóa khoản lỗ nên giữ cổ phiếu lỗ quá lâu và bán cổ phiếu lãi quá sớm.","basis":"Tài chính hành vi: né tránh thua lỗ, hiệu ứng bán lời giữ lỗ","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-019","part":"CM","subject":"PT","topic":"Thị trường hiệu quả và tài chính hành vi","level":2,"q":"Một chuyên viên phân tích đưa ra dự báo EPS ban đầu là 5.000 đồng; khi có thông tin mới bất lợi, anh ta chỉ điều chỉnh dự báo rất ít so với con số ban đầu. Đây là biểu hiện của thiên lệch hành vi nào?","o":["Hiệu ứng mỏ neo (anchoring)","Tâm lý bầy đàn (herding)","Hiệu ứng bán lời, giữ lỗ (disposition effect)","Thiên lệch kế toán tâm lý (mental accounting)"],"a":0,"e":"Hiệu ứng mỏ neo: bám vào một con số ban đầu (điểm neo) và điều chỉnh không đủ khi có thông tin mới.","basis":"Tài chính hành vi: hiệu ứng mỏ neo","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-020","part":"CM","subject":"PT","topic":"Phân tích kinh tế trong đầu tư chứng khoán","level":2,"q":"Khi mặt bằng lãi suất thị trường tăng mạnh và các yếu tố khác không đổi, tác động nào sau đây là hợp lý nhất đối với thị trường cổ phiếu?","o":["Hệ số P/E hợp lý của thị trường có xu hướng tăng lên","Tỷ suất chiết khấu yêu cầu tăng làm giá trị nội tại của cổ phiếu giảm","Chi phí vốn của doanh nghiệp giảm, lợi nhuận kỳ vọng tăng","Dòng tiền có xu hướng chuyển từ tiền gửi sang cổ phiếu"],"a":1,"e":"Lãi suất tăng làm tăng lãi suất phi rủi ro và tỷ suất chiết khấu, tăng chi phí vốn, làm giảm giá trị hiện tại của dòng tiền tương lai và P/E hợp lý; kênh tiền gửi hấp dẫn hơn.","basis":"Tác động của lãi suất đến định giá: P0 = Σ CFt/(1 + r)^t","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-021","part":"CM","subject":"PT","topic":"Phân tích kinh tế trong đầu tư chứng khoán","level":3,"q":"Lãi suất danh nghĩa của trái phiếu Chính phủ kỳ hạn 1 năm là 9%/năm, tỷ lệ lạm phát dự kiến 4%/năm. Theo phương trình Fisher dạng chính xác, lãi suất thực là bao nhiêu?","o":["5,00%","13,36%","4,81%","4,59%"],"a":2,"e":"(1 + i) = (1 + r)(1 + π) ⇒ r = 1,09/1,04 − 1 = 4,81%. 5,00% là kết quả xấp xỉ i − π; 13,36% là nhân thay vì chia.","basis":"Phương trình Fisher: (1 + i) = (1 + r)(1 + π)","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-022","part":"CM","subject":"PT","topic":"Phân tích kinh tế trong đầu tư chứng khoán","level":1,"q":"Chỉ báo nào sau đây thường được xếp vào nhóm chỉ báo dẫn dắt (chỉ báo sớm) của chu kỳ kinh tế?","o":["Thời gian thất nghiệp bình quân","Chỉ số sản xuất công nghiệp","Lãi suất cho vay bình quân của ngân hàng","Chỉ số giá cổ phiếu (như VN-Index)"],"a":3,"e":"Chỉ số giá cổ phiếu thường biến động trước chu kỳ kinh tế (chỉ báo dẫn dắt); sản xuất công nghiệp là chỉ báo trùng hợp; thời gian thất nghiệp bình quân, lãi suất cho vay bình quân là chỉ báo trễ.","basis":"Phân tích vĩ mô: chỉ báo dẫn dắt, trùng hợp, trễ","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-023","part":"CM","subject":"PT","topic":"Phân tích kinh tế trong đầu tư chứng khoán","level":2,"q":"Khi nền kinh tế bước vào giai đoạn suy thoái, nhóm ngành nào thường có lợi nhuận ít biến động nhất (ngành phòng thủ)?","o":["Hàng tiêu dùng thiết yếu và dược phẩm","Bất động sản và vật liệu xây dựng","Ô tô và hàng tiêu dùng lâu bền","Chứng khoán và dịch vụ tài chính"],"a":0,"e":"Nhu cầu hàng thiết yếu, thuốc (tương tự điện, nước) ít co giãn theo thu nhập nên lợi nhuận ổn định (ngành phòng thủ); các ngành còn lại là ngành chu kỳ.","basis":"Phân tích ngành: ngành chu kỳ và ngành phòng thủ","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-024","part":"CM","subject":"PT","topic":"Phân tích kinh tế trong đầu tư chứng khoán","level":2,"q":"Một ngành có doanh thu tăng trưởng nhanh, lợi nhuận tăng mạnh, nhu cầu vốn đầu tư mở rộng lớn nên doanh nghiệp thường trả cổ tức tiền mặt thấp. Ngành này đang ở giai đoạn nào của vòng đời?","o":["Giai đoạn khởi sự (hình thành)","Giai đoạn tăng trưởng","Giai đoạn bão hòa (chín muồi)","Giai đoạn suy thoái"],"a":1,"e":"Giai đoạn tăng trưởng: doanh thu và lợi nhuận tăng nhanh, cần nhiều vốn tái đầu tư nên chi trả cổ tức thấp. Khởi sự thường chưa có lãi; bão hòa tăng trưởng chậm, cổ tức cao; suy thoái doanh thu giảm.","basis":"Phân tích ngành: vòng đời ngành","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-025","part":"CM","subject":"PT","topic":"Phân tích kinh tế trong đầu tư chứng khoán","level":1,"q":"Yếu tố nào sau đây KHÔNG thuộc mô hình năm áp lực cạnh tranh của Michael Porter?","o":["Mối đe dọa từ các sản phẩm thay thế","Quyền thương lượng của nhà cung cấp","Chính sách tiền tệ của ngân hàng trung ương","Nguy cơ gia nhập ngành của đối thủ tiềm năng"],"a":2,"e":"Năm áp lực: cạnh tranh nội bộ ngành, đe dọa gia nhập, sản phẩm thay thế, quyền thương lượng của người mua và của nhà cung cấp. Chính sách tiền tệ là yếu tố vĩ mô.","basis":"Mô hình năm áp lực cạnh tranh của Porter","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-026","part":"CM","subject":"PT","topic":"Phân tích kinh tế trong đầu tư chứng khoán","level":2,"q":"Khi VND mất giá so với USD và các yếu tố khác không đổi, nhóm doanh nghiệp nào hưởng lợi trực tiếp nhất?","o":["Doanh nghiệp nhập khẩu phần lớn nguyên vật liệu đầu vào","Doanh nghiệp có dư nợ vay USD lớn, doanh thu bằng VND","Doanh nghiệp phân phối hàng nhập khẩu tại thị trường nội địa","Doanh nghiệp xuất khẩu có doanh thu bằng USD, chi phí chủ yếu bằng VND"],"a":3,"e":"VND mất giá làm doanh thu USD quy đổi tăng trong khi chi phí VND không đổi; các doanh nghiệp nhập khẩu hoặc vay nợ USD bị tăng chi phí, tăng nghĩa vụ nợ quy đổi.","basis":"Phân tích vĩ mô: tác động của tỷ giá","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-027","part":"CM","subject":"PT","topic":"Phân tích và định giá cổ phiếu","level":3,"q":"Công ty vừa trả cổ tức D0 = 2.000 đồng/cp. Cổ tức được kỳ vọng tăng trưởng đều 6%/năm mãi mãi; tỷ suất sinh lời yêu cầu của nhà đầu tư là 14%/năm. Giá trị nội tại của cổ phiếu theo mô hình Gordon là","o":["26.500 đồng","25.000 đồng","15.143 đồng","10.600 đồng"],"a":0,"e":"D1 = 2.000 × 1,06 = 2.120 đồng; P0 = D1/(r − g) = 2.120/(14% − 6%) = 26.500 đồng. Lỗi thường gặp: dùng D0 (25.000), bỏ g ở mẫu số (15.143), cộng g vào mẫu số (10.600).","basis":"Mô hình Gordon: P0 = D1/(r − g)","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-028","part":"CM","subject":"PT","topic":"Phân tích và định giá cổ phiếu","level":3,"q":"Công ty vừa trả cổ tức D0 = 1.000 đồng/cp. Cổ tức dự kiến tăng 20%/năm trong 2 năm tới, sau đó tăng đều 5%/năm mãi mãi. Tỷ suất sinh lời yêu cầu là 12%/năm. Giá trị nội tại hiện tại của cổ phiếu (làm tròn đến đồng) là","o":["18.619 đồng","19.439 đồng","21.505 đồng","15.000 đồng"],"a":1,"e":"D1 = 1.200; D2 = 1.440; D3 = 1.440 × 1,05 = 1.512. P2 = D3/(12% − 5%) = 21.600. P0 = 1.200/1,12 + (1.440 + 21.600)/1,12² = 1.071,43 + 18.367,35 = 19.439 đồng. Lỗi thường gặp: tính P2 bằng D2 thay vì D3 (18.619), chiết khấu P2 một kỳ (21.505), dùng Gordon một giai đoạn (15.000).","basis":"Mô hình chiết khấu cổ tức hai giai đoạn: P0 = Σ Dt/(1 + r)^t + Pn/(1 + r)^n, Pn = Dn+1/(r − g)","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-029","part":"CM","subject":"PT","topic":"Phân tích và định giá cổ phiếu","level":2,"q":"Cổ phiếu A có P/E cao hơn đáng kể so với P/E bình quân của các doanh nghiệp cùng ngành. Nếu thị trường định giá hợp lý, điều này phù hợp nhất với giả thiết nào?","o":["Tỷ suất sinh lời yêu cầu đối với A cao hơn mức bình quân của ngành","Tỷ lệ chi trả cổ tức và tốc độ tăng trưởng của A đều thấp hơn ngành","Kỳ vọng tăng trưởng lợi nhuận của A cao hơn hoặc rủi ro của A thấp hơn","A có EPS cao hơn ngành nên giá cổ phiếu và P/E cũng cao hơn ngành"],"a":2,"e":"P/E hợp lý = tỷ lệ chi trả/(r − g): P/E cao tương ứng g cao hơn và/hoặc r thấp hơn (rủi ro thấp hơn). EPS cao bản thân nó không làm P/E cao.","basis":"P/E hợp lý = (D1/E1)/(r − g)","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-030","part":"CM","subject":"PT","topic":"Phân tích và định giá cổ phiếu","level":3,"q":"Công ty có ROE ổn định 15%, tỷ lệ chi trả cổ tức 40%, tỷ suất sinh lời yêu cầu 12%. Giả định công ty tăng trưởng ổn định mãi mãi với g = ROE × tỷ lệ lợi nhuận giữ lại. Hệ số P/E kỳ vọng hợp lý (P0/E1) là","o":["14,53 lần","20,00 lần","6,67 lần","13,33 lần"],"a":3,"e":"g = 15% × (1 − 40%) = 9%; P0/E1 = tỷ lệ chi trả/(r − g) = 0,4/(12% − 9%) = 13,33 lần. Lỗi thường gặp: tính P/E hiện hành P0/E0 = 0,4×1,09/0,03 (14,53), dùng tỷ lệ giữ lại ở tử số (20,00), tính g = ROE × tỷ lệ chi trả (6,67).","basis":"P/E kỳ vọng hợp lý: P0/E1 = (1 − b)/(r − g), g = ROE × b","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-031","part":"CM","subject":"PT","topic":"Phân tích và định giá cổ phiếu","level":2,"q":"Phương pháp định giá dựa trên hệ số P/B thường được ưu tiên áp dụng cho nhóm doanh nghiệp nào?","o":["Ngân hàng, công ty chứng khoán có tài sản chủ yếu là tài sản tài chính","Doanh nghiệp công nghệ có nhiều tài sản vô hình chưa được ghi nhận","Doanh nghiệp dịch vụ có rất ít tài sản hữu hình trên sổ sách","Doanh nghiệp khởi nghiệp đang có vốn chủ sở hữu âm kéo dài"],"a":0,"e":"Giá trị sổ sách của tổ chức tài chính phản ánh khá sát giá trị thị trường của tài sản tài chính, nên P/B phù hợp; với doanh nghiệp có nhiều tài sản vô hình không ghi nhận hoặc vốn chủ âm, P/B kém ý nghĩa.","basis":"Định giá theo P/B = giá thị trường/giá trị sổ sách mỗi cổ phần","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-032","part":"CM","subject":"PT","topic":"Phân tích và định giá cổ phiếu","level":3,"q":"Công ty XYZ có EBITDA dự phóng 500 tỷ đồng; hệ số EV/EBITDA bình quân của các doanh nghiệp so sánh là 8 lần. XYZ có tổng nợ vay 1.200 tỷ đồng, tiền và tương đương tiền 200 tỷ đồng, 100 triệu cổ phiếu đang lưu hành, không có cổ phần ưu đãi và lợi ích cổ đông không kiểm soát. Giá trị hợp lý mỗi cổ phiếu là","o":["28.000 đồng","30.000 đồng","26.000 đồng","40.000 đồng"],"a":1,"e":"EV = 8 × 500 = 4.000 tỷ; giá trị vốn chủ = EV − nợ vay + tiền = 4.000 − 1.200 + 200 = 3.000 tỷ; mỗi cổ phiếu = 3.000 tỷ/100 triệu = 30.000 đồng. Lỗi thường gặp: không cộng tiền (28.000), trừ cả tiền (26.000), coi EV là giá trị vốn chủ (40.000).","basis":"EV/EBITDA: giá trị vốn chủ = EV − nợ vay + tiền và tương đương tiền","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-033","part":"CM","subject":"PT","topic":"Phân tích và định giá cổ phiếu","level":3,"q":"Năm tới, công ty dự kiến (tỷ đồng): lợi nhuận sau thuế 200; khấu hao 50; chi đầu tư TSCĐ 120; vốn lưu động (không kể tiền) tăng 30; vay nợ mới 70 và trả nợ gốc 30. Dòng tiền tự do vốn chủ sở hữu (FCFE) là","o":["100 tỷ đồng","170 tỷ đồng","140 tỷ đồng","200 tỷ đồng"],"a":2,"e":"FCFE = LNST + khấu hao − chi đầu tư TSCĐ − tăng vốn lưu động + vay ròng = 200 + 50 − 120 − 30 + (70 − 30) = 140 tỷ đồng. Lỗi thường gặp: bỏ vay ròng (100), cộng vay mới gộp (170), cộng thay vì trừ tăng vốn lưu động (200).","basis":"FCFE = LNST + khấu hao − CAPEX − ΔVLĐ + vay ròng","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-034","part":"CM","subject":"PT","topic":"Phân tích và định giá cổ phiếu","level":3,"q":"Năm tới, công ty dự kiến (tỷ đồng): EBIT 300; thuế suất thuế TNDN 20%; khấu hao 60; chi đầu tư TSCĐ 100; vốn lưu động (không kể tiền) tăng 20. Dòng tiền tự do doanh nghiệp (FCFF) là","o":["240 tỷ đồng","120 tỷ đồng","220 tỷ đồng","180 tỷ đồng"],"a":3,"e":"FCFF = EBIT(1 − t) + khấu hao − CAPEX − ΔVLĐ = 300 × 0,8 + 60 − 100 − 20 = 180 tỷ đồng. Lỗi thường gặp: không trừ thuế (240), bỏ khấu hao (120), cộng ΔVLĐ (220).","basis":"FCFF = EBIT(1 − t) + khấu hao − CAPEX − ΔVLĐ","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-035","part":"CM","subject":"PT","topic":"Phân tích và định giá cổ phiếu","level":2,"q":"Trong trường hợp nào định giá bằng mô hình chiết khấu FCFF thường phù hợp hơn mô hình FCFE?","o":["Doanh nghiệp có đòn bẩy cao hoặc cơ cấu vốn dự kiến thay đổi đáng kể","Doanh nghiệp trả cổ tức ổn định, tương xứng với khả năng tạo tiền","Doanh nghiệp có cơ cấu vốn ổn định và FCFE dự báo được tin cậy","Ngân hàng thương mại có hoạt động chính là huy động và cho vay"],"a":0,"e":"Khi nợ vay lớn hoặc cơ cấu vốn biến động, FCFE khó dự báo (phụ thuộc vay ròng) nên dùng FCFF chiết khấu bằng WACC rồi trừ nợ. Cổ tức ổn định phù hợp DDM; ngân hàng thường dùng P/B hoặc thu nhập thặng dư.","basis":"Lựa chọn mô hình FCFF (chiết khấu bằng WACC) và FCFE (chiết khấu bằng chi phí vốn chủ)","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-036","part":"CM","subject":"PT","topic":"Phân tích và định giá cổ phiếu","level":1,"q":"Mô hình tăng trưởng cổ tức không đổi (Gordon) chỉ cho kết quả có ý nghĩa khi","o":["Tốc độ tăng trưởng cổ tức lớn hơn tỷ suất sinh lời yêu cầu của nhà đầu tư","Tỷ suất sinh lời yêu cầu lớn hơn tốc độ tăng trưởng cổ tức và g không đổi mãi mãi","Doanh nghiệp không chi trả cổ tức trong một số năm đầu của kỳ dự báo","Tốc độ tăng trưởng cổ tức thay đổi mạnh qua từng giai đoạn phát triển"],"a":1,"e":"P0 = D1/(r − g) chỉ xác định khi r > g và g ổn định vĩnh viễn; nếu g thay đổi qua các giai đoạn cần dùng mô hình nhiều giai đoạn.","basis":"Mô hình Gordon: P0 = D1/(r − g), điều kiện r > g","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-037","part":"CM","subject":"PT","topic":"Phân tích và định giá cổ phiếu","level":3,"q":"Cơ cấu vốn mục tiêu của công ty: 60% vốn chủ sở hữu, 40% nợ vay. Chi phí vốn chủ sở hữu 15%, lãi suất vay trước thuế 10%, thuế suất thuế TNDN 20%. Chi phí vốn bình quân gia quyền (WACC) là","o":["13,0%","10,8%","12,2%","11,5%"],"a":2,"e":"WACC = 60% × 15% + 40% × 10% × (1 − 20%) = 9% + 3,2% = 12,2%. Lỗi thường gặp: bỏ lá chắn thuế (13,0%), đảo tỷ trọng (10,8%), lấy bình quân giản đơn (11,5%).","basis":"WACC = wE × rE + wD × rD × (1 − t)","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-038","part":"CM","subject":"PT","topic":"Phân tích và định giá trái phiếu","level":3,"q":"Trái phiếu mệnh giá 100.000 đồng, lãi suất coupon 8%/năm, trả lãi mỗi năm một lần, còn đúng 3 năm đến hạn (vừa trả coupon). Nếu lợi suất đáo hạn yêu cầu là 10%/năm, giá trái phiếu (làm tròn đến đồng) là","o":["105.154 đồng","94.924 đồng","99.131 đồng","95.026 đồng"],"a":3,"e":"P = 8.000/1,1 + 8.000/1,1² + 108.000/1,1³ = 7.272,73 + 6.611,57 + 81.142,00 = 95.026 đồng. Lỗi thường gặp: đảo coupon và lợi suất (105.154), tính như trả lãi nửa năm (94.924), không chiết khấu coupon (99.131).","basis":"Giá trái phiếu: P = Σ C/(1 + y)^t + F/(1 + y)^n","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-039","part":"CM","subject":"PT","topic":"Phân tích và định giá trái phiếu","level":3,"q":"Trái phiếu mệnh giá 100.000 đồng, lãi suất coupon 6%/năm trả hằng năm, còn đúng 2 năm đến hạn (vừa trả coupon), đang giao dịch ở giá 96.433 đồng. Lợi suất đáo hạn (YTM) của trái phiếu xấp xỉ bằng","o":["8,00%","6,00%","6,22%","9,92%"],"a":0,"e":"YTM là y thỏa mãn 96.433 = 6.000/(1 + y) + 106.000/(1 + y)². Thử y = 8%: 5.555,56 + 90.877,89 = 96.433 ⇒ YTM ≈ 8,00%. 6,00% là lãi suất coupon; 6,22% là lợi suất hiện hành; 9,92% là gộp toàn bộ chênh lệch giá vào một năm.","basis":"Lợi suất đáo hạn: P = Σ C/(1 + YTM)^t + F/(1 + YTM)^n","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-040","part":"CM","subject":"PT","topic":"Phân tích và định giá trái phiếu","level":3,"q":"Trái phiếu mệnh giá 100.000 đồng, lãi suất coupon 9%/năm (trả hằng năm), đang giao dịch ở giá 95.000 đồng. Lợi suất hiện hành của trái phiếu là","o":["9,00%","9,47%","8,55%","14,74%"],"a":1,"e":"Lợi suất hiện hành = coupon năm/giá thị trường = 9.000/95.000 = 9,47%. 9,00% là lãi suất coupon; 14,74% là cộng cả chênh lệch giá 5.000 vào tử số.","basis":"Lợi suất hiện hành = coupon hằng năm/giá thị trường","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-041","part":"CM","subject":"PT","topic":"Phân tích và định giá trái phiếu","level":3,"q":"Trái phiếu mệnh giá 100.000 đồng, kỳ hạn còn lại 3 năm, coupon 10%/năm trả hằng năm, lợi suất đáo hạn 10%/năm. Thời gian đáo hạn bình quân Macaulay (Macaulay duration) của trái phiếu là","o":["3,00 năm","2,49 năm","2,74 năm","2,00 năm"],"a":2,"e":"PV dòng tiền: 9.090,91; 8.264,46; 82.644,63 (tổng 100.000). D = (1×9.090,91 + 2×8.264,46 + 3×82.644,63)/100.000 = 2,7355 ≈ 2,74 năm. 3,00 là kỳ hạn; 2,49 là duration điều chỉnh D/(1 + y).","basis":"Duration Macaulay: D = Σ t × PV(CFt)/P","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-042","part":"CM","subject":"PT","topic":"Phân tích và định giá trái phiếu","level":3,"q":"Trái phiếu có duration điều chỉnh (modified duration) 6,5 và độ lồi (convexity) 60, theo quy ước %ΔP ≈ −MD × Δy + ½ × C × (Δy)². Nếu lợi suất đáo hạn tăng 100 điểm cơ bản, giá trái phiếu thay đổi xấp xỉ","o":["−6,80%","−6,50%","−5,90%","−6,20%"],"a":3,"e":"%ΔP ≈ −6,5 × 0,01 + ½ × 60 × 0,01² = −6,50% + 0,30% = −6,20%. Độ lồi luôn cộng thêm (với độ lồi dương) bất kể lãi suất tăng hay giảm. Lỗi thường gặp: trừ phần độ lồi (−6,80%), bỏ độ lồi (−6,50%), quên hệ số ½ (−5,90%).","basis":"%ΔP ≈ −MD × Δy + ½ × Convexity × (Δy)²","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-043","part":"CM","subject":"PT","topic":"Phân tích và định giá trái phiếu","level":2,"q":"Đối với trái phiếu thông thường (không có quyền chọn), các yếu tố khác không đổi, thay đổi nào sau đây làm duration của trái phiếu tăng lên?","o":["Lãi suất coupon của trái phiếu thấp hơn","Lợi suất đáo hạn của trái phiếu cao hơn","Thời gian còn lại đến khi đáo hạn ngắn hơn","Gốc được trả dần hằng năm thay vì trả một lần"],"a":0,"e":"Coupon thấp làm tỷ trọng giá trị dòng tiền cuối kỳ lớn hơn nên duration dài hơn. Lợi suất cao hơn, kỳ hạn ngắn hơn hoặc trả gốc dần đều làm duration ngắn lại.","basis":"Các nhân tố ảnh hưởng đến duration: coupon, kỳ hạn, lợi suất đáo hạn","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-044","part":"CM","subject":"PT","topic":"Phân tích và định giá trái phiếu","level":1,"q":"Một trái phiếu được giao dịch dưới mệnh giá (trái phiếu chiết khấu) khi","o":["Lãi suất coupon cao hơn lợi suất đáo hạn yêu cầu của thị trường","Lãi suất coupon thấp hơn lợi suất đáo hạn yêu cầu của thị trường","Lãi suất coupon bằng lợi suất đáo hạn yêu cầu của thị trường","Lợi suất hiện hành của trái phiếu thấp hơn lãi suất coupon"],"a":1,"e":"Coupon < YTM ⇒ P < mệnh giá; coupon > YTM ⇒ P > mệnh giá; bằng nhau ⇒ P = mệnh giá. Với trái phiếu chiết khấu, lợi suất hiện hành lớn hơn lãi suất coupon.","basis":"Quan hệ giữa giá trái phiếu, lãi suất coupon và lợi suất đáo hạn","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-045","part":"CM","subject":"PT","topic":"Phân tích kỹ thuật","level":2,"q":"Trên đồ thị giá ngày, đường trung bình động ngắn hạn MA20 cắt đường trung bình động dài hạn MA50 từ dưới lên trên. Theo phân tích kỹ thuật truyền thống, đây là","o":["Tín hiệu bán (giao cắt tử thần – death cross)","Tín hiệu cổ phiếu rơi vào vùng quá mua","Tín hiệu mua (giao cắt vàng – golden cross)","Tín hiệu xác nhận xu hướng giảm trung hạn"],"a":2,"e":"MA ngắn hạn cắt MA dài hạn từ dưới lên cho thấy giá gần đây tăng nhanh hơn mặt bằng dài hạn – tín hiệu mua (golden cross). Cắt từ trên xuống là tín hiệu bán (death cross).","basis":"Đường trung bình động: giao cắt MA ngắn hạn và dài hạn","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-046","part":"CM","subject":"PT","topic":"Phân tích kỹ thuật","level":1,"q":"Theo cách diễn giải thông thường, chỉ báo RSI(14) vượt lên trên mức 70 cho thấy","o":["Cổ phiếu ở vùng quá bán, có khả năng hồi phục tăng","Khối lượng giao dịch đang tăng đột biến bất thường","Giá đã phá vỡ ngưỡng hỗ trợ dài hạn của cổ phiếu","Cổ phiếu ở vùng quá mua, có khả năng điều chỉnh giảm"],"a":3,"e":"RSI > 70: vùng quá mua; RSI < 30: vùng quá bán. RSI đo động lượng giá, không đo khối lượng.","basis":"Chỉ báo RSI: ngưỡng 70 (quá mua) và 30 (quá bán)","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-047","part":"CM","subject":"PT","topic":"Phân tích kỹ thuật","level":3,"q":"Trong 14 phiên gần nhất, mức tăng giá bình quân là 1.500 đồng và mức giảm giá bình quân là 500 đồng (cả hai tính bình quân trên 14 phiên). Giá trị RSI(14) và cách diễn giải phù hợp là","o":["RSI = 75; cổ phiếu ở vùng quá mua","RSI = 25; cổ phiếu ở vùng quá bán","RSI = 66,67; cổ phiếu ở vùng trung tính","RSI = 75; cổ phiếu ở vùng quá bán"],"a":0,"e":"RS = 1.500/500 = 3; RSI = 100 − 100/(1 + RS) = 100 − 25 = 75 > 70 ⇒ vùng quá mua. Lỗi thường gặp: đảo tỷ số RS (25), dùng 100 − 100/RS (66,67).","basis":"RSI = 100 − 100/(1 + RS), RS = mức tăng bình quân/mức giảm bình quân","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-048","part":"CM","subject":"PT","topic":"Phân tích kỹ thuật","level":3,"q":"Phiên hôm qua, đường MACD của cổ phiếu nằm phía trên đường tín hiệu. Phiên hôm nay: EMA12 = 25,4; EMA26 = 24,6 (nghìn đồng); đường tín hiệu (EMA9 của MACD) = 0,95. Giá trị MACD hôm nay và tín hiệu tương ứng là","o":["MACD = 0,80; cắt đường tín hiệu từ dưới lên – tín hiệu mua","MACD = 0,80; cắt đường tín hiệu từ trên xuống – tín hiệu bán","MACD = −0,80; nằm phía dưới đường 0 – tín hiệu bán","MACD = 0,15; nằm phía trên đường 0 – tín hiệu mua"],"a":1,"e":"MACD = EMA12 − EMA26 = 25,4 − 24,6 = 0,80. Hôm qua MACD nằm phía trên đường tín hiệu, hôm nay 0,80 < 0,95 ⇒ MACD cắt đường tín hiệu từ trên xuống – tín hiệu bán.","basis":"MACD = EMA12 − EMA26; đường tín hiệu = EMA9 của MACD","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-049","part":"CM","subject":"PT","topic":"Phân tích kỹ thuật","level":2,"q":"Giá cổ phiếu vượt dứt khoát ngưỡng kháng cự 30.000 đồng với khối lượng giao dịch lớn. Theo phân tích kỹ thuật truyền thống, ngưỡng 30.000 đồng sau đó thường","o":["Trở thành ngưỡng kháng cự mạnh hơn so với trước","Báo hiệu xu hướng tăng của cổ phiếu đã kết thúc","Đóng vai trò ngưỡng hỗ trợ mới khi giá điều chỉnh","Không còn ý nghĩa kỹ thuật nào đối với cổ phiếu"],"a":2,"e":"Khi kháng cự bị phá vỡ dứt khoát (có khối lượng xác nhận), vùng giá này thường đảo vai trò thành hỗ trợ (nguyên lý đổi vai hỗ trợ – kháng cự).","basis":"Ngưỡng hỗ trợ và kháng cự: nguyên lý đổi vai","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-050","part":"CM","subject":"PT","topic":"Phân tích kỹ thuật","level":1,"q":"Giả định nào sau đây là nền tảng của phân tích kỹ thuật?","o":["Giá cổ phiếu luôn hội tụ về giá trị nội tại xác định từ báo cáo tài chính","Biến động giá là hoàn toàn ngẫu nhiên nên không thể dự báo được","Giá cổ phiếu chỉ phụ thuộc vào lợi nhuận và cổ tức dự kiến","Giá phản ánh mọi yếu tố, vận động theo xu hướng và lịch sử có xu hướng lặp lại"],"a":3,"e":"Ba giả định của phân tích kỹ thuật (lý thuyết Dow): thị trường phản ánh tất cả, giá vận động theo xu hướng, lịch sử lặp lại. Các phương án khác là quan điểm của phân tích cơ bản hoặc bước ngẫu nhiên.","basis":"Giả định cơ bản của phân tích kỹ thuật","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-051","part":"CM","subject":"BC","topic":"Tổng quan về phân tích báo cáo tài chính doanh nghiệp","level":1,"q":"Phương pháp so sánh số liệu của cùng một chỉ tiêu tài chính qua nhiều kỳ (cả số tuyệt đối và tỷ lệ thay đổi) để đánh giá xu hướng biến động được gọi là","o":["Phân tích theo chiều ngang (phân tích xu hướng)","Phân tích theo chiều dọc (quy mô chung)","Phân tích Dupont","Phân tích độ nhạy"],"a":0,"e":"Phân tích ngang so sánh một chỉ tiêu giữa các kỳ; phân tích dọc biểu diễn khoản mục theo tỷ lệ % so với một chỉ tiêu gốc trong cùng kỳ.","basis":"Phương pháp so sánh theo chiều ngang trong phân tích BCTC","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-052","part":"CM","subject":"BC","topic":"Tổng quan về phân tích báo cáo tài chính doanh nghiệp","level":3,"q":"Báo cáo kết quả hoạt động kinh doanh năm N của công ty (tỷ đồng): doanh thu thuần 800; giá vốn hàng bán 560; doanh thu hoạt động tài chính 12; chi phí tài chính 32; chi phí bán hàng 48; chi phí quản lý doanh nghiệp 40. Trên báo cáo dạng quy mô chung (% doanh thu thuần), tỷ lệ lợi nhuận thuần từ hoạt động kinh doanh là","o":["19,00%","16,50%","15,00%","30,00%"],"a":1,"e":"LN thuần từ HĐKD = 800 − 560 + 12 − 32 − 48 − 40 = 132; tỷ lệ = 132/800 = 16,50%. Lỗi thường gặp: bỏ hoạt động tài chính (19,00%), bỏ doanh thu tài chính (15,00%), nhầm với biên lợi nhuận gộp (30,00%).","basis":"Phân tích quy mô chung: khoản mục/doanh thu thuần","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-053","part":"CM","subject":"BC","topic":"Tổng quan về phân tích báo cáo tài chính doanh nghiệp","level":2,"q":"Một ngân hàng đang thẩm định khoản vay bổ sung vốn lưu động kỳ hạn 6 tháng cho doanh nghiệp. Nhóm chỉ tiêu nào ngân hàng cần quan tâm trước tiên?","o":["Các chỉ tiêu giá thị trường như P/E, P/B của cổ phiếu","Tốc độ tăng trưởng doanh thu dài hạn trong 5–10 năm tới","Khả năng thanh toán ngắn hạn và dòng tiền từ hoạt động kinh doanh","Cơ cấu cổ đông và tỷ lệ sở hữu của nhà đầu tư nước ngoài"],"a":2,"e":"Chủ nợ ngắn hạn quan tâm khả năng trả nợ trong ngắn hạn: hệ số thanh toán, chất lượng tài sản ngắn hạn và dòng tiền HĐKD.","basis":"Đối tượng sử dụng BCTC và mục tiêu phân tích","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-054","part":"CM","subject":"BC","topic":"Tổng quan về phân tích báo cáo tài chính doanh nghiệp","level":1,"q":"Khi phân tích báo cáo tình hình tài chính (bảng cân đối kế toán) theo chiều dọc, mỗi khoản mục thường được biểu diễn dưới dạng tỷ lệ % so với","o":["Doanh thu thuần trong kỳ","Vốn chủ sở hữu cuối kỳ","Chính khoản mục đó ở kỳ gốc","Tổng tài sản (tổng nguồn vốn)"],"a":3,"e":"Phân tích dọc bảng cân đối lấy tổng tài sản (= tổng nguồn vốn) làm gốc 100%; với báo cáo KQKD gốc là doanh thu thuần; so với kỳ gốc là phân tích ngang.","basis":"Phân tích theo chiều dọc (quy mô chung)","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-055","part":"CM","subject":"BC","topic":"Hệ thống báo cáo tài chính doanh nghiệp","level":1,"q":"Theo VAS 24 – Báo cáo lưu chuyển tiền tệ, các luồng tiền trong kỳ được phân loại theo những hoạt động nào?","o":["Hoạt động kinh doanh, hoạt động đầu tư và hoạt động tài chính","Hoạt động sản xuất, hoạt động thương mại và hoạt động dịch vụ","Hoạt động kinh doanh, hoạt động tài chính và hoạt động khác","Hoạt động thường xuyên, hoạt động đầu tư và hoạt động bất thường"],"a":0,"e":"VAS 24 phân loại luồng tiền thành: hoạt động kinh doanh, hoạt động đầu tư, hoạt động tài chính.","basis":"VAS 24 – Báo cáo lưu chuyển tiền tệ","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-056","part":"CM","subject":"BC","topic":"Hệ thống báo cáo tài chính doanh nghiệp","level":2,"q":"Theo VAS 24, giao dịch nào sau đây được phân loại vào luồng tiền từ hoạt động tài chính?","o":["Tiền chi góp vốn đầu tư vào doanh nghiệp khác","Tiền chi trả nợ gốc vay ngân hàng","Tiền chi mua sắm máy móc, thiết bị sản xuất","Tiền chi trả người cung cấp hàng hóa, dịch vụ"],"a":1,"e":"Trả nợ gốc vay thuộc hoạt động tài chính (thay đổi quy mô, kết cấu vốn chủ và vốn vay). Góp vốn đầu tư vào đơn vị khác, mua TSCĐ thuộc hoạt động đầu tư; trả người bán thuộc hoạt động kinh doanh.","basis":"VAS 24 – phân loại luồng tiền hoạt động tài chính","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-057","part":"CM","subject":"BC","topic":"Hệ thống báo cáo tài chính doanh nghiệp","level":3,"q":"Năm N, công ty có (tỷ đồng): lợi nhuận sau thuế 150; khấu hao TSCĐ 40; phải thu khách hàng tăng 30; hàng tồn kho tăng 25; phải trả người bán tăng 20. Giả định không có khoản điều chỉnh nào khác (thuế TNDN phải nộp đã nộp đủ trong kỳ). Lưu chuyển tiền thuần từ hoạt động kinh doanh theo phương pháp gián tiếp là","o":["225 tỷ đồng","115 tỷ đồng","155 tỷ đồng","190 tỷ đồng"],"a":2,"e":"CFO = 150 + 40 − 30 (tăng phải thu) − 25 (tăng tồn kho) + 20 (tăng phải trả) = 155 tỷ đồng. Lỗi thường gặp: đảo dấu biến động vốn lưu động (225), bỏ khấu hao (115), bỏ biến động vốn lưu động (190).","basis":"Phương pháp gián tiếp: CFO = LN + khấu hao − tăng TS ngắn hạn + tăng nợ phải trả ngắn hạn","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-058","part":"CM","subject":"BC","topic":"Hệ thống báo cáo tài chính doanh nghiệp","level":2,"q":"Khoản dự phòng giảm giá hàng tồn kho được trình bày trên báo cáo tình hình tài chính (bảng cân đối kế toán) như thế nào?","o":["Trình bày là một khoản nợ phải trả ngắn hạn","Trình bày là một khoản mục thuộc vốn chủ sở hữu","Trình bày là một khoản tài sản ngắn hạn khác","Ghi số âm, làm giảm khoản mục hàng tồn kho"],"a":3,"e":"Dự phòng giảm giá hàng tồn kho là khoản điều chỉnh giảm giá trị tài sản, trình bày dưới dạng số âm ngay trong khoản mục hàng tồn kho để phản ánh giá trị thuần có thể thực hiện được.","basis":"VAS 02 – Hàng tồn kho: giá trị thuần có thể thực hiện được và dự phòng","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-059","part":"CM","subject":"BC","topic":"Hệ thống báo cáo tài chính doanh nghiệp","level":2,"q":"Ngày 01/01/N, công ty nhận trước 360 triệu đồng tiền cho thuê văn phòng trong 3 năm (01/01/N – 31/12/N+2); hợp đồng cho phép bên thuê hủy ngang và nhận lại tiền thuê của thời gian chưa sử dụng. Theo nguyên tắc cơ sở dồn tích, trên BCTC năm N công ty","o":["Ghi nhận doanh thu 120 triệu; 240 triệu còn lại là doanh thu chưa thực hiện","Ghi nhận doanh thu 360 triệu vì toàn bộ tiền thuê đã được thu trong năm N","Ghi nhận doanh thu 120 triệu; 240 triệu còn lại ghi tăng vốn chủ sở hữu","Ghi nhận doanh thu 120 triệu; 240 triệu còn lại ghi giảm phải thu khách hàng"],"a":0,"e":"Doanh thu được ghi nhận theo kỳ cung cấp dịch vụ: 360/3 = 120 triệu cho năm N; 240 triệu nhận trước cho 2 năm sau là doanh thu chưa thực hiện, một khoản nợ phải trả. Do bên thuê được hủy ngang và nhận lại tiền, không đủ điều kiện ghi nhận một lần toàn bộ số tiền nhận trước.","basis":"VAS 01 – Chuẩn mực chung: nguyên tắc cơ sở dồn tích và phù hợp","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-060","part":"CM","subject":"BC","topic":"Hệ thống báo cáo tài chính doanh nghiệp","level":1,"q":"Trên báo cáo kết quả hoạt động kinh doanh, chỉ tiêu “Lợi nhuận gộp về bán hàng và cung cấp dịch vụ” được xác định bằng","o":["Doanh thu thuần trừ giá vốn, chi phí bán hàng và chi phí quản lý","Doanh thu thuần về bán hàng và cung cấp dịch vụ trừ giá vốn hàng bán","Doanh thu chưa trừ các khoản giảm trừ, trừ giá vốn hàng bán","Doanh thu thuần trừ giá vốn hàng bán và chi phí tài chính"],"a":1,"e":"Lợi nhuận gộp = doanh thu thuần về bán hàng và cung cấp dịch vụ − giá vốn hàng bán.","basis":"Cấu trúc báo cáo kết quả hoạt động kinh doanh","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-061","part":"CM","subject":"BC","topic":"Phân tích các chỉ tiêu tài chính","level":3,"q":"Tại 31/12/N, công ty có (tỷ đồng): tiền và tương đương tiền 80; đầu tư tài chính ngắn hạn 40; phải thu ngắn hạn 180; hàng tồn kho 260; tài sản ngắn hạn khác 40; nợ ngắn hạn 400. Hệ số khả năng thanh toán nhanh (không tính hàng tồn kho và tài sản ngắn hạn khác) là","o":["1,50 lần","0,85 lần","0,75 lần","0,30 lần"],"a":2,"e":"Thanh toán nhanh = (tiền 80 + đầu tư ngắn hạn 40 + phải thu 180)/nợ ngắn hạn 400 = 0,75 lần. 1,50 là thanh toán hiện hành; 0,85 là chỉ trừ hàng tồn kho; 0,30 là thanh toán tức thời.","basis":"Hệ số thanh toán nhanh = (tiền + đầu tư TC ngắn hạn + phải thu ngắn hạn)/nợ ngắn hạn","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-062","part":"CM","subject":"BC","topic":"Phân tích các chỉ tiêu tài chính","level":3,"q":"Năm N: giá vốn hàng bán 1.460 tỷ đồng; hàng tồn kho đầu năm 180 tỷ, cuối năm 220 tỷ; doanh thu thuần 2.000 tỷ. Tính theo hàng tồn kho bình quân, giá vốn hàng bán và năm 365 ngày, số ngày tồn kho bình quân là","o":["55,0 ngày","36,5 ngày","45,0 ngày","50,0 ngày"],"a":3,"e":"HTK bình quân = (180 + 220)/2 = 200; vòng quay = 1.460/200 = 7,3 vòng; số ngày tồn kho = 365/7,3 = 50,0 ngày. Lỗi thường gặp: dùng HTK cuối kỳ (55,0), dùng doanh thu (36,5), dùng HTK đầu kỳ (45,0).","basis":"Số ngày tồn kho = 365/(giá vốn hàng bán/HTK bình quân)","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-063","part":"CM","subject":"BC","topic":"Phân tích các chỉ tiêu tài chính","level":1,"q":"Chu kỳ chuyển đổi tiền mặt (cash conversion cycle) của doanh nghiệp được xác định bằng","o":["Số ngày tồn kho + kỳ thu tiền bình quân − kỳ trả tiền bình quân","Số ngày tồn kho + kỳ thu tiền bình quân + kỳ trả tiền bình quân","Kỳ thu tiền bình quân − số ngày tồn kho − kỳ trả tiền bình quân","Số ngày tồn kho + kỳ trả tiền bình quân − kỳ thu tiền bình quân"],"a":0,"e":"CCC = DIO + DSO − DPO: thời gian từ khi chi tiền mua hàng đến khi thu tiền bán hàng.","basis":"Chu kỳ chuyển đổi tiền mặt = DIO + DSO − DPO","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-064","part":"CM","subject":"BC","topic":"Phân tích các chỉ tiêu tài chính","level":3,"q":"Năm N, công ty có ROE 18%, tỷ suất lợi nhuận ròng trên doanh thu 6% và vòng quay tổng tài sản 1,2 lần (các chỉ tiêu tính trên số bình quân). Theo mô hình Dupont, tỷ lệ nợ phải trả trên tổng tài sản bình quân là","o":["40,0%","60,0%","150,0%","250,0%"],"a":1,"e":"Hệ số nhân vốn chủ = ROE/(ROS × vòng quay TS) = 18%/(6% × 1,2) = 2,5; VCSH/TTS = 1/2,5 = 40% ⇒ nợ/TTS = 60,0%. Lỗi thường gặp: lấy VCSH/TTS (40%), nợ/VCSH (150%), hoặc chính hệ số nhân (250%).","basis":"Dupont: ROE = ROS × vòng quay tổng tài sản × hệ số nhân vốn chủ","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-065","part":"CM","subject":"BC","topic":"Phân tích các chỉ tiêu tài chính","level":3,"q":"Công ty có: LNST/LNTT = 0,80; LNTT/EBIT = 0,75; EBIT/doanh thu thuần = 15%; vòng quay tổng tài sản 1,2 lần; tổng tài sản bình quân/vốn chủ sở hữu bình quân = 2,0. ROE theo mô hình Dupont mở rộng (5 nhân tố) là","o":["28,8%","27,0%","21,6%","10,8%"],"a":2,"e":"ROE = 0,80 × 0,75 × 15% × 1,2 × 2,0 = 21,6%. Lỗi thường gặp: bỏ gánh nặng lãi vay (28,8%), bỏ gánh nặng thuế (27,0%), bỏ hệ số nhân vốn chủ (10,8% – đó là ROA).","basis":"Dupont 5 nhân tố: ROE = (LNST/LNTT) × (LNTT/EBIT) × (EBIT/DT) × (DT/TTS) × (TTS/VCSH)","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-066","part":"CM","subject":"BC","topic":"Phân tích các chỉ tiêu tài chính","level":3,"q":"Năm N, công ty có lợi nhuận trước thuế 180 tỷ đồng, chi phí lãi vay 60 tỷ đồng, khấu hao 60 tỷ đồng, thuế suất thuế TNDN 20%. Hệ số khả năng thanh toán lãi vay (EBIT/chi phí lãi vay) là","o":["3,0 lần","5,0 lần","2,4 lần","4,0 lần"],"a":3,"e":"EBIT = LNTT + lãi vay = 180 + 60 = 240; hệ số = 240/60 = 4,0 lần. Lỗi thường gặp: dùng LNTT (3,0), dùng EBITDA (5,0), dùng LNST (2,4).","basis":"Khả năng thanh toán lãi vay = EBIT/chi phí lãi vay","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-067","part":"CM","subject":"BC","topic":"Phân tích các chỉ tiêu tài chính","level":2,"q":"Doanh nghiệp có tỷ suất sinh lời trên tổng tài sản (trước lãi vay) cao hơn lãi suất vay. Khi doanh nghiệp tăng tỷ trọng nợ vay trong cơ cấu vốn, các yếu tố khác không đổi, thì","o":["ROE có xu hướng tăng nhưng rủi ro tài chính của doanh nghiệp cũng tăng","ROE có xu hướng giảm vì chi phí lãi vay của doanh nghiệp tăng lên","ROE có xu hướng tăng và rủi ro tài chính của doanh nghiệp giảm đi","ROE không thay đổi vì tỷ suất sinh lời trên tổng tài sản không đổi"],"a":0,"e":"Khi khả năng sinh lời của tài sản lớn hơn chi phí nợ, đòn bẩy tài chính khuếch đại ROE (đòn bẩy dương), nhưng nghĩa vụ trả lãi cố định tăng làm rủi ro tài chính tăng.","basis":"Đòn bẩy tài chính và tác động đến ROE","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-068","part":"CM","subject":"BC","topic":"Phân tích các chỉ tiêu tài chính","level":1,"q":"Hệ số khả năng thanh toán tức thời (thanh toán bằng tiền) được tính bằng","o":["(Tài sản ngắn hạn − hàng tồn kho)/nợ ngắn hạn","Tiền và các khoản tương đương tiền/nợ ngắn hạn","Tài sản ngắn hạn/nợ ngắn hạn","Tiền và các khoản tương đương tiền/tổng nợ phải trả"],"a":1,"e":"Thanh toán tức thời = (tiền + tương đương tiền)/nợ ngắn hạn; (TSNH − HTK)/nợ ngắn hạn là thanh toán nhanh; TSNH/nợ ngắn hạn là thanh toán hiện hành.","basis":"Nhóm chỉ tiêu khả năng thanh toán","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-069","part":"CM","subject":"BC","topic":"Phân tích các chỉ tiêu tài chính","level":2,"q":"Trong 2 năm, doanh thu của doanh nghiệp đi ngang nhưng số ngày tồn kho bình quân tăng từ 45 ngày lên 90 ngày. Dấu hiệu này phù hợp nhất với nhận định nào?","o":["Hiệu quả quản lý hàng tồn kho của doanh nghiệp được cải thiện rõ rệt","Khả năng thanh toán nhanh của doanh nghiệp chắc chắn được cải thiện","Hàng tồn kho có thể bị ứ đọng, làm tăng nhu cầu vốn lưu động và rủi ro giảm giá","Chu kỳ chuyển đổi tiền mặt của doanh nghiệp đang được rút ngắn lại"],"a":2,"e":"Số ngày tồn kho tăng gấp đôi khi doanh thu không đổi nghĩa là vòng quay HTK giảm một nửa: vốn bị chôn trong HTK, chu kỳ tiền mặt dài ra, rủi ro lỗi thời, giảm giá tăng.","basis":"Nhóm chỉ tiêu hiệu quả hoạt động: vòng quay hàng tồn kho","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-070","part":"CM","subject":"BC","topic":"Phân tích các chỉ tiêu tài chính","level":3,"q":"Tại 31/12/N, vốn chủ sở hữu của công ty là 1.200 tỷ đồng; công ty đã phát hành 65 triệu cổ phiếu phổ thông, trong đó có 5 triệu cổ phiếu quỹ; không có cổ phiếu ưu đãi. Giá thị trường là 30.000 đồng/cp. Hệ số P/B là","o":["1,63 lần","0,67 lần","1,75 lần","1,50 lần"],"a":3,"e":"Cổ phiếu lưu hành = 65 − 5 = 60 triệu; giá trị sổ sách/cp = 1.200 tỷ/60 triệu = 20.000 đồng; P/B = 30.000/20.000 = 1,50 lần. Lỗi thường gặp: tính cả cổ phiếu quỹ (1,625 ≈ 1,63), đảo tỷ số (0,67), cộng thêm cổ phiếu quỹ (1,75).","basis":"P/B = giá thị trường/giá trị sổ sách mỗi cổ phiếu đang lưu hành","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-071","part":"CM","subject":"BC","topic":"Phân tích các chỉ tiêu tài chính","level":1,"q":"Chỉ tiêu nào sau đây thuộc nhóm chỉ tiêu cơ cấu vốn (đòn bẩy tài chính)?","o":["Hệ số nợ phải trả trên vốn chủ sở hữu","Vòng quay khoản phải thu khách hàng","Tỷ suất lợi nhuận gộp trên doanh thu","Hệ số khả năng thanh toán nhanh"],"a":0,"e":"Nhóm cơ cấu vốn gồm nợ/VCSH, nợ/tổng tài sản, hệ số nhân vốn chủ…; các chỉ tiêu còn lại thuộc nhóm hiệu quả hoạt động, sinh lời và thanh toán.","basis":"Nhóm chỉ tiêu cơ cấu vốn và đòn bẩy tài chính","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-072","part":"CM","subject":"BC","topic":"Phân tích các chỉ tiêu tài chính","level":2,"q":"Hai công ty S và T cùng có ROE 20%. Phân tích Dupont: S có tỷ suất lợi nhuận ròng 10%, vòng quay tổng tài sản 1,0 lần, hệ số nhân vốn chủ 2,0; T có tỷ suất lợi nhuận ròng 4%, vòng quay tổng tài sản 1,25 lần, hệ số nhân vốn chủ 4,0. Nhận định nào đúng?","o":["S sử dụng tài sản hiệu quả hơn T vì vòng quay tổng tài sản cao hơn","ROE của T dựa nhiều hơn vào đòn bẩy nên rủi ro tài chính của T cao hơn S","Rủi ro tài chính của S và T như nhau vì hai công ty có cùng ROE","T có tỷ suất sinh lời trên tổng tài sản (ROA) cao hơn công ty S"],"a":1,"e":"ROA S = 10% × 1,0 = 10%; ROA T = 4% × 1,25 = 5%. T đạt cùng ROE 20% nhờ hệ số nhân vốn chủ 4,0 (nợ/TTS 75%) so với 2,0 của S (50%) nên rủi ro tài chính cao hơn; vòng quay TS của T (1,25) cao hơn S.","basis":"Dupont: ROE = ROS × vòng quay tổng tài sản × hệ số nhân vốn chủ","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-073","part":"CM","subject":"BC","topic":"Phân tích các chỉ tiêu tài chính","level":2,"q":"Vòng quay tổng tài sản của doanh nghiệp giảm từ 1,5 lần xuống 1,1 lần trong khi doanh thu thuần không đổi. Điều này cho thấy","o":["Tổng tài sản bình quân giảm, hiệu quả sử dụng tài sản để tạo doanh thu tăng","Tỷ suất lợi nhuận ròng trên doanh thu của doanh nghiệp chắc chắn giảm","Tổng tài sản bình quân tăng, hiệu quả sử dụng tài sản để tạo doanh thu giảm","Khả năng thanh toán ngắn hạn của doanh nghiệp chắc chắn được cải thiện"],"a":2,"e":"Vòng quay TS = doanh thu/TTS bình quân; doanh thu không đổi mà vòng quay giảm ⇒ TTS bình quân tăng (khoảng 36%), mỗi đồng tài sản tạo ra ít doanh thu hơn.","basis":"Vòng quay tổng tài sản = doanh thu thuần/tổng tài sản bình quân","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-074","part":"CM","subject":"BC","topic":"Phân tích các chỉ tiêu tài chính","level":3,"q":"Công ty có tài sản ngắn hạn 400 tỷ đồng và nợ ngắn hạn 200 tỷ đồng. Công ty dùng 50 tỷ đồng tiền mặt để trả nợ người bán. Sau giao dịch, hệ số khả năng thanh toán hiện hành","o":["Giảm xuống 1,75 lần","Không đổi ở mức 2,00 lần","Tăng lên 2,67 lần","Tăng lên 2,33 lần"],"a":3,"e":"Trước: 400/200 = 2,00. Sau: (400 − 50)/(200 − 50) = 350/150 = 2,33 lần. Khi hệ số > 1, giảm cùng một lượng ở tử và mẫu làm hệ số tăng. Lỗi thường gặp: chỉ giảm tử (1,75) hoặc chỉ giảm mẫu (2,67).","basis":"Hệ số thanh toán hiện hành = TSNH/nợ ngắn hạn","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-075","part":"CM","subject":"BC","topic":"Dự báo báo cáo tài chính doanh nghiệp","level":3,"q":"Doanh thu năm N là 1.000 tỷ đồng, dự báo tăng 20% trong năm N+1. Tỷ suất lợi nhuận ròng trên doanh thu dự kiến 10%, tỷ lệ chi trả cổ tức 40%. Lợi nhuận giữ lại bổ sung vốn chủ sở hữu năm N+1 là","o":["72 tỷ đồng","48 tỷ đồng","60 tỷ đồng","120 tỷ đồng"],"a":0,"e":"Doanh thu N+1 = 1.000 × 1,2 = 1.200; LNST = 1.200 × 10% = 120; LN giữ lại = 120 × (1 − 40%) = 72 tỷ đồng. Lỗi thường gặp: nhân với tỷ lệ chi trả (48), dùng doanh thu năm N (60), lấy toàn bộ LNST (120).","basis":"Dự báo: LN giữ lại = DT dự báo × biên LN ròng × (1 − tỷ lệ chi trả cổ tức)","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-076","part":"CM","subject":"BC","topic":"Dự báo báo cáo tài chính doanh nghiệp","level":3,"q":"Doanh thu năm N là 1.000 tỷ đồng, dự báo năm N+1 là 1.200 tỷ đồng. Doanh nghiệp hoạt động hết công suất; tài sản tăng theo doanh thu với tỷ lệ tài sản/doanh thu 0,8; nợ phải trả phát sinh tự động (phải trả người bán, chi phí phải trả) bằng 20% doanh thu. Tỷ suất lợi nhuận ròng 10%, tỷ lệ chi trả cổ tức 40%. Nhu cầu vốn bổ sung từ bên ngoài (AFN) năm N+1 là","o":["120 tỷ đồng","48 tỷ đồng","88 tỷ đồng","60 tỷ đồng"],"a":1,"e":"Tài sản tăng = 0,8 × 200 = 160; nợ tự phát tăng = 0,2 × 200 = 40; LN giữ lại = 1.200 × 10% × 60% = 72. AFN = 160 − 40 − 72 = 48 tỷ đồng. Lỗi thường gặp: bỏ LN giữ lại (120), bỏ nợ tự phát (88), tính LN giữ lại theo doanh thu năm N (60).","basis":"Phương pháp tỷ lệ % trên doanh thu: AFN = ΔTS − ΔNợ tự phát − LN giữ lại","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-077","part":"CM","subject":"BC","topic":"Dự báo báo cáo tài chính doanh nghiệp","level":2,"q":"Khi dự báo BCTC theo phương pháp tỷ lệ phần trăm trên doanh thu, khoản mục nào thường KHÔNG được giả định biến động tự động theo doanh thu mà phụ thuộc quyết định tài trợ?","o":["Phải trả người bán","Hàng tồn kho","Vay ngân hàng","Phải thu khách hàng"],"a":2,"e":"Phải thu, tồn kho, phải trả người bán biến động gần tỷ lệ với doanh thu; vay ngân hàng, phát hành cổ phiếu là nguồn tài trợ chủ động, dùng để cân đối nhu cầu vốn bổ sung.","basis":"Phương pháp tỷ lệ % trên doanh thu: khoản mục biến đổi và nguồn tài trợ chủ động","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-078","part":"CM","subject":"BC","topic":"Dự báo báo cáo tài chính doanh nghiệp","level":1,"q":"Trong quy trình dự báo báo cáo tài chính doanh nghiệp, chỉ tiêu nào thường được dự báo đầu tiên và làm cơ sở cho các khoản mục khác?","o":["Lợi nhuận sau thuế","Tổng tài sản","Cổ tức chi trả","Doanh thu thuần"],"a":3,"e":"Dự báo doanh thu là bước đầu tiên; chi phí, tài sản, nợ và lợi nhuận được dự báo dựa trên doanh thu.","basis":"Quy trình dự báo BCTC: bắt đầu từ dự báo doanh thu","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-079","part":"CM","subject":"BC","topic":"Dự báo báo cáo tài chính doanh nghiệp","level":3,"q":"Năm N+1, công ty dự báo: doanh thu thuần 2.400 tỷ đồng; tỷ suất lợi nhuận gộp 25%; chi phí bán hàng và quản lý doanh nghiệp bằng 12% doanh thu; chi phí lãi vay 60 tỷ đồng; không có doanh thu, chi phí khác; thuế suất thuế TNDN 20%. Lợi nhuận sau thuế dự báo là","o":["201,6 tỷ đồng","249,6 tỷ đồng","252,0 tỷ đồng","189,6 tỷ đồng"],"a":0,"e":"LN gộp = 2.400 × 25% = 600; chi phí BH và QLDN = 288; EBIT = 312; LNTT = 312 − 60 = 252; LNST = 252 × 0,8 = 201,6 tỷ đồng. Lỗi thường gặp: bỏ lãi vay (249,6), quên thuế (252,0), trừ lãi vay sau thuế (189,6).","basis":"Dự báo báo cáo KQKD theo tỷ lệ % doanh thu","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-080","part":"CM","subject":"BC","topic":"Chất lượng báo cáo tài chính doanh nghiệp","level":2,"q":"Dấu hiệu nào sau đây cho thấy chất lượng lợi nhuận của doanh nghiệp có thể thấp?","o":["Lưu chuyển tiền thuần HĐKD ổn định và xấp xỉ lợi nhuận sau thuế","Lợi nhuận tăng đều nhiều năm nhưng lưu chuyển tiền thuần HĐKD liên tục âm","Doanh thu và phải thu khách hàng tăng cùng tốc độ trong nhiều năm","Lợi nhuận chủ yếu đến từ hoạt động kinh doanh cốt lõi, có tính lặp lại"],"a":1,"e":"Lợi nhuận không chuyển hóa thành tiền (CFO âm kéo dài) cho thấy lợi nhuận dựa nhiều vào các khoản dồn tích như phải thu, tồn kho – dấu hiệu có thể ghi nhận doanh thu sớm hoặc chất lượng lợi nhuận thấp.","basis":"Chất lượng lợi nhuận: so sánh lợi nhuận với lưu chuyển tiền thuần HĐKD","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-081","part":"CM","subject":"BC","topic":"Chất lượng báo cáo tài chính doanh nghiệp","level":3,"q":"Năm N, công ty có lợi nhuận sau thuế 200 tỷ đồng, lưu chuyển tiền thuần từ hoạt động kinh doanh 80 tỷ đồng, tổng tài sản bình quân 1.000 tỷ đồng. Tỷ lệ dồn tích tính theo công thức (LNST − lưu chuyển tiền thuần HĐKD)/tổng tài sản bình quân là","o":["8,0%","20,0%","12,0%","28,0%"],"a":2,"e":"Tỷ lệ dồn tích = (200 − 80)/1.000 = 12,0%. CFO/LNST chỉ 0,4 – phần lớn lợi nhuận là dồn tích, cảnh báo chất lượng lợi nhuận thấp. Lỗi thường gặp: lấy CFO/TTS (8,0%), ROA (20,0%), cộng thay vì trừ (28,0%).","basis":"Tỷ lệ dồn tích = (LNST − CFO)/tổng tài sản bình quân","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-082","part":"CM","subject":"BC","topic":"Chất lượng báo cáo tài chính doanh nghiệp","level":2,"q":"Doanh nghiệp thay đổi ước tính kế toán, kéo dài thời gian khấu hao TSCĐ vượt quá thời gian sử dụng hữu ích thực tế. Trong năm thay đổi, tác động trực tiếp là","o":["Chi phí khấu hao tăng làm lợi nhuận kế toán giảm tương ứng trong năm","Lưu chuyển tiền thuần HĐKD tăng đúng bằng mức giảm chi phí khấu hao","Giá trị còn lại của TSCĐ trên báo cáo tình hình tài chính giảm nhanh hơn","Khấu hao giảm, lợi nhuận kế toán tăng nhưng dòng tiền không được cải thiện"],"a":3,"e":"Khấu hao là chi phí không bằng tiền: kéo dài thời gian khấu hao làm khấu hao mỗi năm giảm, lợi nhuận tăng nhưng không tạo thêm tiền; giá trị còn lại của TSCĐ giảm chậm hơn. Đây là dấu hiệu điều chỉnh lợi nhuận.","basis":"VAS 03, VAS 29: thay đổi ước tính kế toán; chất lượng lợi nhuận","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-083","part":"CM","subject":"BC","topic":"Chất lượng báo cáo tài chính doanh nghiệp","level":1,"q":"Ý kiến kiểm toán nào thể hiện BCTC đã phản ánh trung thực và hợp lý, trên các khía cạnh trọng yếu, tình hình tài chính của doanh nghiệp mà không có ngoại trừ?","o":["Ý kiến chấp nhận toàn phần","Ý kiến kiểm toán ngoại trừ","Ý kiến kiểm toán trái ngược","Từ chối đưa ra ý kiến kiểm toán"],"a":0,"e":"Ý kiến chấp nhận toàn phần: BCTC trung thực, hợp lý trên các khía cạnh trọng yếu. Ý kiến ngoại trừ, trái ngược và từ chối đưa ra ý kiến là các dạng ý kiến không phải chấp nhận toàn phần.","basis":"VSA 700, VSA 705 – Ý kiến kiểm toán trên BCTC","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-084","part":"CM","subject":"BC","topic":"Chất lượng báo cáo tài chính doanh nghiệp","level":2,"q":"Trong năm N, doanh nghiệp vốn hóa 50 tỷ đồng chi phí lẽ ra phải ghi nhận vào chi phí trong kỳ (chưa phân bổ trong năm N; bỏ qua ảnh hưởng thuế). So với cách ghi nhận đúng, BCTC năm N sẽ có","o":["Lợi nhuận cao hơn 50 tỷ; tiền thuần theo từng hoạt động không thay đổi","Lợi nhuận cao hơn 50 tỷ; tiền thuần HĐKD cao hơn và HĐ đầu tư thấp hơn 50 tỷ","Lợi nhuận không đổi; tiền thuần HĐKD cao hơn 50 tỷ so với cách ghi đúng","Lợi nhuận cao hơn 50 tỷ; tiền thuần HĐKD thấp hơn 50 tỷ so với cách ghi đúng"],"a":1,"e":"Vốn hóa sai làm chi phí kỳ giảm 50 tỷ ⇒ lợi nhuận tăng 50 tỷ; khoản chi tiền bị chuyển từ luồng HĐKD sang luồng đầu tư (mua tài sản) ⇒ CFO cao hơn 50 tỷ, CFI thấp hơn 50 tỷ; tổng lưu chuyển tiền không đổi.","basis":"Chất lượng BCTC: tác động của vốn hóa chi phí đến lợi nhuận và dòng tiền","quote":"","src":"Giáo trình SRTC (khung chương trình)","as_of":"2026-11"},{"id":"C2-085","part":"CM","subject":"BC","topic":"Nghiên cứu tình huống","level":3,"q":"Tình huống Công ty M (tỷ đồng): năm N doanh thu thuần 2.000; giá vốn hàng bán 1.500; chi phí bán hàng và quản lý 200; chi phí lãi vay 50; không có thu nhập, chi phí khác; thuế suất thuế TNDN 20%. Tổng tài sản đầu năm 1.800, cuối năm 2.200; vốn chủ sở hữu đầu năm 900, cuối năm 1.100. ROE tính trên vốn chủ sở hữu bình quân là","o":["18,18%","22,22%","20,00%","25,00%"],"a":2,"e":"LNTT = 2.000 − 1.50
