<style>
/* Bố cục: thanh điều hướng dọc bên trái + vùng học ở giữa; dưới 900px chuyển thành thanh tab cố định ở đáy.
   Màu mức nắm vững mượn quy ước bảng điện: sàn, giảm, tham chiếu (mốc 60%), tăng, trần. */
:root {
  --bg: #F1F4F1; --surface: #FFFFFF; --surface-2: #E7ECE8; --ink: #13201A; --muted: #56645C; --line: #D1D9D3;
  --accent: #17408F; --accent-soft: #E2E9F7; --on-accent: #FFFFFF; --gold: #9A6F14; --navy: #0C2A63; --gold-bright: #E0B04A;
  --up: #0A8653; --up-soft: #DCF1E6; --down: #C43333; --down-soft: #FAE3E3; --ref: #9C7300; --ref-soft: #F6ECCD;
  --ceil: #7A39C0; --ceil-soft: #EEE4FA; --floor: #11809B; --floor-soft: #DDF0F5; --none: #98A39D;
  --shadow: 0 1px 2px rgba(19, 32, 26, .06), 0 6px 18px rgba(19, 32, 26, .05);
  --font-ui: "Be Vietnam Pro", "Segoe UI", system-ui, sans-serif;
  --font-read: "Literata", Georgia, "Times New Roman", serif;
  --font-num: "JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r: 10px; --nav-w: 232px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0E1513; --surface: #151E1B; --surface-2: #1C2724; --ink: #E4EDE8; --muted: #9AABA2; --line: #2B3833;
    --accent: #8FB0F5; --accent-soft: #1D2B44; --on-accent: #0B1424; --gold: #E0B04A;
    --up: #3CCB8B; --up-soft: #15352A; --down: #FF7474; --down-soft: #3D1F22; --ref: #E8BC45; --ref-soft: #3A3018;
    --ceil: #BE90F7; --ceil-soft: #2E2340; --floor: #52C6EC; --floor-soft: #15323C; --none: #6E7C75;
    --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0E1513; --surface: #151E1B; --surface-2: #1C2724; --ink: #E4EDE8; --muted: #9AABA2; --line: #2B3833;
  --accent: #8FB0F5; --accent-soft: #1D2B44; --on-accent: #0B1424; --gold: #E0B04A;
  --up: #3CCB8B; --up-soft: #15352A; --down: #FF7474; --down-soft: #3D1F22; --ref: #E8BC45; --ref-soft: #3A3018;
  --ceil: #BE90F7; --ceil-soft: #2E2340; --floor: #52C6EC; --floor-soft: #15323C; --none: #6E7C75;
  --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { min-height: 100%; }   /* không khóa chiều cao body, để thanh trên cùng (sticky) bám suốt khi cuộn */
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.6 var(--font-ui); -webkit-font-smoothing: antialiased; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }
h1, h2, h3 { margin: 0; line-height: 1.25; text-wrap: balance; }
h1 { font: 700 1.75rem/1.2 var(--font-read); letter-spacing: -.01em; }
h2 { font: 600 1.2rem/1.3 var(--font-read); }
h3 { font-size: 1rem; font-weight: 600; }
p { margin: 0; }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* ---------- khung ---------- */
.shell { display: grid; grid-template-columns: var(--nav-w) minmax(0, 1fr); min-height: 100%; }
.nav { position: sticky; top: env(safe-area-inset-top, 0px); height: calc(100vh - env(safe-area-inset-top, 0px)); overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--surface); padding-block: 20px; padding-left: max(14px, env(safe-area-inset-left, 0px)); padding-right: 14px;
  display: flex; flex-direction: column; gap: 4px; }
.brand { display: flex; align-items: center; gap: 10px; padding: 0 8px 18px; }
.brand-mark { width: 38px; height: 38px; border-radius: 9px; background: radial-gradient(circle at 30% 20%, #17408F, var(--navy) 70%); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 1px; flex: none; }
.brand-mark span { font: 800 15px/1 var(--font-ui); color: #fff; letter-spacing: -1px; }
.brand-mark span i { font-style: normal; color: var(--gold-bright); }
.brand-mark em { display: flex; align-items: flex-end; gap: 2px; height: 7px; }
.brand-mark em b { width: 3px; border-radius: 1px; display: block; }
.brand b { font: 800 1.1rem var(--font-ui); display: block; letter-spacing: .01em; }
.brand b i { font-style: normal; color: var(--gold); }
.brand small { color: var(--muted); font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; }
.nav-group { color: var(--muted); font-size: .7rem; letter-spacing: .1em; text-transform: uppercase; padding: 14px 10px 4px; font-weight: 600; }
.nav a { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: var(--ink); text-decoration: none; font-weight: 500; font-size: .93rem; }
.nav a svg { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; color: var(--muted); }
.nav a:hover { background: var(--surface-2); }
.nav a.on { background: var(--accent-soft); color: var(--accent); }
.nav a.on svg { color: var(--accent); }
.nav .badge-due { margin-left: auto; background: var(--down); color: #fff; font: 600 .7rem var(--font-num); border-radius: 20px; padding: 1px 7px; }
.nav-foot { margin-top: auto; padding: 14px 10px 0; font-size: .75rem; color: var(--muted); border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 8px; }
.nav-foot .hotline { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border-radius: 9px; background: var(--accent-soft); color: var(--ink); text-decoration: none; }
.nav-foot .hotline b { font: 700 1rem var(--font-num); color: var(--accent); }
.main { min-width: 0; padding-block: 28px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.page { max-width: 1060px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px; }
.head { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 12px; }
.head .eyebrow { color: var(--muted); font-size: .75rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; margin-bottom: 4px; }
.head p.lead { color: var(--muted); max-width: 64ch; margin-top: 6px; }
.topbar, .tabbar { display: none; }
/* tài khoản: nút góc phải (máy tính: cố định góc trên; điện thoại: trong thanh trên cùng) */
.acct-desk { position: fixed; top: 12px; right: 20px; z-index: 35; display: flex; align-items: center; gap: 10px; }
.acct-desk .hint { font-size: .82rem; color: var(--muted); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; }
.acct-me { display: inline-flex; align-items: center; gap: 8px; background: var(--surface); }
.acct-me .av { width: 24px; height: 24px; border-radius: 50%; display: inline-grid; place-items: center; background: var(--navy, #0C2A63); color: #fff; font-weight: 700; font-size: .8rem; }
.acct-top { display: inline-flex; }
.tip-today { border-left: 4px solid var(--gold, #E0B04A); }
/* biểu đồ cột một chuỗi (trang quản trị): cột mảnh, bo 4px đầu cột, cách nhau 2px */
.vbars { display: flex; align-items: flex-end; gap: 2px; height: 140px; border-bottom: 1px solid var(--line); }
.vbars i { flex: 1; min-width: 3px; background: var(--accent); border-radius: 4px 4px 0 0; opacity: .85; }
.vbars i:hover { opacity: 1; outline: 2px solid var(--surface); }
@media (min-width: 901px) { .main { padding-top: 64px; } }

@media (max-width: 900px) {
  .shell { grid-template-columns: minmax(0, 1fr); }
  .nav { position: fixed; inset: 0 auto 0 0; width: min(300px, 86vw); height: 100%; z-index: 40; transform: translateX(-105%); transition: transform .2s; box-shadow: var(--shadow);
    padding-top: calc(20px + env(safe-area-inset-top, 0px)); }
  .nav.open { transform: none; }
  .scrim { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 39; }
  .topbar { display: flex; align-items: center; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--surface); border-bottom: 1px solid var(--line);
    padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 25; background: var(--surface); }
  .topbar b { font: 700 1.05rem var(--font-read); }
  .topbar .t { color: var(--muted); font-size: .85rem; margin-left: auto; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  @media (max-width: 400px) { .topbar .t { display: none; } .topbar .acct-top { margin-left: auto; } }
  .acct-desk { display: none; }
  .tabbar { display: grid; grid-template-columns: repeat(5, 1fr); position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; background: var(--surface); border-top: 1px solid var(--line);
    padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
  .tabbar a { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 7px 2px 6px; font-size: .68rem; color: var(--muted); text-decoration: none; }
  .tabbar a svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
  .tabbar a.on { color: var(--accent); }
  .main { padding-block: 18px calc(84px + env(safe-area-inset-bottom, 0px)); }
  h1 { font-size: 1.45rem; }
}

/* ---------- thành phần ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.card h2 + p, .card h3 + p { margin-top: 6px; }
.grid { display: grid; gap: 14px; }
.g2 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 320px), 1fr)); }
.g3 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 230px), 1fr)); }
.g4 { grid-template-columns: repeat(auto-fit, minmax(min(100%, 170px), 1fr)); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
.between { justify-content: space-between; }
.muted { color: var(--muted); }
.small { font-size: .85rem; }
.tiny { font-size: .75rem; }
.stack { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink);
  border-radius: 8px; padding: 9px 16px; font-weight: 600; font-size: .92rem; cursor: pointer; text-decoration: none; min-height: 40px; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.btn.primary:hover { filter: brightness(1.08); }
.btn.danger { color: var(--down); border-color: var(--down); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.btn.sm { padding: 5px 11px; min-height: 32px; font-size: .82rem; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 6px; padding: 2px 8px; font-size: .75rem; font-weight: 600; background: var(--surface-2); color: var(--muted); max-width: 100%; line-height: 1.4; }
.chip.up { background: var(--up-soft); color: var(--up); } .chip.down { background: var(--down-soft); color: var(--down); }
.chip.ref { background: var(--ref-soft); color: var(--ref); } .chip.ceil { background: var(--ceil-soft); color: var(--ceil); }
.chip.floor { background: var(--floor-soft); color: var(--floor); } .chip.acc { background: var(--accent-soft); color: var(--accent); }
label.f { display: flex; flex-direction: column; gap: 5px; font-size: .8rem; font-weight: 600; color: var(--muted); min-width: 0; }
select, input[type="text"], input[type="number"], input[type="search"], textarea {
  border: 1px solid var(--line); background: var(--surface); border-radius: 8px; padding: 8px 10px; min-height: 40px; font-weight: 400; color: var(--ink); width: 100%; min-width: 0; }
textarea { min-height: 90px; resize: vertical; font-family: var(--font-num); font-size: .8rem; }
.check { display: flex; align-items: center; gap: 8px; font-size: .9rem; }
.bar { height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; position: relative; }
.bar > i { position: absolute; inset: 0 auto 0 0; background: var(--accent); border-radius: 4px; transition: width .45s cubic-bezier(.2, .7, .2, 1); }
.bar .mark { position: absolute; top: -3px; bottom: -3px; width: 2px; background: var(--ink); opacity: .55; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; }
.note { border-left: 3px solid var(--ref); background: var(--ref-soft); padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: .88rem; }
.note.info { border-color: var(--accent); background: var(--accent-soft); }
.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: .75rem; text-transform: uppercase; letter-spacing: .05em; }
td.r, th.r { text-align: right; }
.stat .k { color: var(--muted); font-size: .78rem; font-weight: 600; }
.stat .v { font: 700 1.7rem/1.2 var(--font-num); margin-top: 4px; }
.stat .d { color: var(--muted); font-size: .8rem; margin-top: 2px; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg);
  padding: 10px 16px; border-radius: 8px; font-size: .9rem; z-index: 60; max-width: calc(100vw - 32px); }
@media (min-width: 901px) { .toast { bottom: 24px; } }
.modal-wrap { position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 70; display: grid; place-items: center; padding: 16px; }
.modal { background: var(--surface); border-radius: 12px; padding: 22px; width: min(460px, 100%); display: flex; flex-direction: column; gap: 14px; box-shadow: var(--shadow); border: 1px solid var(--line); }

/* bản đồ nắm vững kiểu bảng điện */
.board { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 150px), 1fr)); gap: 8px; }
.tile { border-radius: 8px; padding: 10px 12px; border: 1px solid var(--line); background: var(--surface); display: flex; flex-direction: column; gap: 2px; text-align: left; cursor: pointer; }
.tile .code { font: 700 .78rem var(--font-num); letter-spacing: .04em; }
.tile .name { font-size: .8rem; color: var(--muted); line-height: 1.3; min-height: 2.6em; }
.tile .pct { font: 700 1.25rem var(--font-num); }
.tile.up { border-color: var(--up); } .tile.up .pct, .tile.up .code { color: var(--up); }
.tile.down { border-color: var(--down); } .tile.down .pct, .tile.down .code { color: var(--down); }
.tile.ref { border-color: var(--ref); } .tile.ref .pct, .tile.ref .code { color: var(--ref); }
.tile.ceil { border-color: var(--ceil); } .tile.ceil .pct, .tile.ceil .code { color: var(--ceil); }
.tile.floor { border-color: var(--floor); } .tile.floor .pct, .tile.floor .code { color: var(--floor); }
.tile.none .pct, .tile.none .code { color: var(--none); }
.legend { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .75rem; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 5px; vertical-align: -1px; }

/* ---------- làm bài ---------- */
.quiz { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 16px; align-items: start; }
@media (max-width: 900px) { .quiz { grid-template-columns: minmax(0, 1fr); } }
.qcard { display: flex; flex-direction: column; gap: 14px; }
.qtext { font: 500 1.08rem/1.6 var(--font-ui); white-space: pre-line; }   /* câu tổ hợp: mỗi mệnh đề I, II, III một dòng */
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; align-items: start; text-align: left; border: 1px solid var(--line); background: var(--surface);
  border-radius: 9px; padding: 11px 12px; cursor: pointer; font-size: .97rem; line-height: 1.5; }
.opt:hover:not(:disabled) { border-color: var(--accent); }
.opt .l { width: 26px; height: 26px; border-radius: 6px; display: grid; place-items: center; background: var(--surface-2); font: 700 .8rem var(--font-num); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.sel .l { background: var(--accent); color: var(--on-accent); }
.opt.ok { border-color: var(--up); background: var(--up-soft); } .opt.ok .l { background: var(--up); color: #fff; }
.opt.bad { border-color: var(--down); background: var(--down-soft); } .opt.bad .l { background: var(--down); color: #fff; }
.opt:disabled { cursor: default; }
.explain { border-top: 1px solid var(--line); padding-top: 14px; display: flex; flex-direction: column; gap: 8px; }
.explain .verdict { font-weight: 700; }
.explain .verdict.ok { color: var(--up); } .explain .verdict.bad { color: var(--down); }
.quote { font: 400 .92rem/1.6 var(--font-read); border-left: 3px solid var(--line); padding: 4px 0 4px 12px; color: var(--ink); }
.side { position: sticky; top: calc(14px + env(safe-area-inset-top, 0px)); display: flex; flex-direction: column; gap: 12px; }
@media (max-width: 900px) { .side { position: static; order: -1; } }
.timer { font: 700 1.9rem var(--font-num); letter-spacing: .02em; }
.timer.warn { color: var(--down); }
.navgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(36px, 1fr)); gap: 5px; }
.navgrid button { height: 34px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font: 600 .78rem var(--font-num); cursor: pointer; }
.navgrid button.done { background: var(--accent-soft); border-color: var(--accent); color: var(--accent); }
.navgrid button.cur { outline: 2px solid var(--ink); outline-offset: 1px; }
.navgrid button.flag { box-shadow: inset 0 -3px 0 var(--ref); }
.navgrid button.ok { background: var(--up-soft); border-color: var(--up); color: var(--up); }
.navgrid button.bad { background: var(--down-soft); border-color: var(--down); color: var(--down); }
.kbd { font: 600 .72rem var(--font-num); border: 1px solid var(--line); border-bottom-width: 2px; border-radius: 4px; padding: 0 5px; }

/* ---------- kết quả, thư viện, thẻ ---------- */
.ring { --p: 0; width: 120px; height: 120px; border-radius: 50%; background: conic-gradient(var(--c, var(--accent)) calc(var(--p) * 1%), var(--surface-2) 0); display: grid; place-items: center; flex: none; }
.ring > div { width: 92px; height: 92px; border-radius: 50%; background: var(--surface); display: grid; place-items: center; text-align: center; }
.ring b { font: 700 1.4rem var(--font-num); display: block; }
.law { font: 400 .98rem/1.75 var(--font-read); }
.law p + p { margin-top: 6px; }
.law .art { scroll-margin-top: 80px; padding-block: 16px; border-bottom: 1px solid var(--line); }
.law .art h3 { font: 600 1.02rem var(--font-read); margin-bottom: 6px; }
.law .hit { background: var(--ref-soft); border-radius: 3px; }
.law .lvl2 { padding-left: 1.2em; }
.toc { display: flex; flex-direction: column; gap: 2px; max-height: 70vh; overflow-y: auto; font-size: .82rem; }
.toc a { text-decoration: none; color: var(--ink); padding: 3px 6px; border-radius: 5px; }
.toc a:hover { background: var(--surface-2); }
.lib { display: grid; grid-template-columns: 240px minmax(0, 1fr); gap: 16px; align-items: start; }
.lib .toc-wrap { position: sticky; top: 16px; }
@media (max-width: 900px) { .lib { grid-template-columns: minmax(0, 1fr); } .lib .toc-wrap { position: static; } .toc { max-height: 220px; } }
